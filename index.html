// ---- favor and the three ranges (SPEC 3.23, second pass SPEC 3.33) ---------
// Replaces SPEC 1.7's flat per-station influence counter with a real
// 0-100 standing meter, per port, per quadrant — profile.quadrants[q].
// ports[name] = { favor, peakFavor, lastVisitHour }. Tiers gate what a
// station lets the pilot do (see favorTierAtLeast/callPoi); Control
// (investment, station levels, passive production) is direction-only in
// SPEC.md 3.23b, not built — see the CFG comment above favorKnown for why.
var FAVOR_TIERS = ['unknown', 'known', 'trusted', 'allied', 'honored'];
var FAVOR_TIER_WORDS = {
    unknown: "You're unknown to us.", known: 'We know you.',
    trusted: 'We trust you.', allied: "You're one of ours.",
    honored: 'You are honored among us.'
};
function favorTierMin(tier) {
    return tier === 'honored' ? CFG.favorHonored : tier === 'allied' ? CFG.favorAllied :
           tier === 'trusted' ? CFG.favorTrusted : tier === 'known' ? CFG.favorKnown : 0;
}
function favorTier(favor) {
    return favor >= CFG.favorHonored ? 'honored' : favor >= CFG.favorAllied ? 'allied' :
           favor >= CFG.favorTrusted ? 'trusted' : favor >= CFG.favorKnown ? 'known' : 'unknown';
}
function favorTierRank(tier) { return FAVOR_TIERS.indexOf(tier); }

// SPEC 3.33: Trusted is PERMANENT — once a port's peakFavor has ever
// reached favorTrusted, favor can never again read below it, not from
// decay and not from a hard loss (Brian: "favor should not ever go
// below 40"). Below that peak, the floor is 0.
function favorFloor(port) { return port.peakFavor >= CFG.favorTrusted ? CFG.favorTrusted : 0; }

// Lazily creates a port's record the first time anything touches it.
// SPEC 3.33 first tried "nobody starts favored, Station Meridian
// included" — Brian's own play (ideas11) reversed that: the home
// station is the one deliberate exception, "never not have favor."
// Seeding it at exactly favorTrusted makes that permanent for free via
// favorFloor's existing "peakFavor >= favorTrusted -> floor there" rule
// (no separate special-case needed in decay, hard losses, or the v5->v6
// migration's own max()-merge of old influence data) — home is
// identified by quadrantId, not just by name, so a station that happens
// to share the name in some future non-home quadrant (3.22's later
// quadrants) still starts a stranger like everyone else. Every other
// port is a stranger (Unknown, favor 0) until it's actually earned. Safe
// to call with a bare quadrant shell that has no `ports` yet
// (loadProfile's own v5->v6 migration relies on that).
function ensurePort(q, name) {
    if (!q.ports) q.ports = {};
    if (!q.ports[name]) {
        var isHome = profile.quadrantId === 'home' && name === 'Station Meridian';
        q.ports[name] = isHome
            ? { favor: CFG.favorTrusted, peakFavor: CFG.favorTrusted, lastVisitHour: profile.clock / 3600 }
            : { favor: 0, peakFavor: 0, lastVisitHour: profile.clock / 3600 };
    }
    return q.ports[name];
}

// The current effective favor at a port, decay applied as of right now
// but NOT written back — pure and safe to call every frame (every
// station-range check does). SPEC 3.33: decay doesn't run AT ALL below
// favorDecayStartsAt (Allied) — a Known or Trusted pilot never loses a
// point to absence — and, once running, is bounded by the floor above.
// Real state only ever changes via touchPort() (a genuine interaction)
// or writeFavor() (a real gain/loss); reads never mutate anything, which
// is the fix for the bug 3.23's own testing found: reconcileFavor used
// to stamp lastVisitHour on every read, so favor drained at every
// station every frame regardless of whether the pilot ever traded there.
function decayedFavor(port) {
    if (port.favor < CFG.favorDecayStartsAt) return port.favor;
    var nowHour = profile.clock / 3600;
    var elapsed = Math.max(0, nowHour - port.lastVisitHour);
    if (elapsed <= 0) return port.favor;
    var rate = port.favor >= CFG.favorHonored ? CFG.favorDecayHonored : CFG.favorDecayPerHour;
    return Math.max(favorFloor(port), port.favor - rate * elapsed);
}

// Commits whatever decay has accrued and resets the absence clock —
// called only at a REAL interaction (a hail, a sale, a donation, a
// mission accepted or completed there, a docking), never from a plain
// read, so "a regular is remembered; a stranger is forgotten" actually
// means something.
function touchPort(port) {
    port.favor = decayedFavor(port);
    port.lastVisitHour = profile.clock / 3600;
}

// The current effective favor at a port — 0 if the pilot has never
// touched this quadrant's ports at all yet (no live mutation here, just
// a read-only default so display code never needs to special-case "no
// quadrant yet").
function favorOf(name) {
    var q = currentQuadrant();
    if (!q) return 0;
    return decayedFavor(ensurePort(q, name));
}

// The one real mutator both gainFavor/loseFavor go through, and the sole
// path that bypasses the "fixed sector doesn't run favor" rule — used
// only by the delivery run's own handover exception (dockAtStation),
// which the spec calls out by name as feeding real quadrant standing
// even though the demo's own sector otherwise never touches favor.
function writeFavor(name, delta) {
    ensureQuadrantHome();
    var port = ensurePort(currentQuadrant(), name);
    touchPort(port);
    port.favor = clamp(port.favor + delta, favorFloor(port), 100);
    if (port.favor > port.peakFavor) port.peakFavor = port.favor;
    saveProfile();
}
function gainFavor(poi, amt) { if (!demo && poi) writeFavor(poi.name, amt); }
function loseFavor(poi, amt) { if (!demo && poi) writeFavor(poi.name, -amt); }

// True immediately in the delivery run's own fixed sector — its Meridian
// isn't favor-gated at all, matching every service it already offers
// unconditionally today.
function favorTierAtLeast(poi, minTier) {
    if (demo) return true;
    return favorTierRank(favorTier(favorOf(poi.name))) >= favorTierRank(minTier);
}

function hailGreeting(poi) {
    if (demo) return poi.name + ' control: ';
    return poi.name + ' control. ' + FAVOR_TIER_WORDS[favorTier(favorOf(poi.name))] + ' ';
}

// The three ranges, per station: CFG's own value already reflects any
// owned range module (comm_array/transporter_booster/docking_computer,
// via moduleCfgOverlay); the station's own favor TIER adds its own bonus
// on top of THAT (favorRangeBonus, SPEC 3.33 — Trusted +25%, Allied and
// Honored +50%), so the bonus only applies where it's actually been
// earned, not everywhere. kind: 'comm' | 'transporter' | 'dock'.
function stationRangeFor(kind, poiName) {
    var base = kind === 'dock' ? CFG.stationDockRange :
               kind === 'transporter' ? CFG.stationTransporterRange : CFG.stationCommRange;
    if (demo) return base;
    var bonus = CFG.favorRangeBonus[favorTier(favorOf(poiName))] || 0;
    return base * (1 + bonus);
}

// SPEC 3.33: 25% off modules, lasers, repairs, and reaction mass at a
// station that's actually Honored — 1 (no discount) everywhere else,
// including the demo's own favor-blind sector.
function honoredDiscountAt(poi) {
    if (!poi || demo) return 1;
    return favorTier(favorOf(poi.name)) === 'honored' ? (1 - CFG.honoredDiscount) : 1;
}

// SPEC 3.33: stamps a port as visited right now WITHOUT changing its
// favor — the interaction itself (a hail, a sale, a donation, accepting
// or completing a mission, docking) is what resets the absence clock,
// even when nothing about the visit moves the meter (a sale too small
// to cross a whole point, a hail that buys nothing). Every real
// gain/loss already touches via writeFavor; this covers the rest.
function touchStationVisit(poiName) {
    if (demo) return;
    ensureQuadrantHome();
    touchPort(ensurePort(currentQuadrant(), poiName));
}

// ideas6: undocking drops the ship undockDist (1000) out along the arrival
// vector, facing away — outside comm range, but still inside the no-warp
// zone, so the pilot thrusts clear before jumping anywhere. Held keys,
// auto-thrust, and the range band are reset here too; the yaw bug that
// actually caused Brian's "couldn't move after undocking" is fixed below.
function undock() {
    var poi = docked.poi, dir = docked.approachDir;
    docked = null;
    stationSubmenu = null;
    keysDown = {}; autoThrust = false;
    ship.pos = add(poi.pos, scale(dir, CFG.undockDist));
    ship.vel = v3(0, 0, 0);
    // Face AWAY from the door: shipForward() is (sin yaw, ., -cos yaw), so
    // forward = dir needs atan2(dir.x, -dir.z) — the same formula
    // __sim.faceSelected uses to face TOWARD a point. The sign was flipped
    // from SPEC 1.19 until ideas6 (Round 16): the ship faced the station,
    // W flew it into the hull, and updateCollisions stopped and pushed it
    // back on every press — Brian's "the controls didn't move my ship".
    ship.yaw = Math.atan2(dir.x, -dir.z); ship.pitch = 0;
    poi.rangeBand = 0;          // outside comm range now; no crossing cue for the departure itself
    startSpaceAmbient();   // SPEC 3.67: replaces the docked interior loop, crossfading out
    say('Undocked. ' + CFG.undockDist + ' out from ' + poi.name + ', facing away. The drive won\'t spool within ' +
        CFG.warpInhibitDist + ' of the station — thrust clear first.');
}

// ---- station range cues (ideas6, three bands as of SPEC 3.23) --------------
// Three audible lines around every station: comms (C hails, talk only),
// transporter (C hands cargo over, no landing), dock (C lands). Crossing
// inward sounds a rising cue and says which; a crossing outward sounds a
// falling one. Stateless per frame — the band is compared before/after,
// like the warp-core alerts — with the first frame after a roster build
// just recording where the ship already is. This is purely about
// PHYSICAL range, same as before 3.23 — favor gates what actually happens
// when C is pressed inside a band (see callPoi), not whether the cue fires.
function stationRangeBand(d, poiName) {
    return d <= stationRangeFor('dock', poiName) ? 3 : d <= stationRangeFor('transporter', poiName) ? 2 :
           d <= stationRangeFor('comm', poiName) ? 1 : 0;
}
function updateStationRanges() {
    targets.forEach(function (t) {
        if (!t.alive || t.kind !== 'poi' || t.poiType !== 'station') return;
        var band = stationRangeBand(len(sub(t.pos, ship.pos)), t.name);
        if (t.rangeBand === undefined) { t.rangeBand = band; return; }
        if (band === t.rangeBand) return;
        var was = t.rangeBand;
        t.rangeBand = band;
        if (band > was) {
            if (band === 3) {
                SIM.cues.play('dock_range');
                say('Docking range. C docks at ' + t.name + '.');
            } else if (band === 2) {
                SIM.cues.play('transporter_range');
                say('Transporter range. C hails the transporter at ' + t.name + '.');
            } else {
                SIM.cues.play('comm_range');
                say('Comms range. C hails ' + t.name + '.');
            }
        } else {
            SIM.cues.play('range_lost');
            say(band === 2 ? 'Out of docking range. Still in transporter range.'
              : band === 1 ? 'Out of transporter range. Still in comms range.'
                            : 'Out of comms range.');
        }
    });
}

function stationMenuKey(lname) {
    if (stationSubmenu === 'modules') { moduleKey(lname); return; }
    if (stationSubmenu === 'lasers') { laserShopKey(lname); return; }
    var n = STATION_ITEMS.length;
    if (lname === 'escape' || lname === 'x') { undock(); return; }
    if (lname === 'arrowdown') { menuClick(); stationIdx = (stationIdx + 1) % n; say(stationItemText()); }
    else if (lname === 'arrowup') { menuClick(); stationIdx = (stationIdx - 1 + n) % n; say(stationItemText()); }
    else if (lname === 'enter' || lname === 'arrowright' || lname === 'arrowleft') {
        var item = STATION_ITEMS[stationIdx];
        if (item.adjust) {
            if (lname !== 'enter') { menuClick(); item.adjust(lname === 'arrowright' ? 1 : -1); }
            say(stationItemText());
            return;
        }
        menuSelectSound();
        say(itemLabel(item) + ' selected.');
        item.run();
    } else if (lname === 'tab') {
        say(stationItemText());
    } else if (lname === 'y') {
        speakTotals();
    } else {
        SIM.audio.blip(220, 80, 0.1);
        say('Up and down arrows browse the station menu, Enter selects, Escape undocks. ' + itemLabel(STATION_ITEMS[stationIdx]) + '.');
    }
}

// H — hyperwarp to the nav target. Spool up, jump as far as the tank allows,
// and drop out just beyond calling range — or wherever the charge runs dry —
// so the last leg is always flown by ear.
// The nearest point of interest inside the no-warp zone, or null. Checked
// against every POI, not just the nav target — the drive won't spool this
// close to ANYTHING, so a pilot must fly clear of a station before jumping
// anywhere else, not just before jumping back to that same station.
// Hit a station or planet too fast and it costs hull, billed at the next
// landing rather than repaired free — SPEC 2.14, "bad drivers pay."
function updateCollisions(spd) {
    if (spd <= CFG.collisionSafeSpeed) return;
    for (var i = 0; i < targets.length; i++) {
        var t = targets[i];
        if (!t.alive || t.kind !== 'poi' || (t.poiType !== 'station' && t.poiType !== 'planet')) continue;
        var rel = sub(ship.pos, t.pos);
        if (len(rel) > CFG.stationHullRadius) continue;
        var over = spd - CFG.collisionSafeSpeed;
        var dmg = Math.ceil(over * CFG.collisionDmgPerSpeed);
        var dir = len(rel) > 1e-6 ? norm(rel) : v3(0, 0, 1);
        ship.pos = add(t.pos, scale(dir, CFG.stationHullRadius));
        ship.vel = v3(0, 0, 0);
        collisionDamage += Math.min(dmg, hull);
        SIM.audio.sfxNoise({ dur: 0.35, vol: 0.45, filter: 'lowpass', freq: 400 });
        hullHit(dmg, t.name);
        return;
    }
}

// ---- blink (SPEC 3.68, ideas15.txt) -----------------------------------------
// An instant displacement, facing and velocity untouched — Brian's own
// instinct, and the reason it works against 3.58's facing cone: the enemy
// is still turned toward where the ship WAS, and its own turn rate is the
// window this buys. No auto-retarget (Shift+T, 3.38, does that at a
// charge) — the lock simply drops next frame if the bearing left the
// zone, same as any other sudden reposition would.
var blinkReadyAt = 0;
function blinkOffset(dir) {
    if (dir === 'up') return v3(0, 1, 0);
    if (dir === 'down') return v3(0, -1, 0);
    if (dir === 'left') return scale(shipRight(), -1);
    if (dir === 'right') return shipRight();
    if (dir === 'forward') return shipForward();
    return scale(shipForward(), -1);   // 'back'
}
function blinkKey(dir) {
    // SPEC 3.68 Part C: refused on the course, same as weapons — docked/
    // warping/turret never reach this far into onKeyDown at all (their
    // own earlier gates already returned or turret's own zone-switch
    // claimed the chord first), so the course is the one case that needs
    // an explicit check here.
    // SPEC 3.61/3.62: the minefield and the shadow both refuse it too —
    // blinking past a mine cluster, or straight onto a tail, would skip
    // the lesson each one exists to teach.
    if (mode === 'course' || mode === 'minefield' || mode === 'shadow') {
        SIM.cues.play('refusal_offline');
        say('Weapons are cold in open space. C calls a point of interest.');   // reuses weaponsCold()'s own line
        return;
    }
    if (Date.now() < blinkReadyAt) {
        SIM.cues.play('refusal_wait');
        say('Blink recharging, ' + Math.ceil((blinkReadyAt - Date.now()) / 1000) + ' seconds.');
        return;
    }
    var fromPos = v3(ship.pos.x, ship.pos.y, ship.pos.z);
    var toPos = add(ship.pos, scale(blinkOffset(dir), CFG.blinkDist));
    // Never a free hull hit: a blink that would land inside a station's or
    // planet's hull radius stops short, reusing updateCollisions' own
    // clamp-to-the-radius geometry rather than landing inside it.
    var clampedName = null;
    targets.forEach(function (t) {
        if (!t.alive || t.kind !== 'poi' || (t.poiType !== 'station' && t.poiType !== 'planet')) return;
        var rel = sub(toPos, t.pos), d = len(rel);
        if (d < CFG.stationHullRadius) {
            toPos = add(t.pos, scale(d > 1e-6 ? norm(rel) : v3(0, 0, 1), CFG.stationHullRadius));
            clampedName = t.name;
        }
    });
    ship.pos = toPos;
    spendRcs(CFG.blinkRcs);
    blinkReadyAt = Date.now() + CFG.blinkCooldownS * 1000;
    SIM.cues.play('blink', { fromPos: fromPos, toPos: toPos });
    say(clampedName ? 'Blink short. Hull.' : 'Blink ' + dir + ', ' + CFG.blinkDist + '.');
}

function nearbyPoi() {
    var best = null, bestD = CFG.warpInhibitDist;
    targets.forEach(function (p) {
        if (!p.alive || p.kind !== 'poi') return;
        var d = len(sub(p.pos, ship.pos));
        if (d < bestD) { bestD = d; best = p; }
    });
    return best;
}

// Warp drama (SPEC 1.17): three phases, all on the UI bus like every other
// ship-own sound (thrusters, shield hum) — there's no HRTF position for the
// listener's own engine. If an engine's clips aren't decoded (only engine 1
// is, for now), the old synthesized warp_charge cue fills in for the start;
// the engaged loop and finish clip simply go quiet rather than crash, and
// the arrival sting (warp_arrive/warp_dry) always plays regardless.
function playWarpStart(engine) {
    if (!SIM.audio.playAsset('warp_start' + engine, 0.5)) {
        SIM.cues.play('warp_charge', { dur: CFG.warpEdgeClipS });
    }
}
function startWarpEngagedLoop(engine) {
    var A = SIM.audio, name = 'warp_engaged' + engine + 'r';
    if (!A.ctx) return;
    if (!A.assetBufs[name]) { A.load(name); return; }
    var src = A.ctx.createBufferSource();
    src.buffer = A.assetBufs[name];
    src.loop = true;
    var g = A.ctx.createGain(); g.gain.value = 0.0001;
    src.connect(g); g.connect(A.uiBus);
    src.start();
    A.ramp(g.gain, 0.4, 0.15);
    warpEngagedNode = { src: src, g: g };
}
function stopWarpEngagedLoop() {
    if (!warpEngagedNode) return;
    var n = warpEngagedNode; warpEngagedNode = null;
    SIM.audio.ramp(n.g.gain, 0.0001, 0.15);
    setTimeout(function () { try { n.src.stop(); n.g.disconnect(); } catch (e) {} }, 300);
}
function playWarpFinish(engine) {
    var A = SIM.audio, name = 'warp_finish' + engine;
    if (!A.ctx) return;
    if (!A.assetBufs[name]) { A.load(name); return; }
    var src = A.ctx.createBufferSource();
    src.buffer = A.assetBufs[name];
    var g = A.ctx.createGain(); g.gain.value = 0.0001;
    src.connect(g); g.connect(A.uiBus);
    src.start();
    A.ramp(g.gain, 0.5, 0.15);
}

function startWarp() {
    if (mode !== 'sector') { say('Hyperwarp needs open sector space.'); return; }
    if (warping) return;
    if (systemState('warp') === 'off') {
        SIM.cues.play('refusal_offline');
        say('Warp engine offline. Repair crew is on it.');
        return;
    }
    var t = targets[selected];
    if (!t) { say('No nav target. Q opens the quadrant map.'); return; }
    var near = nearbyPoi();
    if (near) {
        say('Hyperwarp inhibited this close to ' + near.name + '. Fly clear first.');
        return;
    }
    var d = len(sub(t.pos, ship.pos));
    if (d < CFG.warpMinDist) {
        say('Too close for hyperwarp. Just fly it. Distance ' + round10(d) + '.');
        return;
    }
    var chargePct = warpCharge / CFG.warpTankMax * 100;
    if (chargePct < CFG.warpMinChargePct) {
        SIM.cues.play('refusal_wait');
        say('Warp core below ' + CFG.warpMinChargePct + ' percent. Let it cool, or fly it.');
        return;
    }
    var autoOff = autoThrust ? autoOffText() : '';
    autoThrust = false;
    var dir = norm(sub(t.pos, ship.pos));
    var need = warpNeed(d);
    var travel = Math.min(need, warpEffectiveCharge());
    var dry = travel < need;
    // Flight time scales with the distance actually flown: warpJumpMinS at
    // the shortest allowed travel (a jump right at warpMinDist), up to
    // warpJumpMaxS at warpJumpLongDist and beyond. A dry jump (travel <
    // need) simply takes less time — it's still flying the same distance,
    // just less of it (SPEC 1.17).
    var minTravel = CFG.warpMinDist - CFG.warpDropout;
    var frac = clamp((travel - minTravel) / (CFG.warpJumpLongDist - minTravel), 0, 1);
    var totalTime = CFG.warpJumpMinS + (CFG.warpJumpMaxS - CFG.warpJumpMinS) * frac;
    warping = true;
    keysDown = {};
    thrusterSync(null);
    updateStabilizers(0);
    ship.vel = v3(0, 0, 0);
    warpFlight = { poi: t, dir: dir, fromPos: v3(ship.pos.x, ship.pos.y, ship.pos.z),
                    travel: travel, dry: dry, totalTime: totalTime, elapsed: 0,
                    engine: CFG.warpEngine, phase: 'start' };
    playWarpStart(warpFlight.engine);
    say(autoOff + 'Hyperwarp charging.');
}

// Runs every frame from simTick while warping — the automated flight itself.
// The ship sits still through the start clip (the spool), then moves at a
// constant rate for the rest of the flight (through the engaged loop AND
// the finish clip, arriving exactly as the finish clip ends).
function updateWarpFlight(dt) {
    var f = warpFlight;
    f.elapsed += dt;
    // SPEC 2.10: the engaged loop (and the ship's own departure) starts
    // warpEngagedLeadS early, crossfading with the tail of the start clip.
    var moveStart = CFG.warpEdgeClipS - CFG.warpEngagedLeadS;
    var p = clamp((f.elapsed - moveStart) / (f.totalTime - moveStart), 0, 1);
    ship.pos = add(f.fromPos, scale(f.dir, f.travel * p));

    if (f.phase === 'start' && f.elapsed >= moveStart) {
        f.phase = 'engaged';
        startWarpEngagedLoop(f.engine);
    }
    var finishAt = f.totalTime - CFG.warpEdgeClipS;
    if (f.phase === 'engaged' && f.elapsed >= finishAt) {
        f.phase = 'finish';
        stopWarpEngagedLoop();
        playWarpFinish(f.engine);
    }
    if (f.elapsed >= f.totalTime) finishWarpFlight();
}

function finishWarpFlight() {
    var f = warpFlight;
    stopWarpEngagedLoop();
    ship.pos = add(f.fromPos, scale(f.dir, f.travel));
    warpCharge -= f.travel;
    ship.vel = v3(0, 0, 0);
    ship.yaw = Math.atan2(f.dir.x, -f.dir.z);
    ship.pitch = Math.asin(clamp(f.dir.y, -1, 1));
    warping = false;
    var dry = f.dry, poi = f.poi;
    warpFlight = null;
    SIM.cues.play(dry ? 'warp_dry' : 'warp_arrive');
    setTimeout(function () {
        var rem = round10(len(sub(poi.pos, ship.pos)));
        say(dry
            ? 'Warp charge exhausted. ' + poi.name + ' dead ahead, distance ' + rem +
              '. Thrust the rest; C calls it within ' + CFG.poiInteract + '.'
            : 'Hyperwarp complete. ' + poi.name + ' dead ahead, distance ' + rem +
              '. C calls it once you are within ' + CFG.poiInteract +
              '. Warp charge ' + warpPct() + ' percent.');
    }, 350);
}

// C — call the selected point of interest (within range).
function snapshotSector(atPoi) {
    return { pos: v3(ship.pos.x, ship.pos.y, ship.pos.z),
             yaw: ship.yaw, pitch: ship.pitch, poiName: atPoi.name };
}

function callPoi() {
    var t = targets[selected];
    if (!t) { say('No point of interest selected. Tab cycles them.'); return; }
    var d = len(sub(t.pos, ship.pos));
    // SPEC 3.33: quadrant-wide comms (opened by clearing the quadrant's
    // Contested Zone) reaches any station from anywhere in the quadrant
    // — comms only, never a shortcut into the transporter or docking,
    // which still read the real distance below.
    var commsOpenQuadrantWide = !demo && t.poiType === 'station' &&
        currentQuadrant() && currentQuadrant().openComms;
    var range = t.poiType === 'station' ? stationRangeFor('comm', t.name) : CFG.poiInteract;
    if (d > range && !commsOpenQuadrantWide) {
        say('Too far to call ' + t.name + '. Get within ' + range +
            '. Distance ' + round10(d) + '.');
        return;
    }
    SIM.audio.blip(880, 90, 0.12); setTimeout(function () { SIM.audio.blip(1100, 90, 0.12); }, 130);
    if (t.poiType === 'combat') {
        sectorHome = snapshotSector(t);
        newGame('combat');
        say(t.name + ' control: hostiles inbound, weapons free. ' + combatIntro());
    } else if (t.poiType === 'mining') {
        if (demo && !demo.combatCleared) {
            say(t.name + ' control: mining rights are suspended while hostiles hold the Contested Zone. Clear it first, pilot.');
            return;
        }
        sectorHome = snapshotSector(t);
        newGame('mining');
        say(t.name + ' control: mining rights confirmed. ' + miningIntro() + fieldTypeNote(t));
    } else if (t.poiType === 'station') {
        if (docked) { say('Already docked. Escape or X undocks.'); return; }
        // SPEC 3.23: three ranges now, gated by favor tier, not just
        // distance — the innermost range a pilot has physically reached
        // wins, but reaching it doesn't grant it: falling short of the
        // tier it needs just drops to the next range out instead (a
        // refusal for docking specifically, since spec gives that one its
        // own worked wording; a silent drop to comms for the transporter,
        // since being in transporter range but unwelcome there is really
        // just "still at comms" from the station's point of view).
        if (d <= stationRangeFor('dock', t.name)) {
            // SPEC 3.34: docking needs a full stop — the stabilizers
            // already bring a coasting ship to zero on their own (2.14),
            // so the gesture is let go of W (or S to brake), then C
            // again. Checked before favor, since it's the more basic gate.
            var spd = len(ship.vel);
            if (spd > CFG.dockMaxSpeed) {
                say(t.name + ' control: come to a full stop to dock. Speed ' + Math.round(spd) + '.');
                return;
            }
            if (favorTierAtLeast(t, 'trusted')) { dockAtStation(t); return; }
            say(t.name + ' control: docking denied. Earn our trust first — ' +
                capFirst(favorTier(favorOf(t.name))) + ' favor, ' + Math.round(favorOf(t.name)) +
                ' of ' + CFG.favorTrusted + ' needed.');
            return;
        }
        if (d <= stationRangeFor('transporter', t.name) && favorTierAtLeast(t, 'known')) { openHailMenu(t, 'transporter'); return; }
        openHailMenu(t, 'comm');
    } else if (t.poiType === 'gate') {
        // SPEC 3.10: sealed until SPEC 3.22 gives it a real transit — no
        // favor/hydrogen check yet, just the placeholder 2.6 text.
        say(t.name + ' control: transit lane not commissioned.');
    } else if (t.poiType === 'star') {
        // SPEC 3.74: an encounter, not open flight — the same
        // sectorHome-snapshot-then-newGame('mining') shape calling a
        // field or the Contested Zone already uses, so this correctly
        // routes any loss through the ordinary sector-campaign tug.
        // `corona` is set INSIDE newGame() (its own `startCorona` param),
        // same reasoning haul/capital/distress are — clearMission() runs
        // first and would otherwise null it right back out.
        sectorHome = snapshotSector(t);
        newGame('mining', null, false, false, null, true);
        ship.pos = v3(0, 0, -CFG.starEntryDist);
        say(t.name + '. ' + coronaIntro());
    } else {
        say(t.name + ' orbital relay: atmospheric operations are not yet available. ' +
            'The view is spectacular, though.');
    }
}

// X from an encounter entered via the sector: back to open space at the POI.
function returnToSector(silent) {
    var home = sectorHome;
    var wasMode = mode, wasWon = won;    // captured BEFORE newGame('sector') resets them
    sectorHome = null;
    // SPEC 3.10: a cleared zone or a worked-out field is replaced elsewhere
    // in the open quadrant the moment it's exited — decided (and, for a
    // depleted field, executed) BEFORE rebuilding the roster below, so the
    // fresh targets already reflect the new spawn instead of a stale one.
    var pendingRespawn = null;   // 'zone' | the depleted field's own name
    if (!demo && wasMode === 'combat' && wasWon) {
        pendingRespawn = 'zone';
    } else if (!demo && wasMode === 'mining') {
        var q0 = currentQuadrant();
        var qf0 = q0 && q0.fields.filter(function (x) { return x.name === home.poiName; })[0];
        if (qf0 && qf0.budget <= 0) pendingRespawn = home.poiName;
    }
    var respawnedField = null;
    if (pendingRespawn === 'zone') {
        currentQuadrant().zone = spawnZone(home.pos);
    } else if (pendingRespawn) {
        var q = currentQuadrant();
        q.fields = q.fields.filter(function (f) { return f.name !== pendingRespawn; });
        respawnedField = spawnField(home.pos);
        q.fields.push(respawnedField);
    }
    newGame('sector');
    ship.pos = home.pos; ship.yaw = home.yaw; ship.pitch = home.pitch;
    var idx = -1;
    targets.forEach(function (t, i) { if (t.name === home.poiName) idx = i; });
    if (idx >= 0) { selected = idx; locked = false; stopLockTone(); }
    else selectNearest();
    refillWarp();                                  // the core cooled while you were busy
    // "Near X" only when X is still actually there — a same-named
    // replacement (Contested Zone) or a depleted field's replacement both
    // mean the ship isn't really near what it's nominally selected on.
    var stillAtSameSpot = idx >= 0 && !pendingRespawn;
    var respawnNote = '';
    if (pendingRespawn === 'zone') {
        var zt = findTargetByName('Contested Zone');
        respawnNote = zt ? ' Contested Zone cleared. A new one is reported, ' + bearingText(zt)
                         : ' Contested Zone cleared. A new one is reported elsewhere.';
    } else if (respawnedField) {
        var nt = findTargetByName(respawnedField.name);
        respawnNote = ' ' + pendingRespawn + ' is worked out. ' + respawnedField.name + ' sighted, ' +
                      fieldKindWord(respawnedField.type) + (nt ? '. ' + bearingText(nt) : '.');
    }
    if (!silent) {
        say('Back in open space' + (stillAtSameSpot ? ' near ' + home.poiName : '') +
            '. Warp tank full. Ore hold ' + ore + '.' + respawnNote + ' Q for the map.');
    }
    saveProfile();
}

// ============================== 9. INPUT ====================================
// F5, F6, F11, and control R, F, W, T belong to the browser, so the pilot is
// never trapped in the page. The keyboard explorer is the one exception: while
// on, it promises every key is described and nothing happens.
var BROWSER_KEYS = { F5: true, F6: true, F11: true };

function isBrowserKey(e) {
    if (BROWSER_KEYS[e.key]) return true;
    if (e.ctrlKey) {
        var k = String(e.key).toLowerCase();
        if (k === 'r' || k === 'f' || k === 'w' || k === 't') return true;
    }
    return false;
}

var HELD = { arrowleft: 1, arrowright: 1, arrowup: 1, arrowdown: 1, w: 1, s: 1 };

function onKeyDown(e) {
    if (!running) {
        // Before Enter: Enter and Space activate the focused button natively;
        // anything else (a stray arrow, Ctrl to silence the reader, a letter)
        // re-speaks the begin line instead of silence. Browser keys pass.
        if (isBrowserKey(e) || e.repeat) return;
        var pre = String(keyName(e)).toLowerCase();
        if (pre === 'enter' || pre === ' ' || pre === 'tab') return;
        say(BEGIN_LINE);
        return;
    }
    if (isBrowserKey(e) && !describeMode) return;
    // Single characters lower-cased so Caps Lock, the NVDA laptop modifier,
    // never silences the game.
    var name = keyName(e);
    if (typeof name === 'string' && name.length === 1) name = name.toLowerCase();
    var lname = String(name).toLowerCase();
    e.preventDefault();

    if (describeMode) {
        if (e.repeat) return;
        if (lname === 'f12' || lname === 'escape') {
            describeMode = false;
            say('Explore mode off.');
        } else {
            say(prettyKey(name) + '. ' +
                (function () {
                    var d = KEY_DESCRIPTIONS[lname === ' ' ? ' ' : lname];
                    return (typeof d === 'function' ? d() : d) || 'Does nothing here.';
                })());
        }
        return;
    }

    // Music (SPEC 3.80): '[' play/stop, ']' next, Shift+']' previous — read
    // from e.code (BracketLeft/BracketRight + shiftKey), never e.key, since
    // a real Shift+']' sends '}' via e.key — the same trap 3.24 fixed for
    // Shift+digits. Checked here, before every overlay's own capture below,
    // so it works everywhere the sim takes keys — the same reach Y has
    // (3.51): the menu, flight, every encounter, every overlay.
    if (!e.repeat && e.code === 'BracketLeft') { musicToggleKey(); return; }
    if (!e.repeat && e.code === 'BracketRight') { musicStepKey(!!e.shiftKey); return; }

    // The Sound menu's own Music submenu, same shell as every other overlay.
    if (musicMenu.open) { musicMenuKey(lname); return; }

    // The help pop-up captures everything while open (arrows read, H jumps
    // headings, Escape closes) so game keys can't fire underneath it.
    if (help.open) { helpKey(lname, !!e.shiftKey); return; }

    // The quadrant map captures everything the same way.
    if (map.open) { if (lname === 'f1') { closeMap(); openHelp(); } else mapKey(lname); return; }

    // The run log captures everything the same way.
    if (runlog.open) { runLogKey(lname, !!e.shiftKey); return; }

    // F2 ship status, same shell.
    if (shipScreen.open) { shipScreenKey(lname, !!e.shiftKey); return; }

    // F3 resources, same shell.
    if (resourceScreen.open) { resourceScreenKey(lname); return; }

    // The Sound settings list, same shell (reached from the mission menu).
    if (soundMenu.open) { soundKey(lname); return; }

    // Docked at a station: the station menu captures everything.
    if (docked) { stationMenuKey(lname); return; }

    // Hailing a station at range: its own small menu, same shell.
    if (hailMenu.open) { hailMenuKey(lname); return; }

    // The mission menu: a Keyboard Commander style list. Nothing else fires
    // — checked BEFORE the warping guard below, since Escape (SPEC 1.18) can
    // open this menu mid-warp and every key from then on (arrows, Enter,
    // first-letter jumps, Escape-again-resumes) has to actually reach
    // menuKey() rather than being swallowed by "Hyperwarp in progress."
    if (menuOpen) {
        if (e.repeat) return;
        menuKey(lname, name);
        return;
    }

    // Mid-jump with no menu open, the ship answers to nobody — except
    // Escape (SPEC 1.18): the flight and its sound keep going under the
    // menu, so open it here too rather than blocking it like every other
    // key. Reaching this branch means menuOpen was false, so this is the
    // only place that opens it (menuKey() above handles Escape-again once
    // it's up).
    if (warping) {
        if (lname === 'escape') { if (!e.repeat) openMissionMenuOverlay(); return; }
        if (!e.repeat) say('Hyperwarp in progress.');
        return;
    }

    // SPEC 3.70: the shared end-of-encounter debrief, whatever the mode —
    // arrows/Home/End/Escape/Y are claimed here, same shape as the Run log
    // just above (repeats browse, same as holding Down there); Enter/X/F1/
    // F2/F3/F12 are NOT claimed, so each mode's own distinct Enter-retry/
    // X-leave branch (already built per encounter, further down) reaches
    // the generic switch untouched.
    if (debrief.open) {
        if (debriefKey(lname)) return;
    }

    // SPEC 3.59: turret defense replaces flight/weapons entirely with its
    // own Left/Right/Space/F/G/I — everything it doesn't claim (f1/f2/f3/
    // f12/escape/x/enter/y) falls through to the generic switch below.
    if (mode === 'turret' && !e.repeat) {
        if (turretKey(lname)) return;
    }

    // Shift+1..6 (SPEC 3.24 fix): unlike Shift+W/T/Tab/R below, a shifted
    // DIGIT does not fold back to the same character — a US layout sends
    // '!'/'@'/'#'/'$'/'%'/'^' via e.key, which never matched the plain
    // '1'-'6' switch cases, so cycling a slot backward has never worked
    // from a real keyboard (only the synthetic test events that set
    // e.key: '1' alongside shiftKey: true). e.code names the physical key
    // regardless of shift state or layout, so read the digit from there.
    if (e.shiftKey) {
        var digitMatch = /^Digit([1-6])$/.exec(e.code || '');
        if (digitMatch) {
            if (e.repeat) return;
            selectSlot(parseInt(digitMatch[1], 10) - 1, true);
            return;
        }
    }
    // Shift+Z (SPEC 3.30): the target-zone cycle Z used to be, unguarded by
    // tug/mission/over() same as it always was — a preference toggle, not
    // a combat action, so it stays available any time. Z itself is unbound
    // as of SPEC 3.44 (the tractor moved to B) — it falls through to the
    // switch's default case below, "Z does nothing here."
    if (e.shiftKey && lname === 'z') {
        if (e.repeat) return;
        cycleZone();
        return;
    }
    // Shift+B (SPEC 3.44) is retired as of SPEC 3.52 — there's no lower
    // "selected" tier to step down to any more, only the owned one, so
    // Shift+B needs no special handling at all: it simply falls through to
    // plain B's own case below (lname is 'b' regardless of shift), which is
    // harmless — engage/release doesn't care how the key arrived.
    // Blink (SPEC 3.68, ideas15.txt): Shift+arrows sidestep/world-vertical,
    // Shift+Page Up/Down forward/back — checked here, before the HELD
    // branch, for the same reason every other Shift chord is: a
    // Shift+arrow would otherwise just be a held turn. e.repeat is
    // ignored so a held chord blinks once, never a burst. docked/warping/
    // menuOpen/hailMenu never reach this far down onKeyDown at all (their
    // own gates above already returned), and turret mode's own Left/Right
    // zone-switch claims plain-or-shifted arrows before this — the course
    // is the one mode that still needs an explicit refusal, inside
    // blinkKey() itself.
    if (e.shiftKey && (lname === 'arrowleft' || lname === 'arrowright' || lname === 'arrowup' ||
                        lname === 'arrowdown' || lname === 'pageup' || lname === 'pagedown')) {
        if (e.repeat) return;
        if (tug) { say('A tug is on the way, ' + Math.ceil(tug.remaining) + ' seconds out.'); return; }
        if (mission && over()) { say('X returns to the sector.'); return; }
        if (over()) { say('Enter restarts.'); return; }
        blinkKey(lname === 'arrowleft' ? 'left' : lname === 'arrowright' ? 'right'
               : lname === 'arrowup' ? 'up' : lname === 'arrowdown' ? 'down'
               : lname === 'pageup' ? 'forward' : 'back');
        return;
    }
    // Shift chords (SPEC 1.15), before the HELD branch — Shift+W arrives as
    // 'w' and would otherwise just be a held thrust key. SPEC 3.38 rebinds
    // Shift+T specifically from cycle-back to auto-target; Shift+Tab keeps
    // cycle-back alone.
    if (e.shiftKey && (lname === 'w' || lname === 's' || lname === 't' || lname === 'tab' || lname === 'r')) {
        if (e.repeat) return;
        if (tug) { say('A tug is on the way, ' + Math.ceil(tug.remaining) + ' seconds out.'); return; }
        if (mission && over()) { say('X returns to the sector.'); return; }
        if (over()) { say('Enter restarts.'); return; }
        if (lname === 'w') toggleAutoThrust('fwd');
        else if (lname === 's') toggleAutoThrust('rev');   // SPEC 3.57
        else if (lname === 'r') radarPing();
        else if (lname === 't') autoTargetKey();
        else cycleTarget(-1);
        return;
    }
    // Any manual thrust or brake press ends auto-thrust (the press itself
    // still lands as a normal held key).
    if (autoThrust && (lname === 'w' || lname === 's') && !e.repeat) {
        var offLine = autoOffText();
        autoThrust = false;
        SIM.audio.blip(380, 90, 0.14, 0, 'triangle');
        say(offLine);
    }
    if (HELD[lname]) {
        keysDown[lname] = true;
        // Silence is a bug: if the sim is frozen because the encounter is
        // over, a thrust or turn key says so instead of doing nothing.
        if (over() && !e.repeat) say(overHeldText());
        return;
    }
    if (e.repeat) return;

    switch (lname) {
        case ' ':
            if (weaponsCold()) { SIM.cues.play('refusal_offline'); say('Weapons are cold in open space. C calls a point of interest.'); }
            else if (!over()) startBeam();
            break;
        case 'f':
            if (weaponsCold()) { SIM.cues.play('refusal_offline'); say('Weapons are cold in open space. C calls a point of interest.'); }
            else if (!over()) fireMissile();
            break;
        case '1': case '2': case '3': case '4': case '5': case '6':
            selectSlot(parseInt(lname, 10) - 1, e.shiftKey);
            break;
        case 'g':
            // SPEC 3.41: shields are cold on the flight course too — but
            // this leaves the sector's own G untouched (it has never
            // refused there, and this isn't the place to change that).
            if (mode === 'course' || mode === 'minefield' || mode === 'shadow') { SIM.cues.play('refusal_offline'); say('Weapons are cold in open space. C calls a point of interest.'); }
            else if (!over()) shieldKey();
            break;
        case 'd':
            if (weaponsCold()) { SIM.cues.play('refusal_offline'); say('Nothing shoots at you in open space. Decoys are for encounters.'); }
            else if (!over()) fireChaff();
            break;
        case 'b':      if (!over()) tractorKey(); break;
        case 'tab':    if (!over()) cycleTarget(); break;
        case 'r':      rangeReport(); break;
        case 'e':      if (!over()) startExtract(); break;
        case 'v':      if (!over()) startDustVac(); break;
        case 'z':      zStatusKey(); break;   // SPEC 3.66
        case 'q':      openMap(); break;
        case 'h':      if (mode === 'gaterun') { if (!over()) gateRunKey(); } else startWarp(); break;
        case 'c':
            if (mode === 'sector') { callPoi(); }
            else say('C calls points of interest in open sector space.');
            break;
        case 'x':
            if (tug) say('A tug is already on the way, ' + Math.ceil(tug.remaining) + ' seconds out. Sit tight.');
            else if (sectorHome && mode !== 'sector') returnToSector();
            else exitToMenu();
            break;
        case 'i':      statusReport(); break;
        case 'y':      speakTotals(); break;
        case 't': {
            var sel = targets[selected];
            if (sel && sel.alive) say(bearingText(sel));
            else say(mode === 'mining' ? 'No rock selected. Tab cycles targets.'
                                       : 'No target selected. Tab cycles targets.');
            break;
        }
        case 'f1':     openHelp(); break;
        case 'f2':     openShipScreen(); break;
        case 'f3':     openResourceScreen(); break;
        case 'f12':
            describeMode = true;
            say('Explore mode on. Press any key to hear what it does. F12 or Escape turns it off.');
            break;
        case 'escape':
            openMissionMenuOverlay();
            break;
        case 'enter':
            // SPEC 2.16: a lost ship waiting on a tug (sector campaign or
            // the delivery run) answers Enter by paying to rush the tug,
            // not by restarting anything — tugCandidate() is what routed
            // shipDestroyed() into the tug in the first place, so `tug`
            // being set here always means this loss came from there.
            if (tug) {
                payTugFee();
            } else if (mission && over()) {
                if (mission.poiName) {
                    // SPEC 2.17: a station-offered mission never Enter-replays
                    // — it's offered once per station per cooldown from the
                    // hail menu, not farmable in place. X is the only way out.
                    say('Mission ' + (mission.success ? 'complete' : 'over') + '. X returns to the sector.');
                } else {
                    // SPEC 3.54: a menu-launched drill (no station, no
                    // poiName) DOES replay on Enter, same as Combat training —
                    // a fresh run of the same kind, not farmable-for-favor
                    // since there's no favor to farm.
                    startMissionDrill(mission.kind);
                }
            } else if (over()) {
                // A fresh drill run from the menu starts a fresh hold and a
                // full magazine; a replay inside a sector run keeps the
                // cargo and the missile count. A retry after a loss always
                // comes with a repaired hull (there is no other way back).
                // (A lost ship reaches here only for a standalone training
                // drill now — every sector/demo loss is routed to the tug
                // above instead, so `lost` alongside `sectorHome` no longer
                // happens at this point.)
                if (mode === 'mining' && !sectorHome) ore = 0;
                if (!sectorHome) { missiles = CFG.missileMax; chaff = CFG.chaffMax; autoTargetCharges = CFG.autoTargetCharges; }
                if (lost || !sectorHome) { hull = CFG.shipHull; repairAllSystems(); }
                // SPEC 3.60: captured BEFORE newGame() — its own clearMission()
                // call is about to null `haul`, same reasoning courseState/
                // turretState already need on this exact line.
                var wasHaul = mode === 'mining' && !!haul;
                // SPEC 3.69: same reasoning as wasHaul above.
                var wasCapital = mode === 'combat' && !!capital;
                // SPEC 3.71: same reasoning again — miningState/combatState
                // are about to be nulled by newGame()'s own clearMission()
                // call too, so whether THIS retry belongs to the standalone
                // drill (as opposed to a quadrant field/demo/contract mining
                // trip, or a mission/capital combat encounter) has to be
                // captured now, not re-checked after.
                var wasMiningDrill = mode === 'mining' && !!miningState;
                var wasCombatDrill = mode === 'combat' && !!combatState;
                if (wasHaul) {
                    newGame(null, null, true);
                    say(haulIntro());
                } else if (wasCapital) {
                    newGame(null, null, false, true);
                    say(capitalIntro());
                } else {
                    newGame();
                    if (mode === 'course') {
                        courseState = { activeIndex: 0, elapsed: 0, started: false, made: 0, missed: 0, offsets: [] };
                        activateCourseGate(0, courseIntro());
                    } else if (mode === 'turret') {
                        turretState = makeTurretState();
                        say(turretIntro());
                    } else if (mode === 'minefield') {
                        // SPEC 3.61: a real bug found while testing 3.62 —
                        // this branch never existed, so an Enter-retry after
                        // winning the minefield fell to the generic `else`
                        // below and spoke combatIntro()'s "Five targets
                        // detected..." instead. newGame() itself already
                        // rebuilt the minefield correctly (its own mode
                        // dispatch doesn't need this fix); only the SPOKEN
                        // line was wrong.
                        minefieldState = { elapsed: 0, started: false, detonations: 0 };
                        say(minefieldIntro());
                    } else if (mode === 'shadow') {
                        // SPEC 3.62: same fix, same reasoning, built alongside
                        // rather than after finding it a second time.
                        shadowState = { elapsed: 0, started: false, contact: 0, inRange: false, currentHold: 0, longestHold: 0, timesLost: 0 };
                        say(shadowIntro());
                    } else if (mode === 'nebula') {
                        // SPEC 3.63: same shape again, built alongside from
                        // the start this time.
                        nebulaState = { elapsed: 0, started: false, inside: false,
                                         cloudCenter: v3(0, 0, -CFG.nebulaCenterDist) };
                        if (SIM.audio.ctx) SIM.audio.playMusic('nebula_cloud', { vol: CFG.stationAmbientVol, fadeS: 1.5 });
                        say(nebulaIntro());
                    } else if (mode === 'gaterun') {
                        // SPEC 3.64: same shape again.
                        gateRunState = { elapsed: 0, started: false, wasted: 0 };
                        say(gateRunIntro());
                    } else if (mode === 'mining' && wasMiningDrill) {
                        // SPEC 3.71: same shape again — only for the
                        // standalone drill (wasMiningDrill, captured above
                        // BEFORE newGame() nulled miningState); a quadrant
                        // field/demo/contract mining retry never reaches
                        // this branch (their own loss routes through the
                        // tug instead, never Enter).
                        miningState = { elapsed: 0, started: false, cores: 0 };
                        say(miningIntro());
                    } else if (mode === 'combat' && wasCombatDrill) {
                        // SPEC 3.71: same shape again, for the standalone
                        // Combat drill.
                        combatState = { elapsed: 0, started: false, shotsFired: 0, shotsLanded: 0 };
                        say(combatIntro());
                    } else {
                        say(mode === 'mining' ? miningIntro() : combatIntro());
                    }
                }
            }
            else say('Enter does nothing here. F1 for help.');
            break;
        default:
            // Silence is a bug: a key nothing wanted still gets an answer.
            say(prettyKey(name) + ' does nothing here. F1 for help.');
    }
}

// Some injected or virtual keyboards (and a few switch-access devices) send
// an empty e.key and only fill e.code, so fall back to decoding the code.
function keyName(e) {
    var name = e.key;
    if (name && name !== 'Unidentified') return name;
    var c = e.code || '';
    if (c === 'Space') return ' ';
    if (/^Key[A-Z]$/.test(c)) return c.slice(3).toLowerCase();
    return c;
}

function onKeyUp(e) {
    var name = keyName(e);
    if (typeof name === 'string' && name.length === 1) name = name.toLowerCase();
    delete keysDown[String(name).toLowerCase()];
}

// ============================== 10. LOOP ====================================
var lastFrame = 0;

function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min((now - lastFrame) / 1000, 0.1);
    lastFrame = now;
    simTick(dt);
}

function simTick(dt) {
    // The game clock (SPEC 2.17, persisted as of 3.10 — profile.clock):
    // backs mission cooldowns and the quadrant's orbits/drift/spawns, so it
    // needs to keep counting outside the delivery run too — same gate as
    // the delivery clock, minus its over()/tug wrinkle (nothing here needs it).
    if (running && !help.open && !map.open && !menuOpen && dt > 0) {
        profile.clock += dt;
        // A quiet autosave every CFG.quadrantSaveEveryS of open sector
        // flight (SPEC 3.10) — never mid-encounter (that gate is `mode
        // === 'sector'`, so a combat/mining visit just doesn't tick this;
        // leaving one is its own transition save in returnToSector).
        if (mode === 'sector') {
            quadrantAutosaveIn -= dt;
            if (quadrantAutosaveIn <= 0) { saveProfile(); quadrantAutosaveIn = CFG.quadrantSaveEveryS; }
        }
    }
    // The delivery clock runs whenever the sim is live, hyperwarp included —
    // and, as of SPEC 2.16, through a tug wait too: the tug is a consequence
    // on the clock, not a pause of it.
    if (demo && !demo.delivered && running && !help.open && !map.open &&
        !menuOpen && (!over() || tug) && dt > 0) demo.elapsed += dt;
    // SPEC 3.28: the quadrant's own contract clock, same gate as the demo's.
    if (contract && !contract.delivered && running && !help.open && !map.open &&
        !menuOpen && (!over() || tug) && dt > 0) contract.elapsed += dt;
    // The tug countdown runs on the same real/game-time gate as everything
    // else that's frozen by help/map/menu — it just isn't gated on !over(),
    // since being lost is exactly the condition that starts it.
    if (tug && running && !help.open && !map.open && !menuOpen && dt > 0) updateTug(dt);
    if (!running || over() || help.open || map.open || docked || hailMenu.open || dt <= 0) {
        thrusterSync(null); updateStabilizers(0); return;
    }

    // A warp flight is automated — no manual control — but it keeps moving
    // and sounding even under an open mission menu (SPEC 1.18's mid-warp
    // exception), so it gets its own branch rather than the plain freeze
    // menuOpen otherwise causes below.
    if (warping) {
        thrusterSync(null); updateStabilizers(0);
        updateWarpFlight(dt);
        updateListener();
        updateTargeting(dt);
        updateStatusLine();
        return;
    }

    if (menuOpen) {
        thrusterSync(null); updateStabilizers(0); return;
    }

    // SPEC 3.59 (ideas14.txt): turret defense — the ship doesn't fly at all
    // (Brian: "the player has 3 zones in front of them"), so it skips every
    // bit of the flight/thrust/collision block below entirely, running only
    // its own zone/incoming update and the listener/status line every other
    // mode already needs.
    if (mode === 'turret') {
        thrusterSync(null); updateStabilizers(0);
        updateTurret(dt);
        updateListener();
        updateStatusLine();
        return;
    }

    // Attitude from held arrows. Fitted modules add mass (SPEC 1.7); no
    // friction in space, so more mass just means slower turning and thrust.
    var mass = shipMass();
    // Auto-thrust (SPEC 1.15) reads as a held W to everything below —
    // thrust, the thruster sound, and the stabilizers' "coasting" test.
    // SPEC 3.57: 'rev' reads as a held S instead (the brake/reverse thruster).
    var k = autoThrust ? Object.assign({}, keysDown, autoThrust === 'rev' ? { s: true } : { w: true }) : keysDown;
    if (keysDown.arrowleft)  ship.yaw   -= CFG.turnRate / mass * dt;
    if (keysDown.arrowright) ship.yaw   += CFG.turnRate / mass * dt;
    if (keysDown.arrowup)    ship.pitch += CFG.turnRate / mass * dt;
    if (keysDown.arrowdown)  ship.pitch -= CFG.turnRate / mass * dt;
    ship.pitch = clamp(ship.pitch, -CFG.pitchLimit, CFG.pitchLimit);
    // SPEC 3.38: after the manual keys, so a held arrow this same frame
    // (checked inside updateAutoTarget) cancels it — the pilot always wins.
    if (autoTarget) updateAutoTarget(dt);

    // Thrust, brake, damping, cap — with each maneuver's own thruster sound.
    // Reaction mass (SPEC 2.14): W, S, and the passive stabilizer damping
    // all draw on it, scaled down to rcsBatteryFactor once it runs out
    // rather than stopping outright. Braking is a real reverse thruster
    // now (half of forward thrust), not an instant multiplicative stop.
    var rf = rcsFactor();
    // SPEC 3.27: a broken thrust system doesn't touch the passive
    // stabilizer damping below — only W/S themselves are affected —
    // 'off' means neither does anything, 'half' means half the push.
    var thrustSt = systemState('thrust');
    var tf = thrustSt === 'half' ? CFG.repairThrustPct : 1;
    if (k.w && thrustSt !== 'off') {
        ship.vel = add(ship.vel, scale(shipForward(), CFG.thrust / mass * rf * tf * dt));
        spendRcs(CFG.rcsThrustPerS * dt);
        // SPEC 3.41: "the clock starts the moment you thrust" — W or
        // auto-thrust, whichever gets there first.
        if (mode === 'course' && courseState && !courseState.started) courseState.started = true;
        // SPEC 3.61: same rule for the minefield.
        if (mode === 'minefield' && minefieldState && !minefieldState.started) minefieldState.started = true;
        // SPEC 3.62: same rule for the shadow.
        if (mode === 'shadow' && shadowState && !shadowState.started) shadowState.started = true;
        // SPEC 3.63: same rule for nebula transit.
        if (mode === 'nebula' && nebulaState && !nebulaState.started) nebulaState.started = true;
        // SPEC 3.64: same rule for the gate run.
        if (mode === 'gaterun' && gateRunState && !gateRunState.started) gateRunState.started = true;
        // SPEC 3.71: same rule for the Mining and Combat drills' own clocks
        // — miningState/combatState are only ever set for the standalone
        // drill (see their own declarations above), so this never touches
        // a quadrant field visit, the demo/contract, the haul, distress,
        // a mission, or the capital ship.
        if (mode === 'mining' && miningState && !miningState.started) miningState.started = true;
        if (mode === 'combat' && combatState && !combatState.started) combatState.started = true;
    }
    thrusterSync(k);
    if (k.s && thrustSt !== 'off') {
        ship.vel = add(ship.vel, scale(shipForward(), -CFG.brakeThrust / mass * rf * tf * dt));
        spendRcs(CFG.rcsBrakePerS * dt);
    }
    var beforeDampSpd = len(ship.vel);
    var effectiveDampKeep = 1 - (1 - CFG.dampKeep) * rf;   // weaker stabilizer on battery
    ship.vel = scale(ship.vel, Math.pow(effectiveDampKeep, dt));
    var dampShed = beforeDampSpd - len(ship.vel);
    if (dampShed > 0.01) spendRcs(dampShed * CFG.rcsPerSpeedShed);
    var spd = len(ship.vel);
    if (spd > CFG.maxSpeed) ship.vel = scale(ship.vel, CFG.maxSpeed / spd);
    ship.pos = add(ship.pos, scale(ship.vel, dt));
    // Stabilizers pulse only while coasting with real momentum to shed.
    updateStabilizers(spd > 3 && !k.w && !k.s ? spd : 0);
    if (mode === 'sector') { updateCollisions(spd); updateStationRanges(); }

    if (mode === 'mining') {
        // Rock physics: drift with momentum, bleed energy to friction so a
        // blasted rock calms down and becomes laserable again, and vanish
        // if pushed past the edge of the asteroid cloud.
        targets.forEach(function (t) {
            if (!t.alive || t.kind !== 'rock') return;   // dust hangs still
            t.pos = add(t.pos, scale(t.vel, dt));
            t.vel = scale(t.vel, Math.pow(CFG.rockFriction, dt));
            if (t.nodes) SIM.audio.movePanner(t.nodes.panner, t.pos);
            // SPEC 3.60: the cloud-radius check is measured from the world
            // ORIGIN, which is exactly where a normal mining cloud sits —
            // but the haul's whole point is towing a rock far from its
            // spawn point as the ship flies, so this would "lose" it (and,
            // via checkMiningEnd, silently WIN the run) the moment it left
            // an ordinary cloud's radius. Real bug found in testing: gated
            // out for any haulable rock.
            if (!t.haulable && len(t.pos) > CFG.cloudRadius) loseRock(t);
        });
        updateTractor(dt);
    }
    // (Combat ship motion — the orbiting Cruiser and evade bursts — lives in
    // updateEnemies, along with enemy fire.)

    updateListener();
    updateTargeting(dt);
    if (mode === 'course') updateCourse(dt);
    if (mode === 'minefield') updateMinefield(dt);
    if (mode === 'shadow') updateShadow(dt);
    if (mode === 'nebula') updateNebula(dt);
    if (mode === 'gaterun') updateGateRun(dt);
    if (mode === 'mining') updateMining(dt);   // SPEC 3.71: a no-op unless miningState is set
    if (mode === 'mining' && corona) updateCorona(dt);   // SPEC 3.74
    if (mode === 'combat') updateCombat(dt);   // SPEC 3.71: a no-op unless combatState is set
    if (mode === 'combat' && capital) capital.elapsed += dt;   // SPEC 3.71: the capital ship's own clock
    stepMissile(dt);
    updateShield(dt);
    updateEnemies(dt);
    if (mission) updateMission(dt);
    updateWarpCore(dt);
    updateRepairCrew(dt);
    updateStatusLine();
}

// Test-only manual clock: advances the sim by dtSeconds (default a 60 Hz
// frame) without requestAnimationFrame, so a script can drive a scenario
// even while the tab is backgrounded. Steps in real frame-sized chunks
// (capped like simTick's own dt) rather than one giant dt, so nothing that
// assumes per-frame granularity (spool timers, tick schedulers) skips state.
function stepSim(dtSeconds, chunk) {
    var left = dtSeconds === undefined ? 1 / 60 : dtSeconds;
    var step = chunk || 1 / 30;
    while (left > 1e-6) {
        var d = Math.min(step, left);
        simTick(d);
        left -= d;
    }
}

// Visual sanity line for a sighted co-tester. aria-hidden, never read.
var lastStatusAt = 0;
function updateStatusLine() {
    var now = Date.now();
    if (now - lastStatusAt < 250 || !statusEl) return;
    lastStatusAt = now;
    var t = targets[selected], lines = [];
    lines.push('Speed ' + Math.round(len(ship.vel)) +
               '   yaw ' + Math.round(deg(ship.yaw)) +
               '   pitch ' + Math.round(deg(ship.pitch)));
    if (t && t.alive) {
        var a = aim(t.pos);
        lines.push('Target: ' + t.name + '   err ' + deg(a.err).toFixed(1) +
                   '°   dist ' + Math.round(a.dist) + (locked ? '   LOCKED' : ''));
    }
    lines.push((mode === 'mining'
                    ? 'Rocks: ' + aliveRocks().length + '   dust fields: ' + debris.length + '   ore ' + ore
                    : 'Targets alive: ' + aliveTargets().length) +
               (missile ? '   missile in flight' + (missile.guided ? '' : ' (ballistic)') : ''));
    lines.push('Hull ' + hull + '   missiles ' + missiles +
               '   shields ' + (shield.up ? 'UP ' + Math.round(shield.pool / shieldPoolMax() * 100) + '%' : shield.raising >= 0 ? 'raising' : shield.repairing > 0 ? 'disrepair' : 'down') +
               '   ' + laserSlotText(laserSlot) + (laserHot() ? '   LASER HOT' : '') +
               (threat ? '   threat: ' + threat.type + ' from ' + threat.t.name : '') +
               (demo ? '   clock ' + Math.floor(demo.elapsed) + 's' : ''));
    statusEl.textContent = lines.join('\n');
}

    // named; this is a sanity check that the CFG numbers are in the
    // right neighborhood, not a claim of precise fidelity. 'clean' =
    // five kills, the ore goal mined mostly by dust, two clears of the
    // no-warp zone, a clean approach; 'sloppy' adds a second field (a

    runBudget: function (scenario) {

        var dustFraction = 0.6;                               // rough split of the ore goal that comes from dust vs. cores

        var gained = killRcs + dustRcs;

        var clears = scenario === 'sloppy' ? 3 : 2;           // out of the no-warp zone: station departure, and again per field visited

        var balance = clamp(CFG.rcsMax - spent + gained, 0, CFG.rcsMax);
        return { scenario: scenario, gained: Math.round(gained * 10) / 10, spent: Math.round(spent * 10) / 10,

                 onBattery: balance <= 0 };
    },
    // Test-only manual clock: advances the sim by dtSeconds (default one
    // 60 Hz frame) without requestAnimationFrame, in small chunks so every
    // per-frame system (spool timers, tick schedulers) still sees each
    // step — not one giant dt. Needed because a backgrounded/hidden browser
    // tab suspends rAF almost entirely (Chrome Page Visibility throttling),
    // which would otherwise stall shields, enemy fire, missiles, everything.
    step: function (dtSeconds, chunk) { stepSim(dtSeconds, chunk); },
    // Test-only knobs: pull the next enemy attack forward, or set the hold.
    poke: function (o) {
