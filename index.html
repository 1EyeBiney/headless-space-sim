function turretTimingText() {
    if (!turretState.offsets.length) return 'No shots timed — every incoming was a volley or a hit.';
    var mean = turretState.offsets.reduce(function (a, b) { return a + b; }, 0) / turretState.offsets.length;
    if (Math.abs(mean) < 0.05) return 'On average you fire right on the sweet spot.';
    return 'On average you fire ' + Math.abs(mean).toFixed(1) + ' seconds ' + (mean < 0 ? 'early' : 'late') + '.';
}
function turretWeakestZoneText() {
    var zh = turretState.zoneHits, total = turretState.hits + turretState.volleyLanded;
    if (total <= 0) return 'No zone took a hit.';
    var idx = 0;
    for (var k = 1; k < zh.length; k++) if (zh[k] > zh[idx]) idx = k;
    if (zh[idx] <= 0) return 'No zone took a hit.';
    var name = TURRET_ZONE_NAMES[idx];
    return name.charAt(0).toUpperCase() + name.slice(1) + ' zone took ' + zh[idx] + ' of your ' + total +
           ' hit' + (total === 1 ? '' : 's') + '.';
}
function turretDebriefLines() {
    var t = turretState;
    // SPEC 3.72: the volley's own gone (turretVolleyChance 0) — "Volleys: 0
    // caught, 0 landed." on every single run is noise, so the line goes
    // with it; volleyCaught/volleyLanded still exist on turretState (the
    // mechanism is one number away from coming back, not deleted).
    return [
        'Score ' + Math.round(t.score) + '.',
        'Accuracy ' + turretAccuracyPct() + ' percent — ' + t.cleared + ' cleared of ' + (t.cleared + t.hits) + '.',
        turretTimingText(),
        'Best streak ' + t.bestStreak + '.',
        'Missiles used: ' + (CFG.turretMissileMax - t.missiles) + ' of ' + CFG.turretMissileMax + '.',
        turretWeakestZoneText()
    ];
}
// Opened automatically at the end of a run (win or loss, from updateTurret
// and from shipDestroyed's own delayed line). SPEC 3.70: routes through the
// shared debrief shell now — see openDebrief() below.
function openTurretDebrief() {
    var accuracy = turretAccuracyPct();
    recordRun('turret', { score: Math.round(turretState.score), accuracy: accuracy, bestStreak: turretState.bestStreak });
    openDebrief('Turret defense ' + (won ? 'held' : 'over'), turretDebriefLines(),
                 'Enter tries again, X for the mission menu.');
}

// ---- the shared debrief (SPEC 3.70, ideas16.txt) ---------------------------
// One shell for every encounter's end, win or loss — generalized from the
// turret's own first-built version (SPEC 3.65) above. `opener` already
// carries its own status word ("Turret defense held", "Flight course
// complete", "Ship lost" style headers use their own encounter name plus
// "over") — this function appends the period, the headline, and the fixed
// "Down arrow reads the results" tail in one say(), matching the spec's own
// template: "[Title] [held/complete/over]. [line 1]. Down arrow reads the
// results." `lines` is the encounter's own facts, headline (the ranked
// number, SPEC 3.71) first; `options` is that encounter's Enter/X hint,
// appended as the FINAL entry of `debrief.lines` — that's the whole "no nag
// timer" design (Brian, 2026-09-09): nothing speaks unprompted after the
// opener, so a pilot who walks away and comes back presses Down or End and
// hears exactly what to do next.
function openDebrief(opener, lines, options) {
    debrief.title = opener;
    debrief.options = options;
    debrief.lines = lines.concat([options]);
    debrief.open = true;
    debrief.idx = 0;
    say(opener + '. ' + lines[0] + ' Down arrow reads the results.');
}
// Arrows browse one line at a time (Home/End jump to the first/last — the
// last is always that encounter's own Enter/X hint), Escape closes back to
// the same frozen-ship state that already existed without a debrief, Y
// passes through to the resource totals. Enter/X/F1/F2/F3/F12 are
// deliberately NOT claimed here — they fall through to the generic switch
// exactly as they did before any of this existed, so each mode's own
// existing Enter-retry/X-leave branch (already distinct per encounter) just
// runs unmodified.
function debriefKey(lname) {
    var lines = debrief.lines;
    if (lname === 'arrowdown') {
        if (debrief.idx < lines.length - 1) { debrief.idx++; say(lines[debrief.idx]); }
        else { SIM.audio.blip(220, 80, 0.1); say('End of the debrief.'); }
        return true;
    }
    if (lname === 'arrowup') {
        if (debrief.idx > 0) { debrief.idx--; say(lines[debrief.idx]); }
        else { debrief.idx = 0; SIM.audio.blip(220, 80, 0.1); say('Top of the debrief.'); }
        return true;
    }
    if (lname === 'home') { debrief.idx = 0; say(lines[0]); return true; }
    if (lname === 'end') { debrief.idx = lines.length - 1; say(lines[debrief.idx]); return true; }
    if (lname === 'escape') {
        debrief.open = false;
        say('Debrief closed. ' + debrief.options);
        return true;
    }
    if (lname === 'y') { speakTotals(); return true; }
    return false;   // enter/x/f1/f2/f3/f12 fall through to the generic switch
}

// Space/F/G, and Left/Right to switch zones — the whole of turret's own
// input. Everything else (arrows up/down, W/S, Tab/T/R, D/B/Z/E/V/Q/H/C)
// is refused with the offline buzz: none of it means anything here.
function turretKey(lname) {
    // SPEC 3.70: the shared debrief check in onKeyDown runs BEFORE this
    // function and already claims arrows/Home/End/Escape/Y while it's open
    // — anything reaching here with debrief.open true (Left/Right, Space,
    // F, G, I) is a key the debrief doesn't want, and none of turret's own
    // zone-switch/fire/shield logic should run once the drill is over.
    if (debrief.open) return false;
    var i = turretState.zone, z = turretState.zones[i], name = TURRET_ZONE_NAMES[i];
    if (lname === 'arrowleft' || lname === 'arrowright') {
        turretState.zone = (i + (lname === 'arrowright' ? 1 : -1) + 3) % 3;
        var nz = turretState.zones[turretState.zone];
        SIM.audio.blip(lname === 'arrowright' ? 500 : 420, 90, 0.12, 0, 'triangle');
        say(TURRET_ZONE_NAMES[turretState.zone] + '. ' +
            (nz.incoming ? Math.ceil(nz.incoming.timeLeft) + ' seconds out, ' + nz.incoming.height +
                (nz.incoming.kind === 'volley' ? ', shield only.' : '.') : 'Clear.') +
            (nz.shieldUp ? ' Shield up.' : ''));
        return true;
    }
    if (lname === ' ' || lname === 'f') {
        var isMissile = lname === 'f';
        if (isMissile && turretState.missiles <= 0) { SIM.cues.play('refusal_dud'); say('No missiles left.'); return true; }
        if (!z.incoming) { SIM.cues.play('refusal_dud'); say('Nothing in the ' + name + ' zone.'); return true; }
        // SPEC 3.65: a volley can't be shot at all — the shield is the only answer.
        if (z.incoming.kind === 'volley') {
            SIM.cues.play('refusal_offline');
            say('That one can\'t be shot. Shield, G.');
            return true;
        }
        if (!isMissile && Date.now() < z.laserReadyAt) {
            SIM.cues.play('refusal_wait');
            say(name.charAt(0).toUpperCase() + name.slice(1) + ' laser recharging, ' + Math.ceil((z.laserReadyAt - Date.now()) / 1000) + ' seconds.');
            return true;
        }
        var frac = clamp(z.incoming.timeLeft / z.incoming.total, 0, 1);
        var points = turretClearScore(z.incoming, frac);
        SIM.cues.play('explosion_kill', { pos: turretIncomingPos(i, z.incoming.height, frac), size: 'small' });
        stopIncomingVoice(z.incoming); z.incoming = null;
        z.spawnIn = rand(CFG.turretSpawnGapMinS, CFG.turretSpawnGapMaxS);
        turretState.cleared++;
        turretState.score += points;
        if (isMissile) turretState.missiles--;
        else z.laserReadyAt = Date.now() + CFG.turretLaserCooldownS * 1000;
        var streakLine = turretRegisterSuccess();
        // SPEC 3.72 (Brian: "do not announce scored in the game play"): no
        // "plus N" here — `points` still accrues into turretState.score,
        // read on demand by I and by the debrief at the end, just never
        // spoken mid-drill. The clear/explosion cue and the streak line
        // stay; those are events, not bookkeeping.
        if (!streakLine) {
            say(name.charAt(0).toUpperCase() + name.slice(1) + ' cleared' + (isMissile ? ' by missile.' : '.') +
                (isMissile ? ' ' + turretState.missiles + ' left.' : ''));
        }
        return true;
    }
    if (lname === 'g') {
        z.shieldUp = !z.shieldUp;
        SIM.audio.blip(z.shieldUp ? 480 : 340, 100, 0.14, 0, 'sine');
        say(name.charAt(0).toUpperCase() + name.slice(1) + ' shield ' + (z.shieldUp ? 'up.' : 'down.'));
        return true;
    }
    if (lname === 'i') {
        var line = 'Your hull ' + hull + '. ' + name.charAt(0).toUpperCase() + name.slice(1) + ' selected, ' +
            (z.incoming ? Math.ceil(z.incoming.timeLeft) + ' seconds out' + (z.incoming.kind === 'volley' ? ', shield only.' : '.') : 'clear.') +
            (z.shieldUp ? ' Shield up.' : '') +
            ' ' + Math.max(0, Math.ceil(CFG.turretDrillS - turretState.elapsed)) + ' seconds left. ' +
            'Score ' + Math.round(turretState.score) + '. Streak ' + turretState.streak + '. ' +
            turretState.cleared + ' cleared, ' + turretState.hits + ' hit, ' + turretState.missiles + ' missiles.';
        say(line);
        return true;
    }
    if (lname === 'arrowup' || lname === 'arrowdown' || lname === 'w' || lname === 's' ||
        lname === 'tab' || lname === 't' || lname === 'r' || lname === 'd' || lname === 'b' ||
        lname === 'z' || lname === 'e' || lname === 'v' || lname === 'q' || lname === 'h' || lname === 'c') {
        SIM.cues.play('refusal_offline');
        say('Turret defense: left and right switch zones, Space, F, and G act on the selected one.');
        return true;
    }
    return false;   // f1/f2/f3/f12/escape/x/enter/y fall through to the generic switch
}

// ============================== 8. RADAR ====================================
// Plays each surviving target's own signature at its true 3D position,
// nearest first, by briefly boosting its continuous voice +6 dB. Doubles as
// an HRTF localization drill.
// R (SPEC 1.15): the one number, plus which way it is going. The range
// rate is the relative velocity along the line of sight; under 2 units a
// second it is just "Range N."
function rangeReport() {
    var t = targets[selected];
    if (!t || !t.alive) {
        say(mode === 'mining' ? 'No rock selected. Tab cycles targets.' : 'No target selected. Tab cycles targets.');
        return;
    }
    var rel = sub(t.pos, ship.pos), d = len(rel);
    var rate = d > 0 ? dot(scale(rel, 1 / d), sub(t.vel || v3(0, 0, 0), ship.vel)) : 0;   // + = opening
    var trend = rate < -2 ? ', closing' : rate > 2 ? ', opening' : '';
    SIM.audio.blip(660, 60, 0.1);
    say('Range ' + round10(d) + trend + '.');
}

// Shift+R (was R before SPEC 1.15).
function radarPing() {
    if (radarBusy) return;
    var alive = aliveTargets().slice().sort(function (x, y) {
        return len(sub(x.pos, ship.pos)) - len(sub(y.pos, ship.pos));
    });
    if (!alive.length) { say('No targets remain.'); return; }
    radarBusy = true;
    alive.forEach(function (t, i) {
        setTimeout(function () {
            if (t.alive && t.nodes && SIM.audio.ctx) {
                // Each voice returns to ITS OWN resting level — a dust field's
                // quiet shimmer must not stay stuck at rock volume.
                var back = t.kind === 'dust'
                    ? clamp(0.015 + t.amount / 8000, 0.015, 0.07)
                    : t.kind === 'poi' ? poiGain(t)
                    : CFG.targetGain;
                var peak = t.kind === 'dust' ? back * 4 : back * CFG.radarBoost;
                var g = t.nodes.gain.gain, t0 = SIM.audio.ctx.currentTime;
                g.cancelScheduledValues(t0);
                g.setValueAtTime(peak, t0);
                g.setValueAtTime(peak, t0 + CFG.radarBurstMs / 1000);
                g.linearRampToValueAtTime(back, t0 + CFG.radarBurstMs / 1000 + 0.1);
            }
        }, i * CFG.radarGapMs);
    });
    setTimeout(function () {
        radarBusy = false;
        if (mode === 'mining') {
            var r = aliveRocks().length, d = debris.length;
            say(r + (r === 1 ? ' rock' : ' rocks') +
                (d ? ' and ' + d + (d === 1 ? ' dust field.' : ' dust fields.') : ' remain.'));
        } else if (mode === 'sector') {
            say(alive.length + ' points of interest.');
        } else {
            say(alive.length + (alive.length === 1 ? ' target remains.' : ' targets remain.'));
        }
    }, alive.length * CFG.radarGapMs + 200);
}

// Shift+W (SPEC 1.15). Ends on Shift+W again, any W or S press, a warp
// jump, docking, or leaving the mode — the first three speak, the rest
// fold "Auto-thrust off" into their own line or go quietly with the reset.
// SPEC 3.57: `dir` is 'fwd' (Shift+W) or 'rev' (Shift+S). Pressing the
// chord for the direction already running turns it off; the other chord
// flips direction in one press — a cruise doesn't have to stop to reverse.
function toggleAutoThrust(dir) {
    autoThrust = (autoThrust === dir) ? false : dir;
    SIM.audio.blip(autoThrust ? (dir === 'rev' ? 440 : 520) : 380, 90, 0.14, 0, 'triangle');
    say(autoThrust === 'rev' ? 'Auto-reverse on. W, S, or shift S ends it.'
      : autoThrust ? 'Auto-thrust on. W, S, or shift W ends it.'
      : autoOffText(dir));
}
function autoOffText(dir) { return (dir || autoThrust) === 'rev' ? 'Auto-reverse off. ' : 'Auto-thrust off. '; }
function autoOnText()  { return autoThrust === 'rev' ? 'Auto-reverse on. ' : autoThrust ? 'Auto-thrust on. ' : ''; }

// SPEC 3.51 (ideas12.txt): "Y to announce resource totals... hopefully
// this can be used anywhere, as I was using the station and needed this
// info." One line, credits first — F3 stays the browsable long form
// naming what each resource is FOR; this is the number itself, from
// anywhere a `y` pass-through reaches (every captured-input menu that
// matters: station, Modules, Lasers, hail/transporter, Missions, the
// map, F2/F3, the run log — plus the raw sim itself).
function speakTotals() {
    var line = 'Credits ' + (profile ? profile.credits : 0) + '. ' +
               'Ore ' + ore + '. ' +
               'Salvage ' + (profile ? profile.resources.salvage : 0) + '. ' +
               'Alloy ' + (profile ? profile.resources.alloy : 0) + '. ' +
               'Reaction mass ' + Math.round(rcsPct()) + ' percent. ' +
               'Warp ' + warpPct() + ' percent. ' +
               'Missiles ' + missiles + ', decoys ' + chaff + '.';
    if (autoTargetFitted()) line += ' Auto-target charges ' + autoTargetCharges + '.';
    say(line);
}

function statusReport() {
    var speed = Math.round(len(ship.vel));
    var line = 'Speed ' + speed + '. ' + autoOnText();
    var t = targets[selected];
    if (t && t.alive) line += bearingText(t) + ' ';
    if (mode === 'mining') {
        line += 'Ore hold ' + ore + '. ';
        if (debris.length) {
            line += debris.length + (debris.length === 1 ? ' dust field' : ' dust fields') + ' adrift. ';
        }
    }
    if (mode === 'sector') line += 'Ore hold ' + ore + '. Warp charge ' + warpPct() + ' percent. ' +
        'Reaction mass ' + Math.round(rcsPct()) + ' percent' + (rcsBattery ? ', on battery' : '') + '. ';
    // SPEC 3.23: the selected station's own standing, once close enough to
    // hail it — not spoken for the demo's own fixed sector, which never
    // runs favor at all.
    if (mode === 'sector' && !demo && t && t.poiType === 'station' &&
        len(sub(t.pos, ship.pos)) <= stationRangeFor('comm', t.name)) {
        line += capFirst(favorTier(favorOf(t.name))) + ' with ' + t.name + '. ';
    }
    if (mode !== 'sector' && mode !== 'course' && mode !== 'minefield' && mode !== 'shadow' && mode !== 'nebula' && mode !== 'gaterun' && autoTargetFitted()) {
        line += autoTargetCharges + (autoTargetCharges === 1 ? ' auto-target charge. ' : ' auto-target charges. ');
    }
    if (mode === 'course') {
        line += 'Gate ' + (courseState.activeIndex + 1) + ' of ' + targets.length + '. ' +
                'Clock ' + fmtTime(courseState.elapsed) + '. ';
    } else if (mode === 'minefield') {
        var minesLeft = targets.filter(function (x) { return x.kind === 'mine' && x.alive; }).length;
        line += 'Your hull ' + hull + ' percent. ' + minesLeft + (minesLeft === 1 ? ' mine' : ' mines') +
                ' remain. Speed ' + Math.round(len(ship.vel)) + ', safe under ' + CFG.mineSafeSpeed +
                '. Clock ' + fmtTime(minefieldState.elapsed) + '. ';
    } else if (mode === 'shadow') {
        var shadowTarget = targets[0];
        line += (shadowTarget && shadowTarget.dark ? 'Ship dark. ' : 'Ship lit. ') +
                'Contact ' + Math.round(shadowState.contact) + ' of ' + CFG.shadowNeedS + ' seconds. ' +
                'Clock ' + fmtTime(shadowState.elapsed) + '. ';
    } else if (mode === 'nebula') {
        line += 'Your hull ' + Math.round(hull) + ' percent. ' + (nebulaState.inside ? 'Inside the nebula, sensor at half. ' : 'Clear of the nebula. ') +
                'Clock ' + fmtTime(nebulaState.elapsed) + '. ';
    } else if (mode === 'gaterun') {
        var gt = targets[0];
        line += (gt ? 'Distance to the gate ' + round10(len(sub(gt.pos, ship.pos))) + '. ' : '') +
                gateRunState.wasted + (gateRunState.wasted === 1 ? ' pass wasted. ' : ' passes wasted. ') +
                'Clock ' + fmtTime(gateRunState.elapsed) + '. ';
    } else {
        line += mode === 'mining' ? (distress ? '' : aliveRocks().length + ' rocks remain. ')
              : mode === 'sector' ? aliveTargets().length + ' points of interest. '
              : mission ? aliveTargets().filter(function (x) { return !x.kind; }).length + ' hostiles remain. '
              : aliveTargets().length + ' targets remain. ';
    }
    if (mode !== 'mining' && mode !== 'course' && mode !== 'minefield' && mode !== 'shadow' && mode !== 'nebula' && mode !== 'gaterun') {
        line += 'Your hull ' + hull + ' percent. ' + missiles + (missiles === 1 ? ' missile. ' : ' missiles. ') +
                chaff + (chaff === 1 ? ' decoy. ' : ' decoys. ');
    }
    if (mode === 'combat' || mode === 'mining') line += laserStatusText();
    if (mode === 'combat') {
        line += shield.up ? 'Shields up, ' + Math.round(shield.pool / shieldPoolMax() * 100) + ' percent. '
              : shield.raising >= 0 ? 'Shields coming up. '
              : shield.repairing > 0 ? 'Shields in disrepair, ' + Math.ceil(shield.repairing) + ' seconds. '
              : shield.pool < shieldPoolMax() ? 'Shields down, ' + Math.round(shield.pool / shieldPoolMax() * 100) + ' percent, recharging. '
              : 'Shields down. ';
        if (laserHot()) line += 'Laser overheated. ';
    }
    if (demo) line += 'Clock ' + fmtTime(demo.elapsed) + '. ' + demoObjective();
    else if (contract) line += 'Contract clock ' + fmtTime(contract.elapsed) + '. ' + contractObjective();
    if (distress) {
        line += distress.recovered ? 'Derelict secured, bring it home to ' + distress.poiName + '. '
                                    : 'Derelict adrift — tractor it in, then E to recover it. ';
    }
    if (mission) {
        var f = mission.friendly;
        line += f.name + ' shields ' + Math.round(f.shield / f.shieldPool * 100) + ' percent, hull ' +
                Math.round(f.hp / f.maxHp * 100) + ' percent. ';
        if (mission.kind === 'escort') line += 'Leg ' + Math.round(mission.elapsed) + ' of ' + CFG.missionEscortLegS + ' seconds. ';
    }
    if (laserBoostActive()) line += 'Laser boost, ' + Math.ceil((laserBoostUntil - Date.now()) / 1000) + ' seconds left. ';
    var broken = brokenSystemIds();
    if (broken.length) {
        broken.sort(function (a, b) {
            var pa = REPAIR_PRIORITY.indexOf(systemPriorityKey(a)), pb = REPAIR_PRIORITY.indexOf(systemPriorityKey(b));
            return pa !== pb ? pa - pb : (a < b ? -1 : 1);
        });
        line += broken.map(function (id) {
            var cap = systemCap(id);
            return systemName(id) + ' ' + Math.round(systemHealth(id)) + ' percent' + (cap < 100 ? ', field cap ' + cap : '');
        }).join('; ') + '. ';
    }
    say(line);
}

// ---- Z: the quick status cycle (SPEC 3.66, ideas15.txt) --------------------
// Brian: "pressing Z and it says 'hull 80%', press Z and it says '7
// missiles left' and so on... instead of having to pull up the Ship
// Status screen with F2." One line a press, cycling a FIXED order of
// stops; a category at full health is skipped (never a COUNT category —
// a full magazine is a number, not a percent, and "how many do I have"
// is always worth answering) so the pilot never sits through good news.
// A press within zStatusChainS of the last continues the cycle from
// where it left off; after that gap it restarts at Hull, so a single Z
// always means "hull" — the number reached for most.
var Z_STATUS_SLOTS = ['hull', 'shields', 'laser', 'missiles', 'decoys', 'rcs', 'warp', 'systems', 'autotarget'];
var zStatusIdx = 0;
var zStatusLastAt = 0;

// True for a HEALTH category sitting at full (or, for the laser, also
// true when the selected slot is simply empty — nothing to report either
// way) — never true for missiles/decoys (hull never even asks).
function zStatusSkip(id) {
    if (id === 'shields') return shield.pool >= shieldPoolMax() && !shield.repairing;
    if (id === 'laser') {
        var L = currentLaser();
        return !L || profile.laserHealth[LASER_FAMILIES_BY_ID[L.family].id] >= 100;
    }
    if (id === 'rcs') return rcsPct() >= 100 && !rcsBattery;
    if (id === 'warp') return warpCharge >= CFG.warpTankMax;
    if (id === 'systems') return brokenSystemIds().length === 0;
    if (id === 'autotarget') return !autoTargetFitted();   // excluded from the cycle entirely, not just this once
    return false;   // hull, missiles, decoys: never skipped
}
function zStatusAllWhole() {
    return zStatusSkip('shields') && zStatusSkip('laser') && zStatusSkip('rcs') &&
           zStatusSkip('warp') && zStatusSkip('systems');
}
function zStatusLine(id) {
    if (id === 'hull') {
        return 'Hull ' + hull + ' percent.' + (zStatusAllWhole() ? ' All systems whole.' : '');
    }
    if (id === 'shields') {
        return 'Shields ' + (shield.up ? 'up' : 'down') + ', ' + Math.round(shield.pool) + ' of ' +
               Math.round(shieldPoolMax()) + (shield.repairing ? ', repairing' : '') + '.';
    }
    if (id === 'laser') {
        var L = currentLaser();
        if (!L) return laserSlotText(laserSlot) + '.';
        var fam = LASER_FAMILIES_BY_ID[L.family];
        return laserSlotText(laserSlot) + ' level ' + L.version + ', health ' + Math.round(profile.laserHealth[fam.id]) + '.';
    }
    if (id === 'missiles') return missiles + (missiles === 1 ? ' missile.' : ' missiles.');
    if (id === 'decoys') return chaff + (chaff === 1 ? ' decoy.' : ' decoys.');
    if (id === 'rcs') return 'Reaction mass ' + Math.round(rcsPct()) + ' percent' + (rcsBattery ? ', on battery' : '') + '.';
    if (id === 'warp') return 'Warp charge ' + warpPct() + ' percent.';
    if (id === 'systems') {
        var broken = brokenSystemIds();
        broken.sort(function (a, b) {
            var pa = REPAIR_PRIORITY.indexOf(systemPriorityKey(a)), pb = REPAIR_PRIORITY.indexOf(systemPriorityKey(b));
            return pa !== pb ? pa - pb : (a < b ? -1 : 1);
        });
        return broken.map(function (sid) {
            var cap = systemCap(sid);
            return systemName(sid) + ' ' + Math.round(systemHealth(sid)) + ' percent' + (cap < 100 ? ', field cap ' + cap : '');
        }).join(', ') + '.';
    }
    // autotarget
    return autoTargetCharges + (autoTargetCharges === 1 ? ' auto-target charge.' : ' auto-target charges.');
}
function zStatusKey() {
    var now = Date.now();
    var fresh = (now - zStatusLastAt) > CFG.zStatusChainS * 1000;
    zStatusLastAt = now;
    var startIdx = fresh ? 0 : zStatusIdx + 1;
    for (var i = 0; i < Z_STATUS_SLOTS.length; i++) {
        var idx = (startIdx + i) % Z_STATUS_SLOTS.length;
        var id = Z_STATUS_SLOTS[idx];
        if (idx !== 0 && zStatusSkip(id)) continue;   // Hull (idx 0) never skips
        zStatusIdx = idx;
        say(zStatusLine(id));
        return;
    }
    zStatusIdx = 0;
    say(zStatusLine('hull'));   // defensive fallback — Hull always qualifies above
}

// ---- run log --------------------------------------------------------------------
// A read-only browsable list, same shell as the quadrant map / F2: the sim
// freezes and ducks while open, arrows step, Escape closes. SPEC 3.71
// (ideas16.txt): regrouped by board — one heading per encounter (EVERY
// board in BOARD_ORDER gets one, even with zero runs so far, and says "No
// runs yet." rather than vanishing — "a pilot who hears eleven headings
// must not wonder where the twelfth went"), same {text, heading, name}
// shape buildShipLines() already uses, so H/Shift+H and a cycling first-
// letter jump both just reuse that exact pattern (shipScreenKey's own).
function runLogItems() {
    var items = [];
    BOARD_ORDER.forEach(function (kind) {
        var b = BOARDS[kind];
        var list = profile.boards[kind] || [];
        items.push({ text: b.label + ', heading. ' + list.length + (list.length === 1 ? ' run.' : ' runs.'),
                     heading: true, name: b.label });
        if (!list.length) {
            items.push({ text: 'No runs yet.', heading: false });
        } else {
            list.forEach(function (r, i) {
                items.push({ text: 'Number ' + (i + 1) + ': ' + b.line(r) + ', ' + r.date + '.', heading: false });
            });
        }
    });
    return items;
}

function openRunLog() {
    var total = BOARD_ORDER.reduce(function (n, k) { return n + (profile.boards[k] || []).length; }, 0);
    runlog.open = true;
    runlog.idx = -1;
    keysDown = {};
    thrusterSync(null);
    if (SIM.audio.ctx && SIM.audio.masterGain && !menuOpen) SIM.audio.ramp(SIM.audio.masterGain.gain, 0.0001, 0.2);
    say('Run log. ' + BOARD_ORDER.length + ' boards, ' + total + (total === 1 ? ' run.' : ' runs.') +
        ' Up and down arrows browse, H jumps headings, a letter jumps to one, Escape closes.');
}

function closeRunLog() {
    runlog.open = false;
    if (SIM.audio.ctx && SIM.audio.masterGain && !menuOpen) SIM.audio.ramp(SIM.audio.masterGain.gain, CFG.masterGain, 0.2);
    say('Run log closed.');
}

function runLogSpeakLine(items) {
    var ln = items[runlog.idx];
    if (ln) say(ln.text);
}

// SPEC 3.71: H/Shift+H heading nav and a cycling first-letter jump, copied
// faithfully from shipScreenKey's own (F2) — several board labels share an
// initial ("Minefield"/"Mining", "Timed contract"/"Turret defense",
// "Combat training"/"Capital ship"), so searching forward from just past
// the cursor and wrapping cycles through all of them, same idiom as F2.
function runLogKey(lname, shift) {
    if (lname === 'escape') { closeRunLog(); return; }
    var items = runLogItems(), n = items.length;
    if (runlog.idx >= n) runlog.idx = n - 1;   // a board's own runs shrink under a stale cursor? never today, but defensive
    if (lname === 'arrowdown') {
        if (runlog.idx < n - 1) { runlog.idx++; runLogSpeakLine(items); }
        else { SIM.audio.blip(220, 80, 0.1); say('End of the list.'); }
    } else if (lname === 'arrowup') {
        if (runlog.idx > 0) { runlog.idx--; runLogSpeakLine(items); }
        else { runlog.idx = 0; SIM.audio.blip(220, 80, 0.1); say('Top of the list.'); }
    } else if (lname === 'h') {
        var i = runlog.idx;
        if (shift) {
            for (i = runlog.idx - 1; i >= 0; i--) if (items[i].heading) break;
            if (i < 0) { SIM.audio.blip(220, 80, 0.1); say('No previous heading.'); return; }
        } else {
            for (i = runlog.idx + 1; i < n; i++) if (items[i].heading) break;
            if (i >= n) { SIM.audio.blip(220, 80, 0.1); say('No next heading.'); return; }
        }
        runlog.idx = i; runLogSpeakLine(items);
    } else if (lname === 'home') {
        runlog.idx = 0; runLogSpeakLine(items);
    } else if (lname === 'end') {
        runlog.idx = n - 1; runLogSpeakLine(items);
    } else if (lname === 'y') {
        speakTotals();
    } else if (typeof lname === 'string' && lname.length === 1 && /[a-z]/.test(lname)) {
        var found = -1;
        for (var k = 0; k < n; k++) {
            var idx = (runlog.idx + 1 + k) % n;
            if (items[idx].heading && items[idx].name.charAt(0).toLowerCase() === lname) { found = idx; break; }
        }
        if (found >= 0) { runlog.idx = found; runLogSpeakLine(items); }
        else { SIM.audio.blip(220, 80, 0.1); say('No board starts with that letter.'); }
    } else {
        say('Up and down arrows read the run log, H jumps headings, a letter jumps to one, Escape closes.');
    }
}

// ---- delivery run --------------------------------------------------------------
// The shareable, timed demo: clear the Contested Zone, mine the quota, deliver
// it to Station Meridian. The clock counts only while the sim is live (pauses,
// help, and the map stop it), and hyperwarp time counts.
function startDemo() {
    menuOpen = false;
    ore = 0; hull = CFG.shipHull; missiles = CFG.missileMax; chaff = CFG.chaffMax;
    autoTargetCharges = CFG.autoTargetCharges;
    refillRcs(); collisionDamage = 0; repairAllSystems();
    sectorHome = null;
    demo = { elapsed: 0, combatCleared: false, delivered: false, quotaSaid: false };
    newGame('sector');
    placeAtStationStart();
    // The first objective is the nav target from the start, so H works at once.
    targets.forEach(function (t, i) { if (t.poiType === 'combat') selected = i; });
    locked = false; stopLockTone();
    say(demoIntro());
}

// New pilots begin just outside Station Meridian, facing the Contested Zone,
// with a full tank — the demo route (SPEC 1.10) starts here.
function placeAtStationStart() {
    // SPEC 3.10: more than one station can exist in `targets` now (the
    // open quadrant), so this can't just take "whichever station turns up
    // last" — new pilots start at home, Station Meridian by name, same as
    // the delivery run always has.
    var s = null, c = null;
    targets.forEach(function (t) {
        if (t.poiType === 'station' && (!s || t.name === 'Station Meridian')) s = t;
        if (t.poiType === 'combat') c = t;
    });
    if (!s || !c) return;
    var dir = norm(sub(c.pos, s.pos));
    ship.pos = add(s.pos, scale(dir, CFG.sectorStartDist));
    ship.vel = v3(0, 0, 0);
    ship.yaw = Math.atan2(dir.x, -dir.z);
    ship.pitch = Math.asin(clamp(dir.y, -1, 1));
    refillWarp();
    selectNearest();
}

function demoIntro() {
    return 'Delivery run. The clock is running. First clear the Contested Zone, then mine ' +
           CFG.demoOreGoal + ' ore at Asteroid Field Kappa and deliver it to Station Meridian. ' +
           'The station also repairs, rearms, and refuels you. You carry ' + CFG.missileMax + ' missiles, ' +
           'and a full warp tank that reaches the Contested Zone, your nav target. ' +
           'Q opens the map, H hyperwarps to your nav target, C calls a point within ' +
           CFG.poiInteract + ', and I reads the clock and the tank. F1 for help.' + beaconNote();
}

function fmtTime(s) {
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return (m ? m + (m === 1 ? ' minute ' : ' minutes ') : '') + sec + (sec === 1 ? ' second' : ' seconds');
}

function demoObjective() {
    if (!demo) return '';
    if (!demo.combatCleared) return 'Objective: clear the Contested Zone.';
    if (demo.delivered) return 'Delivery complete.';
    if (ore < CFG.demoOreGoal) return 'Objective: mine ore, ' + ore + ' of ' + CFG.demoOreGoal + '.';
    return 'Objective: deliver ' + ore + ' ore to Station Meridian.';
}

// SPEC 3.28: the quadrant's own timed contract, mirroring demoObjective's
// shape exactly — the two are mutually exclusive, so nothing ever needs
// both at once.
function contractObjective() {
    if (!contract) return '';
    if (!contract.combatCleared) return 'Contract objective: clear the Contested Zone.';
    if (contract.delivered) return 'Contract delivered.';
    if (ore < CFG.demoOreGoal) return 'Contract objective: mine ore, ' + ore + ' of ' + CFG.demoOreGoal + '.';
    return 'Contract objective: deliver ' + ore + ' ore to Station Meridian.';
}

// Called on every ore gain: once the quota is met, say so (once) — for
// whichever of the demo or the SPEC 3.28 contract is currently active.
function oreGained() {
    if (demo && !demo.quotaSaid && ore >= CFG.demoOreGoal) {
        demo.quotaSaid = true;
        setTimeout(function () {
            SIM.audio.sfxArpeggio([659, 784, 1047], 0.12, 0.14, { type: 'triangle' });
            say('Ore hold ' + ore + '. Delivery quota met! Take it to Station Meridian. Q for the map.');
        }, 500);
    } else if (contract && contract.combatCleared && !contract.quotaSaid && ore >= CFG.demoOreGoal) {
        contract.quotaSaid = true;
        setTimeout(function () {
            SIM.audio.sfxArpeggio([659, 784, 1047], 0.12, 0.14, { type: 'triangle' });
            say('Ore hold ' + ore + '. Contract quota met! Take it to Station Meridian. Q for the map.');
        }, 500);
    }
}

// ---- F2 ship screen (SPEC 2.13, grown into the full reference by 3.29) ----
// Same browsable shell as Help/the map: build once at open time, one
// heading per subsystem, H/Shift+H jump between headings (the F1 idiom),
// a first letter jumps to a heading (the map's idiom — several headings
// share a first letter, so a repeated letter cycles forward through them,
// wrapping, same as any type-ahead list), arrows read line by line,
// Escape closes. Every number is read LIVE off CFG/LASERS/profile/
// shipSystems — no second source of truth, so a tier or module bump
// shows up here the instant it's bought.
function buildShipLines() {
    var lines = [];
    function heading(name) { lines.push({ text: name + ', heading.', heading: true, name: name }); }
    // SPEC 3.48: an optional slot index tags every line belonging to a
    // laser slot's own block, so shipScreenKey's Left/Right can find which
    // slot the cursor is sitting on regardless of which of that slot's
    // lines it happens to be reading.
    function line(text, slot) { lines.push({ text: text, heading: false, slot: slot }); }

    heading('Hull');
    line('Hull ' + hull + ' percent.' + (activeRepairId === 'hull' ? ' Damage control on it.' : ''));
    if (repairRcsSpentSortie > 0) {
        line('Repairs have spent ' + repairRcsSpentSortie.toFixed(1) + ' reaction mass this sortie.');
    }
    if (collisionDamage > 0) {
        line(Math.ceil(collisionDamage) + ' points of collision damage owed, billed at the next landing.');
    }

    if (mission) {
        heading('Mission');
        var mf = mission.friendly;
        line(mf.name + ': shields ' + Math.round(mf.shield / mf.shieldPool * 100) +
             ' percent, hull ' + Math.round(mf.hp / mf.maxHp * 100) + ' percent.');
    }

    // SPEC 3.28: independent of Mission above — a contract can be open at
    // the same time as an escort/defend encounter, since accepting one
    // doesn't touch the other.
    if (contract) {
        heading('Contract');
        line('Timed delivery, clock ' + fmtTime(contract.elapsed) + '.');
        line(contractObjective());
    }

    // SPEC 3.55: independent of Mission/Contract above, same reasoning.
    if (distress) {
        heading('Distress call');
        line(distress.recovered
            ? 'Derelict secured. Bring it home to ' + distress.poiName + '.'
            : 'Derelict adrift nearby. Tractor it in, then E recovers it.');
    }

    heading('Shields');
    line('Shields ' + (shield.up ? 'up' : 'down') + ', pool ' + Math.round(shield.pool) +
         ' of ' + Math.round(shieldPoolMax()) + (shield.repairing ? ', repairing' : '') + '.');
    var raiseS = CFG.shieldRaiseMs / 1000;
    line('Raises in ' + raiseS + (raiseS === 1 ? ' second.' : ' seconds.'));
    line('Regenerates ' + CFG.shieldRegenPerS + ' a second while down.');
    line('A depleted pool takes ' + CFG.shieldRepairS + ' seconds to repair, returning at ' +
         Math.round(CFG.shieldRepairReturn * 100) + ' percent.');

    heading('Lasers');
    if (laserBoostActive()) {
        line('Laser boost active, ' + Math.ceil((laserBoostUntil - Date.now()) / 1000) + ' seconds left.');
    }
    line('Range ' + CFG.laserRange + ', up to ' + Math.round((CFG.laserCloseMult - 1) * 100) +
         ' percent more at point-blank.');
    // SPEC 3.48 (ideas12.txt): one block per FITTED slot, not one list per
    // family then one per slot to reconcile — Brian's own complaint about
    // the old shape. Left/Right on any of a slot's own lines cycles that
    // slot's level within the owned range (shipScreenKey), so every number
    // here has to come from the SLOT's actual fitted laser, not the family
    // in the abstract.
    for (var i = 0; i < LASER_SLOTS; i++) {
        var L = profile ? laserById(profile.slots[i]) : null;
        if (!L) { line('Slot ' + (i + 1) + ' is empty.', i); continue; }
        var fam = LASER_FAMILIES_BY_ID[L.family];
        var perTick = Math.round(fam.tickBase * laserLevelMult(L.version));
        var left = laserCooldownLeft(i);
        var switching = laserSwitch && laserSwitch.slot === i;
        var status = switching ? ', switching ' + Math.ceil(laserSwitchLeft()) + ' seconds'
                   : left > 0 ? ', recharging ' + Math.ceil(left) + ' seconds' : ', ready';
        line('Slot ' + (i + 1) + ': ' + capFirst(fam.label) + ' laser level ' + L.version + status + '.', i);
        line(perTick + ' per tick, ' + fam.tickCount + ' ticks over ' + (fam.tickCount * fam.tickS) +
             ' seconds, ' + fam.cooldownS + ' second cooldown.', i);
        line('Bites ' + fam.matchupSpoken.strong + '. Weak on ' + fam.matchupSpoken.weak + '.', i);
        line('Health ' + Math.round(profile.laserHealth[fam.id]) + '.', i);
    }

    heading('Missiles');
    line(missiles + ' of ' + CFG.missileMax + '.');
    line(CFG.missileDamage + ' damage, ' + CFG.missileSpeed + ' units a second, about ' +
         Math.round(CFG.missileSpeed * CFG.missileLifeS) + ' reach.');
    line('Needs the target inside ' + ZONES[zoneIdx].missile + ' degrees.');

    heading('Decoys');
    line(chaff + ' of ' + CFG.chaffMax + '.');

    heading('Warp');
    line('Charge ' + Math.round(warpCharge) + ' of ' + CFG.warpTankMax + '.');
    line('Regenerates ' + CFG.warpRegenPerS + ' a second in open flight.');
    line('Needs at least ' + CFG.warpMinChargePct + ' percent to jump.');
    line('Reaches ' + Math.round(warpEffectiveCharge()) + ' at this charge.');

    heading('Reaction mass');
    line(Math.round(rcsPct()) + ' percent' + (rcsBattery ? ', on battery power' : '') + '.');
    line('Battery power holds thrust, braking, and the stabilizers to ' +
         Math.round(CFG.rcsBatteryFactor * 100) + ' percent.');

    heading('Thrusters');
    line('Thrust ' + CFG.thrust + ', brake ' + CFG.brakeThrust + ', turn rate ' +
         Math.round(CFG.turnRate * 180 / Math.PI) + ' degrees a second.');
    line('Mass factor ' + shipMass().toFixed(2) + '.');

    heading('Extractor');
    line('Reach ' + CFG.vacRange + '. Tier 1.');

    heading('Vacuum');
    line('Cloud radius ' + CFG.cloudRadius + '.');

    if (tractorFitted()) {
        heading('Tractor beam');
        var tOwned = tractorLevel(), tRow = TRACTOR_TIERS[tOwned - 1];
        line('Tier ' + tOwned + ' owned.' +
             (ownedModules().indexOf('tractor_1') < 0 ? ' Test fit.' : ''));
        line('Pull ' + tRow.core + ' a second on a small rock or a core, ' +
             tRow.medium + ' on a medium, ' +
             (tRow.large > 0 ? tRow.large + ' on a large, ' : 'none on a large, ') +
             (tRow.huge > 0 ? tRow.huge + ' on a huge.' : 'none on a huge.'));
        line('Range ' + tRow.range + '. Costs reaction mass per unit of mass moved.');
    }

    if (autoTargetFitted()) {
        heading('Auto-target');
        var atTier = autoTargetTier();
        line('Tier ' + atTier + ', ' + CFG.autoTargetWorstTiers[atTier - 1] + ' seconds worst case, holds ' +
             CFG.autoTargetHoldS + ' seconds once aimed.' +
             (ownedModules().indexOf('auto_target_1') < 0 ? ' Test fit.' : ''));
        line(autoTargetCharges + (autoTargetCharges === 1 ? ' charge left.' : ' charges left.'));
    }

    heading('Sensor');
    var sensorMult = systemState('sensor') === 'half' ? CFG.repairSensorPct : 1;
    ZONES.forEach(function (z, i) {
        line(z.name + (i === zoneIdx ? ', active' : '') + ': lock on ' +
             (z.lockOn * sensorMult).toFixed(1) + ' degrees, lock off ' +
             (z.lockOff * sensorMult).toFixed(1) + ' degrees.');
    });
    line('Tick ' + CFG.tickFast + ' to ' + CFG.tickSlow + ' milliseconds.');

    heading('Repair crew');
    var crewTier = ownedModules().indexOf('repair_crew_2') >= 0 ? 2
                  : ownedModules().indexOf('repair_crew_1') >= 0 ? 1 : 0;
    line('Tier ' + crewTier + ', ' + CFG.repairHalfS + ' seconds to half, ' +
         (CFG.repairHalfS * 2) + ' to full.');
    line('Once every system is whole, the hull too, at half that rate. ' +
         'Every repair costs ' + CFG.repairRcsPerPoint + ' reaction mass a point, ' +
         'pausing below ' + CFG.repairRcsFloor + '.');
    line('A field repair stops at ' + CFG.repairFieldCap + ' percent — ' + CFG.repairHullFieldCap +
         ' for the hull — falling to as low as ' + CFG.repairCapFloor +
         ' after repeat knockouts of the same system. Docking clears every ceiling.');

    heading('Systems');
    var broken = brokenSystemIds();
    if (broken.length) {
        broken.sort(function (a, b) {
            var pa = REPAIR_PRIORITY.indexOf(systemPriorityKey(a)), pb = REPAIR_PRIORITY.indexOf(systemPriorityKey(b));
            return pa !== pb ? pa - pb : (a < b ? -1 : 1);
        });
        broken.forEach(function (id) {
            var cap = systemCap(id);
            line(systemName(id) + ' ' + Math.round(systemHealth(id)) + ' percent' +
                 (cap < 100 ? ', field cap ' + cap : '') +
                 (id === activeRepairId ? ', crew working' : '') + '.');
        });
    } else {
        line('Nothing broken.');
    }

    heading('Cargo');
    line(ore + ' ore, ' + (profile ? profile.credits : 0) + ' credits.');

    heading('Modules');
    var owned = ownedModules();
    if (owned.length) {
        owned.forEach(function (id) {
            var m = moduleById(id);
            if (m) line(m.name + ': ' + m.desc + ' Mass ' + m.mass + '.');
        });
    } else {
        line('None fitted.');
    }
    line('Total mass ' + shipMass().toFixed(2) + '.');

    // SPEC 3.23/3.33: the three station ranges — base CFG values (already
    // reflecting any owned comm_array/transporter_booster/
    // docking_computer, via moduleCfgOverlay) plus the per-tier bonus a
    // pilot's own standing adds, station by station.
    heading('Station access');
    line('Comms ' + Math.round(CFG.stationCommRange) + ', transporter ' +
         Math.round(CFG.stationTransporterRange) + ', docking ' + Math.round(CFG.stationDockRange) + '.');
    line('Trusted adds ' + Math.round(CFG.favorRangeBonus.trusted * 100) + ' percent to all three there; ' +
         'Allied and Honored add ' + Math.round(CFG.favorRangeBonus.allied * 100) + ' percent. ' +
         'Honored also discounts modules, lasers, repairs, and reaction mass by ' +
         Math.round(CFG.honoredDiscount * 100) + ' percent, there only.');

    return lines;
}

function openShipScreen() {
    shipScreen.open = true;
    shipScreen.idx = -1;
    shipScreen.lines = buildShipLines();
    keysDown = {};
    thrusterSync(null);
    if (SIM.audio.ctx && SIM.audio.masterGain && !menuOpen) SIM.audio.ramp(SIM.audio.masterGain.gain, 0.0001, 0.2);
    var headingCount = shipScreen.lines.filter(function (l) { return l.heading; }).length;
    say('Ship status. ' + headingCount + ' headings, ' + shipScreen.lines.length +
        ' lines. Down arrow reads line by line, H jumps headings, a letter jumps to one, ' +
        'left and right change a laser slot\'s level, Escape closes.');
}

function closeShipScreen() {
    shipScreen.open = false;
    if (SIM.audio.ctx && SIM.audio.masterGain && !menuOpen) SIM.audio.ramp(SIM.audio.masterGain.gain, CFG.masterGain, 0.2);
    say('Ship status closed.');
}

function shipScreenSpeakLine() {
    var ln = shipScreen.lines[shipScreen.idx];
    if (ln) say(ln.text);
}

function shipScreenKey(lname, shift) {
    if (lname === 'escape' || lname === 'f2') { closeShipScreen(); return; }
    var n = shipScreen.lines.length;
    if (lname === 'arrowdown') {
        if (shipScreen.idx < n - 1) { shipScreen.idx++; shipScreenSpeakLine(); }
        else { SIM.audio.blip(220, 80, 0.1); say('End of ship status.'); }
    } else if (lname === 'arrowup') {
        if (shipScreen.idx > 0) { shipScreen.idx--; shipScreenSpeakLine(); }
        else { shipScreen.idx = 0; SIM.audio.blip(220, 80, 0.1); say('Top of ship status.'); }
    } else if (lname === 'h') {
        var i = shipScreen.idx;
        if (shift) {
            for (i = shipScreen.idx - 1; i >= 0; i--) if (shipScreen.lines[i].heading) break;
            if (i < 0) { SIM.audio.blip(220, 80, 0.1); say('No previous heading.'); return; }
        } else {
            for (i = shipScreen.idx + 1; i < n; i++) if (shipScreen.lines[i].heading) break;
            if (i >= n) { SIM.audio.blip(220, 80, 0.1); say('No next heading.'); return; }
        }
        shipScreen.idx = i; shipScreenSpeakLine();
    } else if (lname === 'home') {
        shipScreen.idx = 0; shipScreenSpeakLine();
    } else if (lname === 'end') {
        shipScreen.idx = n - 1; shipScreenSpeakLine();
    } else if (lname === 'arrowleft' || lname === 'arrowright') {
        // SPEC 3.48: cycles the CURRENT line's own laser slot within its
        // owned range, live — F2 is frozen sim, so no switch delay or
        // refusal window, just the clip at natural length and the block
        // re-reading with the new numbers.
        var cur = shipScreen.lines[shipScreen.idx];
        if (!cur || cur.slot === undefined) {
            SIM.audio.blip(220, 80, 0.1);
            say('Left and right change a laser slot\'s level. This line isn\'t one.');
            return;
        }
        var si = cur.slot;
        if (!laserById(profile.slots[si])) {
            SIM.cues.play('refusal_offline');
            say('Slot ' + (si + 1) + ' is empty. Fit a laser at the station.');
            return;
        }
        cycleLaserVersion(si, lname === 'arrowright' ? 1 : -1);
        saveProfile();
        playSlotSwitchClipNatural(si);
        shipScreen.lines = buildShipLines();
        shipScreenSpeakLine();
    } else if (lname === 'y') {
        // SPEC 3.51: checked before the generic first-letter jump below —
        // no heading starts with Y today, but this must never depend on
        // that staying true.
        speakTotals();
    } else if (typeof lname === 'string' && lname.length === 1 && /[a-z]/.test(lname)) {
        // First-letter jump to a heading. Several headings share an initial
        // (Hull/Shields/Systems/Sensor, Reaction mass/Repair crew, Missiles/
        // Modules) — searching forward from just past the cursor and
        // wrapping means a repeated letter cycles through all of them, the
        // same type-ahead idiom as any list.
        var found = -1;
        for (var k = 0; k < n; k++) {
            var idx = (shipScreen.idx + 1 + k) % n;
            if (shipScreen.lines[idx].heading && shipScreen.lines[idx].name.charAt(0).toLowerCase() === lname) { found = idx; break; }
        }
        if (found >= 0) { shipScreen.idx = found; shipScreenSpeakLine(); }
        else { SIM.audio.blip(220, 80, 0.1); say('No heading starts with that letter.'); }
    } else {
        say('Up and down arrows read ship status, H jumps headings, a letter jumps to one, left and right change a laser slot\'s level, Escape closes.');
    }
}

// ---- F3 resources screen (SPEC 2.15) ---------------------------------------
// Same shell as F2/the run log. One line per resource, each naming what
// it's for — the point being a pilot can look up the whole economy in one
// place, not just what's fitted to the ship.
function buildResourceLines() {
    var lines = [];
    lines.push('Ore: ' + ore + '. Mined from any rock, sold for credits at a station.');
    lines.push('Salvage: ' + (profile ? profile.resources.salvage : 0) +
                '. From combat kills only, sold for ' + CFG.salvageCredit +
                ' credits each, and some modules will need it.');
    lines.push('Alloy: ' + (profile ? profile.resources.alloy : 0) +
                '. From iron cores, sold for ' + CFG.alloyCredit + ' credits each.');
    lines.push('Reaction mass: ' + Math.round(rcsPct()) + ' percent' +
                (rcsBattery ? ', on battery power' : '') +
                '. Spent by thrust, braking, and the stabilizers; earned back from combat kills, ' +
                'vacuuming dust, mining an ice core, buying it at a station, or finishing a mission.');
    lines.push('Warp charge: ' + warpPct() + ' percent. Spent by hyperwarp jumps.');
    // SPEC 3.74: real now — V scoops it from the star's own corona.
    // Combat containers (SPEC 3.18) will add a second source later.
    lines.push('Hydrogen: ' + (profile ? profile.resources.hydrogen : 0) +
                '. Scooped from the star\'s corona with V. Pays the jump gate\'s own fare.');
    lines.push('Credits: ' + (profile ? profile.credits : 0) + '. Spent on modules, lasers, and collision repairs.');
    lines.push(missiles + (missiles === 1 ? ' missile.' : ' missiles.') + ' Fired with F.');
    lines.push(chaff + (chaff === 1 ? ' decoy.' : ' decoys.') + ' Spent with D against an incoming missile.');
    return lines;
}

function openResourceScreen() {

}

function resourceScreenKey(lname) {
    if (lname === 'escape' || lname === 'f3') { closeResourceScreen(); return; }
    var n = resourceScreen.lines.length;
