<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Silence</title>
<!--
  The Silence (working name: Headless Space Sim) — a 3D-audio (HRTF)
  space sim played entirely by ear.

  Purpose: evaluate whether Web Audio's PannerNode in HRTF mode (the browser
  equivalent of OpenAL) is good enough to carry a full audio-only space sim.

  Runs by double-clicking this file (file://). No build, no modules, no CDN.
  Shell patterns (focus trap, one keydown listener, one live region) are
  ported from accessible_football (DESIGN.md 21.1 / 21.2 / 21.3 there).
-->
<style>
    html, body { height: 100%; }
    body {
        margin: 0; padding: 2rem; box-sizing: border-box;
        background: #000; color: #9fb4c8;
        font-family: system-ui, sans-serif;
    }
    .sr-only {
        position: absolute; width: 1px; height: 1px;
        margin: -1px; padding: 0; border: 0;
        clip: rect(0 0 0 0); overflow: hidden; white-space: nowrap;
    }
    #initBtn { font-size: 1.4rem; padding: 1rem 2rem; }
    h1 { font-size: 1.2rem; font-weight: normal; margin: 0 0 1rem 0; }
    /* Visual status for a sighted co-tester only. aria-hidden, never read. */
    #status { font-size: 1.4rem; white-space: pre-wrap; line-height: 1.6; }
</style>
</head>
<body role="application">

<!-- The one standard control. Pressing it creates the audio context (browsers
     only allow that inside a user gesture), hides itself, shows the container
     and focuses it. From then on the screen reader is in focus mode and every
     key goes to the game. -->
<button id="initBtn" autofocus>Press Enter to Begin</button>

<!-- One voice. Nothing else in the page is ever read. It lives OUTSIDE the
     hidden game container on purpose (Round 43): a live region inside a
     display:none subtree is not in the accessibility tree, so the SPEC 3.39
     "Press Enter to begin" line and its repeats were written but never
     exposed to the screen reader until Enter unhid the container. -->
<div id="announce" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

<div id="game" tabindex="0" hidden
     aria-label="The Silence. A space sim played entirely by ear. Press F1 for help, or F12 to hear what any key does without doing it.">
    <h1 aria-hidden="true">The Silence</h1>
    <div id="status" aria-hidden="true"></div>
</div>

<script src="audio_assets.js"></script>
<script src="audio_engine.js"></script>
<script src="audio_cues.js"></script>
<script>
(function () {
'use strict';

// ============================== 1. CONFIG ===================================
var CFG_DEFAULTS = {
    // SPEC 3.39 (ideas10.txt): the Press-Enter-to-Begin page is silent
    // until Enter — the aria-live div works fine before the AudioContext
    // exists, it's just never been spoken to. Reminded again if missed.
    beginRemindFirstMs: 10000,
    beginRemindEveryMs: 20000,

    turnRate:   Math.PI / 3,     // 60 deg/s yaw and pitch while arrow held
    pitchLimit: 85 * Math.PI / 180,
    thrust:     70,              // u/s^2 along the nose while W held
    brakeThrust: 35,             // u/s^2 reverse thrust while S held (SPEC 2.14, half of thrust)
    dampKeep:   0.7,             // passive stabilizer damping, vel *= dampKeep^dt while not on battery
    maxSpeed:   100,             // u/s cap

    // Reaction mass (SPEC 2.14, ideas5): thrust, braking, and the automatic
    // stabilizers all spend this. Not Newtonian — the stabilizers still
    // counter momentum on their own, same as always; they just cost fuel
    // to do it now. Empty means battery mode (a flat weaker fraction of
    // every one of those, never zero, never stranded), not a hard stop.
    rcsMax: 100,
    rcsThrustPerS: 1,             // W burn rate
    rcsBrakePerS: 1.5,            // S burn rate (a harder push than forward thrust)
    rcsPerSpeedShed: 0.02,        // stabilizer cost per unit of speed they bleed off
    rcsBatteryFactor: 0.4,        // thrust/brake/stabilizer strength once rcs hits 0
    rcsAlertPcts: [50, 25],       // spoken as it drains, like the warp core (1.13) in reverse
    rcsPerIceCore: 10,            // refill from mining an ice core
    // SPEC 3.32: replaces the old flat, never-actually-wired-up
    // rcsPerKill (5) with a real by-class table (RCS_PER_KILL, near
    // SALVAGE), plus a steady trickle from vacuuming dust and a chunk
    // from a completed mission — sized so a clean delivery run stays
    // off battery and a sloppy one doesn't.
    rcsPerDustUnit: 0.002,        // per unit of dust collected (about 2 per 1,000 dust)
    rcsMission: 25,               // escort/defend/the timed contract, on success
    rcsCreditPerUnit: 1,          // hail-range purchase price
    alloyPerIronCore: 1,          // SPEC 2.15: an iron core's other yield
    salvageCredit: 30,            // sell price per unit at the landing menu
    alloyCredit: 20,
    // Collisions (SPEC 2.14): hit a station or planet too fast and it costs
    // hull, billed at the next landing rather than repaired free like combat
    // damage — the "bad drivers pay" rule.
    stationHullRadius: 60,
    collisionSafeSpeed: 25,
    collisionDmgPerSpeed: 2,
    repairCreditPerPoint: 5,
    dockMaxSpeed: 2,   // SPEC 3.34: C inside dock range above this speed refuses — come to a full stop first

    // Blink (SPEC 3.68, ideas15.txt): an instant displacement, facing and
    // velocity untouched — the point being it works AGAINST 3.58's facing
    // cone (the enemy is still turned toward where you WERE). Brian: "I do
    // not have a distance to blink known yet" — blinkDist is a pure
    // placeholder, changeable live via poke({blinkDist}) so he can try
    // numbers without a rebuild; the spoken line always reads it back.
    blinkDist: 300,
    blinkRcs: 4,
    blinkCooldownS: 3,

    // The capital ship (SPEC 3.69, ideas15.txt): a moving parent (not a
    // target — no lock, no Tab, just a low hull drone) carrying four
    // ordinary hostile turret targets at rotating offsets. Each turret's
    // shield "door" is the telegraph: closed (doorUp, invulnerable) while
    // it counts down to firing, open through the shot and a beat after.
    // capitalOrbitRadius was 350 (matching the existing roster Cruiser's
    // own orbit) until testing found a real placement bug: a turret's
    // own offset (up to ~280 from the parent) stacks on TOP of the
    // parent's orbit radius, so 350 routinely put turrets past 600 —
    // CFG.laserRange/enemyCannonRange — meaning nothing was in reach
    // from the ship's own default spawn at the origin. 200 keeps the
    // farthest turret (~480) comfortably inside both.
    capitalOrbitDegPerSec: 3, capitalOrbitRadius: 200, capitalOrbitY: 0,
    capitalTurnRateDeg: 15,      // how fast the parent's own facing re-aims at the player
    capitalTurretSpacing: 250,   // adjacent turrets at least this far apart
    capitalTurretHp: 60,
    capitalDoorOpenS: 4, capitalDoorCloseS: 2,
    shieldedLockTremoloHz: 3,    // the 'shielded' lock tone's own slow wobble

    // Death by tug (SPEC 2.16): a lost ship in the sector campaign or the
    // delivery run waits for pickup instead of Enter-restarting in place.
    // SPEC 3.23: the influence-halving is gone — the tug now goes to the
    // nearest station that actually trusts the pilot, at the base wait; if
    // none in the quadrant does, it's a long ride home to Meridian at
    // tugHomeFactor times the base (see startTug).
    tugBaseS: 90,             // base wait to a trusted station, or halved by the credit fee
    tugHomeFactor: 2,         // no trusted station anywhere: the long way home to Meridian
    // SPEC 3.35 (ideas10.txt): the fee is now repeatable — Enter pays it
    // again and again, each payment halving whatever's left, as many
    // times as credits allow (a fresh 100-credit pilot buys exactly two:
    // 90s -> 45 -> 22.5).
    tugFeeCredits: 50,
    tugReminderMarkS: 30,     // the countdown's second F2/F3 reminder fires at this mark
    startCredits: 100,        // SPEC 3.35: a fresh profile's starting credits (was 0)

    refDistance: 50, maxDistance: 2000, rolloff: 1,
    masterGain: 0.7, targetGain: 0.25,

    // front/back cue: lowpass cutoff vs dot(forward, dirToTarget)
    lpMax: 20000, lpMin: 800,

    // lock tick
    tickArc:    60 * Math.PI / 180,   // beyond this: searching tock
    tickFast:   80,                   // ms interval near lock
    tickSlow:   500,                  // ms interval at 60 deg error

    laserRange: 600,
    laserCloseMult: 1.6,     // damage x this at point-blank, tapering to x1 at laserRange
    laserShipMult: 1,        // extra multiplier on ships only (not rocks); Rookie doubles it (SPEC 1.20)
    toolCooldownMs: 700,     // E / V re-trigger guard (lasers cool per slot, see LASERS)
    laserMissWindowMs: 11000, // two zero-damage bursts inside this window...
                              // (SPEC 1.9: a 5 s burst + 3 s cooldown puts the
                              // natural gap between two misses at ~8 s, so the
                              // window has to clear that or overheat is unreachable)
    laserOverheatMs: 5000,   // ...and the laser is down for this long (audible)

    // mining
    cloudRadius: 800,        // a rock past this distance from origin is lost
    rockFriction: 0.85,      // vel *= friction^dt — rocks bleed energy, ~15%/s
    beamPush: 6,             // u/s of shove per laser damage tick, scaled by size
    vacRange: 300,           // core extractor (E) reach
    vacArc: 20 * Math.PI / 180,
    vacTickMs: 600,

    // Tractor beam (SPEC 3.30, tiered as of SPEC 3.44, second pass SPEC
    // 3.52): pulls the selected rock/core toward the ship at a clean fixed
    // rate by size — not a force fighting momentum, a deliberate
    // simplification (see SPEC.md 3.30). Not standard gear; tractorTestFit
    // fits everyone with tier 1 until Brian has heard it, after which owning
    // tractor_1/2/3/4 (MODULES) is the only way in. As of 3.52 there is no
    // "selected" tier any more — owned IS active (TRACTOR_TIERS below,
    // tractorLevel() picks the row) — range, pull rate on every size
    // including core, and reaction-mass cost all scale with it.
    tractorTestFit: true,
    tractorStopDist: 250,        // pulled items stop here, not at vacRange — a real margin, not a coincidence
    tractorDamp: 0.5,            // vel *= damp^dt while pulling — a laser's own shove dies out fast
    tractorRcsPerMassUnit: 0.004,   // reaction-mass cost per (rock mass unit x distance closed), before tier costMul

    // SPEC 3.60 (Brian's own tow picture, ideas14.txt): the tractor trails a
    // MOVING puller — the one place it does (3.55 deliberately avoided
    // this). The load chases an ideal point behind the ship; how far it
    // actually lags that point IS the strain, so hard accel or a sharp turn
    // (the ideal point darting away faster than the tier can correct for)
    // naturally strains the line with no separate rule needed for either.
    // Reversing into the load is the one thing that gets its own explicit
    // rule — Brian: "not allowing someone to auto-thrust backwards or they
    // lose tether."
    haulTowDist: 220,             // the load's ideal trailing distance behind the ship
    haulSpringK: 6, haulDamping: 4,   // how tightly the load's velocity chases the ship's — generous
    haulMaxAccel: 500,            // safety clamp on the spring — see updateHaulTow's own comment
    // Strain is three independent, explicit gains (Brian named three
    // things that should strain the line), not something inferred purely
    // from how far the load has visibly lagged — gentle flying under all
    // three stays quiet, on purpose, after an early build snapped almost
    // instantly under ordinary forward thrust.
    haulSafeSpeed: 90,            // ship speed below this: thrust alone adds no strain
    haulSpeedStrainPerS: 0.5,     // strain/second per 100 units/s of speed over haulSafeSpeed
    haulTurnStrainPerS: 0.5,      // strain/second per 90 deg/s of combined yaw+pitch rate
    haulReverseStrainPerS: 1.3,   // extra strain/second while S or auto-reverse is held
    haulStrainDecayPerS: 0.4,     // strain bleeds off this fast when none of the above apply
    haulCreakWarnFrac: 0.5,       // the creak becomes audible above this fraction of the snap point
    haulRcsPerMassUnit: 0.01,     // reaction-mass cost per (rock mass x corrective accel x dt), before tier costMul
    haulHomeDist: 1600,           // the home beacon's fixed distance from the load's start
    haulPar: 40,                  // reaction mass a clean haul should cost, for the end-of-run comparison

    // Auto-target (SPEC 3.38, ideas10.txt): Shift+T hands the stabilizers
    // the selected target — steers the nose onto it, then holds through a
    // few seconds of tracking so a moving/orbiting target's lock actually
    // lands. Brian's own problem: a Cruiser he couldn't get targeted by
    // hand. Never fires, never damages. Not standard gear — same
    // test-fit pattern as the tractor beam above — until the auto_target_N
    // modules exist for real.
    autoTargetTestFit: true,
    autoTargetWorstTiers: [6, 4, 2],  // seconds, worst case (180 deg yaw or the pitch clamp, whichever is
                                       // larger), indexed by owned tier (1/2/3) — autoTargetTier() reads
                                       // ownership directly (like tractorFitted()), not a cfg overlay,
                                       // since the number needed depends on WHICH tier is owned, not a
                                       // flat override
    autoTargetHoldS: 5,          // once aimed, holds (still tracking) this long before releasing
    autoTargetCharges: 3,        // per sortie; refilled wherever missiles are
    autoTargetAimToleranceRad: 1 * Math.PI / 180,  // "aimed" means within this of dead-on

    // particulates: every laser tick and every stage blast sheds dust that
    // hangs where it was knocked loose; the vacuum (V) filters it up.
    debrisScale: 0.75,       // every dust amount x this (Brian: 25% less dust)
    debrisPerDamage: 8,      // dust per point of laser damage
    debrisEventBase: 300,    // base mist from a stage blast (scaled by size)
    debrisMergeDist: 80,     // dust this close congeals into one field
    dustVacRange: 250,       // vacuum reach (no aiming — it filters the area)
    dustVacTickMs: 600,

    // sector (open space between encounters)
    poiInteract: 500,        // call (C) range for a point of interest (combat/mining zones; unaffected by 3.23)
    // Station (SPEC 1.19, ranges widened by SPEC 3.23): C at range does one
    // of three things now instead of two — comms (talk), transporter (hand
    // over cargo, no landing), or docking (land) — gated by favor tier, not
    // just distance (see favorTierAtLeast). Supersedes the 1.6 docking-
    // corridor mechanic entirely; planets aren't real ports yet (3.19), so
    // these three ranges apply to stations only for now.
    stationCommRange: 2000,        // C this close: a hail — talk, missions, no cargo moves
    stationTransporterRange: 600,  // C this close, Known favor or better: rearm/sell/buy, no landing
    stationDockRange: 150,         // C this close, Trusted favor or better: docks instantly
    // Upgrades extend all three (comm_array/transporter_booster/
    // docking_computer modules, plus Allied's own +25%, SPEC 3.23);
    // crossing any of the three inward/outward sounds a cue and says so.
    // Undocking puts the ship well outside comm range, facing away, so the
    // pilot has to thrust clear of the no-warp zone (warpInhibitDist)
    // before jumping.
    undockDist: 1000,
    stationAmbientVol: 0.35, // the docked interior loop (music bus)
    musicTrackVol: 0.35,     // SPEC 3.80: SIM.music's own fixed per-track fade-target level
                             // (music bus) — replaces Round 44's now-retired menuMusicVol,
                             // since the player is the menu's music now too.
    musicCrossfadeS: 2,      // SPEC 3.80: the player's own track-to-track crossfade
    spaceAmbientVol: 0.25,   // SPEC 3.67: the deep space bed under every mode (music bus)
    // Lock tones by target kind (ideas6): a ship gets the solid tone; a
    // rock or dust field the soft pulse; a point of interest the solid
    // tone much softer WITH the guidance ticks still running underneath,
    // at this cadence, so a long flight onto a beacon keeps its steering.
    lockToneVol: 0.12,
    lockTonePoiVol: 0.045,
    lockPulseVol: 0.1,
    tickLockedMs: 220,
    // Economy (SPEC 1.7): placeholder prices, all in CFG so Brian can retune.
    oreCreditRate: 10,        // 1 credit per this many ore

    // Favor and the three ranges (SPEC 3.23, Brian's station game; SPEC
    // 3.33 second pass, ideas9/ideas10). A per-port standing meter,
    // replacing SPEC 1.7's flat influence count (folded in at 10 points
    // each on migration, then retired). Control (investment, station
    // levels, passive production) is deliberately NOT built this round —
    // it's still direction-only in SPEC.md 3.23b, waiting on 3.11's wants
    // table and Brian's own open questions. Only stations run favor;
    // planets aren't real ports until 3.19.
    favorKnown: 10,     // the transporter (hand cargo over, no landing) opens
    favorTrusted: 40,   // docking (land) opens; PERMANENT once reached — favor never drops below
                        // this again, not even to a hard loss (SPEC 3.33: "favor never goes below 40")
    favorAllied: 70,    // +50% ranges; decay itself doesn't even start until this tier (favorDecayStartsAt)
    favorHonored: 90,   // SPEC 3.33's fifth tier: +50% ranges (no more than Allied's), honoredDiscount off
                        // purchases, and decay halved (favorDecayHonored)
    // SPEC 3.33 tried "nobody starts favored, Meridian included"; Brian's
    // own play (ideas11) reversed that — the home station stays the one
    // guaranteed exception. Station Meridian, in the starting/home
    // quadrant specifically, is seeded at favorTrusted and never drops
    // below it (see ensurePort) — every OTHER station, and Meridian in
    // any future non-home quadrant, still starts a stranger at 0.
    favorMission: 16,          // a mission (escort/defend/the timed contract) completed for that port — 2x 3.23's 8
    favorFail: 10,             // a mission ABANDONED (X mid-run) while the friendly was still alive
    favorFriendlyLost: 25,     // the port's own escort freighter or miner destroyed — the bigger loss
    favorZoneClear: 16,        // the quadrant's Contested Zone cleared, at the nearest station —
                               // Brian's "stranger gate": one combat win reaches Known (10) outright
    favorDeliveryHandover: 10, // the FIXED delivery run's own handover at Meridian (the one favor
                               // change that fires even though "the fixed sector doesn't run favor")
    // "selling what it wants" needs 3.11's per-station wants table — until
    // then every sale counts, at these per-category rates (ore's own rate
    // raised 200->500 per point, SPEC 3.33 — Brian: the old number was too
    // big a jump; hydrogen/biomass aren't real resources yet).
    favorPerWantUnit: { ore: 500, salvage: 4, alloy: 4 },
    donateOrePerFavor: 2000,  // SPEC 3.33: Donate ore's own, separate rate — a full 20,000-ore
                              // hold (cargoMax, once 3.14 exists; today's actual max hold) is
                              // exactly Known, Brian's other stranger-gate path
    favorDecayPerHour: 1,     // per play-hour of absence, but ONLY once favor has reached favorDecayStartsAt
    favorDecayHonored: 0.5,   // the slower rate once favor has reached favorHonored
    favorDecayStartsAt: 70,   // = favorAllied: below this, favor never decays at all (SPEC 3.33)
    // Not read anywhere yet — SPEC 3.23b's control system would slow decay
    // further once it exists (every station in the quadrant controlled;
    // two controlled quadrants touching on the galactic map). Written into
    // CFG now per spec so the numbers exist before the system that reads them.
    favorDecayQuadrantControlled: 0.4,
    favorDecayQuadrantsTouching: 0.25,
    // Per-tier range multiplier (added to 1) at THAT station only — unknown/known get none.
    favorRangeBonus: { trusted: 0.25, allied: 0.5, honored: 0.5 },
    honoredDiscount: 0.25,    // 25% off modules, lasers, repairs, and reaction mass at an Honored station

    // Escort and defend missions (SPEC 2.17), offered from a station's hail
    // menu. Raiders spawn hostile from the start (they're already attacking
    // the friendly) but only actually fight the PLAYER once provoked — see
    // `t.provoked` in TARGETING/WEAPONS.
    missionCredits: 300,       // full reward at 100% friendly hull; SPEC 3.25 scales it down from there
    missionCooldownS: 600,    // per mission kind, per station, in persisted game time (profile.clock)
    contractCredits: 200,     // SPEC 3.28: paid on top of the ore's own sell price
    // SPEC 3.55: the distress-call tow. Flat reward (there's no hull/frac to
    // scale by — the derelict is either recovered or it isn't), a spawn
    // distance matching escort/defend's own convention (see missionEscortHull
    // above for the shape this borrows), and a `size` that maps the derelict
    // onto the EXISTING tractor pull-rate/mass table (TRACTOR_TIERS,
    // rockMass) unchanged — see makeDistressRoster.
    distressCredits: 200,
    distressSpawnDist: 350,
    missionEscortHull: 200,
    missionMinerHull: 150,
    missionEscortSpeed: 40,   // u/s, the freighter's own drift toward the planet
    // SPEC 3.25: too hard to feel good, too short to build to anything
    // (Brian, from flying it) — the leg nearly doubles and the third wave
    // now arrives with a minute left, so clearing two waves still means
    // outrunning the third rather than a clean sweep every time.
    missionEscortLegS: 180,   // the leg's duration — surviving it is the win condition
    missionEscortWaveTimes: [20, 70, 120],  // game-seconds into the mission each wave arrives
    missionDefendWaveTimes: [10, 45],
    missionEscortWaveSize: 3, // Drones per wave (SPEC 3.25: was 2 Raiders)
    missionDefendWaveSize: 3, // Raiders per wave, unchanged
    missionStrikeGapMinS: 6,  // how often an unprovoked raider hits the friendly
    missionStrikeGapMaxS: 10,
    missionStrikeDmg: 8,      // SPEC 3.25: halved from 15
    // SPEC 3.25: the friendly's own shield — a pool like the pilot's,
    // absorbing strikes first; regenerates between hits so a wave cleared
    // fast leaves the friendly near-fresh for the next.
    friendlyShieldPool: 60,
    friendlyShieldRegenPerS: 1.5,
    // Kill buffs (SPEC 3.25): rolled independently, in this order, on
    // every ship kill (not rocks/dust/poi) — the first check that hits
    // AND applies wins, so a kill can grant nothing as easily as one.
    // Missile and laser sum with shield to under 1.0 on purpose (roughly
    // 30% of kills grant nothing) rather than partitioning a single roll
    // into "always exactly one" — "at most one" was the brief.
    killBuffMissileChance: 0.35,
    killBuffLaserChance: 0.35,
    killBuffLaserPct: 0.25,   // +25% laser damage while active
    killBuffLaserS: 30,       // a second boost extends this timer, never the size
    killBuffShieldChance: 0.3,
    killBuffShieldPts: 15,    // into the pool, or off a disrepair countdown
    killBuffAutoTargetChance: 0.25,  // SPEC 3.38: +1 auto-target charge — "it might be a buff of sorts"

    // The quadrant (SPEC 3.10): the open campaign's sector is no longer
    // four fixed points. QUADRANT (below) holds the star/stations/planets/
    // gate; the combat zone and asteroid fields are the moving parts,
    // spawned by these rules and saved in profile.quadrants. The delivery
    // run's SECTOR_POIS is untouched — none of this applies to it (demo
    // truthy skips every quadrant code path).
    quadrantRadius: 16000,      // nothing spawns or orbits past this from the star
    spawnMinFromPilot: 5000,    // a replacement zone/field spawns this far from the pilot...
    spawnMaxFromPilot: 11000,   // ...to this far — one clean jump, since leaving any
                                 // encounter refills the tank
    spawnMinGap: 4000,          // ...and at least this far from every other point
    spawnMaxFromStation: 11000, // ...and within this of at least one station
    quadrantFieldCount: 2,      // asteroid fields kept alive at once (spec: "1 to 3,
                                 // never zero" — built as a fixed count, replaced 1-for-1)
    cloudDriftPerS: 5,          // a field's drift speed along its spawn ring (prograde)
    cloudOreBudget: 40000,      // total ore before a field is worked out and replaced
    quadrantSaveEveryS: 30,     // quiet autosave cadence in open sector flight
    beaconAudibleDist: 8000,    // SPEC 3.10: the open quadrant's "on" beacons are audible
                                 // within this, or the selected target at any distance —
                                 // the delivery run's fixed sector stays always-audible,
                                 // unchanged, since it only ever has four points

    warpDropout: 600,        // hyperwarp exits this far out — final approach is flown
    warpMinDist: 1200,       // closer than this: just fly it
    // Warp drama (SPEC 1.17): a jump takes real time and flies the ship
    // continuously, scored by three recorded phases played at their own
    // rate, never trimmed or time-stretched. warpEdgeClipS/warpEngagedS are
    // the measured lengths of the recordings themselves (audio/ships/warp),
    // not independently tunable — change them only if the clips are re-cut.
    // The shortest allowed jump is one pass of all three, minus the two
    // overlaps below (4 + 1.5 + 4 - 1 = 8.5s); warpJumpLongDist is
    // calibrated (see SECTOR_POIS) so the delivery run's station ->
    // Contested Zone leg on a full tank takes exactly warpJumpMaxS.
    // Anything past that distance is still warpJumpMaxS — the engaged
    // loop just repeats longer in between.
    warpEdgeClipS: 4,        // length of every warp_startN / warp_finishN clip
    warpEngagedS: 1.5,       // length of a warp_engagedNr loop
    // SPEC 2.10 (ideas5): the engaged loop starts this much before the
    // start clip's natural end, crossfading with its tail — shortens the
    // shortest/longest jump to match, since the flight no longer waits
    // for the clip to finish before the ship gets moving.
    warpEngagedLeadS: 0.5,
    // Symmetric overlap on the other end: the total flight shortens by
    // this much again so the finish clip's arrival still lands exactly
    // on time while the engaged loop's tail crossfades into it.
    warpFinishLeadS: 0.5,
    warpJumpMinS: 8.5,
    warpJumpMaxS: 11,
    warpJumpLongDist: 10606, // travel distance (see SPEC 1.17) mapping to warpJumpMaxS
    warpMinChargePct: 25,    // refuse a jump under this % of the tank
    warpEngine: 1,           // 1-6; a drive module will pick this later (A.5) — only
                              // engine 1's clips are embedded in audio_assets.js so far
    warpInhibitDist: 1500,   // this close to ANY point of interest, the drive won't spool at all
    // The warp tank (SPEC 1.10) is measured in DISTANCE: a jump spends charge
    // by distance flown, and a jump that outreaches the tank drops the pilot
    // where it runs dry to thrust the rest. Full at a station and on leaving
    // any encounter (the core cools while you fight and mine); slow regen in
    // open flight so nobody is ever stranded. SECTOR_POIS is laid out against
    // this number: station -> combat fits one tank, the two later legs each
    // run the tank dry a few hundred short of the usual 600 dropout. Sized
    // against the BEST exit from an encounter (the no-warp zone makes the
    // pilot fly 1500 clear first, and leaving toward the next target shaves
    // that off the leg) — leave the wrong way and it's a longer thrust in.
    warpTankMax: 12500,
    warpRegenPerS: 40,       // open-flight core cooling: ~6 min to a full tank
    warpAlertPcts: [50, 75], // spoken "Warp core N percent" while cooling in open flight (full has its own line)
    sectorStartDist: 1800,   // new pilots start this far from Station Meridian, toward
                             // the Contested Zone — just outside the no-warp zone
    // Beacon panners use long-range params so every POI stays faintly
    // audible across the sector (sensor conceit, not real acoustics). The
    // steep-ish rolloff plus the distance-haze lowpass (see updateTargeting)
    // is what makes a beacon 11,000 out actually SOUND far away.
    beaconRef: 800, beaconMax: 40000, beaconRolloff: 1.2,
    beaconGainScale: 2,
    stationBeaconScale: 0.5,  // Station Meridian's beacon, half volume (Brian: too loud)

    // The Jump Gate's lighthouse beam (Phase 3L, L.9): a directional cone on
    // its beacon panner, sweeping a full turn every gateSweepS — loudest
    // when the beam points at you, never silent when it doesn't.
    gateSweepS: 10,
    gateConeInner: 60, gateConeOuter: 180, gateConeOuterGain: 0.15,

    // SPEC 3.64 (ideas14.txt/Fable): the gate run — the SAME sweep above
    // becomes a real timing rule, ahead of quadrant 2 needing it. A
    // tighter angular window than the audio cone's own wide one
    // (gateConeInner, which is about "loud", not "on time") — this one
    // decides pass or refuse.
    gateRunDist: 800,          // ship start distance from the gate
    gateRunApproachDist: 300,  // must be this close to attempt H at all
    gateRunBeamHalfAngle: 15,  // degrees either side of dead-on: a clean pass

    missileMax: 8,                    // magazine; Station Meridian rearms
    chaffMax: 4,                      // decoys (D); Station Meridian restocks (SPEC 1.8)
    laserMatchupStrong: 1.3,          // family-vs-target multiplier (SPEC 2.12), replaces hullMult/rockMult
    laserMatchupWeak: 0.7,
    // Laser levels (SPEC 3.26, replaces 2.12's free cycling): a level is
    // earned at the station, not cycled for free, and wears with use.
    laserLevelCredits: 200,   // buying level N costs this x N credits
    laserLevelAlloy: 1,       // and this x N alloy
    laserWearPerBurst: 1,     // health lost per burst fired, hit or miss, at any level in the family
    laserWearAlertPcts: [50, 25], // spoken once on each descending crossing (mirrors rcsAlertPcts)
    laserRepairCreditsPerPoint: 2, // × the owned level, per point of health restored, station only
    // SPEC 3.46 (ideas12.txt): fitting a not-yet-owned family into an
    // empty slot for the first time — a flat cost, always level 1,
    // unlike laserLevelCredits/Alloy above which scale with the level.
    laserFitCredits: 300,
    laserFitAlloy: 1,
    enemyChaffFollowUpS: 2,           // Veteran/Ace: a spoofed missile brings the next attack this soon
    missileDamage: 75,
    missileSpeed: 130,                // u/s
    missileTurn:  70 * Math.PI / 180, // max steer per second
    missileHit:   25,                 // hit radius, u
    missileLifeS: 11,                 // ~1400 u of reach at missileSpeed
    // Semi-active homing: the pilot must hold the target inside the missile
    // zone for the whole flight. Out of the cone longer than the grace and
    // the missile goes ballistic, coasts straight, then pops.
    missileGuideGraceS: 0.5,
    missileCoastS: 1.5,

    // ship survival
    shipHull: 100,
    shieldRaiseMs: 1500,     // spool-up before the shield is actually up
    shieldPool: 45,          // damage a raised shield can absorb (1.5x a full enemy beam)
    shieldRegenPerS: 3,      // pool regen while down (not raising, not in disrepair)
    shieldRepairS: 12,       // disrepair duration after the pool is drained to zero
    shieldRepairReturn: 0.5, // fraction of a full pool the shield returns with

    // System damage (SPEC 3.27): an enemy missile that lands on the hull —
    // never a beam, never absorbed by a raised shield — can knock a
    // subsystem out. A standard repair crew works one broken system at a
    // time in a fixed priority; docking still repairs everything instantly.
    knockoutChance: 0.4,     // odds a landed missile knocks something out
    repairHalfS: 90,         // seconds from 0 to 50% health, then 90 more to full
    // SPEC 3.36 (ideas10.txt): the crew also mends the hull once every
    // system above is whole (REPAIR_PRIORITY's own lowest rung), at HALF
    // the system rate — Brian: "hull repairs do not happen at the same
    // rate as other modules/components". And ALL repair work, hull or
    // system, spends reaction mass, through spendRcs() so the usual
    // alerts/battery flip fire the same as thrusting does; the crew
    // simply stops rather than ever drain the tank past the floor.
    repairHullFactor: 0.5,     // hull's own rate = the system rate x this
    repairRcsPerPoint: 0.2,    // reaction mass per point/percent restored, hull or system alike
    repairRcsFloor: 10,        // the crew won't spend mass below this
    repairPoolPct: 0.5,      // shields-broken: pool max multiplier at half health
    repairThrustPct: 0.5,    // thrust-broken: thrust multiplier at half health

    // SPEC 3.66 (ideas15.txt): field repairs stop short of whole — Brian:
    // "it should not go all the way back to 100%... degraded somehow
    // until full ship repairs can be made at a station." A system's own
    // field-repair ceiling starts at repairFieldCap the first time it's
    // knocked out, then steps down by repairCapLossPerHit on every
    // knockout after that (once it's been field-repaired and hit again),
    // floored at repairCapFloor — cleared entirely by docking. The hull's
    // own field cap is flat, no variance (damage to it isn't a discrete
    // "knockout" the way a system's is).
    repairFieldCap: 80, repairHullFieldCap: 80,
    repairCapLossPerHit: 10, repairCapFloor: 50,
    zStatusChainS: 4,   // Z: a press within this of the last continues the cycle; after, it restarts at Hull
    repairWarpRangePct: 0.5, // warp-broken: jump range multiplier at half health
    repairLaserDmgPct: 0.5,  // laser-broken: damage multiplier at half health
    repairMissileSpeedPct: 0.5, // missiles-broken: launch speed multiplier at half health
    repairChaffFizzlePct: 0.5,  // decoys-broken: chance a decoy does nothing at half health
    repairSensorPct: 0.5,    // sensor-broken: lock zone / tick-speed multiplier at half health
    repairCargoSpillOff: 0.02,  // cargo-broken: fraction of ore spilled per further hit, offline
    repairCargoSpillHalf: 0.01, // ...at half health

    // enemy fire (combat only, one attack in progress at a time)
    enemyFirstAttackS: 8,    // grace after the encounter starts
    enemyProvokedS: 4,       // a ship hit for the first time waits at least this long to fire back
    enemyAttackMinS: 7, enemyAttackMaxS: 12,   // gap between attacks
    enemyAlertAttackS: 2.5,  // a missile survivor strikes back this soon
    enemyLaserRange: 600,
    enemyLaserTelegraphS: 1.2,   // lock-on chirps before the beam bites
    enemyLaserTicks: 5, enemyLaserTickS: 1, enemyLaserTickDmg: 6,   // 5 s beam, 30 total
    enemyMissileRange: 1600,
    enemyMissileSpeed: 150, enemyMissileDamage: 25, enemyMissileLifeS: 14,
    enemyMissileTurn: 60 * Math.PI / 180,
    evadeSpeed: 260, evadeKeep: 0.4,   // missile survivor's break-away burst and its decay

    // SPEC 3.58 (ideas14.txt): every hostile ship gets a yaw-only `facing`
    // that turns toward its own motion while moving and toward the pilot
    // otherwise (turning to fire is the tell) — a cone on its engine voice
    // makes that turn audible. A `weapon: 'cannon'` roster ship fires a
    // steady rattle instead of the beam at close range: full damage inside
    // the inner cone, none outside — side-stepping out of it is the defense.
    enemyFacingTurnRateDeg: 90,       // deg/s the facing yaw turns
    enemyConeInner: 70, enemyConeOuter: 160, enemyConeOuterGain: 0.35,
    enemyCannonRange: 600,            // same reach as the beam (enemyLaserRange)
    enemyCannonTicks: 4, enemyCannonTickS: 1, enemyCannonTickDmg: 5,   // 4 s, 20 total dead-center

    // delivery run (the timed demo)
    demoOreGoal: 15000,

    // SPEC 3.41 (ideas11.txt): the flight course — beacons to fly through,
    // against the clock. A mission-menu drill, weapons cold, teaching the
    // controls the way a visual game's hoop course would.
    // SPEC 3.49 (ideas12.txt): closer gates, a bigger trigger radius, and
    // turns steep enough that flying straight actually misses — Brian's
    // own ask ("cut my requests in half except the radius") plus the
    // geometry check that came with it: 500*sin(25 deg) ~= 211, still
    // inside a 250 radius, so COURSES.gentle's own turns had to grow to
    // 35-45 degrees for the course to teach turning at all (500*sin(35)
    // ~= 287, outside the radius) while the wide radius still forgives
    // sloppy manual-thrust centering once the ship HAS turned toward it.
    courseGateRadius: 250,     // clean pass: within this of the gate's own
                               // position at the moment its plane is crossed
    courseSpacing: 500,        // distance from one gate to the next
    courseAudible: 4,          // gates sounding at once, in order
    courseGains: [1, 0.6, 0.35, 0.2],  // volume ladder, active gate first
    courseMissPenaltyS: 10,    // added to the clock per missed gate

    // SPEC 3.61 (ideas14.txt/Fable): the minefield — nothing to shoot, just
    // listening and throttle control. A field of slow-drifting mines
    // between the start and an exit beacon; each mine's own tick quickens
    // as the ship closes, and a mine within mineTriggerDist detonates if
    // the ship is over mineSafeSpeed when it crosses that distance.
    mineCount: 7,
    mineFieldDepth: 3000,       // start to the exit beacon, straight line
    mineSpread: 700,            // mines scattered within this radius of the centerline
    mineDriftSpeed: 6,          // u/s, a slow random walk — not a hazard by itself
    mineSafeSpeed: 25,          // at or under this, passing close is safe
    mineTriggerDist: 90,        // inside this range, over mineSafeSpeed detonates
    mineHullDmg: 20,
    mineTickRange: 700,         // beyond this a mine is silent — too far to matter yet
    mineTickFastMs: 150,        // interval right at mineTriggerDist
    mineTickSlowMs: 1400,       // interval at mineTickRange
    mineExitRadius: 120,        // proximity to the exit beacon that ends the run

    // SPEC 3.62 (ideas14.txt/Fable): the shadow — tail a ship that keeps
    // cutting its engine. It flies a straight route (the escort friendly's
    // own forward-motion code, reused) alternating lit/dark legs at
    // random; held contact within shadowRange accrues toward shadowNeedS
    // regardless of lit/dark — the dark legs cost the pilot the lock and
    // the tick (3.27's sensor-offline rule, scoped to this one target),
    // not the accrual itself, so tracking well through a dark leg by dead
    // reckoning is rewarded rather than doubly penalized.
    shadowRange: 600,
    shadowNeedS: 90,
    shadowSilentMinS: 4, shadowSilentMaxS: 9,
    // SPEC 3.73 (ideas16.txt, Brian's own thruster recordings): the lit
    // leg IS a thrust now — shadowSpeed/shadowLitMinS/MaxS above are
    // retired outright (not just deprioritized), replaced by this block.
    // A thrust leg lasts exactly the owned recording's own tier length
    // (Rookie 10s / Veteran 7s / Ace 4s — tierIdx order, matching every
    // other tiered thing in this file); the ship accelerates along its
    // own facing toward shadowThrustSpeed. A dark leg is a coast: no
    // thrust, speed bleeds toward shadowCoastSpeed, and the nose turns by
    // a random 45-135 degrees (either way) over the leg's own length —
    // the coast itself still follows the OLD velocity, so the surprise
    // lands with the NEXT thrust, not partway through the dark.
    shadowGain: 1.5,                 // "raised 50%" — multiplies targetGain when lit
    shadowThrustTiers: [10, 7, 4],    // seconds, by TIERS index (Rookie/Veteran/Ace)
    shadowThrustSpeed: 110, shadowThrustAccel: 30,
    shadowCoastSpeed: 25, shadowCoastDecel: 10,
    shadowTurnMinDeg: 45, shadowTurnMaxDeg: 135,
    shadowThrustFadeS: 0.3,           // the recording fades out at the tier length, whatever its real length is

    // SPEC 3.63 (ideas14.txt/Fable): nebula transit — the staged pulsar/
    // space_loop batch finally gets a job. A cloud sphere ahead of the
    // start; inside it, the sensor reads 3.27's own "half" state (lock
    // zone halved, tick doubled, scoped to nebulaState.inside rather
    // than the real shipSystems.sensor — the exact reasoning 3.62's
    // t.dark check already established) and the hull slowly ablates.
    // A motionless pulsar sits just past the far edge — the one stable
    // bearing — while the actual exit gate drifts slowly around that
    // same point, never quite where the pulsar points.
    nebulaCenterDist: 1800,     // cloud center, straight ahead of the start
    nebulaRadius: 1000,         // inside this of the center: half sensor, hull ablates
    nebulaHullPerS: 1.2,        // slow — minutes, not seconds, to matter
    nebulaHullAlertPcts: [50, 25],
    nebulaExitDrift: 5,         // u/s random walk, same shape as a mine's drift
    nebulaExitRadius: 120,      // proximity to the exit that ends the run

    // SPEC 3.59 (ideas14.txt): turret defense — three fixed zones, ship
    // stationary, weapons act on whichever zone is selected. First pass is
    // the 3-zone version only; the numpad 3x3 (3.59b) is a later item.
    turretZoneBearingsDeg: [-40, 0, 40],         // left, centre, right
    turretHeightOffsetsDeg: { low: -20, mid: 0, high: 20 },
    turretSpawnDist: 1200,           // world distance an incoming starts at
    turretIncomingMinS: 4, turretIncomingMaxS: 7,   // time to impact once spawned
    turretSpawnGapMinS: 2, turretSpawnGapMaxS: 4,   // gap after a zone clears before its next one
    turretLaserCooldownS: 1.3,       // per zone
    turretMissileMax: 3,             // whole drill, not per zone
    turretHullDmg: 12,               // an unhandled impact
    turretDrillS: 60,                // survive this long to win

    // SPEC 3.65 (Brian, from playing 3.59): a sweet spot to clear at, a
    // pressure ramp, a second noise only the shield answers, and a streak
    // reward. turretSweetFrac/Width are in the SAME frac units as the
    // spawn/impact code (1 = just spawned, 0 = impact).
    turretSweetFrac: 0.45, turretSweetWidth: 0.45,
    turretMaxPoints: 100, turretMinPoints: 10,
    turretRampFloor: 0.6,             // time-to-impact shrinks to this fraction by drill's end
    // SPEC 3.72 (ideas16.txt, Brian: "remove the incoming... not the
    // player missiles"): the volley goes. Chance to 0 rather than deleting
    // the mechanism — turretVolleyPoints/volleyCaught/volleyLanded and the
    // shield-only branch in turretImpact all stay wired, just unreachable,
    // one number away from coming back.
    turretVolleyChance: 0,            // was 0.3 — fraction of spawns that are shield-only
    turretVolleyPoints: 40,           // flat — catching one is a timing act, not a score race
    turretIncomingVol: 0.45,          // SPEC 3.72: was a hardcoded 0.22 in buildIncomingVoice
    turretAmbientDuck: 0.5,           // SPEC 3.72: the deep-space bed (3.67) at this fraction while the drill runs
    turretStreakFor: 5, turretStreakShieldS: 6,

    radarBurstMs: 350, radarGapMs: 450, radarBoost: 2.0,   // +6 dB

    // SPEC 3.71 (ideas16.txt, Brian's own scoring table, 2026-09-09): the
    // standalone Mining drill's own clock (a real quadrant field visit or
    // the demo/contract's own mining leg has none, and stays none — only
    // the Encounters-menu drill runs to a clock). Ore in the hold when the
    // clock or the cloud runs out first is the board's headline.
    miningDrillS: 420,               // 7 minutes
    miningClockMarks: [60, 10],       // seconds-left spoken marks

    // SPEC 3.74 (ideas16.txt, Brian, 2026-09-09): the star's own corona —
    // hydrogen for a miner who won't fight, ahead of quadrant 2's own gate
    // fare. Pull is inverse-square: `starPull * (starGravityDist/d)^2`,
    // capped at starPullMax — by construction, starPull equals CFG.thrust
    // (70) at d = starGravityDist = starCaptureDist (200), so the pull
    // reads as exactly 100% of nominal full thrust at the capture radius
    // and grows past it inside — "the pull exceeds full thrust" there,
    // literally. starHeatDist (400) sits outside starCaptureDist on
    // purpose, so a pilot can be ablating before they're anywhere near
    // capture; starHarvestBest (250) sits inside the heat radius but
    // outside capture — risky, not yet fatal, matching "the deepest,
    // richest scoop is the one that costs hull."
    starEntryDist: 1600,
    starGravityDist: 200, starPull: 70, starPullMax: 140,
    starPullPcts: [25, 50, 75, 100],
    starCaptureDist: 200,
    starHarvestDist: 600, starHarvestBest: 250, starHarvestCloseMult: 3,
    starHydrogenPerTick: 6,
    starHeatDist: 400, starHeatPerS: 2, starHeatPcts: [50, 25]
};

// The live config: a fresh copy of the numeric baseline with the active
// tier's overrides merged on top. Every CFG.xxx read elsewhere in the file
// sees this object, so applyTier() re-tuning it in place is all a tier
// change needs — nothing else in the code has to know tiers exist.
var CFG = Object.assign({}, CFG_DEFAULTS);
window.CFG = CFG;   // audio_engine.js and audio_cues.js are separate top-level
                    // scripts (outside this closure) and read CFG directly;
                    // applyTier() below mutates this same object in place, so
                    // the external reference always sees the live, tier-
                    // adjusted values without needing to be reassigned.

// Difficulty tiers. Rookie is the numeric baseline (its cfg overlay is
// empty) with enemies passive until hit; Veteran and Ace make every ship
// hostile from the start (the original, harder Round 10 pacing) and tune a
// few numbers tighter. zoneIdxDefault only takes effect when the tier is
// SET (menu adjust or profile load), never re-applied mid-mission, so a
// zone the pilot picked with Z survives leaving and re-entering a mission.
var TIERS = [
    { name: 'Rookie',  alwaysHostile: false, zoneIdxDefault: 0, cfg: { laserShipMult: 2 } },
    { name: 'Veteran', alwaysHostile: true,  zoneIdxDefault: 0, cfg: {} },
    { name: 'Ace',     alwaysHostile: true,  zoneIdxDefault: 1,
      cfg: { shieldRaiseMs: 2500, laserMissWindowMs: 16000, missileMax: 6 } }
];
var TIER_DESCS = [
    'Ships hold their fire until you hit them. Lasers do double damage to ships. Standard shields and magazine.',
    'Every ship is hostile from the start, the full training-drill pacing.',
    'Veteran pacing, a slower shield, a touchier laser, and a smaller magazine.'
];

function applyTier(idx) {
    tierIdx = idx;
    Object.assign(CFG, CFG_DEFAULTS, TIERS[idx].cfg, moduleCfgOverlay());
    zoneIdx = TIERS[idx].zoneIdxDefault;
}

// ---- profile (localStorage) --------------------------------------------
// One saved object carries the difficulty choice and the delivery-run log
// across sessions — same idea as Keyboard Commander's kbc_profile. Every
// read and write is wrapped: a browser with localStorage blocked or absent
// (some file:// contexts throw on the property access itself) just runs
// without persistence instead of erroring.
var PROFILE_KEY = 'hss_profile';
var profile = null;
// SPEC 2.18: 1 = the original Round 10-11 shape (tier/credits/upgrades/
// chaff/runs only); 2 = everything since (modules, sound, beacons, laser
// slots, resources); 3 = SPEC 3.10's game clock, mission cooldowns, and
// the quadrant save; 4 = SPEC 3.26's earned laser levels; 5 = SPEC 3.28's
// timed contract log and cooldown slot; 6 = SPEC 3.23's per-port favor,
// replacing the flat influence count. Bump this whenever a field is
// added or reshaped so loadProfile has one clear place to migrate from,
// instead of a save silently missing a field forever. `saveProfile` never
// writes a LOWER number than what was loaded, so a save from a newer build
// than this code (an unlikely rollback scenario) keeps its own version
// stamp — Object.assign already preserves any fields this code doesn't
// know about, so nothing about an unrecognized newer field gets dropped.
var PROFILE_VERSION = 15;

function defaultProfile() {
    // SPEC 3.71: `boards[kind]` (best-10 each) replaces what used to be
    // eight separate top-level array fields (runs/contractRuns/courseRuns/
    // turretRuns/minefieldRuns/shadowRuns/nebulaRuns/gateRunRuns) — see
    // loadProfile()'s own v13->v14 migration for how an old save's data
    // moves in unchanged. `upgrades: []` here is still the actual list of
    // owned module ids (unrelated to boards; BOARDS.runs.line() reads its
    // LENGTH off a stored run's own `upgrades` count, not this live list).
    var boards = {};
    BOARD_ORDER.forEach(function (k) { boards[k] = []; });
    return { version: PROFILE_VERSION, tier: 0, credits: CFG.startCredits, upgrades: [], chaff: 0,
             slots: STARTING_SLOTS.slice(), laserSlot: 0,
             sound: { world: SOUND_LEVELS.length - 1, cockpit: SOUND_LEVELS.length - 1, effects: SOUND_LEVELS.length - 1, music: 3 }, beacons: 'on',
             // SPEC 3.80: the background music player. on defaults true for
             // a new pilot (KC's own default); idx is which track in the
             // style's own list was last playing, so a reload resumes
             // roughly where it left off instead of redrawing at random.
             music: { on: true, style: 'celestial', idx: 0 },
             resources: { salvage: 0, alloy: 0, hydrogen: 0 },   // SPEC 3.74: the field this item creates
             // SPEC 3.26: levels are earned at the station, not cycled for
             // free — one owned level and one health per family.
             laserLevels: { mining: 1, rapid: 1 }, laserHealth: { mining: 100, rapid: 100 },
             // SPEC 3.10: the session game clock (was simClock, SPEC 2.17,
             // session-only) and the mission cooldowns it now backs — both
             // persist so a reload doesn't silently make everything
             // available again. quadrants/quadrantId are the moving
             // world's save; quadrantId always 'home' until SPEC 3.22's
             // Frontier exists.
             clock: 0, missionCooldownUntil: { escort: 0, defend: 0, contract: 0, distress: 0 },
             quadrants: {}, quadrantId: 'home',
             boards: boards };
}

function loadProfile() {
    profile = defaultProfile();
    var saved = null;
    try {
        var raw = window.localStorage && localStorage.getItem(PROFILE_KEY);
        if (raw) {
            saved = JSON.parse(raw);
            if (saved && typeof saved === 'object') Object.assign(profile, saved);
        }
    } catch (e) { saved = null; /* no persistence this session; profile stays default */ }
    var loadedVersion = profile.version || 1;
    // v1 -> v2 (SPEC 2.18): a save from before modules/sound/beacons/
    // resources existed gets every field below backfilled with defaults,
    // same as a v2 save with one of them missing or malformed gets today
    // — these checks were already here field-by-field before 2.18 gave
    // them a version number; nothing about their behavior changes.
    if (!Array.isArray(profile.runs)) profile.runs = [];
    if (!Array.isArray(profile.upgrades)) profile.upgrades = [];
    // Laser slots: exactly LASER_SLOTS entries, unknown ids become empty.
    if (!Array.isArray(profile.slots)) profile.slots = STARTING_SLOTS.slice();
    profile.slots = profile.slots.slice(0, LASER_SLOTS).map(function (id) { return laserById(id) ? id : null; });
    while (profile.slots.length < LASER_SLOTS) profile.slots.push(null);
    laserSlot = (profile.laserSlot >= 0 && profile.laserSlot < LASER_SLOTS) ? profile.laserSlot | 0 : 0;
    // v7 -> v8 (SPEC 3.45): five sound levels replace three — remap an
    // old save's level indexes (0/1/2) onto their new equivalents
    // (0/2/4) before the general validation below runs, so an old
    // "full" (index 2) isn't silently reinterpreted as the new "quiet"
    // (also index 2). Checked against the RAW saved JSON, not the
    // already-merged profile (the same trap SPEC 2.18/3.26 exist to
    // avoid) — `saved` is null for a genuinely fresh profile, so this
    // never touches one.
    if (loadedVersion < 8 && saved && saved.sound && typeof saved.sound === 'object') {
        var oldToNewSound = { 0: 0, 1: 2, 2: 4 };
        Object.keys(saved.sound).forEach(function (id) {
            if (oldToNewSound[saved.sound[id]] !== undefined) profile.sound[id] = oldToNewSound[saved.sound[id]];
        });
    }
    // Sound options: one level index per category, unknown values become
    // full — EXCEPT music (SPEC 3.80), which defaults to medium instead
    // (KC's own default). Nothing before 3.80 ever exposed a way to set
    // the music level on purpose, so "the field is missing" and "this
    // pilot has never touched it" are the same thing here — no version
    // gate needed, unlike the SPEC 3.45 remap this pattern otherwise
    // mirrors.
    var snd = (profile.sound && typeof profile.sound === 'object') ? profile.sound : {};
    profile.sound = {};
    SOUND_CATS.forEach(function (c) {
        var i = snd[c.id] | 0;
        var fallback = c.id === 'music' ? 3 : SOUND_LEVELS.length - 1;
        profile.sound[c.id] = (i >= 0 && i < SOUND_LEVELS.length && snd[c.id] !== undefined) ? i : fallback;
    });
    beaconMode = BEACON_MODES.some(function (m) { return m.id === profile.beacons; }) ? profile.beacons : 'on';
    if (!profile.resources || typeof profile.resources !== 'object') profile.resources = { salvage: 0, alloy: 0, hydrogen: 0 };
    if (typeof profile.resources.salvage !== 'number') profile.resources.salvage = 0;
    if (typeof profile.resources.alloy !== 'number') profile.resources.alloy = 0;
    // SPEC 3.74: the field this item creates — a pre-existing save simply
    // never had one, same backfill shape as salvage/alloy got in 2.15.
    if (typeof profile.resources.hydrogen !== 'number') profile.resources.hydrogen = 0;
    // v2 -> v3 (SPEC 3.10): the game clock and mission cooldowns move from
    // session-only variables into the profile; the quadrant save is new.
    if (typeof profile.clock !== 'number' || profile.clock < 0) profile.clock = 0;
    if (!profile.missionCooldownUntil || typeof profile.missionCooldownUntil !== 'object') profile.missionCooldownUntil = {};
    ['escort', 'defend', 'contract', 'distress'].forEach(function (k) {
        if (typeof profile.missionCooldownUntil[k] !== 'number') profile.missionCooldownUntil[k] = 0;
    });
    if (!profile.quadrants || typeof profile.quadrants !== 'object') profile.quadrants = {};
    if (typeof profile.quadrantId !== 'string') profile.quadrantId = 'home';
    // v4 -> v5 (SPEC 3.28): the timed contract's own run log — a plain
    // backfill, same shape as `runs`' own guard above.
    if (!Array.isArray(profile.contractRuns)) profile.contractRuns = [];
    // v5 -> v6 (SPEC 3.23): favor replaces the flat influence count, per
    // port, per quadrant (profile.quadrants[q].ports[name].favor). Folds
    // an old profile.stations[name].influence in at 10 points each (the
    // spec's own conversion) into whichever quadrant is current today
    // (always 'home' in practice — there's only ever been one). Every
    // OTHER port still starts a stranger regardless of old data; Station
    // Meridian gets its own seed from ensurePort itself (SPEC 3.33/
    // ideas11 — see that function), not from this migration, so a save
    // with no stations data at all is unaffected. A genuinely fresh
    // profile is left with NO quadrant record at all, same as always: the
    // shell below is only created when there's real data to put in it, so
    // ensureQuadrantHome's "first ever Sector visit" check (on `.zone`,
    // not the record's mere existence) still works, and every other place
    // that tests `profile.quadrants[id]` for plain truthiness (a real bug
    // this exact migration surfaced in testing — see SPEC.md 3.23)
    // doesn't see a hollow shell it wasn't expecting.
    if (profile.stations && typeof profile.stations === 'object' && Object.keys(profile.stations).length) {
        if (!profile.quadrants[profile.quadrantId]) {
            profile.quadrants[profile.quadrantId] = { zone: null, fields: [], fieldSeq: 0, ports: {} };
        }
        var migrateQ = profile.quadrants[profile.quadrantId];
        Object.keys(profile.stations).forEach(function (name) {
            var oldInfluence = profile.stations[name] && profile.stations[name].influence;
            if (typeof oldInfluence !== 'number' || oldInfluence <= 0) return;
            var port = ensurePort(migrateQ, name);
            var favor = Math.min(100, oldInfluence * 10);
            if (favor > port.favor) port.favor = favor;
            if (favor > port.peakFavor) port.peakFavor = favor;
        });
    }
    delete profile.stations;
    // v6 -> v7 (SPEC 3.41): the flight course's own run log — a plain
    // backfill, same shape as contractRuns' own guard above.
    if (!Array.isArray(profile.courseRuns)) profile.courseRuns = [];
    // v8 -> v9 (SPEC 3.65): the turret drill's own run log.
    if (!Array.isArray(profile.turretRuns)) profile.turretRuns = [];
    // v9 -> v10 (SPEC 3.61): the minefield's own run log.
    if (!Array.isArray(profile.minefieldRuns)) profile.minefieldRuns = [];
    // v10 -> v11 (SPEC 3.62): the shadow's own run log.
    if (!Array.isArray(profile.shadowRuns)) profile.shadowRuns = [];
    // v11 -> v12 (SPEC 3.63): the nebula transit's own run log.
    if (!Array.isArray(profile.nebulaRuns)) profile.nebulaRuns = [];
    // v12 -> v13 (SPEC 3.64): the gate run's own run log.
    if (!Array.isArray(profile.gateRunRuns)) profile.gateRunRuns = [];
    // v13 -> v14 (SPEC 3.71): one `profile.boards[kind]` object replaces
    // the eight separate top-level arrays just backfilled above —
    // unchanged, entries intact (an old save's own `courseRuns` becomes
    // `boards.course`); the six brand-new boards (combat/mining/haul/
    // capital/escort/defend) simply start empty, nothing to migrate for
    // those. Real bug found in testing: `defaultProfile()` now seeds
    // `profile.boards` with all fourteen keys already present as EMPTY
    // arrays (needed so a genuinely fresh profile has every board from
    // the start) — an `!Array.isArray(profile.boards[newKey])` guard here
    // (meant to avoid clobbering an already-migrated board) is therefore
    // ALWAYS false, since an empty array still passes Array.isArray, so
    // the copy never ran and every old save's real data was silently
    // dropped. Fixed by keying the copy on the OLD array actually having
    // entries instead — `delete profile[oldKey]` below is what actually
    // makes this idempotent (a save already migrated once has no old
    // field left to re-read), not a check on the board's own contents.
    if (!profile.boards || typeof profile.boards !== 'object') profile.boards = {};
    var OLD_BOARD_FIELDS = { runs: 'runs', contractRuns: 'contract', courseRuns: 'course',
                              turretRuns: 'turret', minefieldRuns: 'minefield', shadowRuns: 'shadow',
                              nebulaRuns: 'nebula', gateRunRuns: 'gaterun' };
    Object.keys(OLD_BOARD_FIELDS).forEach(function (oldKey) {
        var newKey = OLD_BOARD_FIELDS[oldKey];
        if (Array.isArray(profile[oldKey]) && profile[oldKey].length) {
            profile.boards[newKey] = profile[oldKey];
        }
        delete profile[oldKey];
    });
    BOARD_ORDER.forEach(function (k) { if (!Array.isArray(profile.boards[k])) profile.boards[k] = []; });
    // v14 -> v15 (SPEC 3.80): the background music player. A save from
    // before this round simply never had profile.music at all — a plain
    // backfill, same shape as contractRuns'/courseRuns' own guards above.
    if (!profile.music || typeof profile.music !== 'object') profile.music = { on: true, style: 'celestial', idx: 0 };
    if (typeof profile.music.on !== 'boolean') profile.music.on = true;
    if (typeof profile.music.style !== 'string' || !(window.MUSIC_STYLES && window.MUSIC_STYLES[profile.music.style])) {
        profile.music.style = 'celestial';
    }
    if (typeof profile.music.idx !== 'number' || profile.music.idx < 0) profile.music.idx = 0;
    // v3 -> v4 (SPEC 3.26): laser levels replace 2.12's free version-cycling.
    // A pre-4 save's slots held version ids (mining3, etc) directly with no
    // separate "owned level" concept — the highest version found per family
    // becomes the owned level so nobody loses a laser they already had;
    // health starts full. A slot pointing above its own family's owned
    // level (shouldn't happen going forward — wearLaser clamps it on a
    // drop) is pulled back down defensively.
    // NOTE: defaultProfile() already seeds laserLevels/laserHealth with
    // valid numbers, so a plain "is it missing" check on `profile` can
    // never tell an old save's absence from a fresh one's default — the
    // check has to run against the raw `saved` JSON instead (the same
    // trap SPEC 2.18's version field exists to avoid; this migration
    // just doesn't have a version field of its own to lean on).
    // Gated on loadedVersion < 4 AND a hardcoded family list (not the live
    // LASER_FAMILIES array) — SPEC 3.46 added four more families to that
    // array, and this v3->v4 migration re-running for THOSE on every load
    // (loadedVersion < 4 never true, but the loop ran regardless before
    // this fix) would have silently granted level 1 in all four to every
    // profile, fresh or old, since `saved.laserLevels` never had those
    // keys either. A migration must stay pinned to what it originally
    // migrated, not grow with whatever the live data model adds later.
    if (loadedVersion < 4) {
        ['mining', 'rapid'].forEach(function (famId) {
            var hadLevel = saved && saved.laserLevels && typeof saved.laserLevels[famId] === 'number';
            if (!hadLevel) {
                var maxV = 1;
                profile.slots.forEach(function (id) {
                    var L = laserById(id);
                    if (L && L.family === famId && L.version > maxV) maxV = L.version;
                });
                profile.laserLevels[famId] = maxV;
            }
            var hadHealth = saved && saved.laserHealth && typeof saved.laserHealth[famId] === 'number';
            if (!hadHealth) profile.laserHealth[famId] = 100;
        });
    }
    profile.slots = profile.slots.map(function (id) {
        var L = laserById(id);
        if (!L) return id;
        var owned = profile.laserLevels[L.family] || 1;
        return L.version > owned ? L.family + owned : id;
    });
    // Never write a version lower than what was actually loaded.
    profile.version = Math.max(loadedVersion, PROFILE_VERSION);
    applyTier(TIERS[profile.tier] ? profile.tier : 0);
}

// Push the saved levels onto the buses. Called once the context exists and
// whenever a level changes; harmless before audio has started.
function applySoundLevels() {
    if (!profile || !SIM.audio.ctx) return;
    SIM.audio.setBusLevel('world',   SOUND_LEVELS[profile.sound.world].v);
    SIM.audio.setBusLevel('cockpit', SOUND_LEVELS[profile.sound.cockpit].v);
    SIM.audio.setBusLevel('music',   SOUND_LEVELS[profile.sound.music].v);
    SIM.cues.setLevel(SOUND_LEVELS[profile.sound.effects].v);
}

function saveProfile() {
    if (!profile) return;
    profile.tier = tierIdx;
    profile.laserSlot = laserSlot;
    profile.beacons = beaconMode;
    try {
        if (window.localStorage) localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
    } catch (e) { /* can't persist; the session still plays fine */ }
}

// SPEC 3.71 (ideas16.txt, Brian's own scoring table, 2026-09-09): one
// shape for every encounter's own best-10 log, replacing what had grown
// into eight near-identical push/sort/slice/save functions (recordRun,
// recordContractRun, recordCourseRun, recordMinefieldRun, recordShadowRun,
// recordNebulaRun, recordGateRunRun, recordTurretRun — see git history for
// their own original shapes). `rank` names which field of a stored entry
// is the ranked headline (SPEC 3.70's own debrief line 1); `dir` says
// which way wins; `line(entry)` is what the Run log speaks for one entry
// (runLogItems(), below). The Contested Zone and the distress call get NO
// board here (Brian's own call, debrief only) — not listed.
//
// The table names FOURTEEN boards, not the twelve the spec's own prose
// counted — "four new kinds (combat, mining, haul, capital) plus escort/
// defend drills" is 6 new alongside the 8 that already existed, not 4;
// flagged here as an apparent undercount in the spec text rather than
// silently reconciled, since fourteen is what the table's own sixteen
// rows minus its two "no board" rows actually adds up to.
var BOARD_ORDER = ['runs', 'contract', 'course', 'minefield', 'shadow', 'nebula', 'gaterun',
                    'combat', 'mining', 'escort', 'defend', 'turret', 'haul', 'capital'];
var BOARDS = {
    runs:      { label: 'Delivery run', rank: 'seconds', dir: 'asc',
                 line: function (e) { return fmtTime(e.seconds) + ' (' + (TIERS[e.tier] ? TIERS[e.tier].name : '?') +
                                       (e.upgrades ? ', ' + e.upgrades + ' modules' : '') + ')'; } },
    contract:  { label: 'Timed contract', rank: 'seconds', dir: 'asc',
                 line: function (e) { return fmtTime(e.seconds) + ' (' + (TIERS[e.tier] ? TIERS[e.tier].name : '?') + ')'; } },
    course:    { label: 'Flight course', rank: 'seconds', dir: 'asc',
                 line: function (e) { return fmtTime(e.seconds) +
                                       (typeof e.avgOffset === 'number' ? ', average ' + Math.round(e.avgOffset) + ' off centre' : '') +
                                       (typeof e.made === 'number' ? ', ' + e.made + ' of ' + (e.made + e.missed) + ' gates clean' : ''); } },
    minefield: { label: 'Minefield', rank: 'seconds', dir: 'asc',
                 line: function (e) { return fmtTime(e.seconds) +

    shadow:    { label: 'The shadow', rank: 'seconds', dir: 'asc',
                 line: function (e) {
                     var t = fmtTime(e.seconds);
                     if (typeof e.efficiency !== 'number') return t;   // a pre-3.71 entry has no metrics — read the time alone
                     return t + ', ' + Math.round(e.efficiency) + ' percent contact, ' + e.timesLost +
                            (e.timesLost === 1 ? ' time lost, longest hold ' : ' times lost, longest hold ') + fmtTime(e.longestHold);
                 } },
    nebula:    { label: 'Nebula transit', rank: 'seconds', dir: 'asc',
                 line: function (e) { return fmtTime(e.seconds) + (typeof e.hull === 'number' ? ', hull ' + e.hull + ' percent' : ''); } },
    gaterun:   { label: 'The gate run', rank: 'seconds', dir: 'asc',
                 line: function (e) { return fmtTime(e.seconds) +
                                       (typeof e.wasted === 'number' ? ', ' + e.wasted + (e.wasted === 1 ? ' pass wasted' : ' passes wasted') : ''); } },
    combat:    { label: 'Combat training', rank: 'seconds', dir: 'asc',
                 line: function (e) { return fmtTime(e.seconds) + ', hull ' + e.hull + ' percent, ' +
                                       e.missilesUsed + ' missiles used, ' + e.accuracy + ' percent accuracy'; } },
    mining:    { label: 'Mining', rank: 'ore', dir: 'desc',
                 line: function (e) { return e.ore + ' ore' + (e.cleared ? ', cleared in ' + fmtTime(e.seconds) : ' (clock ran out)') +
                                       ', ' + e.cores + (e.cores === 1 ? ' core' : ' cores') + ' extracted'; } },
    escort:    { label: 'Escort drill', rank: 'hullPct', dir: 'desc',
                 line: function (e) { return e.hullPct + ' percent freighter hull, ' + e.cleared + ' drones cleared, ' +
                                       e.credits + ' credits, own hull ' + e.ownHullPct + ' percent'; } },
    defend:    { label: 'Defend drill', rank: 'hullPct', dir: 'desc',
                 line: function (e) { return e.hullPct + ' percent miner hull, ' + e.cleared + ' raiders cleared, ' +
                                       'last wave at ' + fmtTime(e.seconds); } },
    turret:    { label: 'Turret defense', rank: 'score', dir: 'desc',
                 line: function (e) { return 'score ' + e.score +
                                       (typeof e.accuracy === 'number' ? ', ' + e.accuracy + ' percent accuracy' : '') +
                                       (typeof e.bestStreak === 'number' ? ', best streak ' + e.bestStreak : ''); } },
    haul:      { label: 'The haul', rank: 'rcsSpent', dir: 'asc',
                 line: function (e) { return Math.round(e.rcsSpent) + ' reaction mass, ' + fmtTime(e.seconds) + ', ' +
                                       e.parted + (e.parted === 1 ? ' time parted' : ' times parted'); } },
    capital:   { label: 'Capital ship', rank: 'seconds', dir: 'asc',
                 line: function (e) { return fmtTime(e.seconds) + ', hull ' + e.hull + ' percent, ' +
                                       e.refused + (e.refused === 1 ? ' shot refused' : ' shots refused') + ' by a closed door'; } }
};
// Records a completed run against its own board: best-10, sorted by that
// board's own rank field and direction, most-recent entry stamped with
// today's date. Returns the PREVIOUS best value of the ranked field
// (undefined on a first-ever run) — not a boolean — so a finish line can
// speak the real delta ("New personal best by N seconds") the way every
// board since SPEC 3.49 already has; callers ranked by time (fmtTime) or
// a plain count both read `prevBest` the same way, just with different
// formatting at the call site.
function recordRun(kind, entry) {
    if (!profile) return undefined;
    var b = BOARDS[kind];
    if (!b) return undefined;
    var list = profile.boards[kind] || (profile.boards[kind] = []);
    var prevBest = list.length ? list[0][b.rank] : undefined;
    entry.date = new Date().toISOString().slice(0, 10);
    list.push(entry);
    list.sort(function (x, y) { return b.dir === 'asc' ? x[b.rank] - y[b.rank] : y[b.rank] - x[b.rank]; });
    profile.boards[kind] = list.slice(0, 10);
    saveProfile();
    return prevBest;
}

// Lasers (SPEC 1.9, families SPEC 2.12). Slots 1 and 2 are the two laser
// FAMILIES; all eight levels exist per family but SPEC 3.26 makes them
// earned, not free — a profile owns 1..N of them (profile.laserLevels),
// bought at the station with credits and alloy. Keys 1/2 select their
// slot, then select again (or Shift) cycles among owned levels within
// the family — same switch time and clip either way (Brian: decided).
// A burst is fire-and-forget — it runs every
// tick to the end and cannot be stopped — then the slot cools for
// cooldownS. Damage is a PER-TICK PROFILE, not one number, and the burst
// length follows each family's own recording (Mining clips run 8 s,
// Rapid-pulse 5 s) rather than a fixed five ticks. Placeholder per-tick
// numbers until Brian sets them by ear. SPEC 3.26: level n is tickBase x
// (1 + 0.2*(n-1)) through level 5, then that x 1.1^(n-5) for 6-8 —
// replaces 2.12's flat 1.1^(n-1) now that levels are earned, not free.
function laserLevelMult(n) {
    var base = 1 + 0.2 * (Math.min(n, 5) - 1);
    return n <= 5 ? base : base * Math.pow(1.1, n - 5);
}
// SPEC 3.46 (ideas12.txt): four more families for slots 3-6, one each,
// each with a job the others don't (Fable's profiles, for Brian's ear).
// tickCount/tickS are each fitted to that family's OWN clips' real
// measured length (ffprobe), the same way mining (8x1=8s) and rapid
// (10x0.5=5s) already fit theirs — not the tickCount/duration Fable
// first proposed before the clips existed to measure.
var LASER_FAMILIES = [
    { id: 'mining', label: 'mining', tickBase: 15, tickCount: 8, tickS: 1, cooldownS: 3,
      strong: ['iron', 'cruiser'], weak: ['ice', 'interceptor'],
      matchupSpoken: { strong: 'iron and cruisers', weak: 'ice and interceptors' } },
    { id: 'rapid', label: 'rapid', tickBase: 6, tickCount: 10, tickS: 0.5, cooldownS: 1.5,
      strong: ['ice', 'interceptor'], weak: ['iron', 'cruiser'],
      matchupSpoken: { strong: 'ice and interceptors', weak: 'iron and cruisers' } },
    // Mining's heavy cousin: few, heavy bites — good at rock, useless in
    // a fight. Real clip length 7.0s.
    { id: 'rugged_mining', label: 'rugged mining', tickBase: 19, tickCount: 7, tickS: 1, cooldownS: 3.5,
      strong: ['iron', 'stone'], weak: ['interceptor', 'corvette', 'cruiser'],
      matchupSpoken: { strong: 'iron and stone', weak: 'every ship' } },
    // Rapid's cousin, tuned for dogfighting: same cadence as rapid (its
    // clips share rapid's own 5.0s length), strong on the nimble stuff.
    { id: 'fast_fighter', label: 'fast fighter', tickBase: 5, tickCount: 10, tickS: 0.5, cooldownS: 1.5,
      strong: ['interceptor', 'ice'], weak: ['cruiser', 'iron'],
      matchupSpoken: { strong: 'interceptors and ice', weak: 'cruisers and iron' } },
    // Many small bites, corvette killer, useless on rock of any kind.
    // Real clip length 7.0s.
    { id: 'rotary_cannon', label: 'rotary cannon', tickBase: 4, tickCount: 14, tickS: 0.5, cooldownS: 2,
      strong: ['corvette'], weak: ['ice', 'iron', 'stone'],
      matchupSpoken: { strong: 'corvettes', weak: 'every rock' } },
    // Three (now four, refit to the real 5.0s clip) heavy front-loaded
    // bites — an alpha strike against a cruiser, weak on anything nimble.
    { id: 'burst_plasma', label: 'burst plasma', tickBase: 35, tickCount: 4, tickS: 1.25, cooldownS: 4,
      strong: ['cruiser'], weak: ['interceptor'],
      matchupSpoken: { strong: 'cruisers', weak: 'interceptors' } }
];
var LASER_FAMILIES_BY_ID = {};
LASER_FAMILIES.forEach(function (f) { LASER_FAMILIES_BY_ID[f.id] = f; });

var LASERS = [];
LASER_FAMILIES.forEach(function (fam) {
    for (var v = 1; v <= 8; v++) {
        var perTick = Math.round(fam.tickBase * laserLevelMult(v));
        var ticks = [];
        for (var k = 0; k < fam.tickCount; k++) ticks.push(perTick);
        LASERS.push({ id: fam.id + v, family: fam.id, version: v,
                      name: fam.label + ' ' + v, asset: 'laser_' + fam.id + v,
                      ticks: ticks, tickS: fam.tickS, cooldownS: fam.cooldownS });
    }
});

// Ship classes for the laser matchup table (same split 2.2 will use).
var SHIP_CLASS = { Freighter: 'cruiser', Raider: 'interceptor', Scout: 'interceptor',

// Salvage (SPEC 2.15/A.9): collected on the kill (a container to fly to

var SALVAGE = { interceptor: 2, corvette: 3, cruiser: 5 };

var RCS_PER_KILL = { interceptor: 6, corvette: 9, cruiser: 15 };
// Ship destruction, four size tiers (this round): which of

var SHIP_EXPLOSION_SIZE = { Cruiser: 'capital', Freighter: 'large', Drone: 'medium',

// Replaces the old per-laser hullMult/rockMult: the FAMILY decides whether
// this shot is a good match for the target, a rock by type, a ship by class.
function laserMatchupMult(L, t) {
    var fam = LASER_FAMILIES_BY_ID[L.family];
    if (!fam) return 1;
    var key = t.kind === 'rock' ? t.type.name.toLowerCase() : (SHIP_CLASS[t.name] || 'corvette');
    if (fam.strong.indexOf(key) >= 0) return CFG.laserMatchupStrong;
    if (fam.weak.indexOf(key) >= 0) return CFG.laserMatchupWeak;
    return 1;
}

function moduleById(id) {
    for (var i = 0; i < MODULES.length; i++) if (MODULES[i].id === id) return MODULES[i];
    return null;
}
function ownedModules() { return (profile && profile.upgrades) || []; }

// Every owned module's cfg, merged into one overlay, applied on top of the
// tier — so buying a module works the moment you buy it (applyTier is the
// one place CFG gets rebuilt from scratch, tier change or not).
function moduleCfgOverlay() {
    var out = {};
    ownedModules().forEach(function (id) {
        var m = moduleById(id);
        if (m && m.cfg) Object.assign(out, m.cfg);
    });
    return out;
}

// No friction in space, so mass is the tradeoff for every module: 1.0 at
// an empty loadout, a little higher per module fitted. Feeds thrust/turn
// in simTick.
// Reaction mass (SPEC 2.14): spent by thrust, braking, and the automatic
// stabilizers; empty means battery mode (rcsBatteryFactor of everything,
// never zero). Alerts descend the same way the warp core's ascend (1.13):
// spoken once on the exact crossing, re-armed by any refill above it.
function rcsPct() { return CFG.rcsMax > 0 ? clamp(rcs / CFG.rcsMax * 100, 0, 100) : 0; }

function spendRcs(amount) {
    if (rcsBattery || amount <= 0) return;
    var before = rcsPct();
    rcs = Math.max(0, rcs - amount);
    var after = rcsPct();
    for (var i = 0; i < CFG.rcsAlertPcts.length; i++) {
        var p = CFG.rcsAlertPcts[i];
        if (before > p && after <= p) { say('Reaction mass ' + p + ' percent.'); break; }
    }
    if (rcs <= 0) {
        rcsBattery = true;
        SIM.cues.play('refusal_wait');
        say('Reaction mass empty. Battery power.');
    }
}

// Free refill (station landing) or a purchased amount (hail range) — either
// way, coming back above zero clears battery mode.
function addRcs(amount) {
    rcs = clamp(rcs + amount, 0, CFG.rcsMax);
    if (rcs > 0) rcsBattery = false;
}
function refillRcs() { rcs = CFG.rcsMax; rcsBattery = false; }

function rcsFactor() { return rcsBattery ? CFG.rcsBatteryFactor : 1; }

function shipMass() {
    var extra = ownedModules().reduce(function (s, id) {
        var m = moduleById(id); return s + (m ? m.mass : 0);
    }, 0);
    return 1 + extra / 100;
}

function laserById(id) {
    for (var i = 0; i < LASERS.length; i++) if (LASERS[i].id === id) return LASERS[i];
    return null;
}
