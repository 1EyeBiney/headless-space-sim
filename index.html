    // (plain solid the instant the door opens).
    if (t.doorUp) return 'shielded';
    return 'solid';
}
function lockToneUsesPulse() { return lockToneKind() === 'pulse'; }

function playLockPulse() {
    SIM.audio.sfxTone({ type: 'sine', f1: 330, dur: 0.06, vol: CFG.lockPulseVol });
    SIM.audio.sfxTone({ type: 'sine', f1: 440, dur: 0.06, vol: CFG.lockPulseVol, at: 0.09 });
}

function startLockPulse() {
    if (lockPulseTimer) return;
    playLockPulse();
    lockPulseTimer = setTimeout(function repeat() {
        if (!locked || !lockToneUsesPulse()) { lockPulseTimer = null; return; }
        playLockPulse();
        lockPulseTimer = setTimeout(repeat, 2000);
    }, 2000);
}

function stopLockPulse() {
    if (!lockPulseTimer) return;
    clearTimeout(lockPulseTimer);
    lockPulseTimer = null;
}

var lockToneKindPlaying = null;   // SPEC 3.69: which kind is actually live, to catch a door flip mid-lock
function startLockTone() {
    var kind = lockToneKind();
    lockToneKindPlaying = kind;
    if (kind === 'pulse') startLockPulse();
    else if (kind === 'shielded') startSolidTone(CFG.lockToneVol, CFG.shieldedLockTremoloHz);
    else startSolidTone(kind === 'poi' ? CFG.lockTonePoiVol : CFG.lockToneVol);
}
function stopLockTone() { lockToneKindPlaying = null; stopLockPulse(); stopSolidTone(); }

function scheduleTick() {
    clearTimeout(tick.timer);
    tick.timer = setTimeout(tickBeat, 120);
}

function tickBeat() {
    if (!running || over() || help.open || map.open || menuOpen || warping || docked || hailMenu.open) { tick.timer = setTimeout(tickBeat, 250); return; }
    var t = targets[selected];
    if (!t || !t.alive) { tick.timer = setTimeout(tickBeat, 250); return; }
    // SPEC 3.27: no tick at all while the sensor is fully dark.
    // SPEC 3.62: the shadow's own silent legs reuse this exact rule,
    // scoped to just t.dark rather than the real shipSystems.sensor —
    // flipping the real sensor would wrongly show it broken in F2/I.
    if (systemState('sensor') === 'off' || t.dark) { tick.timer = setTimeout(tickBeat, 400); return; }
    // SPEC 3.63: inside the nebula, the tick doubles its interval too —
    // same scoped insideNebula() check as zoneRad()'s own sensorMult.
    var sensorSlow = (systemState('sensor') === 'half' || insideNebula()) ? 2 : 1;   // "tick slower"
    var a = aim(t.pos);
    var interval;
    if (locked && lockToneKind() === 'poi') {
        // ideas6: locked on a point of interest, the soft tone says
        // "locked" and the ticks keep steering — a steady cadence, still
        // pitched by elevation and panned by azimuth.
        var ppan = clamp(Math.sin(a.azimuth) * 1.5, -1, 1);
        SIM.audio.blip(tickFreqFor(a.elev), 45, 0.11, ppan, 'square');
        interval = CFG.tickLockedMs * sensorSlow;
    } else if (locked) {
        // Solid tone (or the 2 s pulse) carries the locked state; the
        // scheduler just idles.
        interval = 200 * sensorSlow;
    } else if (a.err > CFG.tickArc) {
        // Searching: soft slow tock, out of the tracking arc.
        SIM.audio.blip(260, 60, 0.06, 0, 'sine');
        interval = 1000 * sensorSlow;
    } else {
        var z = zoneRad();
        var span = CFG.tickArc - z.lockOff;
        var frac = clamp((a.err - z.lockOff) / span, 0, 1);
        interval = (CFG.tickFast + (CFG.tickSlow - CFG.tickFast) * frac) * sensorSlow;
        var pan = clamp(Math.sin(a.azimuth) * 1.5, -1, 1);
        SIM.audio.blip(tickFreqFor(a.elev), 45, 0.11, pan, 'square');
    }
    tick.timer = setTimeout(tickBeat, interval);
}

// ============================== 6. TARGETING ================================
function aliveTargets() { return targets.filter(function (t) { return t.alive; }); }
function aliveRocks()   { return targets.filter(function (t) { return t.alive && t.kind === 'rock'; }); }

function selectNearest() {
    var best = -1, bestD = Infinity;
    targets.forEach(function (t, i) {
        // SPEC 2.17: a mission's friendly isn't Tab-cycled by default —
        // it's who you're protecting, not something to select and shoot.
        // SPEC 3.55: EXCEPT the distress call's own derelict (tractorable),
        // which is the one friendly the pilot actually needs to select and
        // aim the tractor at — see the note on makeDistressRoster.
        // SPEC 3.61: mines are never selectable either — each one's own
        // passive proximity tick (updateMinefield) carries the bearing
        // instead, with no lock/Tab needed; only the exit beacon (kind
        // 'poi') is a real target here.
        if (!t.alive || (t.kind === 'friendly' && !t.tractorable) || t.kind === 'mine') return;
        var d = len(sub(t.pos, ship.pos));
        if (d < bestD) { bestD = d; best = i; }
    });
    selected = best;
    locked = false;
    stopLockTone();
}

// dir +1 (Tab) steps outward through the nearest-first order, -1 (Shift+T,
// Shift+Tab) steps back the other way.
function cycleTarget(dir) {
    dir = dir || 1;
    // SPEC 3.41: course gates are never Tab-cycled — the active gate is
    // chosen for the pilot, in order, same reason friendlies are excluded.
    // SPEC 3.55: the distress call's own tractorable derelict is the one
    // exception — see selectNearest's own matching note.
    // SPEC 3.61: mines are excluded the same way, see selectNearest.
    var alive = targets.map(function (t, i) { return (t.alive && (t.kind !== 'friendly' || t.tractorable) && t.kind !== 'mine' && t.poiType !== 'course') ? i : -1; })
                       .filter(function (i) { return i >= 0; });
    if (!alive.length) { say('No targets remain.'); return; }
    // Nearest-first order, stepping from the current selection.
    alive.sort(function (x, y) {
        return len(sub(targets[x].pos, ship.pos)) - len(sub(targets[y].pos, ship.pos));
    });
    var at = alive.indexOf(selected);
    selected = at < 0 ? alive[dir > 0 ? 0 : alive.length - 1]
                      : alive[(at + dir + alive.length) % alive.length];
    locked = false;
    stopLockTone();
    lastCycleAt = Date.now();
    say(bearingText(targets[selected]));
}

function bearingText(t) {
    var a = aim(t.pos);
    var az = round5(Math.abs(deg(a.azimuth)));
    var el = round5(Math.abs(deg(a.elev)));
    var bits = [];
    bits.push(az === 0 ? 'Centered' : 'Bearing ' + az + (a.azimuth >= 0 ? ' right' : ' left'));
    if (el >= 5) bits.push(el + (a.elev >= 0 ? ' high' : ' low'));
    if (a.facing < -0.2) bits.push('behind');
    var line = t.name;
    if (t.kind === 'rock') {
        // No hull reading for rocks — stage thresholds stay hidden.
        line += t.resource ? ', mineable core' : ', ' + ROCK_SIZES[t.size].label + ' asteroid';
    } else if (t.kind === 'dust') {
        line += ', dust field, about ' + round10(t.amount) + ' units';
    } else if (t.kind === 'poi') {
        line += ', ' + t.desc;
    }
    line += '. ' + bits.join(', ') + '. Distance ' + round10(a.dist) + '.';
    if (!t.kind) line += ' Hull ' + hullPercent(t) + ' percent.' + (t.doorUp ? ' Shielded.' : '');
    return line;
}

// ---- auto-target (SPEC 3.38, ideas10.txt) ----------------------------------
// Brian's problem, verbatim: "i just did a combat mission where i just could
// not get the cruiser targetted." Shift+T hands the stabilizers the selected
// target — steers the nose onto it, then holds through a few seconds of
// continued tracking so a moving/orbiting target's lock actually lands.
// Never fires, never damages; not standard gear, from a limited pool.
function angleDiff(a, b) {
    var d = b - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
}
function angleTowards(current, target, maxStep) {
    var d = angleDiff(current, target);
    if (d > maxStep) d = maxStep; else if (d < -maxStep) d = -maxStep;
    return current + d;
}
// Tier 0 = not fitted at all. CFG.autoTargetTestFit (the tractor's own
// pattern, SPEC 3.30) gives everyone tier 3 for free until Brian has flown
// it; after that, owning auto_target_1/2/3 (each requiring the one below)
// is the only way. Deliberately NOT read through moduleCfgOverlay — which
// tier is owned decides WHICH of the three worst-case times applies, not a
// flat CFG override.
function autoTargetTier() {
    if (CFG.autoTargetTestFit) return 3;
    var owned = ownedModules();
    if (owned.indexOf('auto_target_3') >= 0) return 3;
    if (owned.indexOf('auto_target_2') >= 0) return 2;
    if (owned.indexOf('auto_target_1') >= 0) return 1;
    return 0;
}
function autoTargetFitted() { return autoTargetTier() > 0; }
// Worst case = 180 deg of yaw or the pitch clamp, whichever is larger
// (180 always wins today), moved at once — Brian: the fastest tier should
// take 2 seconds from directly behind at max pitch.
function autoTargetRateRadPerS() {
    var tier = autoTargetTier();
    if (!tier) return 0;
    return Math.max(Math.PI, CFG.pitchLimit) / CFG.autoTargetWorstTiers[tier - 1];
}

function autoTargetHum(on) {
    if (!SIM.audio.ctx) return;
    if (on && !autoTargetNodes) {
        var g = SIM.audio.ctx.createGain(); g.gain.value = 0.0001;
        var o = SIM.audio.ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 180;
        o.connect(g); g.connect(SIM.audio.uiBus);
        o.start();
        autoTargetNodes = { g: g, osc: o };
        SIM.audio.ramp(g.gain, 0.08, 0.15);
    } else if (!on && autoTargetNodes) {
        var n = autoTargetNodes; autoTargetNodes = null;
        SIM.audio.ramp(n.g.gain, 0.0001, 0.2);
        setTimeout(function () { try { n.osc.stop(); n.g.disconnect(); } catch (e) {} }, 300);
    }
}

function releaseAutoTarget(silent) {
    if (!autoTarget) return;
    autoTarget = null;
    autoTargetHum(false);
    if (!silent) say('Auto-target released.');
}

function autoTargetKey() {
    if (mode === 'sector') { SIM.cues.play('refusal_offline'); say('Nothing to aim at in open space.'); return; }
    // SPEC 3.41: the flight course is flown by hand — that's the point.
    // SPEC 3.61: the minefield has nothing to aim at anyway (mines aren't
    // selectable — see selectNearest), same refusal.
    // SPEC 3.62: the shadow is manual tracking practice — auto-target
    // would just do the one thing it exists to train.
    if (mode === 'course' || mode === 'minefield' || mode === 'shadow') { SIM.cues.play('refusal_offline'); say('Fly the course yourself — auto-target is off here.'); return; }
    var t = targets[selected];
    if (!t || !t.alive) { say('No target selected.'); return; }
    if (!autoTargetFitted()) { SIM.cues.play('refusal_offline'); say('Auto-target not fitted.'); return; }
    if (autoTarget) { say('Auto-target already engaged.'); return; }
    if (autoTargetCharges <= 0) {
        SIM.cues.play('refusal_dud');
        say('No auto-target charges. The station refills them.');
        return;
    }
    autoTargetCharges--;
    autoTarget = { holding: false, holdRemaining: CFG.autoTargetHoldS };
    autoTargetHum(true);
    say('Auto-target engaged, ' + autoTargetCharges + ' left.');
}

// Called from simTick right after the manual arrow-key handling, only
// while engaged — a held arrow this same frame releases it at once (the
// pilot always wins) with the charge already spent. Keeps steering through
// the whole hold, not just the initial slew, so a moving target (the
// orbiting Cruiser that started this) doesn't slip back out once aimed.
function updateAutoTarget(dt) {
    if (!autoTarget) return;
    if (keysDown.arrowleft || keysDown.arrowright || keysDown.arrowup || keysDown.arrowdown) {
        releaseAutoTarget(true);
        return;
    }
    var t = targets[selected];
    if (!t || !t.alive) { releaseAutoTarget(true); return; }
    var dir = norm(sub(t.pos, ship.pos));
    var targetYaw = Math.atan2(dir.x, -dir.z);
    var targetPitch = clamp(Math.asin(clamp(dir.y, -1, 1)), -CFG.pitchLimit, CFG.pitchLimit);
    var maxStep = autoTargetRateRadPerS() * dt;
    ship.yaw = angleTowards(ship.yaw, targetYaw, maxStep);
    ship.pitch = angleTowards(ship.pitch, targetPitch, maxStep);
    if (!autoTarget.holding) {
        if (Math.abs(aim(t.pos).err) < CFG.autoTargetAimToleranceRad) autoTarget.holding = true;
    } else {
        autoTarget.holdRemaining -= dt;
        if (autoTarget.holdRemaining <= 0) releaseAutoTarget(false);
    }
}

// Lock hysteresis + per-target front/back lowpass, run every frame.
function updateTargeting(dt) {
    targets.forEach(function (t) {
        if (!t.alive || !t.nodes || !t.nodes.lp) return;   // dust has no filter
        var a = aim(t.pos);
        // Behind-the-hull muffling: cutoff tracks dot(forward, dir).
        var f = clamp((a.facing + 1) / 1.2, 0, 1);
        var cutoff = CFG.lpMin + (CFG.lpMax - CFG.lpMin) * f;
        if (t.kind === 'poi') {
            // Distance haze: far beacons are muffled as well as quiet, the
            // strongest "that is far away" cue human ears know. Full
            // brightness inside 1,000; ~1.3 kHz at 7,000; ~600 Hz at 11,000.
            var haze = 20000 * Math.pow(1000 / Math.max(a.dist, 1000), 1.4);
            cutoff = Math.min(cutoff, clamp(haze, 500, CFG.lpMax));
            // Beacon mode (SPEC 1.12, in the Sound menu as of SPEC 3.45):
            // on / off / selected target only. SPEC 3.41's course gates
            // ignore it entirely — their own volume ladder (courseGainFor)
            // is the only thing driving this mute.
            if (t.nodes.mute && SIM.audio.ctx) {
                var muteTarget = t.poiType === 'course' ? courseGainFor(t) : (beaconAudible(t) ? 1 : 0);
                t.nodes.mute.gain.setTargetAtTime(muteTarget, SIM.audio.ctx.currentTime, 0.15);
            }
            // Phase 3L, L.9: the gate's lighthouse beam sweeps a full turn
            // every gateSweepS, independent of the listener — loud when it
            // points at you, faint (never silent) when it doesn't.
            if (t.poiType === 'gate' && dt) {
                t.gatePhase = ((t.gatePhase || 0) + (360 / CFG.gateSweepS) * dt) % 360;
                var rad = t.gatePhase * Math.PI / 180;
                SIM.audio.setOrientation(t.nodes.panner, Math.sin(rad), 0, -Math.cos(rad));
            }
        }
        t.nodes.lp.frequency.setTargetAtTime(cutoff, SIM.audio.ctx ? SIM.audio.ctx.currentTime : 0, 0.1);
    });
    var t = targets[selected];
    if (!t || !t.alive) return;
    // SPEC 3.27: an offline sensor can't hold (or acquire) a lock at all —
    // Tab/T still work (they don't touch `locked`), only the lock tone
    // and tick go dark.
    // SPEC 3.62: the shadow's own silent legs reuse this exact rule (see
    // tickBeat's matching note) rather than touching the real sensor.
    if (systemState('sensor') === 'off' || t.dark) {
        if (locked) { locked = false; stopLockTone(); SIM.cues.play('lock_lost'); }
        return;
    }
    // SPEC 3.69: a capital turret's own door can flip open/closed while
    // it's ALREADY locked — the tone otherwise only re-evaluates on a
    // fresh lock acquire, which would leave a stale "shielded" tremolo
    // playing after the door opens (or vice versa) until the lock happens
    // to drop and re-land. `t.doorUp !== undefined` is only ever true for
    // a capital turret, so this is a no-op for every other target kind.
    if (locked && t.doorUp !== undefined && lockToneKind() !== lockToneKindPlaying) {
        stopLockTone();
        startLockTone();
    }
    var a = aim(t.pos);
    var z = zoneRad();
    if (!locked && a.err < z.lockOn) {
        locked = true;
        SIM.cues.play('lock_acquired');
        startLockTone();
        // The tick has walked the pilot onto the target; the one number that
        // matters now is how far away it is (laser reach, missile flight).
        if (Date.now() - lastCycleAt > 1500) say('Locked. Distance ' + round10(a.dist) + '.');
    } else if (locked && a.err > z.lockOff) {
        locked = false;
        stopLockTone();
        SIM.cues.play('lock_lost');
    }
}

// ============================== 7. WEAPONS ==================================
// `extra` (SPEC 2.15) is a short line — e.g. a salvage gain — to prepend to
// whichever message this kill ends up producing. It can't just be its own
// say() call before this one: say() only sets textContent, and two
// synchronous writes in the same tick collapse into one DOM mutation, so a
// screen reader (and anything else watching the live region) only ever
// perceives the LAST one. The immediate "target destroyed" line is built by
// the caller (damageTarget) for the same reason; this function only needs
// to thread `extra` through to its own delayed victory line.
function destroyTarget(t, extra) {
    t.alive = false;
    SIM.cues.play('explosion_kill', { pos: t.pos, size: shipExplosionSize(t.name) });
    stopVoice(t);
    if (targets[selected] === t) selectNearest();
    if (threat && threat.t === t) endThreat();
    // SPEC 2.17: a mission's win/loss is its own wave-count/timer logic
    // (updateMission/missionEnd), not "every target in the array is dead"
    // — the friendly stays in `targets` and alive throughout, so this
    // generic check would never fire for escort (whose win condition is
    // the leg timer) and would fire too early for defend (right after any
    // single wave, before the next one spawns) if left in charge here.
    // SPEC 3.71: one kill counter for the board's own "cleared" column —
    // t.kind is falsy only for combat ships, so this never counts the
    // friendly itself (kind: 'friendly') dying.
    if (mission) { if (!t.kind) mission.cleared = (mission.cleared || 0) + 1; return false; }
    var left = aliveTargets().length;
    if (left === 0) {
        won = true;
        shieldReset();
        // SPEC 3.69: every turret down — the parent breaks up on its own,
        // a real explosion at capital.pos on top of (not instead of) each
        // turret's own kill sound already played above. Its own tail, not
        // the demo/contract/zone-clear text below, none of which applies
        // to a standalone drill with no sectorHome anyway.
        if (capital) {
            var capPos = capital.pos;
            // SPEC 3.71: captured now, not read inside the timeout below —
            // `capital` itself is about to be nulled by clearMission() if
            // the player retries or leaves before that timeout fires.
            var capSeconds = Math.round(capital.elapsed), capRefused = capital.refused;
            recordRun('capital', { seconds: capSeconds, hull: Math.round(hull), refused: capRefused });
            setTimeout(function () { SIM.cues.play('explosion_kill', { pos: capPos, size: 'capital' }); }, 400);
            setTimeout(function () {
                openDebrief('The capital ship breaks apart',
                    [ (extra || '') + 'Last turret down. Time ' + fmtTime(capSeconds) + '.',
                      'Your hull ' + Math.round(hull) + ' percent.',
                      capRefused + (capRefused === 1 ? ' shot refused by a closed door.' : ' shots refused by a closed door.') ],
                    'Enter plays again, X for the mission menu.');
            }, 900);
            return true;
        }
        // SPEC 3.33 (Brian, ideas9/10 — reverses 3.23's own retirement of
        // this): clearing a sector-entered Contested Zone pays favor at
        // the nearest station, same as a mission — Brian's "stranger
        // gate," one combat win is enough to reach Known outright — and,
        // the first time it happens in a quadrant, opens QUADRANT-WIDE
        // comms there (hail any station from anywhere in it). Gated on
        // sectorHome (entered from the open quadrant) so a standalone
        // Combat-training drill — no sectorHome, no real "quadrant"
        // context — doesn't feed it; the demo's own fixed sector never
        // runs favor at all regardless. Folded into the one deferred
        // say() below, never a second call.
        var zoneClearNote = '';
        if (!demo && sectorHome) {
            var nearestPort = nearestStationTo(sectorHome.pos);
            if (nearestPort) gainFavor({ name: nearestPort.name }, CFG.favorZoneClear);
            var zq = currentQuadrant();
            if (zq && !zq.openComms) {
                zq.openComms = true;
                saveProfile();
                zoneClearNote = 'Quadrant-wide comms open — hail any station from anywhere here.';
            }
        }
        setTimeout(function () { SIM.cues.play('win_fanfare'); }, 400);
        setTimeout(function () {
            // SPEC 3.70: split into the shared debrief shell — the demo/
            // contract branches keep their own "Next: ..." step (this
            // combat encounter is just a leg of a longer run, so there is
            // no Enter-retry to mention, only X back to the sector); the
            // generic branch (a standalone drill, or the open quadrant's own
            // Contested Zone) reads hull/missiles until 3.71 lands a clock.
            var headline = (extra || '') + 'All targets destroyed.';
            var opener = 'Victory', lines, options;
            if (demo && !demo.combatCleared) {
                demo.combatCleared = true;
                opener = 'Contested Zone cleared';
                lines = [ headline, 'Clock ' + fmtTime(demo.elapsed) + '.',
                          'Next: mine ' + CFG.demoOreGoal + ' ore at Asteroid Field Kappa.' ];
                options = 'X returns to the sector.';
            } else if (contract && !contract.combatCleared) {
                // SPEC 3.28: the same zone-clear the demo checks for, but for
                // the quadrant's own timed contract instead — mining itself
                // stays unblocked in the open quadrant either way (unlike the
                // demo's fixed sector), so this only gates the eventual
                // delivery, not the mining trip itself.
                contract.combatCleared = true;
                opener = 'Contested Zone cleared';
                lines = [ headline, 'Contract clock ' + fmtTime(contract.elapsed) + '.',
                          'Next: mine ' + CFG.demoOreGoal + ' ore at any field and deliver it to Station Meridian.' ];
                options = 'X returns to the sector.';
            } else if (combatState) {
                // SPEC 3.71: the standalone drill's own board — headline is
                // time to clear (never a real Contested Zone; combatState
                // is only ever set for startMission('combat'), not the
                // sectorHome path, which has no board of its own).
                var accuracyPct = combatState.shotsFired > 0
                    ? Math.round(combatState.shotsLanded / combatState.shotsFired * 100) : 0;
                recordRun('combat', { seconds: Math.round(combatState.elapsed), hull: Math.round(hull),
                                       missilesUsed: CFG.missileMax - missiles, accuracy: accuracyPct });
                lines = [ headline + ' Time ' + fmtTime(combatState.elapsed) + '.',
                          'Your hull ' + Math.round(hull) + ' percent.',
                          'Missiles used: ' + (CFG.missileMax - missiles) + ' of ' + CFG.missileMax + '.',
                          'Accuracy ' + accuracyPct + ' percent.' ];
                options = 'Enter plays again, X for the mission menu.';
            } else {
                lines = [ headline, 'Your hull ' + Math.round(hull) + ' percent.',
                          'Missiles remaining ' + missiles + '.' ];
                options = 'Enter plays again, X ' + (sectorHome ? 'to return to the sector.' : 'for the mission menu.');
            }
            if (zoneClearNote) lines.push(zoneClearNote);
            openDebrief(opener, lines, options);
        }, 900);
        return true;
    }
    return false;
}

function hullPercent(t) {
    return Math.max(0, Math.round(t.hp / t.maxHp * 100));
}

// Every ship is passive until the pilot hits it: the first hit makes it
// hostile for good (it joins the attack pool), with a short fuse so the
// retaliation never lands in the same breath as the hit.
function provoke(t) {
    // SPEC 2.17: in a mission, every raider already spawns hostile — this
    // flag is what actually flips a raider from "harassing the friendly"
    // to "fighting the player", unconditionally, even when the `hostile`
    // latch below is already true and short-circuits.
    t.provoked = true;
    if (t.hostile) return;
    t.hostile = true;
    threatIn = Math.max(threatIn, CFG.enemyProvokedS);
}

// Apply damage; returns true if the target died (kill speech handled here).
// Salvage (SPEC 2.15): every kill adds it by class. Ships have no `kind`
// field (rocks/dust/poi do), so !t.kind is this codebase's own "is a ship"
// check, same as the hostile-pool filters elsewhere. Silent on purpose —
// see destroyTarget's comment on why this can't be its own say() call.
function addSalvage(shipName) {
    if (!profile) return 0;
    var amt = SALVAGE[SHIP_CLASS[shipName] || 'corvette'] || 0;
    if (amt <= 0) return 0;
    profile.resources.salvage += amt;
    saveProfile();
    return amt;
}

// SPEC 3.32: reaction mass looted the same way salvage is, by class.
function addKillRcs(shipName) {
    var amt = RCS_PER_KILL[SHIP_CLASS[shipName] || 'corvette'] || 0;
    if (amt <= 0) return 0;
    addRcs(amt);
    return amt;
}

// SPEC 3.25: an instant, temporary reward on a ship kill (never rocks/
// dust/poi — the same !t.kind gate salvage uses just below). Independent
// rolls in a fixed order; the first that hits AND applies wins, so a kill
// can grant nothing as easily as one (see the CFG comment for why the
// three chances don't sum to 1). Returns a string ending in a space, or
// '' — folded into the SAME say() as the kill line by the caller, never
// its own (the SPEC 2.15 lesson: two say()s in one tick collapse to one).
function rollKillBuff() {
    if (Math.random() < CFG.killBuffMissileChance) {
        if (missiles < CFG.missileMax) {
            missiles++;
            return 'Missile recovered, ' + missiles + ' left. ';
        }
        return '';
    }
    if (Math.random() < CFG.killBuffLaserChance) {
        laserBoostUntil = Date.now() + CFG.killBuffLaserS * 1000;
        var deadline = laserBoostUntil;
        SIM.audio.sfxTone({ type: 'sine', f1: 500, f2: 1100, dur: 0.25, vol: 0.2 });
        setTimeout(function () {
            if (laserBoostUntil === deadline) say('Laser boost over.');
        }, CFG.killBuffLaserS * 1000 + 50);
        return 'Laser boost, ' + CFG.killBuffLaserS + ' seconds. ';
    }
    if (Math.random() < CFG.killBuffShieldChance) {
        if (shield.repairing > 0) {
            shield.repairing = Math.max(0, shield.repairing - 4);
            return 'Disrepair crew hurries. ';
        }
        if (shield.pool < shieldPoolMax()) {
            shield.pool = Math.min(shieldPoolMax(), shield.pool + CFG.killBuffShieldPts);
            return 'Shields plus ' + CFG.killBuffShieldPts + '. ';
        }
        return '';
    }
    // SPEC 3.38 (ideas10.txt): "it might be a buff of sorts" — a fight can
    // hand back an auto-target charge. Only if the ship can actually use
    // one (fitted, and not already at the cap).
    if (Math.random() < CFG.killBuffAutoTargetChance) {
        if (autoTargetFitted() && autoTargetCharges < CFG.autoTargetCharges) {
            autoTargetCharges++;
            return 'Auto-target charge recovered, ' + autoTargetCharges + ' left. ';
        }
        return '';
    }
    return '';
}

function damageTarget(t, dmg) {
    provoke(t);
    t.hp -= dmg;
    if (t.hp <= 0) {
        var name = t.name;
        var salvageGain = !t.kind ? addSalvage(name) : 0;
        var rcsGain = !t.kind ? addKillRcs(name) : 0;   // SPEC 3.32
        var salvageText = salvageGain ? 'Salvage plus ' + salvageGain +
            (rcsGain ? ', reaction mass plus ' + rcsGain + '. ' : '. ') : '';
        var buffText = !t.kind ? rollKillBuff() : '';
        var prefix = salvageText + buffText;
        var over = destroyTarget(t, prefix);
        if (!over) {
            // A mission's friendly (kind: 'friendly') never counts as a
            // "target remaining" in this readout — it isn't something to
            // destroy, and always-alive-forever would make the count
            // permanently off by one otherwise.
            var remain = mission ? aliveTargets().filter(function (x) { return !x.kind; }).length
                                  : aliveTargets().length;
            say(prefix + name + ' destroyed. ' + remain + ' targets remain.');
        }
        return true;
    }
    return false;
}

// ---- laser beam -------------------------------------------------------------
// The laser is a sustained two-second beam, not a snap shot. It ticks damage
// every half second, and each tick scales with how centered the selected
// target is AT THAT INSTANT relative to the current zone — so a drifting
// target gives different spoken damage numbers tick by tick. The beam's own
// carrier pitch rises and falls with the same quality, narrating your aim,
// and a vibrato LFO plus a noise shimmer keep the cue alive over its length.
var beam = null;   // { nodes, ticksLeft, totalDamage, timer }

// ---- laser slots ----------------------------------------------------------
function currentLaser() { return profile ? laserById(profile.slots[laserSlot]) : null; }
function capFirst(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function laserSlotText(i) {
    var L = profile ? laserById(profile.slots[i]) : null;
    return 'Slot ' + (i + 1) + (L ? ', ' + L.name : ' is empty');
}

// Seconds until slot i may fire again (0 = ready).
function laserCooldownLeft(i) {
    return Math.max(0, ((laserReadyAt[i] || 0) - Date.now()) / 1000);
}

// Seconds left on a slot switch in progress (0 = none).
function laserSwitchLeft() {
    return laserSwitch ? Math.max(0, (laserSwitch.until - Date.now()) / 1000) : 0;
}

function stopLaserSwitch() {
    if (!laserSwitch) return;
    var s = laserSwitch; laserSwitch = null;
    clearTimeout(s.timer);
    if (s.g) {
        SIM.audio.ramp(s.g.gain, 0.0001, 0.1);
        setTimeout(function () { try { s.src.stop(); s.g.disconnect(); } catch (e) {} }, 200);
    }
}

// SPEC 3.48: F2 is a frozen sim, so cycling a slot's level there has no
// real switch delay or refusal window — but the slot's own clip still
// plays, for the feel, at its own natural length (no playbackRate
// stretch, unlike startSlotSwitch below) and blocks nothing.
function playSlotSwitchClipNatural(i) {
    var sw = SLOT_SWITCH[i], A = SIM.audio;
    if (A.ctx && !A.assetBufs[sw.asset]) A.load(sw.asset);
    if (A.ctx && A.assetBufs[sw.asset]) {
        var src = A.ctx.createBufferSource(); src.buffer = A.assetBufs[sw.asset];
        var g = A.ctx.createGain(); g.gain.value = 0.5;
        src.connect(g); g.connect(A.uiBus);
        src.start();
    } else if (A.ctx) {
        A.sfxSweep({ f1: 300, f2: 900, f3: 500, dur: sw.s, vol: 0.12, type: 'sawtooth' });
    }
}

// Keys 1-6, Shift+1-6 (SPEC 2.12). Switching to another slot takes
// SLOT_SWITCH[i].s seconds: the slot's recording plays, stretched to fill
// exactly that window, Space is refused until it ends, then the laser
// announces itself. Re-selecting the current slot cycles to the next
// version in its family (Shift = previous) — same switch time and clip,
// since it takes the ship just as long to bring another version online.
// An empty slot refuses with no delay; a burst in progress refuses (it
// can't be stopped, SPEC 1.9).
function startSlotSwitch(i, L) {
    var sw = SLOT_SWITCH[i], secs = sw.s, A = SIM.audio, src = null, g = null;
    if (A.ctx && !A.assetBufs[sw.asset]) A.load(sw.asset);   // SPEC 2.19: kick off for next time
    if (A.ctx && A.assetBufs[sw.asset]) {
        var buf = A.assetBufs[sw.asset];
        src = A.ctx.createBufferSource(); src.buffer = buf;
        src.playbackRate.value = buf.duration / secs;      // stretch or shrink to the window
        g = A.ctx.createGain(); g.gain.value = 0.5;
        src.connect(g); g.connect(A.uiBus);
        src.start();
    } else if (A.ctx) {
        // Clip not decoded (or missing): a mechanical sweep the same length.
        A.sfxSweep({ f1: 300, f2: 900, f3: 500, dur: secs, vol: 0.12, type: 'sawtooth' });
    }
    laserSwitch = { slot: i, until: Date.now() + secs * 1000, src: src, g: g, timer: null };
    laserSwitch.timer = setTimeout(function () {
        if (!laserSwitch || laserSwitch.slot !== i) return;
        laserSwitch = null;
        if (!running) return;
        var left = laserCooldownLeft(i);
        SIM.cues.play('slot_select');
        say(capFirst(L.name) + (left > 0 ? ' recharging, ' + Math.ceil(left) + ' seconds.' : ' ready.'));
    }, secs * 1000);
    say(laserSlotText(i) + ', switching.');
}

// Cycles slot i's laser to the next (dir +1) or previous (dir -1) level
// within its family, wrapping 1..owned (SPEC 3.26 — levels are earned, so
// cycling can never reach a level the station hasn't sold yet), and writes
// it back into profile.slots.
function cycleLaserVersion(i, dir) {
    var L = laserById(profile.slots[i]);
    if (!L) return null;
    var owned = profile.laserLevels[L.family] || 1;
    var newVersion = ((L.version - 1 + dir + owned) % owned) + 1;
    var newId = L.family + newVersion;
    profile.slots[i] = newId;
    return laserById(newId);
}

// True (and speaks the refusal) if L is fitted above its family's owned
// level — shouldn't happen in normal play (wearLaser clamps a slot down
// the instant its level drops), kept as a defensive check per SPEC 3.26.
function laserUnowned(L) {
    if (!L) return false;
    var owned = profile.laserLevels[L.family] || 1;
    if (L.version <= owned) return false;
    SIM.cues.play('refusal_offline');   // SPEC 3.50: not fitted
    say(capFirst(LASER_FAMILIES_BY_ID[L.family].label) + ' laser level ' + L.version + ' is not fitted. The shipyard sells it.');
    return true;
}

function selectSlot(i, reverse) {
    var L = profile ? laserById(profile.slots[i]) : null;
    if (beam && beam.tool === 'laser') {
        SIM.cues.play('refusal_wait');   // SPEC 3.50: busy, resolves shortly
        say('Laser burst in progress, ' + Math.ceil(beamSecondsLeft()) + ' seconds. Switch after.');
        return;
    }
    if (i === laserSlot) {
        if (!L) { SIM.cues.play('refusal_offline'); say(laserSlotText(i) + '. Fit a laser at the station.'); return; }
        if (laserUnowned(L)) return;
        L = cycleLaserVersion(i, reverse ? -1 : 1);
        saveProfile();
        startSlotSwitch(i, L);
        return;
    }
    stopLaserSwitch();
    laserSlot = i;
    saveProfile();
    if (!L) { SIM.cues.play('refusal_offline'); say(laserSlotText(i) + '. Fit a laser at the station.'); return; }
    if (laserUnowned(L)) return;
    startSlotSwitch(i, L);
}

function laserStatusText() {
    var L = currentLaser();
    if (!L) return laserSlotText(laserSlot) + '. ';
    if (laserSwitch) return laserSlotText(laserSlot) + ', switching, ' + Math.ceil(laserSwitchLeft()) + ' seconds. ';
    var left = laserCooldownLeft(laserSlot);
    return laserSlotText(laserSlot) + (left > 0 ? ', recharging, ' + Math.ceil(left) + ' seconds. ' : ', ready. ');
}

// SPEC 3.26: every burst fired wears the family's owned level, hit or
// miss, regardless of which level within it is actually selected (Brian:
// a deliberately-lower level "wears the same per burst" — only the
// REPAIR price, not the wear rate, depends on which level is fitted).
// At zero health the owned level drops by one and resets to full — any
// slot still pointing at the level that just dropped comes down with it,
// same as the defensive clamp in loadProfile's v4 migration.
function wearLaser(famId) {
    if (!profile) return;
    var fam = LASER_FAMILIES_BY_ID[famId];
    var label = capFirst(fam.label) + ' laser';
    var before = profile.laserHealth[famId];
    var after = Math.max(0, before - CFG.laserWearPerBurst);
    profile.laserHealth[famId] = after;
    var announced = false;
    for (var i = 0; i < CFG.laserWearAlertPcts.length; i++) {
        var p = CFG.laserWearAlertPcts[i];
        if (before > p && after <= p) {
            say(label + ' at ' + (p === 50 ? 'half' : p + ' percent') + '.');
            announced = true;
            break;
        }
    }
    if (!announced && after <= 0) {
        var owned = profile.laserLevels[famId];
        if (owned > 1) {
            profile.laserLevels[famId] = owned - 1;
            profile.laserHealth[famId] = 100;
            profile.slots = profile.slots.map(function (id) {
                var L = laserById(id);
                return (L && L.family === famId && L.version >= owned) ? famId + (owned - 1) : id;
            });
            say(label + ' worn down to level ' + (owned - 1) + '.');
        }
    }
    saveProfile();
}

function beamQuality() {
    var t = targets[selected];
    if (!t || !t.alive) return 0;
    var a = aim(t.pos);
    if (a.dist > CFG.laserRange) return 0;
    return clamp(1 - a.err / zoneRad().laser, 0, 1);
}

// Point-blank bonus: x laserCloseMult at zero distance, x1 at laserRange.
// The reward for closing in — and the risk, since a close enemy's beam
// gives less warning than a far one's missile.
function laserRangeMult(dist) {
    return 1 + (CFG.laserCloseMult - 1) * clamp(1 - dist / CFG.laserRange, 0, 1);
}

// ---- laser overheat ---------------------------------------------------------
// Two zero-damage bursts inside the window and the laser is down for a few
// seconds. The cooldown is never silent: a venting hiss plus hot-metal pings
// that slow as it cools, then a ready chime.
function laserHot() { return Date.now() < laser.hotUntil; }

function laserMiss() {
    var now = Date.now();
    laser.misses = laser.misses.filter(function (t) { return now - t < CFG.laserMissWindowMs; });
    laser.misses.push(now);
    if (laser.misses.length < 2) return;
    laser.misses = [];
    laser.hotUntil = now + CFG.laserOverheatMs;
    var secs = CFG.laserOverheatMs / 1000;
    SIM.cues.play('laser_overheat', { dur: secs });
    setTimeout(function () {
        if (!running || mode === 'sector' || menuOpen) return;
        SIM.cues.play('ready_chime');
        say('Laser ready.');
    }, CFG.laserOverheatMs);
    say('Laser overheated. ' + secs + ' seconds to cool.');
}

// tool = 'laser' (default) or 'vac' (the ore extractor). Same machinery, two
// different sound builds: the laser is a bright wobbling saw with high
// shimmer; the extractor is a deep slow pulse with low rumbling suction.
function startBeam(tool) {
    tool = tool || 'laser';
    if (beam) return;                              // already firing (audible)
    var L = null;
    if (tool === 'laser') {
        if (shieldsBusy()) { SIM.cues.play('refusal_offline'); say('Shields up. Weapons offline. G drops them.'); return; }
        if (laserHot()) {
            SIM.audio.sfxNoise({ dur: 0.3, vol: 0.15, filter: 'highpass', freq: 2500 });
            say('Laser overheated. ' + Math.ceil((laser.hotUntil - Date.now()) / 1000) + ' seconds.');
            return;
        }
        L = currentLaser();
        if (!L) { SIM.cues.play('refusal_offline'); say(laserSlotText(laserSlot) + '. Fit a laser at the station.'); return; }
        if (systemState('laser' + laserSlot) === 'off') {
            SIM.cues.play('refusal_offline');
            say(systemName('laser' + laserSlot) + ' offline. Repair crew is on it.');
            return;
        }
        if (laserSwitch) {
            SIM.cues.play('refusal_wait');
            say('Switching lasers, ' + Math.ceil(laserSwitchLeft()) + ' seconds.');
            return;
        }
        var left = laserCooldownLeft(laserSlot);
        if (left > 0) {
            SIM.cues.play('refusal_wait');              // SPEC 3.50: recharging — temporary
            say(capFirst(L.name) + ' recharging, ' + Math.ceil(left) + ' seconds.');
            return;                                    // never a silent nothing
        }
    } else if (Date.now() - lastLaserAt < CFG.toolCooldownMs) {
        SIM.cues.play('refusal_wait');
        return;
    }
    if (L) wearLaser(L.family);   // SPEC 3.26: committed to firing — every burst wears, hit or miss
    // SPEC 3.71: the standalone Combat drill's own laser-accuracy counter —
    // counts the BURST, not the tick (a burst that lands one tick out of
    // five still counts as one landed shot, via beam.landedCounted below).
    if (L && combatState) combatState.shotsFired++;
    // SPEC 3.52: any beam tool (laser, extractor, vacuum) committing to fire
    // cuts an active tractor — silent, the hum stopping is already the
    // audible tell, no second say() competing with the firing announcement.
    if (tractor.active) stopTractor();
    var nodes = null;
    // A fitted laser's voice is its recording, played once through the
    // instrument bus. Aim quality nudges its playback rate a little each
    // tick (see beamTick) so a trace of the old pitch narration survives;
    // the synthesized carrier below is the fallback if the asset isn't
    // decoded (or for the E/V tools, which have no recording).
    if (L && SIM.audio.ctx && SIM.audio.assetBufs[L.asset]) {
        var ag = SIM.audio.ctx.createGain(); ag.gain.value = 0.0001;
        var asrc = SIM.audio.ctx.createBufferSource();
        asrc.buffer = SIM.audio.assetBufs[L.asset];
        asrc.connect(ag); ag.connect(SIM.audio.uiBus);
        asrc.start();
        SIM.audio.ramp(ag.gain, 0.5, 0.05);
        nodes = { g: ag, src: asrc, isAsset: true };
    } else if (L && SIM.audio.ctx) {
        SIM.audio.load(L.asset);   // not decoded yet: kick off the fetch, use the synth carrier this time
    }
    // Per-tool voices: laser = bright wobbling saw with high shimmer;
    // vac (E, core extractor) = deep fast pulse with low rumble;
    // dust (V, particulate vacuum) = airy slow breath with mid hiss.
    var P = tool === 'vac'  ? { type: 'sine', f: 140, lp: 900,  vibF: 9,   vibD: 25, shT: 'lowpass',  shF: 400,  shG: 0.05, vol: 0.14 }
          : tool === 'dust' ? { type: 'sine', f: 90,  lp: 600,  vibF: 4,   vibD: 15, shT: 'lowpass',  shF: 1200, shG: 0.07, vol: 0.13 }
          :                   { type: 'sawtooth', f: 900, lp: 2600, vibF: 6.5, vibD: 45, shT: 'highpass', shF: 3800, shG: 0.03, vol: 0.16 };
    if (!nodes && SIM.audio.ctx) {
        var g = SIM.audio.ctx.createGain(); g.gain.value = 0.0001;
        var lp = SIM.audio.ctx.createBiquadFilter(); lp.type = 'lowpass';
        lp.frequency.value = P.lp;
        var o = SIM.audio.ctx.createOscillator();
        o.type = P.type; o.frequency.value = P.f;
        var vib = SIM.audio.ctx.createOscillator(); vib.frequency.value = P.vibF;
        var vg = SIM.audio.ctx.createGain(); vg.gain.value = P.vibD;
        vib.connect(vg); vg.connect(o.frequency);
        var sh = SIM.audio.ctx.createBufferSource(); sh.buffer = SIM.audio.noiseBuf; sh.loop = true;
        var shf = SIM.audio.ctx.createBiquadFilter();
        shf.type = P.shT; shf.frequency.value = P.shF;
        var shg = SIM.audio.ctx.createGain(); shg.gain.value = P.shG;
        sh.connect(shf); shf.connect(shg); shg.connect(SIM.audio.uiBus);
        o.connect(lp); lp.connect(g); g.connect(SIM.audio.uiBus);
        o.start(); vib.start(); sh.start();
        SIM.audio.ramp(g.gain, P.vol, 0.06);
        nodes = { g: g, o: o, vib: vib, sh: sh, shg: shg };
    }
    beam = { tool: tool, nodes: nodes, laser: L, slot: laserSlot, tick: 0,
             ticksLeft: L ? L.ticks.length : 999,
             totalDamage: 0, timer: null };
    beam.timer = setTimeout(beamTick,
        tool === 'vac' ? CFG.vacTickMs : tool === 'dust' ? CFG.dustVacTickMs : L.tickS * 1000);
}

// Seconds of burst still to run (for the "can't stop it" refusals).
function beamSecondsLeft() {
    return beam && beam.laser ? beam.ticksLeft * beam.laser.tickS : 0;
}

function stopBeam(silent) {
    if (!beam) return;
    var b = beam; beam = null;
    clearTimeout(b.timer);
    lastLaserAt = Date.now();
    // The slot cools from whenever the burst ended, natural or interrupted.
    if (b.laser) laserReadyAt[b.slot] = Date.now() + b.laser.cooldownS * 1000;
    if (b.nodes && b.nodes.isAsset) {
        SIM.audio.ramp(b.nodes.g.gain, 0.0001, 0.15);
        setTimeout(function () { try { b.nodes.src.stop(); b.nodes.g.disconnect(); } catch (e) {} }, 300);
    } else if (b.nodes) {
        SIM.audio.ramp(b.nodes.g.gain, 0.0001, 0.1);
        SIM.audio.ramp(b.nodes.shg.gain, 0.0001, 0.1);
        setTimeout(function () {
            try { b.nodes.o.stop(); b.nodes.vib.stop(); b.nodes.sh.stop();
                  b.nodes.g.disconnect(); b.nodes.shg.disconnect(); } catch (e) {}
        }, 220);
    }
    if (!silent && b.tool === 'laser' && b.totalDamage === 0 && !b.saidDust) {
        if (!b.saidRange) { SIM.audio.blip(120, 150, 0.1, 0, 'sine'); say('Miss.'); }
        laserMiss();                               // out-of-range bursts heat it too
    }
}

function beamTick() {
    if (!beam) return;
    if (!running || menuOpen || help.open || over()) { stopBeam(true); return; }
    if (beam.tool === 'vac') { vacTick(); return; }
    if (beam.tool === 'dust') { dustTick(); return; }
    var t = targets[selected];
    var L = beam.laser;
    var q = beamQuality();
    var base = L.ticks[beam.tick];      // this tick's slot in the laser's damage profile
    // SPEC 3.27: a half-broken slot bites for half damage (an offline one
    // already refused to fire back in startBeam, so beamTick never sees it).
    var slotMult = systemState('laser' + beam.slot) === 'half' ? CFG.repairLaserDmgPct : 1;
    var dmg = Math.ceil(base * q * slotMult *
                        (t && t.alive ? laserRangeMult(aim(t.pos).dist) : 1) *
                        (laserBoostActive() ? (1 + CFG.killBuffLaserPct) : 1));
    if (beam.nodes && beam.nodes.isAsset) {
        // The recording's rate narrates aim quality, gently.
        SIM.audio.ramp(beam.nodes.src.playbackRate, 0.92 + 0.16 * q, 0.15);
    } else if (beam.nodes) {
        // The carrier pitch narrates the same quality the number reports.
        SIM.audio.ramp(beam.nodes.o.frequency, 700 + 700 * q, 0.15);
    }
    // Aimed true but out of reach: say so once, instead of a mystery miss.
    if (t && t.alive) {
        var reach = aim(t.pos);
        if (reach.err < zoneRad().laser && reach.dist > CFG.laserRange && !beam.saidRange) {
            beam.saidRange = true;
            SIM.audio.blip(180, 220, 0.12, 0, 'square');
            say('Out of range. Distance ' + round10(reach.dist) + ', the laser reaches ' +
                CFG.laserRange + '. Thrust closer.');
        }
    }
    if (dmg > 0 && t && t.alive) {
        if (t.kind === 'dust') {
            // Nothing solid to cut. Say so once, then just scorch.
            if (!beam.saidDust) {
                beam.saidDust = true;
                say('The laser passes through the dust. Get close and vacuum it with V.');
            } else {
                SIM.audio.blip(140, 90, 0.06, 0, 'sine');
            }
        } else if (t.kind === 'rock') {
            // Hidden hardness roll obscures the stage threshold, and every
            // tick shoves the rock along the beam line.
            var actual = Math.ceil(dmg * laserMatchupMult(L, t) * t.type.hardness * (0.7 + Math.random() * 0.6));
            beam.totalDamage += actual;
            pushRock(t, scale(norm(sub(t.pos, ship.pos)), CFG.beamPush * rockPush(t)));
            if (t.resource) { shatterCore(t); stopBeam(true); return; }
            // Every bite of the laser sheds particulates where the rock is.
            addDebris(t.pos, actual * CFG.debrisPerDamage);
            t.hp -= actual;
            if (t.hp <= 0) { rockEvent(t); return; }   // rockEvent stops the beam
            say(String(actual));
        } else if (t.doorUp) {
            // SPEC 3.69: a capital turret behind its own shield door — the
            // one refusal that ISN'T an offline buzz, since this is
            // combat feedback, not a mode/capability mismatch.
            if (capital) capital.refused++;   // SPEC 3.71
            SIM.cues.play('shield_splash');
            say('Shielded.');
        } else {
            // SPEC 1.20: Rookie doubles laser damage against ships (not
            // rocks) via CFG.laserShipMult, so the spoken number reflects it.
            dmg = Math.ceil(dmg * laserMatchupMult(L, t) * CFG.laserShipMult);
            beam.totalDamage += dmg;
            // SPEC 3.71: one landed shot per BURST, not per tick.
            if (combatState && !beam.landedCounted) { beam.landedCounted = true; combatState.shotsLanded++; }
            if (damageTarget(t, dmg)) { stopBeam(true); return; }
            say(String(dmg));
        }
    } else {
        SIM.audio.blip(140, 90, 0.06, 0, 'sine');       // scorching empty space
    }
    beam.tick++;
    beam.ticksLeft--;
    if (beam.ticksLeft <= 0) stopBeam(false);
    else beam.timer = setTimeout(beamTick, L.tickS * 1000);
}

// One extractor tick: recheck the hold conditions, then pull ore. The
// carrier pitch sinks as the core empties, narrating progress.
// SPEC 3.10: every ore gain against a QUADRANT field (never Kappa or the
// standalone drill, both fieldless) counts against its budget. Not saved
// here — mid-encounter never saves (returnToSector's own transition save
// picks up the new total the moment this visit ends).
function depleteCurrentField(amount) {
    if (demo || mode !== 'mining' || !sectorHome) return;
    var q = currentQuadrant();
    var f = q && q.fields.filter(function (x) { return x.name === sectorHome.poiName; })[0];
    if (f) f.budget -= amount;
}

function vacTick() {
    var t = targets[selected];
    if (!t || !t.alive || !t.resource) { stopBeam(true); say('Extraction interrupted.'); return; }
    var a = aim(t.pos);
    if (a.dist > CFG.vacRange || a.err > CFG.vacArc) {
        stopBeam(true);
        say('Extraction lost. Stay close and centered on the core.');
        return;
    }
    var amount = Math.min(t.oreLeft, 300 + Math.floor(Math.random() * 300));
    t.oreLeft -= amount;
    ore += amount;
    oreGained();
    depleteCurrentField(amount);
    // Gentle tractor pull so the core drifts toward the ship, not away.
    pushRock(t, scale(norm(sub(ship.pos, t.pos)), 2));
    if (beam.nodes) SIM.audio.ramp(beam.nodes.o.frequency, 100 + 120 * (t.oreLeft / t.type.ore), 0.2);
    if (t.oreLeft <= 0) {
        stopBeam(true);
        t.alive = false;
        stopVoice(t);
        SIM.audio.blip(900, 200, 0.15, 0, 'sine');
        // SPEC 2.15: ice and iron cores carry a second yield alongside ore —
        // reaction mass and alloy respectively. Stone has none (a plain
        // ore-only rock, the middle option 2.12's matchup table also uses).
        var bonus = '';
        if (t.type.name === 'Ice') {
            addRcs(CFG.rcsPerIceCore);
            bonus = ' Reaction mass plus ' + CFG.rcsPerIceCore + '.';
        } else if (t.type.name === 'Iron') {
            profile.resources.alloy += CFG.alloyPerIronCore;
            saveProfile();
            bonus = ' Alloy plus ' + CFG.alloyPerIronCore + '.';
        }
        say('Core depleted. Ore hold ' + ore + '.' + bonus);
        if (targets[selected] === t) selectNearest();
        if (miningState) miningState.cores++;   // SPEC 3.71: the standalone drill's own board
        checkMiningEnd();
        return;
    }
    say(String(amount));       // the gain this tick; I reports the full hold
    beam.timer = setTimeout(beamTick, CFG.vacTickMs);
}

// One vacuum tick: filter dust from the nearest field within range of the
// SHIP (no aiming — it cleans the neighborhood). Runs until the area is
// clear or the pilot drifts out of range of any remaining dust.
function dustTick() {
    // SPEC 3.74: the corona reuses this exact tool (V, no aim) for a
    // completely different resource — hydrogen, ship-relative to the
    // star at the origin, scaled by closeness rather than drawn from a
    // debris field. Branches away before any of the ordinary dust-field
    // logic below, which would find no debris here and misfire
    // checkMiningEnd() as "cloud cleared."
    if (corona) {
        var cdist = len(ship.pos);
        if (cdist > CFG.starHarvestDist) {
            stopBeam(true);
            say('Out of harvest range. Fly within ' + CFG.starHarvestDist + ' of the star. Distance ' + round10(cdist) + '.');
            return;
        }
        var hAmount = Math.round(CFG.starHydrogenPerTick * starHarvestMult(cdist));
        profile.resources.hydrogen += hAmount;
        saveProfile();
        say(String(hAmount));
        beam.timer = setTimeout(beamTick, CFG.dustVacTickMs);
        return;
    }
    var f = null, best = CFG.dustVacRange;
    debris.forEach(function (d) {
        var dd = len(sub(d.pos, ship.pos));
        if (dd < best) { best = dd; f = d; }
    });
    if (!f) {
        stopBeam(true);
        if (debrisTotal() === 0 && aliveTargets().length === 0) { checkMiningEnd(); return; }
        say(debrisTotal() > 0
            ? 'No more dust within range. Ore hold ' + ore + '.'
            : 'Area filtered clean. Ore hold ' + ore + '.');
        return;
    }
    var amount = Math.min(f.amount, 150 + Math.floor(Math.random() * 250));
    f.amount -= amount;
    ore += amount;
    oreGained();
    // SPEC 3.32: a silent trickle of reaction mass with every dust pull —
    // checked on F3, not spoken per tick (it's fractions of a unit at a
    // time; naming it here every couple of seconds would just be noise
    // on top of the ore count this line already reads).
    addRcs(amount * CFG.rcsPerDustUnit);
    depleteCurrentField(amount);
    updateDustVolume(f);
    if (f.amount <= 0) removeDust(f);
    say(String(amount));
    beam.timer = setTimeout(beamTick, CFG.dustVacTickMs);
}

function fireMissile() {
    if (missile) { say('Missile already away.'); return; }
    if (shieldsBusy()) { SIM.cues.play('refusal_offline'); say('Shields up. Weapons offline. G drops them.'); return; }
    if (systemState('missiles') === 'off') {
        SIM.cues.play('refusal_offline');
        say('Missiles offline. Repair crew is on it.');
        return;
    }
    if (missiles <= 0) {
        SIM.cues.play('refusal_dud');   // SPEC 3.50: spent, matches "no decoys left"
        say('No missiles left.' + (sectorHome ? ' Station Meridian rearms.' : ''));
        return;
    }
    var t = targets[selected];
    if (!t || !t.alive) { say('No target selected.'); return; }
    if (t.kind === 'dust') { say('Missiles cannot lock onto dust. V vacuums it up.'); return; }
    var a = aim(t.pos);
    if (a.err > zoneRad().missile) {
        say('No lock. Missile needs the target inside ' +
            ZONES[zoneIdx].missile + ' degrees.');
        return;
    }
    // The missile is a real world object with its own HRTF voice - hearing it
    // fly away and converge on the target's hum is the demo's best showcase.
    // SPEC 3.27: a half-broken missile system launches — and flies, the
    // whole way, since steerToward re-normalizes every guided frame — at
    // half speed. Stored on the missile itself so the flight stays
    // consistent even if the system finishes repairing mid-flight.
    var mSpeed = CFG.missileSpeed * (systemState('missiles') === 'half' ? CFG.repairMissileSpeedPct : 1);
    var m = {
        target: t,
        pos: v3(ship.pos.x, ship.pos.y, ship.pos.z),
        vel: scale(shipForward(), mSpeed),
        speed: mSpeed,
        age: 0,
        guided: true, outCone: 0, coast: 0
    };
    missiles--;
    if (SIM.audio.ctx) {
        var g = SIM.audio.ctx.createGain(); g.gain.value = 0.22;
        var p = SIM.audio.makePanner(m.pos);
        g.connect(p); p.connect(SIM.audio.worldBus);
        var o = SIM.audio.ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 300;
        var lg = SIM.audio.ctx.createGain(); lg.gain.value = 0.11;
        var lo = SIM.audio.ctx.createOscillator(); lo.frequency.value = 12;
        lo.connect(lg); lg.connect(g.gain);
        o.connect(g); o.start(); lo.start();
        m.nodes = { g: g, p: p, oscs: [o, lo] };
    }
    missile = m;
    if (!SIM.audio.playAsset('missile_fire', 0.4)) SIM.audio.blip(500, 120, 0.2, 0, 'sawtooth');
    say('Missile away. ' + missiles + ' left.');
}

// The missile goes ballistic: straight line, short coast, then it pops.
function loseGuidance(why) {
    var m = missile;
    if (!m || !m.guided) return;
    m.guided = false; m.coast = 0;
    SIM.audio.blip(300, 220, 0.12, 0, 'sawtooth');
    say(why);
}

// Steer a velocity toward a wanted direction with a capped turn rate
// (pure pursuit, slerp step). Shared by both sides' missiles.
function steerToward(vel, want, speed, maxTurn) {
    var cur = norm(vel);
    var ang = Math.acos(clamp(dot(cur, want), -1, 1));
    if (ang < 1e-4 || ang <= maxTurn) return scale(want, speed);
    var s = Math.sin(ang);
    var w1 = Math.sin(ang - maxTurn) / s, w2 = Math.sin(maxTurn) / s;
    return scale(norm(add(scale(cur, w1), scale(want, w2))), speed);
}

function killMissile() {
    if (!missile) return;
    if (missile.nodes) {
        try {
            missile.nodes.oscs.forEach(function (o) { o.stop(); });
            missile.nodes.p.disconnect();
        } catch (e) {}
    }
    missile = null;
}

function stepMissile(dt) {
    if (!missile) return;
    var m = missile;
    m.age += dt;
    if (!m.target.alive) {           // target died to the laser mid-flight
        SIM.audio.noiseBurst(m.pos, 250, 0.3, 1500);
        killMissile();
        return;
    }
    // Semi-active homing: the ship's own sensors illuminate the target, so
    // the pilot has to keep it inside the missile zone for the whole flight.
    // Shields cut the illumination outright.
    if (m.guided) {
        if (shieldsBusy()) {
            loseGuidance('Missile guidance lost. Shields up.');
        } else if (aim(m.target.pos).err > zoneRad().missile) {
            m.outCone += dt;
            if (m.outCone > CFG.missileGuideGraceS) {
                loseGuidance('Missile guidance lost. Keep the target in the missile zone.');
            }
        } else {
            m.outCone = 0;
        }
    }
    if (m.guided) {
        m.vel = steerToward(m.vel, norm(sub(m.target.pos, m.pos)), m.speed, CFG.missileTurn * dt);
    } else {
        m.coast += dt;
        if (m.coast > CFG.missileCoastS) {
            SIM.audio.noiseBurst(m.pos, 300, 0.35, 1200);
            killMissile();
            return;
        }
    }
    m.pos = add(m.pos, scale(m.vel, dt));
    if (m.nodes) SIM.audio.movePanner(m.nodes.p, m.pos);

    if (len(sub(m.target.pos, m.pos)) < CFG.missileHit) {
        var t = m.target;
        var impactDir = norm(m.vel);
        killMissile();
        if (t.kind === 'rock') {
            if (t.resource) { shatterCore(t); return; }
            addDebris(t.pos, 200 + Math.floor(Math.random() * 200));
            if (t.size <= 1) {
                // Huge and large rocks ABSORB the blast: deep cracking
                // damage, very little motion. This is the missile's job.
                pushRock(t, scale(impactDir, 8));
                t.hp -= Math.ceil(CFG.missileDamage * t.type.hardness);
                if (t.hp <= 0) { rockEvent(t); }
                else {
                    SIM.audio.noiseBurst(t.pos, 350, 0.5, 1800);
                    say(t.name + ' cracks deep under the missile.');
                }
            } else {
                // A smaller rock can't absorb it: the blast hurls it away,
                // and it will usually leave the cloud entirely. Wasteful.
                SIM.cues.play('explosion_rock', { pos: t.pos });
                pushRock(t, scale(impactDir, 150));
                say(t.name + ' is blasted out of control and hurtles toward the edge of the cloud!');
            }
        } else if (t.doorUp) {
            if (capital) capital.refused++;   // SPEC 3.71
            SIM.cues.play('shield_splash');
            say('Shielded.');
        } else if (!damageTarget(t, CFG.missileDamage)) {
            // Survived: impact thump at the target plus a hull report. A
            // Rookie Cruiser just takes the hit and answers by missile; every
            // other ship KNOWS now and breaks away hard.
            SIM.audio.noiseBurst(t.pos, 350, 0.5, 1800);
            if (t.noEvadeBurst) {
                threatIn = Math.min(threatIn, CFG.enemyAlertAttackS);
                say(t.name + ' hit. Hull ' + hullPercent(t) + ' percent.');
            } else {
                var dirWord = alertTarget(t);
                say(t.name + ' hit. Hull ' + hullPercent(t) + ' percent. It breaks away hard' +
                    (dirWord ? ', ' + dirWord : '') + '!');
            }
        }
    } else if (m.age > CFG.missileLifeS) {
        SIM.audio.noiseBurst(m.pos, 300, 0.35, 1200);
        killMissile();
        say('Missile lost.');
    }
}

// ---- enemy evasion ----------------------------------------------------------
// A ship that survives a missile is suddenly aware: it burns hard across the
// line of sight (sideways, and a little up or down), pitches its engine up
// while it does, and its next attack comes early. Orbiters get the same
// burst as an offset plus an extra spin on their orbit. Returns a word for
// the direction it broke, relative to the pilot, for the spoken report.
function alertTarget(t) {
    t.alert = true;
    var toShip = norm(sub(ship.pos, t.pos));
    var side = norm(v3(-toShip.z, 0, toShip.x));
    var s = Math.random() < 0.5 ? -1 : 1;
    var dir = norm(add(scale(side, s), v3(0, Math.random() * 1.2 - 0.6, 0)));
    t.vel = add(t.vel || v3(0, 0, 0), scale(dir, CFG.evadeSpeed));
    if (t.orbit) t.orbit.spin = (t.orbit.spin || 0) + s * 40;
    // Burner: a rising noise whoosh at the ship, and its engine pitches up.
    var out = SIM.audio.worldOut(t.pos, 1200);
    if (out) {
        SIM.audio.sfxNoise({ dur: 1.1, vol: 0.6, filter: 'bandpass', freq: 500, q: 1.5, out: out });
        SIM.audio.sfxTone({ type: 'sawtooth', f1: 90, f2: 260, dur: 1.0, vol: 0.25, out: out });
    }
    if (t.nodes && t.nodes.src && t.baseRate) {
        SIM.audio.ramp(t.nodes.src.playbackRate, t.baseRate * 1.35, 0.3);
        setTimeout(function () {
            if (t.nodes && t.nodes.src) SIM.audio.ramp(t.nodes.src.playbackRate, t.baseRate, 1.5);
        }, 2500);
    }
    threatIn = Math.min(threatIn, CFG.enemyAlertAttackS);
    var r = dot(dir, shipRight()), u = dot(dir, shipUp());
    var words = [];
    if (Math.abs(u) > 0.35) words.push(u > 0 ? 'high' : 'low');
    if (Math.abs(r) > 0.35) words.push(r > 0 ? 'right' : 'left');
    return words.join(' ');
}

// SPEC 3.58 (ideas14.txt): the ship's own facing (yaw only — Brian: "stay on
// the same vertical plane") turns toward its own motion while it's actively
// moving (an evade burst or an orbit's own spin — "turn in the direction
// they thrust"), and toward the pilot the rest of the time ("then turn back
// towards the human player in order to shoot"). One shared turn rate for
// every ship; the cone on its engine voice (buildVoice) makes the turn
// audible, and a cannon ship's damage (stepThreat) reads this same angle.
function updateFacing(t, dt) {
    var moving = t.vel && len(t.vel) > CFG.evadeSpeed * 0.15;
    var dir = moving ? t.vel : sub(ship.pos, t.pos);
    var desiredYaw = Math.atan2(dir.x, -dir.z);
    if (t.facing === undefined) { t.facing = desiredYaw; return; }
    t.facing = angleTowards(t.facing, desiredYaw, CFG.enemyFacingTurnRateDeg * Math.PI / 180 * dt);
}

// Per-frame motion for combat ships: evade bursts decay, orbiters keep
// orbiting (plus any evade spin) around their offset.
function stepCombatShips(dt) {
    targets.forEach(function (t) {
        if (!t.alive || t.kind) return;
        var moved = false;
        // SPEC 3.69: a capital turret's own position is its parent's plus
        // an offset rotated by the parent's current facing — set here,
        // before anything else, so a turret has no `vel`/`orbit` of its
        // own and the rest of this loop (facing, the cone, the panner)
        // just treats it as an ordinary stationary-relative-to-its-parent
        // ship, unchanged.
        if (t.parent) {
            var pyaw = t.parent.facing;
            var pright = v3(Math.cos(pyaw), 0, Math.sin(pyaw));
            t.pos = add(t.parent.pos, add(scale(pright, t.localOffset.x), v3(0, t.localOffset.y, 0)));
            if (t.nodes) SIM.audio.movePanner(t.nodes.panner, t.pos);
        }
        if (t.vel && len(t.vel) > 0.5) {
            var dv = scale(t.vel, dt);
            if (t.orbit) t.off = add(t.off || v3(0, 0, 0), dv);
            else t.pos = add(t.pos, dv);
            t.vel = scale(t.vel, Math.pow(CFG.evadeKeep, dt));
            moved = true;
        }
        if (t.orbit) {
            var o = t.orbit;
            if (o.spin) { o.angle += o.spin * Math.PI / 180 * dt; o.spin *= Math.pow(CFG.evadeKeep, dt); if (Math.abs(o.spin) < 0.5) o.spin = 0; }
            o.angle += o.degPerSec * Math.PI / 180 * dt;
            t.pos = add(v3(Math.cos(o.angle) * o.radius, o.y, Math.sin(o.angle) * o.radius),
                        t.off || v3(0, 0, 0));
            moved = true;
        }
        if (moved && t.nodes) SIM.audio.movePanner(t.nodes.panner, t.pos);
        updateFacing(t, dt);
        if (t.nodes && t.nodes.panner) {
            SIM.audio.setOrientation(t.nodes.panner, Math.sin(t.facing), 0, -Math.cos(t.facing));
        }
    });
}

// ---- the capital ship (SPEC 3.69, ideas15.txt) ------------------------------
// Brian: "a really big capital ship that had different guns/turrets...
// each one of them maybe have shields protecting that gun/turret and that
// shield needs to come down in order to fire and while the shield is down,
// that gun/turret is vulnerable." A moving parent — not a target, no lock,
// no Tab, just a low hull drone — carrying four ORDINARY hostile turret
// targets (`parent` pointing back here, positioned in stepCombatShips)
// whose own shield door is the telegraph: closed and invulnerable while it
// counts down, open through the shot and a beat after.
function updateCapital(dt) {
    if (!capital) return;
    capital.orbitAngle += CFG.capitalOrbitDegPerSec * Math.PI / 180 * dt;
    capital.pos = v3(Math.cos(capital.orbitAngle) * CFG.capitalOrbitRadius, CFG.capitalOrbitY,
                      Math.sin(capital.orbitAngle) * CFG.capitalOrbitRadius);
    var toShip = sub(ship.pos, capital.pos);
    var desiredYaw = Math.atan2(toShip.x, -toShip.z);
    capital.facing = angleTowards(capital.facing, desiredYaw, CFG.capitalTurnRateDeg * Math.PI / 180 * dt);
    if (capital.nodes) SIM.audio.movePanner(capital.nodes.panner, capital.pos);
}

// A low, wide two-oscillator drone through a tight lowpass — "no voice of
// its own but a low hull drone."
function buildCapitalVoice() {
    if (!SIM.audio.ctx) return null;
    var A = SIM.audio;
    var gain = A.ctx.createGain(); gain.gain.value = 0.22;
    var lp = A.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 250;
    var panner = A.makePanner(capital.pos);
    var o1 = A.ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 40;
    var o2 = A.ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 40 * 1.5;
    o1.connect(lp); o2.connect(lp); lp.connect(gain); gain.connect(panner); panner.connect(A.worldBus);
    o1.start(); o2.start();
    return { gain: gain, lp: lp, panner: panner, oscs: [o1, o2] };
}
function stopCapitalVoice() {
    if (!capital || !capital.nodes) return;
    var n = capital.nodes; capital.nodes = null;
    try {
        SIM.audio.ramp(n.gain.gain, 0.0001, 0.3);
        setTimeout(function () { try { n.oscs.forEach(function (o) { o.stop(); }); n.panner.disconnect(); } catch (e) {} }, 400);
    } catch (e) {}
}

// A single haulable-rock-shaped roster: four turrets, offsets at least
// capitalTurretSpacing apart so the ear tells them apart by bearing alone
// (L.8's own room already proved that works) — not by the door sound,
// which is Brian's own worry, answered by spacing instead.
function makeCapitalRoster() {
    var offsets = [
        { x: -CFG.capitalTurretSpacing, y: CFG.capitalTurretSpacing / 2 },
        { x: CFG.capitalTurretSpacing, y: CFG.capitalTurretSpacing / 2 },
        { x: -CFG.capitalTurretSpacing, y: -CFG.capitalTurretSpacing / 2 },
        { x: CFG.capitalTurretSpacing, y: -CFG.capitalTurretSpacing / 2 }
    ];
    var weapons = ['laser', 'cannon', 'laser', 'cannon'];
    var turrets = [];
    // A real bug caught in testing: every OTHER field here is filled in
    // at creation, but `pos` was left for stepCombatShips' own parent-
    // sync to set on the first frame — `state()` (and anything else that
    // reads a target's position) can run before that first frame ever
    // ticks, crashing on `t.pos` being undefined. Computed here the exact
    // same way stepCombatShips computes it every frame after, so a turret
    // never has a moment without a real position.
    var pyaw = capital.facing;
    var pright = v3(Math.cos(pyaw), 0, Math.sin(pyaw));
    for (var i = 0; i < 4; i++) {
        var off = offsets[i];
        turrets.push({
            name: 'Turret ' + (i + 1), hp: CFG.capitalTurretHp, maxHp: CFG.capitalTurretHp,
            voice: { type: 'square', freq: 90 + i * 15, trem: 4 },
            parent: capital, localOffset: off, weapon: weapons[i],
            pos: add(capital.pos, add(scale(pright, off.x), v3(0, off.y, 0))),
            doorUp: true, alive: true
        });
    }
    return turrets;
}

function capitalIntro() {
    return 'A capital ship holds this zone, four turrets riding it. Tab finds one, T reports whether ' +
           'its own shield door is open. A closed door refuses every hit — it opens ' + CFG.capitalDoorOpenS +
           ' seconds before that turret fires and stays open through the shot, that is your window. ' +
           'Clear all four to break the ship apart. F1 for help.';
}

// The door-opening telegraph — Brian's own metal-door recording lands
// later (3.69a, unwired here); a synthesized rising creak stands in,
// replacing that turret's usual three chirps entirely (the door IS the
// telegraph). Once it finishes, hands off to the EXACT ordinary
// laser/cannon attack — capitalDoor is gone by the time either of those
// even starts, so stepThreat/endThreat need no capital-specific branch
// of their own for the firing itself, only the door timing around it.
function startCapitalDoorSequence(t) {
    capitalDoor = { t: t, clock: 0, phase: 'opening' };
    var out = SIM.audio.worldOut(t.pos, CFG.capitalDoorOpenS * 1000);
    if (out) {
        SIM.audio.sfxNoise({ dur: CFG.capitalDoorOpenS * 0.9, vol: 0.3, filter: 'bandpass', freq: 200, q: 3, out: out });
        SIM.audio.sfxTone({ type: 'sawtooth', f1: 60, f2: 140, dur: CFG.capitalDoorOpenS * 0.9, vol: 0.18, out: out });
    }
    say(t.name + ' door opens.' + shieldCoach());
}
function capitalDoorCloseSound(t) {
    var out = SIM.audio.worldOut(t.pos, CFG.capitalDoorCloseS * 1000);
    if (out) {
        SIM.audio.sfxNoise({ dur: CFG.capitalDoorCloseS * 0.9, vol: 0.28, filter: 'bandpass', freq: 200, q: 3, out: out });
        SIM.audio.sfxTone({ type: 'sawtooth', f1: 140, f2: 60, dur: CFG.capitalDoorCloseS * 0.9, vol: 0.16, out: out });
    }
}
function updateCapitalDoor(dt) {
    var t = capitalDoor.t;
    if (!t.alive) { capitalDoor = null; scheduleNextThreat(); return; }
    capitalDoor.clock += dt;
    if (capitalDoor.phase === 'opening') {
        if (capitalDoor.clock >= CFG.capitalDoorOpenS) {
            t.doorUp = false;
            capitalDoor = null;
            if (t.weapon === 'cannon') startEnemyCannon(t); else startEnemyLaser(t);
        }
        return;
    }
    // closing — doorUp stays false (still vulnerable) through this whole
    // phase too: "that open-to-close window is the fight."
    if (capitalDoor.clock >= CFG.capitalDoorCloseS) {
        t.doorUp = true;
        capitalDoor = null;
        scheduleNextThreat();
    }
}

function startCapitalMission() {
    menuOpen = false;
    ore = 0; hull = CFG.shipHull; missiles = CFG.missileMax; chaff = CFG.chaffMax;
    autoTargetCharges = CFG.autoTargetCharges;
    refillRcs(); collisionDamage = 0; repairAllSystems();
    newGame('combat', null, false, true);
    say(capitalIntro());
}

// ---- enemy fire -------------------------------------------------------------
// The other half of combat. One enemy attack runs at a time so the sky stays
// readable: a ship inside laser range paints the hull first (three rising
// chirps from ITS position, plus speech) and then burns a five-second beam
// that bites once a second; a ship farther out launches a missile with its
// own voice that the pilot hears fly in. Both are answered by the shields.
function scheduleNextThreat() {
    threatIn = CFG.enemyAttackMinS + Math.random() * (CFG.enemyAttackMaxS - CFG.enemyAttackMinS);
}

function updateEnemies(dt) {
    if (mode !== 'combat') return;
    updateCapital(dt);   // SPEC 3.69: the parent moves before its turrets sync to it, below
    stepCombatShips(dt);
    // SPEC 3.69: a door opening or closing is its own single in-progress
    // "attack", same rule as `threat` — nothing else in the candidate
    // pool gets picked while one is running.
    if (capitalDoor) { updateCapitalDoor(dt); return; }
    if (threat) { stepThreat(dt); return; }
    threatIn -= dt;
    if (threatIn > 0) return;
    // SPEC 2.17: in a mission every raider is already `hostile` from the
    // start (they're harassing the friendly, not idle), so this pool has
    // to key off `provoked` instead — only a raider the player has actually
    // hit joins the normal player-vs-enemy fight modeled below.
    var cands = aliveTargets().filter(function (t) {
        return !t.kind && (mission ? t.provoked : t.hostile) && len(sub(t.pos, ship.pos)) <= CFG.enemyMissileRange;
    });
    if (!cands.length) { threatIn = 2; return; }
    var alert = cands.filter(function (t) { return t.alert; });
    var pool = alert.length ? alert : cands;
    var t = pool[Math.floor(Math.random() * pool.length)];
    t.alert = false;
    // SPEC 3.69: a capital turret's own beam/cannon attack is wrapped in
    // its door sequence — everything else (range gates, missile fallback)
    // is exactly the ordinary dispatch below, just deferred behind the
    // door opening first.
    if (t.parent && !t.missileOnly &&
        len(sub(t.pos, ship.pos)) <= (t.weapon === 'cannon' ? CFG.enemyCannonRange : CFG.enemyLaserRange)) {
        startCapitalDoorSequence(t);
        return;
    }
    // SPEC 3.58: a `weapon: 'cannon'` ship (Raider, Scout) uses the cannon
    // in place of the beam at the same range; every other ship is unchanged.
    if (!t.missileOnly && len(sub(t.pos, ship.pos)) <= CFG.enemyCannonRange && t.weapon === 'cannon') startEnemyCannon(t);
    else if (!t.missileOnly && len(sub(t.pos, ship.pos)) <= CFG.enemyLaserRange) startEnemyLaser(t);
    else startEnemyMissile(t);
}

function shieldCoach() {
    if (coachedShield >= 2) return '';
    coachedShield++;
    return ' Shields, G.';
}

function startEnemyLaser(t) {
    threat = { type: 'laser', t: t, phase: 'lock', clock: 0, ticks: 0, absorbed: 0, nodes: null };
    var out = SIM.audio.worldOut(t.pos, CFG.enemyLaserTelegraphS * 1000);
    if (out) {
        for (var i = 0; i < 3; i++) {
            SIM.audio.sfxTone({ type: 'square', f1: 1100 + i * 250, f2: 1500 + i * 250, dur: 0.18,
                      vol: 0.3, at: i * 0.35, out: out });
        }
    }
    say(t.name + ' locking on!' + shieldCoach());
}

function enemyBeamVoice(t) {
    if (!SIM.audio.ctx) return null;
    var g = SIM.audio.ctx.createGain(); g.gain.value = 0.0001;
    var lp = SIM.audio.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
    var p = SIM.audio.makePanner(t.pos);
    var o = SIM.audio.ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 380;
    var vib = SIM.audio.ctx.createOscillator(); vib.frequency.value = 7;
    var vg = SIM.audio.ctx.createGain(); vg.gain.value = 30;
    vib.connect(vg); vg.connect(o.frequency);
    o.connect(lp); lp.connect(g); g.connect(p); p.connect(SIM.audio.worldBus);
    o.start(); vib.start();
    SIM.audio.ramp(g.gain, 0.22, 0.08);
    return { g: g, p: p, oscs: [o, vib] };
}

// SPEC 3.58 (ideas14.txt): a synthesized stand-in for the cannon rattle
// Brian's own aside describes (bullets walking in, a shield twang on a hit)
// — a real recording lands later as a 3.58a audio sub-stage, unwired here.
// Loops SIM.audio's shared noise buffer through a bandpass filter, pulsed
// by a square LFO into a live gain that stepThreat drives frame by frame
// from the facing-cone angle — full, half, or nothing, same shape as the
// laser voice's {g, p, oscs} so endThreat's generic cleanup needs no change.
function enemyCannonVoice(t) {
    if (!SIM.audio.ctx) return null;
    var A = SIM.audio;
    var g = A.ctx.createGain(); g.gain.value = 0.0001;
    var bp = A.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 3;
    var p = A.makePanner(t.pos);
    var src = A.ctx.createBufferSource(); src.buffer = A.noiseBuf; src.loop = true;
    var rg = A.ctx.createGain(); rg.gain.value = 0.75;
    var lfo = A.ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 12;
    var lfoDepth = A.ctx.createGain(); lfoDepth.gain.value = 0.25;
    lfo.connect(lfoDepth); lfoDepth.connect(rg.gain);
    src.connect(bp); bp.connect(rg); rg.connect(g); g.connect(p); p.connect(A.worldBus);
    src.start(); lfo.start();
    return { g: g, p: p, oscs: [src, lfo] };
}

function startEnemyCannon(t) {
    threat = { type: 'cannon', t: t, clock: 0, ticks: 0, absorbed: 0, dealt: 0, nodes: null };
    threat.nodes = enemyCannonVoice(t);
    say(t.name + ' cannon opens up!' + shieldCoach());
}

// The facing-cone angle (degrees) between a ship's own yaw and the true
// bearing to the pilot, flattened to yaw (SPEC 3.58's "same vertical
// plane") — shared by the cannon's damage/volume and available for any
// later encounter (3.58) that needs the same geometry.
function facingConeAngle(t) {
    var toShip = sub(ship.pos, t.pos);
    var dirFlat = norm(v3(toShip.x, 0, toShip.z));
    var facingVec = v3(Math.sin(t.facing || 0), 0, -Math.cos(t.facing || 0));
    return Math.acos(clamp(dot(facingVec, dirFlat), -1, 1)) * 180 / Math.PI;
}
function coneMulFor(angleDeg) {
    if (angleDeg <= CFG.enemyConeInner) return 1;
    if (angleDeg <= CFG.enemyConeOuter) return CFG.enemyConeOuterGain;
    return 0;
}

function startEnemyMissile(t) {
    var pos = v3(t.pos.x, t.pos.y, t.pos.z);
    var th = { type: 'missile', t: t, pos: pos,
               vel: scale(norm(sub(ship.pos, pos)), CFG.enemyMissileSpeed),
               age: 0, guided: true, coast: 0, nodes: null };
    if (SIM.audio.ctx) {
        var g = SIM.audio.ctx.createGain(); g.gain.value = 0.26;
        var p = SIM.audio.makePanner(pos);
        var o = SIM.audio.ctx.createOscillator(); o.type = 'square'; o.frequency.value = 190;
        var lp = SIM.audio.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
        var lg = SIM.audio.ctx.createGain(); lg.gain.value = 0.13;
        var lo = SIM.audio.ctx.createOscillator(); lo.frequency.value = 20;
        lo.connect(lg); lg.connect(g.gain);
        o.connect(lp); lp.connect(g); g.connect(p); p.connect(SIM.audio.worldBus);
        o.start(); lo.start();
        th.nodes = { g: g, p: p, oscs: [o, lo] };
    }
    threat = th;
