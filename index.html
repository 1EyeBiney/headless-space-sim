// ---- flight course (SPEC 3.41, ideas11.txt) --------------------------------
// A mission-menu drill, not a combat one: eight beacons to fly through in
// order, against the clock, teaching the controls the way a visual game's
// hoop course would. Each COURSES entry is a list of TURNS — how much the
// path's own heading changes before stepping courseSpacing forward to place
// the next gate — rather than raw positions, so the shape is easy to read
// and re-tune. "Gentle" keeps every turn between 35 and 45 degrees (SPEC
// 3.49 — raised from "under 30" once the closer spacing and wider gate
// radius meant flying dead straight cleared most gates by accident; see
// the CFG.courseSpacing/courseGateRadius comment above for the math) —
// still flyable on auto-thrust, since a gate is several seconds away at
// cruise, but a pilot who never touches the arrows will miss some.
var COURSES = [
    { id: 'gentle', name: 'Gentle', turns: [
        { yaw: 0,   pitch: 0  },
        { yaw: 40,  pitch: 0  },
        { yaw: -35, pitch: 8  },
        { yaw: 45,  pitch: -8 },
        { yaw: -40, pitch: 0  },
        { yaw: 35,  pitch: 10 },
        { yaw: -45, pitch: -10 },
        { yaw: 38,  pitch: 0  }
    ] }
];
// Walks the turn list once, accumulating a heading and stepping
// courseSpacing forward each time, to produce world positions and each
// gate's own forward vector (the direction a clean pass continues in).
function buildCourseGates(course) {
    var pos = v3(0, 0, 0), yaw = 0, pitch = 0, gates = [];
    course.turns.forEach(function (turn) {
        yaw += turn.yaw * Math.PI / 180;
        pitch = clamp(pitch + turn.pitch * Math.PI / 180, -CFG.pitchLimit, CFG.pitchLimit);
        var cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
        var fwd = v3(sy * cp, sp, -cy * cp);
        pos = add(pos, scale(fwd, CFG.courseSpacing));
        gates.push({ pos: pos, fwd: fwd });
    });
    return gates;
}
// One target per gate, kind 'poi' (so targeting's lock tone, tick, distance
// haze, and B-key plumbing all already apply with zero changes) and its own
// poiType 'course' (so buildPoiVoice gives it a distinct tone and
// updateTargeting drives its volume from the ladder instead of beaconAudible).
function makeCourseRoster(course) {
    return buildCourseGates(course).map(function (g, i) {
        var t = { name: 'Gate ' + (i + 1), poiType: 'course', kind: 'poi', desc: 'flight gate',
                  pos: g.pos, fwd: g.fwd, alive: true, resource: false,
                  gateIndex: i, courseCleared: false };
        buildPoiVoice(t);
        return t;
    });
}
// The ladder: the active gate is loudest, courseAudible-1 more ahead of it
// fade in order, everything else (behind, cleared, or beyond the ladder)
// is silent. Drives t.nodes.mute directly in updateTargeting, replacing
// beaconAudible()'s on/off for this poiType only.
function courseGainFor(t) {
    if (t.courseCleared) return 0;
    var offset = t.gateIndex - courseState.activeIndex;
    if (offset < 0 || offset >= CFG.courseGains.length) return 0;
    return CFG.courseGains[offset];
}
// `prefix` (SPEC 2.15's rule: never two say() calls in one tick) folds in
// whatever a gate's own clearing already said — a miss's "plus 10", or the
// run's own opening line — so activating the next gate is always exactly
// one combined announcement, never two in the same frame.
function activateCourseGate(i, prefix) {
    courseState.activeIndex = i;
    selected = i;
    locked = false;
    stopLockTone();
    say((prefix || '') + 'Gate ' + (i + 1) + '.');
}
// Called once per gate, the frame the ship's position crosses that gate's
// own plane (dot of ship-relative-position against the gate's forward
// flips from behind to ahead) — clean if that crossing point is within
// courseGateRadius of the gate's own position, a miss (time penalty, but
// still cleared — the course keeps moving) otherwise.
function clearCourseGate(clean, lateral) {
    var i = courseState.activeIndex;
    var g = targets[i];
    g.courseCleared = true;
    stopVoice(g);
    // SPEC 3.53: every crossing's own distance from the gate's axis, clean
    // or missed — a wide miss counts at its real distance, dragging the
    // average up same as it should.
    courseState.offsets.push(lateral);
    var missText = '';
    if (clean) {
        courseState.made++;
        SIM.cues.play('course_pass');
    } else {
        courseState.missed++;
        courseState.elapsed += CFG.courseMissPenaltyS;
        missText = 'Gate ' + (i + 1) + ' missed, plus ' + CFG.courseMissPenaltyS + '. ';
        SIM.cues.play('course_miss');
    }
    if (i + 1 >= targets.length) finishCourse(missText);
    else activateCourseGate(i + 1, missText);
}
// SPEC 3.49: the final line folds in the made/missed tally and how this
// run ranks against the best time on file — recordRun('course', ...)
// returns the PREVIOUS best (undefined on a first-ever run) rather than a
// plain boolean, so the delta itself can be spoken either way.
function finishCourse(prefix) {
    won = true;
    stopLockTone();
    var seconds = courseState.elapsed;
    // SPEC 3.53: mean distance off each gate's own axis, clean crossings and
    // misses both counted at their real distance — read out, never a second
    // ranked board (time alone still decides personal best).
    var avgOffset = courseState.offsets.reduce(function (a, b) { return a + b; }, 0) / courseState.offsets.length;
    var prevBest = recordRun('course', { seconds: seconds, avgOffset: avgOffset,
                                          made: courseState.made, missed: courseState.missed });
    var rankText;
    if (prevBest === undefined) rankText = 'Your first time.';
    else if (seconds < prevBest) rankText = 'New personal best by ' + fmtTime(prevBest - seconds) + '.';
    else rankText = fmtTime(seconds - prevBest) + ' off your best.';
    // SPEC 3.70: the shared debrief — `prefix` (the final gate's own miss
    // text, if any) folds into the headline line rather than the opener, so
    // this stays the one say() the finish produces (SPEC 2.15).
    openDebrief('Flight course complete',
        [ (prefix || '') + 'Time ' + fmtTime(seconds) + '.',
          courseState.made + ' of ' + targets.length + ' gates clean' +
              (courseState.missed ? ', ' + courseState.missed + ' missed.' : '.'),
          'Average ' + Math.round(avgOffset) + ' off centre.',
          rankText ],
        'Enter tries again, X for the mission menu.');
}
function updateCourse(dt) {
    if (!courseState || won || lost) return;
    if (courseState.started) courseState.elapsed += dt;
    var i = courseState.activeIndex;
    if (i >= targets.length) return;
    var g = targets[i];
    var toShip = sub(ship.pos, g.pos);
    var depth = dot(toShip, g.fwd);
    if (depth <= 0) return;   // hasn't reached the gate's plane yet
    var lateral = len(sub(toShip, scale(g.fwd, depth)));
    clearCourseGate(lateral <= CFG.courseGateRadius, lateral);
}
function courseIntro() {
    return 'Flight course: ' + COURSES[0].name + '. Eight gates, in order. ' +
           'The clock starts the moment you thrust. Weapons are cold. ';
}

// ---- the minefield (SPEC 3.61, ideas14.txt/Fable) --------------------------
// Nothing to shoot — pure listening and throttle control. Mines scatter
// between the start and one exit beacon; each mine's own tick (the lock
// tick's pacing shape, CFG.mineTickFastMs/SlowMs, but keyed to DISTANCE
// rather than aim error) quickens as the ship closes, and a mine within
// mineTriggerDist detonates only if the ship is over mineSafeSpeed at that
// moment — crossing slow and centered is always safe, same lesson
// updateCollisions already teaches at a station. Mines are `kind: 'mine'`,
// deliberately excluded from Tab/lock (see selectNearest/cycleTarget) —
// their own passive tick carries the bearing, no selection needed; the
// exit beacon is the one real (kind 'poi') target here.
function makeMinefieldRoster() {
    var mines = [];
    for (var i = 0; i < CFG.mineCount; i++) {
        var depth = -(CFG.mineFieldDepth * (0.15 + 0.7 * Math.random()));
        var ang = Math.random() * Math.PI * 2, r = Math.random() * CFG.mineSpread;
        var pos = v3(Math.cos(ang) * r, (Math.random() - 0.5) * CFG.mineSpread * 0.4, depth);
        var dir = Math.random() * Math.PI * 2;
        var vel = v3(Math.cos(dir) * CFG.mineDriftSpeed, (Math.random() - 0.5) * CFG.mineDriftSpeed * 0.3,
                     Math.sin(dir) * CFG.mineDriftSpeed);
        var t = { name: 'Mine ' + (i + 1), kind: 'mine', pos: pos, vel: vel, alive: true, tickIn: 0,
                  type: ROCK_TYPES[i % ROCK_TYPES.length], size: ROCK_SIZES.length - 2 };
        buildRockVoice(t);
        mines.push(t);
    }
    var exit = { name: 'Exit Beacon', poiType: 'minefieldExit', kind: 'poi', desc: 'clear of the field',
                 pos: v3(0, 0, -CFG.mineFieldDepth), alive: true, resource: false };
    buildPoiVoice(exit);
    mines.push(exit);
    return mines;
}
function minefieldIntro() {
    return 'The minefield. ' + CFG.mineCount + ' mines drift between here and the exit beacon — Tab finds it. ' +
           'Each mine ticks faster as you close; cross it slow and you are safe, cross it fast and it detonates. ' +
           'The clock starts the moment you thrust. Weapons are cold. ';
}
function finishMinefield() {
    won = true;
    var seconds = minefieldState.elapsed;
    var prevBest = recordRun('minefield', { seconds: seconds, detonations: minefieldState.detonations });
    var rankText = prevBest === undefined ? 'Your first time.'
                 : seconds < prevBest ? 'New personal best by ' + fmtTime(prevBest - seconds) + '.'
                 : fmtTime(seconds - prevBest) + ' off your best.';
    SIM.cues.play('win_fanfare');
    openDebrief('Minefield clear',
        [ 'Time ' + fmtTime(seconds) + '.',
          minefieldState.detonations + (minefieldState.detonations === 1 ? ' mine detonated.' : ' mines detonated.'),
          'Your hull ' + Math.round(hull) + '.',
          rankText ],
        'Enter tries again, X for the mission menu.');
}
// Called every frame from simTick while mode === 'minefield'. Drift, the
// per-mine proximity tick, the speed-gated detonation check, and the exit
// beacon's own proximity finish — all in one pass since none of it needs
// a selection.
function updateMinefield(dt) {
    if (!minefieldState || won || lost) return;
    if (minefieldState.started) minefieldState.elapsed += dt;
    var spd = len(ship.vel);
    var exit = null;
    targets.forEach(function (t) {
        if (t.kind === 'poi') { exit = t; return; }
        if (!t.alive) return;
        t.pos = add(t.pos, scale(t.vel, dt));
        if (t.nodes) SIM.audio.movePanner(t.nodes.panner, t.pos);
        var dist = len(sub(t.pos, ship.pos));
        if (dist > CFG.mineTickRange) { t.tickIn = 0; }
        else {
            t.tickIn -= dt;
            if (t.tickIn <= 0) {
                var frac = clamp(1 - (dist - CFG.mineTriggerDist) / (CFG.mineTickRange - CFG.mineTriggerDist), 0, 1);
                t.tickIn = (CFG.mineTickSlowMs - (CFG.mineTickSlowMs - CFG.mineTickFastMs) * frac) / 1000;
                var out = SIM.audio.worldOut(t.pos, 120);
                SIM.audio.sfxTone({ type: 'sine', f1: 520, dur: 0.07, vol: 0.16, out: out });
            }
        }
        if (dist <= CFG.mineTriggerDist && spd > CFG.mineSafeSpeed) {
            t.alive = false;
            stopVoice(t);
            minefieldState.detonations++;
            SIM.cues.play('explosion_rock', { pos: t.pos });
            hullHit(CFG.mineHullDmg, t.name, false, t.name + ' detonates.');
        }
    });
    if (exit && exit.alive && len(sub(exit.pos, ship.pos)) <= CFG.mineExitRadius) finishMinefield();
}

}
// SPEC 3.73: the manifest key is named for the tier length it plays for —
// Rookie/Veteran/Ace read CFG.shadowThrustTiers[tierIdx] (10/7/4), which is
// exactly the number in the key.
function shadowThrustKey() { return 'shadow_thruster_' + CFG.shadowThrustTiers[tierIdx]; }
// Plays the thrust leg's own recording through the shadow's EXISTING
// engine panner (t.nodes.panner) — no separate position tracking needed,
// it rides the same node updateShadow already moves every frame. Faded
// out at durS - shadowThrustFadeS regardless of the file's real length
// (several of Brian's nine recordings run longer than their own filename
// claims — see SPEC.md 3.73), then hard-stopped just after. A retry/leave
// before either fires is handled by stopVoice() below cancelling both
// timers, not by this function.
function startShadowThrust(t, durS) {
    if (t.thrustNodes) stopShadowThrust(t);
    if (!SIM.audio.ctx || !t.nodes) return;
    var key = shadowThrustKey();
    var buf = SIM.audio.assetBufs[key];
    if (!buf) { SIM.audio.load(key); return; }
    var A = SIM.audio;
    var src = A.ctx.createBufferSource(); src.buffer = buf;
    var g = A.ctx.createGain(); g.gain.value = 1;
    src.connect(g); g.connect(t.nodes.panner);
    src.start();
    var fadeTimer = setTimeout(function () { A.ramp(g.gain, 0.0001, CFG.shadowThrustFadeS); },
                                Math.max(0, durS - CFG.shadowThrustFadeS) * 1000);
    var stopTimer = setTimeout(function () { try { src.stop(); g.disconnect(); } catch (e) {} },
                                durS * 1000 + 250);
    t.thrustNodes = { src: src, g: g, fadeTimer: fadeTimer, stopTimer: stopTimer };
}
function stopShadowThrust(t) {
    if (!t.thrustNodes) return;
    var n = t.thrustNodes; t.thrustNodes = null;
    clearTimeout(n.fadeTimer); clearTimeout(n.stopTimer);
    try {
        SIM.audio.ramp(n.g.gain, 0.0001, 0.1);
        setTimeout(function () { try { n.src.stop(); n.g.disconnect(); } catch (e) {} }, 200);
    } catch (e) {}
}
// Called every frame from simTick while mode === 'shadow'. A two-state
// cycle (SPEC 3.73): THRUST accelerates toward shadowThrustSpeed along the
// ship's own facing while its recording plays (the lit leg IS the thrust —
// updateTargeting's t.dark check, right alongside 3.27's real sensor-
// offline rule, is what actually drops the lock/tick); DARK coasts on
// whatever velocity the thrust left it with (direction frozen — no engine,
// no steering) while the facing alone turns toward a fresh random heading,
// so the NEXT thrust heads somewhere new. Contact still accrues purely by
// range either way — see the CFG block's own note on why accrual isn't
// ALSO gated on lock.
function updateShadow(dt) {
    if (!shadowState || won || lost) return;
    if (shadowState.started) shadowState.elapsed += dt;
    var t = targets[0];
    if (!t || !t.alive) return;

    t.phaseElapsed += dt;
    if (t.phaseElapsed >= t.phaseLen) {
        if (t.phase === 'thrust') {
            stopShadowThrust(t);
            t.phase = 'dark'; t.dark = true; t.phaseElapsed = 0; t.turnRate = 0;
            t.phaseLen = CFG.shadowSilentMinS + Math.random() * (CFG.shadowSilentMaxS - CFG.shadowSilentMinS);
            var turnDeg = (CFG.shadowTurnMinDeg + Math.random() * (CFG.shadowTurnMaxDeg - CFG.shadowTurnMinDeg)) *
                          (Math.random() < 0.5 ? -1 : 1);
            t.turnRate = (turnDeg * Math.PI / 180) / t.phaseLen;
            if (t.nodes) SIM.audio.ramp(t.nodes.gain.gain, 0.0001, 1.5);
        } else {
            t.phase = 'thrust'; t.dark = false; t.phaseElapsed = 0; t.turnRate = 0;
            t.phaseLen = CFG.shadowThrustTiers[tierIdx];
            if (t.nodes) SIM.audio.ramp(t.nodes.gain.gain, CFG.shadowGain * CFG.targetGain, 1.5);
            startShadowThrust(t, t.phaseLen);
        }
    }

    if (t.phase === 'dark') {
        t.facing += t.turnRate * dt;
        var spd = len(t.vel);
        if (spd > CFG.shadowCoastSpeed) {
            var newSpd = Math.max(CFG.shadowCoastSpeed, spd - CFG.shadowCoastDecel * dt);
            t.vel = scale(t.vel, newSpd / spd);
        }
    } else {
        var fwd = v3(Math.sin(t.facing), 0, Math.cos(t.facing));
        var targetVel = scale(fwd, CFG.shadowThrustSpeed);
        var delta = sub(targetVel, t.vel);
        var d = len(delta);
        if (d > 0.001) {
            var step = Math.min(d, CFG.shadowThrustAccel * dt);
            t.vel = add(t.vel, scale(delta, step / d));
        }
    }

    t.pos = add(t.pos, scale(t.vel, dt));
    if (t.nodes) SIM.audio.movePanner(t.nodes.panner, t.pos);

    // SPEC 3.71: contact efficiency (contact/elapsed), times lost (a real
    // RANGE crossing out — independent of lit/dark, which never gates
    // accrual at all, see the CFG note above), and the longest unbroken
    // hold — all three are Brian's own ask for this encounter specifically
    // ("time alone hides the skill"). `inRange` is sticky so only the
    // TRANSITION counts, not every frame spent outside.
    if (shadowState.started) {
        var inRangeNow = len(sub(t.pos, ship.pos)) <= CFG.shadowRange;
        if (inRangeNow) {
            if (!shadowState.inRange) shadowState.currentHold = 0;
            shadowState.currentHold += dt;
            if (shadowState.currentHold > shadowState.longestHold) shadowState.longestHold = shadowState.currentHold;
            shadowState.contact += dt;
        } else {
            if (shadowState.inRange) shadowState.timesLost++;
            shadowState.currentHold = 0;
        }
        shadowState.inRange = inRangeNow;
        if (shadowState.contact >= CFG.shadowNeedS) finishShadow();
    }
}

// ---- nebula transit (SPEC 3.63, ideas14.txt/Fable) -------------------------
// The staged pulsar/space_loop recordings finally get a job. A cloud
// sphere sits ahead of the start; `insideNebula()` (read by zoneRad() and
// tickBeat, right alongside their existing systemState('sensor') === 'half'
// checks — the exact scoped-override shape 3.62's t.dark check already
// established, so the real sensor never actually reports broken in F2/I)
// is true whenever the ship is within CFG.nebulaRadius of the cloud's own
// center. A motionless pulsar (kind: 'poi', poiType: 'pulsar') sits just
// past the far edge — the one stable bearing — while the real exit
// (poiType: 'nebulaExit') drifts slowly around that same point, the same
// small-random-walk shape a mine's own drift already uses.
function insideNebula() {
    return !!(nebulaState && nebulaState.inside);
}
function makeNebulaRoster() {
    var anchor = v3(0, 0, -(CFG.nebulaCenterDist + CFG.nebulaRadius + 400));
    var pulsar = { name: 'Pulsar', poiType: 'pulsar', kind: 'poi', desc: 'a steady, fixed bearing',
                   pos: v3(anchor.x, anchor.y, anchor.z), alive: true, resource: false,
                   beaconAsset: 'nebula_pulsar' };
    var ang = Math.random() * Math.PI * 2;
    var exit = { name: 'Exit Gate', poiType: 'nebulaExit', kind: 'poi', desc: 'clear of the nebula',
                 pos: v3(anchor.x, anchor.y, anchor.z),
                 vel: v3(Math.cos(ang) * CFG.nebulaExitDrift, 0, Math.sin(ang) * CFG.nebulaExitDrift),
                 alive: true, resource: false };
    buildPoiVoice(pulsar);
    buildPoiVoice(exit);
    return [pulsar, exit];
}
function nebulaIntro() {
    return 'Nebula transit. A cloud sits ahead — inside it the sensor runs half strength, and the hull slowly ablates. ' +
           'A pulsar holds one steady bearing; the exit gate itself drifts, so trust the pulsar to aim, not to arrive. ' +
           'Tab cycles between them. The clock starts the moment you thrust.';
}
function finishNebula() {
    won = true;
    var seconds = nebulaState.elapsed;
    var prevBest = recordRun('nebula', { seconds: seconds, hull: Math.round(hull) });
    var rankText = prevBest === undefined ? 'Your first time.'
                 : seconds < prevBest ? 'New personal best by ' + fmtTime(prevBest - seconds) + '.'
                 : fmtTime(seconds - prevBest) + ' off your best.';
    SIM.cues.play('win_fanfare');
    openDebrief('Clear of the nebula',
        [ 'Time ' + fmtTime(seconds) + '.',
          'Your hull ' + Math.round(hull) + ' percent.',
          rankText ],
        'Enter tries again, X for the mission menu.');
}
// Called every frame from simTick while mode === 'nebula'. Drifts the
// exit, tracks the inside/outside boundary (one combined say() on each
// crossing — never two in the same tick), ablates the hull only while
// inside, and checks the exit's own proximity.
function updateNebula(dt) {
    if (!nebulaState || won || lost) return;
    if (nebulaState.started) nebulaState.elapsed += dt;
    var exit = targets.filter(function (t) { return t.poiType === 'nebulaExit'; })[0];
    if (exit && exit.alive) {
        exit.pos = add(exit.pos, scale(exit.vel, dt));
        if (exit.nodes) SIM.audio.movePanner(exit.nodes.panner, exit.pos);
    }
    var wasInside = nebulaState.inside;
    nebulaState.inside = len(sub(ship.pos, nebulaState.cloudCenter)) <= CFG.nebulaRadius;
    if (nebulaState.inside && !wasInside) {
        say('Entering the nebula. Sensor at half strength; the hull will slowly ablate.');
    } else if (!nebulaState.inside && wasInside) {
        say('Clear of the nebula cloud. Sensor restored; the hull stops ablating.');
    }
    if (nebulaState.inside) {
        var before = hull;
        hull = Math.max(0, hull - CFG.nebulaHullPerS * dt);
        CFG.nebulaHullAlertPcts.forEach(function (p) {
            if (before > p && hull <= p) say('Hull ' + Math.round(hull) + ' percent, ablating.');
        });
        if (hull <= 0) { shipDestroyed('the nebula'); return; }
    }
    if (exit && exit.alive && len(sub(exit.pos, ship.pos)) <= CFG.nebulaExitRadius) finishNebula();
}

// ---- the gate run (SPEC 3.64, ideas14.txt/Fable) ---------------------------
// The Jump Gate's own lighthouse sweep (Phase 3L L.9 / SPEC 3.31,
// updateTargeting's t.gatePhase advance) becomes a real timing rule here,
// ahead of quadrant 2 needing the same one: H only jumps while the beam is
// actually pointing at the ship, within gateRunBeamHalfAngle — a tighter
// window than the audio cone's own wide gateConeInner, which is about
// loudness, not timing. One gate target, reusing its real recorded voice
// (beaconAsset, the same space_station6 the quadrant's own gate uses) —
// no new audio, just a new rule read off the SAME t.gatePhase the sweep
// already writes every frame.
function makeGateRunRoster() {
    return [{ name: 'Jump Gate', poiType: 'gate', kind: 'poi', desc: 'jump gate',
              pos: v3(0, 0, -CFG.gateRunDist), alive: true, resource: false,
              beaconAsset: 'space_station6' }];
}
function gateRunIntro() {
    return 'The gate run. Fly to the gate and time your jump to its own sweep — H only works while the beam points at you. ' +
           'A wrong-time H tells you how long until it swings back. The clock starts the moment you thrust.';
}
// The ship's own bearing FROM the gate, in the same 0-360 degree phase
// space t.gatePhase already uses (updateTargeting's own sin/cos convention).
function gateBearingDeg(t) {
    var dir = norm(sub(ship.pos, t.pos));
    var deg = Math.atan2(dir.x, -dir.z) * 180 / Math.PI;
    return (deg + 360) % 360;
}
// Signed degrees from the beam's CURRENT phase to the ship's own bearing,
// wrapped to [-180, 180] — positive means the beam hasn't reached the ship
// yet (sweeping forward toward it), negative means it just passed.
function gateBeamDiffDeg(t) {
    var diff = (gateBearingDeg(t) - (t.gatePhase || 0) + 360) % 360;
    return diff > 180 ? diff - 360 : diff;
}
function finishGateRun() {
    won = true;
    var seconds = gateRunState.elapsed;
    var prevBest = recordRun('gaterun', { seconds: seconds, wasted: gateRunState.wasted });
    var rankText = prevBest === undefined ? 'Your first time.'
                 : seconds < prevBest ? 'New personal best by ' + fmtTime(prevBest - seconds) + '.'
                 : fmtTime(seconds - prevBest) + ' off your best.';
    SIM.cues.play('win_fanfare');
    openDebrief('Through the gate',
        [ 'Time ' + fmtTime(seconds) + '.',
          gateRunState.wasted + (gateRunState.wasted === 1 ? ' pass wasted.' : ' passes wasted.'),
          rankText ],
        'Enter tries again, X for the mission menu.');
}
// H, while mode === 'gaterun' — intercepted in onKeyDown ahead of the
// normal startWarp() call, the same shape every other drill's own key
// intercept uses.
function gateRunKey() {
    var t = targets[0];
    if (!t || !t.alive) return;
    var d = len(sub(t.pos, ship.pos));
    if (d > CFG.gateRunApproachDist) {
        SIM.cues.play('refusal_dud');
        say('Fly closer to the gate first. Distance ' + round10(d) + '.');
        return;
    }
    var diff = gateBeamDiffDeg(t);
    if (Math.abs(diff) <= CFG.gateRunBeamHalfAngle) { finishGateRun(); return; }
    gateRunState.wasted++;
    var forwardDeg = diff >= 0 ? diff : diff + 360;
    var waitS = forwardDeg / (360 / CFG.gateSweepS);
    SIM.cues.play('refusal_wait');
    say('Beam passes in ' + Math.ceil(waitS) + ' seconds.');
}
function updateGateRun(dt) {
    if (!gateRunState || won || lost) return;
    if (gateRunState.started) gateRunState.elapsed += dt;
}

// ---- escort/defend missions (SPEC 2.17) ------------------------------------
// Only the friendly is in the roster at mission start — raiders arrive in
// scripted waves via spawnMissionWave(), not all at once. Same voice/asset
// as makeRoster's own "Freighter" entry for the escort target, since it's
// thematically the same ship; the Miner has no recorded loop of its own
// (oscillator fallback only — nothing dedicated exists to reach for yet).
function makeMissionRoster(m) {
    var f = m.kind === 'escort'
        ? { name: 'Freighter', hp: CFG.missionEscortHull, pos: v3(0, 0, -200),
            voice: { type: 'sawtooth', freq: 55, trem: 3 },
            shipAsset: { name: 'ship_cruiser_1', rate: 0.8 } }
        : { name: 'Miner', hp: CFG.missionMinerHull, pos: v3(0, 0, 0),
            voice: { type: 'triangle', freq: 220, vib: 4, vibDepth: 10 } };
    f.kind = 'friendly';
    f.alive = true;
    f.maxHp = f.hp;
    // SPEC 3.25: a shield pool like the pilot's, starting full.
    f.shieldPool = CFG.friendlyShieldPool;
    f.shield = CFG.friendlyShieldPool;
    f.shieldDown = false;
    m.friendly = f;
    return [f];
}

// A wave arrives around the friendly's current position. Escort's raiders
// are now Drones (SPEC 3.25 — three per wave, hull 40); Defend keeps
// Raiders (hull 80, unchanged). Always named plainly (not numbered) so
// SHIP_CLASS/SALVAGE/laser-matchup lookups, which all key off exact ship
// name, resolve the same way a standalone drill's own Drone/Raider would
// (Drone already maps to 'corvette' there, matching the 3-salvage-a-kill
// spec asked for) — the trade-off is that Tab-cycling two at once can't
// tell them apart by name, only by bearing/distance.
var MISSION_WAVE_STATS = {
    escort: { name: 'Drone', hp: 40, voice: { type: 'beat', freq: 165 },
              shipAsset: { name: 'ship_drone_1', rate: 1 } },
    defend: { name: 'Raider', hp: 80, voice: { type: 'square', freq: 110, trem: 8 },
              shipAsset: { name: 'ship_interceptor_1', rate: 1.15 } }
};
function spawnMissionWave() {
    mission.wavesSent++;
    var f = mission.friendly, stats = MISSION_WAVE_STATS[mission.kind];
    var n = mission.kind === 'escort' ? CFG.missionEscortWaveSize : CFG.missionDefendWaveSize;
    var first = null;
    for (var i = 0; i < n; i++) {
        var ang = Math.random() * Math.PI * 2;
        var pos = add(f.pos, v3(Math.cos(ang) * 400, (Math.random() - 0.5) * 100, Math.sin(ang) * 400));
        var t = { name: stats.name, hp: stats.hp, maxHp: stats.hp, pos: pos,
                  voice: stats.voice, shipAsset: stats.shipAsset,
                  alive: true, hostile: true, provoked: false };
        targets.push(t);
        if (SIM.audio.ctx) buildVoice(t);
        if (!first) first = t;
    }
    var word = stats.name.toLowerCase();
    say(n + ' ' + (n === 1 ? word : word + 's') + ' inbound on the ' + f.name + '. ' + bearingText(first));
}

// An unprovoked raider (one the player hasn't hit yet) periodically hits the
// friendly instead of the player — a deliberately simpler side-channel than
// the full telegraph/beam/missile simulation in WEAPONS, which stays 100%
// about the player; see updateMission for the timer that calls this and
// for the friendly's own shield regen. SPEC 3.25: the friendly's shield
// absorbs first, same pool shape as the pilot's; "shields down" is spoken
// only once, the instant a hit spills past an already-nonzero shield.
function missionStrike(t) {
    var f = mission.friendly;
    var out = SIM.audio.worldOut(t.pos, 500);
    SIM.audio.sfxTone({ type: 'square', f1: 900, f2: 500, dur: 0.3, vol: 0.3, out: out });
    var dmg = CFG.missionStrikeDmg;
    var absorbed = Math.min(f.shield, dmg);
    f.shield -= absorbed;
    var spill = dmg - absorbed;
    if (spill > 0) f.hp = Math.max(0, f.hp - spill);
    // "Shields down" announces once per real drop — f.shieldDown is a
    // STICKY flag, not a same-tick "was it up a second ago" check: a
    // shield sitting near zero regenerates a sliver every frame
    // (friendlyShieldRegenPerS), so an instantaneous "just crossed zero"
    // test re-fires the announcement on every following hit as it ticks
    // up past 0 and immediately back down again. It only re-arms once the
    // pool recovers past a real threshold (10%), not a fraction of a point.
    var announceDown = false;
    if (!f.shieldDown && f.shield <= 0.5) { f.shieldDown = true; announceDown = true; }
    else if (f.shield > f.shieldPool * 0.1) { f.shieldDown = false; }
    if (f.hp <= 0) {
        f.alive = false;
        stopVoice(f);
        SIM.cues.play('explosion_kill', { pos: f.pos, size: shipExplosionSize(f.name) });
        say(t.name + ' hits the ' + f.name + '. ' + f.name + ' destroyed.');
        missionEnd(false);
        return;
    }
    var line = t.name + ' hits the ' + f.name + '. ';
    if (announceDown) {
        line += f.name + ' shields down. ' + f.name + ' hull ' + Math.round(f.hp / f.maxHp * 100) + ' percent.';
    } else if (f.shieldDown) {
        line += f.name + ' hull ' + Math.round(f.hp / f.maxHp * 100) + ' percent.';
    } else {
        line += f.name + ' shields ' + Math.round(f.shield / f.shieldPool * 100) + ' percent.';
    }
    say(line);
}

function missionIntro() {
    var f = mission.friendly;
    var singular = MISSION_WAVE_STATS[mission.kind].name.toLowerCase();   // 'drone' / 'raider'
    var plural = singular + 's';
    return (mission.kind === 'escort'
        ? 'Stay near the ' + f.name + ' and clear any ' + singular + ' that engages you.'
        : 'Defend the ' + f.name + ' from the ' + singular + ' waves.') +
        ' The ' + f.name + ' carries its own shield. The ' + capFirst(plural) +
        ' hold their fire on you until you hit them — until then they harass the ' + f.name +
        '. Tab cycles hostiles once they arrive. Space fires when the tone goes solid. ' +
        'G raises the shields. F1 for help.';
}

// Called every frame a mission is live (simTick, gated on `mission`):
// advances the escort's leg, fires scheduled waves, runs the friendly-strike
// timer, and checks both win conditions (the escort's leg timer; the
// defend's last wave cleared). Loss (the friendly destroyed) is driven by
// missionStrike itself, not checked here.
function updateMission(dt) {
    if (!mission || mission.ended) return;
    mission.elapsed += dt;
    var f = mission.friendly;
    if (mission.kind === 'escort' && f.alive) {
        f.pos = add(f.pos, scale(v3(0, 0, 1), CFG.missionEscortSpeed * dt));
        if (f.nodes) SIM.audio.movePanner(f.nodes.panner, f.pos);
    }
    while (mission.wavesSent < mission.waveTimes.length && mission.elapsed >= mission.waveTimes[mission.wavesSent]) {
        spawnMissionWave();
    }
    // SPEC 3.25: the friendly's shield regenerates like the pilot's own,
    // just without a raise/lower gesture — always trickling back while
    // alive and not full, so a wave cleared fast leaves it near-fresh.
    if (f.alive && f.shield < f.shieldPool) {
        f.shield = Math.min(f.shieldPool, f.shield + CFG.friendlyShieldRegenPerS * dt);
    }
    if (f.alive) {
        mission.nextStrikeIn -= dt;
        if (mission.nextStrikeIn <= 0) {
            var cands = aliveTargets().filter(function (t) { return !t.kind && t.hostile && !t.provoked; });
            if (cands.length) missionStrike(cands[Math.floor(Math.random() * cands.length)]);
            mission.nextStrikeIn = CFG.missionStrikeGapMinS + Math.random() * (CFG.missionStrikeGapMaxS - CFG.missionStrikeGapMinS);
        }
    }
    if (mission.kind === 'escort' && f.alive && mission.elapsed >= CFG.missionEscortLegS) {
        missionEnd(true);
    } else if (mission.kind === 'defend' && f.alive && mission.wavesSent >= mission.waveTimes.length &&
               aliveTargets().filter(function (t) { return !t.kind; }).length === 0) {
        missionEnd(true);
    }
}

function missionEnd(success) {
    if (!mission || mission.ended) return;
    mission.ended = true;
    mission.success = success;
    won = true;
    shieldReset();
    endThreat();
    if (success) {
        // SPEC 3.25: partial reward by the friendly's hull fraction at the
        // end (shield ignored on purpose — hull is what the mission was
        // actually protecting). A mediocre run that still gets the
        // friendly home pays out something, not all-or-nothing.
        var frac = mission.friendly.hp / mission.friendly.maxHp;
        var reward = Math.round(CFG.missionCredits * frac);
        profile.credits += reward;
        addRcs(CFG.rcsMission);   // SPEC 3.32: a chunk of reaction mass on success, full or partial
        // SPEC 3.23: favor at whichever station actually offered this
        // mission — was hardcoded to Station Meridian regardless (a
        // pre-existing bug this migration fixes in passing: a mission
        // taken at Station Two always credited Meridian's standing).
        // SPEC 3.54: a menu-launched drill has no station (poiName null) —
        // nothing to credit, gainFavor's own `poi` guard needs a falsy value,
        // not an object wrapping a null name.
        if (mission.poiName) gainFavor({ name: mission.poiName }, CFG.favorMission);
        // SPEC 3.71: escort and defend keep separate boards, both ranked by
        // the friendly's own hull percent at the end — a station-offered
        // mission records here too, same as a drill; only the debrief's
        // own options text differs by poiName (below).
        var hullPct = Math.round(frac * 100);
        var cleared = mission.cleared || 0;
        recordRun(mission.kind, { hullPct: hullPct, cleared: cleared, credits: reward,
                                   ownHullPct: Math.round(hull), seconds: Math.round(mission.elapsed) });
        saveProfile();
        setTimeout(function () { SIM.cues.play('win_fanfare'); }, 400);
        setTimeout(function () {
            // SPEC 3.54: a menu-launched drill (no poiName) replays on Enter,
            // same as every other standalone drill — the station-offered
            // version stays a one-shot, X the only way out. SPEC 3.70: the
            // shared debrief shell — station-offered and drill both get one,
            // just with different options text (3.70's own "station-offered
            // escort/defend — their own mission-complete lines split").
            var lastWaveLine = mission.kind === 'defend' ? ' Last wave cleared at ' + fmtTime(mission.elapsed) + '.' : '';
            openDebrief('Mission complete',
                [ mission.friendly.name + ' home at ' + hullPct + ' percent.' + lastWaveLine,
                  reward + ' credits earned, reaction mass topped up.',
                  cleared + (mission.kind === 'escort' ? (cleared === 1 ? ' drone cleared.' : ' drones cleared.')
                                                        : (cleared === 1 ? ' raider cleared.' : ' raiders cleared.')) ],
                mission.poiName ? 'X returns to the sector.' : 'Enter plays again, X for the mission menu.');
        }, 900);
    } else {
        // SPEC 3.23: missionEnd(false) only ever fires from missionStrike's
        // own f.hp<=0 branch — the friendly the port protects has just been
        // destroyed, the larger of the two favor losses the spec names
        // (favorFriendlyLost, not the plain favorFail an abandoned-but-
        // still-alive mission costs — see clearMission for that one).
        if (mission.poiName) loseFavor({ name: mission.poiName }, CFG.favorFriendlyLost);
        setTimeout(function () {
            openDebrief('Mission failed',
                [ mission.friendly.name + ' destroyed. No reward.' ],

// and everything reached from it) — SECTOR_POIS above is untouched and stays
// exactly what the delivery run uses (its legs are hand-tuned, A.10).
// Fixed points only: the combat zone and the asteroid fields are the moving
// parts, spawned by the rules below and saved in profile.quadrants, never
// listed here. Names are Brian's own placeholders (Part C, Phase 3
// questions) — rename any time; nothing else keys off the exact string
// except Station Meridian, already known by name from the delivery run.
// ring 0 = the star, at the origin. degPerHour 0 = holds station (both
// stations, the gate); planets creep at 6 deg/hour — a full orbit in 60
// play-hours, enough to drift over weeks, never enough to lose one in a
// session. Position is computed from the clock every frame (ringPos, below)
// — never integrated — so the save is nothing but these rates and phases.
var QUADRANT = [
    { name: 'The Star',         poiType: 'star',    desc: 'the star',
      ring: 0,     degPerHour: 0, phaseDeg: 0 },
    { name: 'Station Meridian', poiType: 'station', desc: 'space station',

// A field's type shapes its rock draw (makeMiningRoster) and is spoken at
// the sighting/hail; 'mixed' matches today's even spread. Weights and the
// per-type rock bias are both placeholders for Brian's ear.
var FIELD_TYPES = ['ice', 'iron', 'mixed'];
var FIELD_TYPE_WEIGHTS = [0.3, 0.3, 0.4];
var FIELD_TYPE_ROCK_WEIGHTS = {   // [Ice, Iron, Stone] draw weights, matching ROCK_TYPES order
    ice:   [0.6, 0.2, 0.2],
    iron:  [0.2, 0.6, 0.2],
    mixed: [0.34, 0.33, 0.33]
};
// Spawned fields walk this list from the top, Brian's own pick ("from
// Rho" — Kappa is the delivery run's own field, spelled for by name).
// Past the list a cycle number is appended so names never collide.
var GREEK_FIELD_NAMES = ['Rho', 'Sigma', 'Tau', 'Upsilon', 'Phi', 'Chi', 'Psi', 'Omega'];

function pickWeighted(items, weights) {
    var r = Math.random(), acc = 0;
    for (var i = 0; i < items.length; i++) {
        acc += weights[i];
        if (r < acc) return items[i];
    }
    return items[items.length - 1];
}

// The one place any orbiting thing (a QUADRANT planet, or a saved field —
// same ring/phaseDeg/degPerHour shape) turns into a world position, always
// from the persisted clock, never integrated frame to frame.
function ringPos(entry) {
    if (!entry.ring) return v3(0, 0, 0);
    var rad = (entry.phaseDeg + entry.degPerHour * (profile.clock / 3600)) * Math.PI / 180;
    return v3(Math.cos(rad) * entry.ring, 0, Math.sin(rad) * entry.ring);
}

function currentQuadrant() { return profile.quadrants[profile.quadrantId]; }

// Spawn placement (A.10 instance rules): near the pilot, clear of every
// other point, near a station, inside the quadrant. 50 tries on the pilot
// band; if none validate, 50 more anywhere in the quadrant (the rest of the
// rules still apply) before simply giving up and returning something inside
// the radius — a pilot band that can never be satisfied (a very crowded
// quadrant) still gets a field/zone rather than none at all.
function findSpawnPos(pilotPos, avoidPositions) {
    function candidate(nearPilot) {
        var ang = Math.random() * Math.PI * 2;
        if (nearPilot) {
            var d = CFG.spawnMinFromPilot + Math.random() * (CFG.spawnMaxFromPilot - CFG.spawnMinFromPilot);
            return add(pilotPos, v3(Math.cos(ang) * d, 0, Math.sin(ang) * d));
        }
        var r = Math.random() * CFG.quadrantRadius;
        return v3(Math.cos(ang) * r, 0, Math.sin(ang) * r);
    }
    function valid(pos) {
        if (len(pos) > CFG.quadrantRadius) return false;
        for (var i = 0; i < avoidPositions.length; i++) {
            if (len(sub(pos, avoidPositions[i])) < CFG.spawnMinGap) return false;
        }
        var nearStation = false;
        QUADRANT.forEach(function (q) {
            if (q.poiType === 'station' && len(sub(pos, ringPos(q))) <= CFG.spawnMaxFromStation) nearStation = true;
        });
        return nearStation;
    }
    var i;
    for (i = 0; i < 50; i++) { var p = candidate(true); if (valid(p)) return p; }
    for (i = 0; i < 50; i++) { var p2 = candidate(false); if (valid(p2)) return p2; }
    return candidate(false);
}

// Every fixed QUADRANT point plus the quadrant's own live zone and fields —
// what a spawn must stay spawnMinGap clear of.
function existingQuadrantPositions() {
    var pts = QUADRANT.map(ringPos);
    var q = currentQuadrant();
    // Guarded (not just `if (q)`): ensureQuadrantHome creates the shell
    // and assigns profile.quadrants.home BEFORE the zone itself exists, so
    // spawnZone's own call into here (via findSpawnPos) can land in the
    // instant between those two steps, with q real but q.zone still null.
    if (q && q.zone) pts.push(v3(q.zone.pos.x, q.zone.pos.y, q.zone.pos.z));
    if (q) q.fields.forEach(function (f) { pts.push(ringPos(f)); });
    return pts;
}

function spawnZone(pilotPos) {
    var pos = findSpawnPos(pilotPos, existingQuadrantPositions());
    return { name: 'Contested Zone', pos: { x: pos.x, y: pos.y, z: pos.z } };
}

// A field drifts prograde along the ring it spawned on (A.10:
// cloudDriftPerS, a LINEAR speed, converted to degrees/hour for the same
// ringPos formula planets use — about 300 a minute, a third of an orbit an
// hour on the inner rings, exactly as spec'd).
function spawnField(pilotPos) {
    var q = currentQuadrant();
    var pos = findSpawnPos(pilotPos, existingQuadrantPositions());
    var ring = Math.max(1, len(pos));
    var phaseDeg = Math.atan2(pos.z, pos.x) * 180 / Math.PI;
    var degPerHour = (CFG.cloudDriftPerS / ring) * (180 / Math.PI) * 3600;
    var seq = q.fieldSeq || 0;
    q.fieldSeq = seq + 1;
    var cycle = Math.floor(seq / GREEK_FIELD_NAMES.length);
    var name = 'Asteroid Field ' + GREEK_FIELD_NAMES[seq % GREEK_FIELD_NAMES.length] +
               (cycle > 0 ? ' ' + (cycle + 1) : '');
    return { name: name, type: pickWeighted(FIELD_TYPES, FIELD_TYPE_WEIGHTS),
             ring: ring, phaseDeg: phaseDeg, degPerHour: degPerHour, budget: CFG.cloudOreBudget };
}

// First-ever Sector visit for this profile: create the home quadrant, using
// Station Meridian's own position as the "pilot position" the first
// zone/fields spawn near — there's no real ship position yet in the sector
// frame at this point, and starting near home matches placeAtStationStart's
// own idea (new pilots begin just outside Meridian).
// SPEC 3.23: guarded on `.zone` rather than the record's mere existence —
// loadProfile's own v5->v6 migration now pre-creates a bare quadrant shell
// (zone: null, fields: [], ports: {...migrated favor}) purely to hold
// favor data folded in from an old save, for a profile that's never
// actually visited the Sector; a real first visit still needs to spawn
// the zone/fields here rather than finding them already "done".
function ensureQuadrantHome() {
    if (!profile.quadrants.home) profile.quadrants.home = { zone: null, fields: [], fieldSeq: 0, ports: {} };
    var home = profile.quadrants.home;
    if (!home.ports) home.ports = {};
    if (home.zone) return;
    profile.quadrantId = 'home';
    var meridian = QUADRANT.filter(function (q) { return q.name === 'Station Meridian'; })[0];
    var originPos = ringPos(meridian);
    home.zone = spawnZone(originPos);
    for (var i = 0; i < CFG.quadrantFieldCount; i++) home.fields.push(spawnField(originPos));
    saveProfile();
}

// The quadrant's points as plain data (no audio nodes) — used both to build
// the live sector-mode roster (makeQuadrantRoster adds voices on top) and to
// list "depart to X" points from inside an encounter, where spinning up a
// fresh voice per point just to populate a map line would be wasted nodes.
function quadrantPoiList() {
    ensureQuadrantHome();
    var q = currentQuadrant();
    var list = QUADRANT.map(function (entry) {
        return { kind: 'poi', name: entry.name, poiType: entry.poiType, desc: entry.desc,
                  pos: ringPos(entry), alive: true, beaconAsset: entry.beaconAsset };
    });
    list.push({ kind: 'poi', name: q.zone.name, poiType: 'combat', desc: 'combat area',
                pos: v3(q.zone.pos.x, q.zone.pos.y, q.zone.pos.z), alive: true });
    q.fields.forEach(function (f) {
        list.push({ kind: 'poi', name: f.name, poiType: 'mining', desc: 'mining area',
                    pos: ringPos(f), alive: true, fieldType: f.type, fieldBudget: f.budget });
    });
    return list;
}

function makeQuadrantRoster() {
    var list = quadrantPoiList();
    list.forEach(function (t) { buildPoiVoice(t); });
    return list;
}

// The nearest real planet/field, for mission flavor text (SPEC 2.17's
// escort/defend labels) — the delivery run keeps naming its own Planet
// Auren / Field Kappa; the open quadrant never advertises a place that
// isn't actually there.
function missionDestinationPlanet() {
    if (demo) return 'Planet Auren';
    var best = null, bestD = Infinity;
    QUADRANT.forEach(function (q) {
        if (q.poiType !== 'planet') return;
        var d = len(sub(ringPos(q), ship.pos));
        if (d < bestD) { bestD = d; best = q.name; }
    });
    return best || 'the nearest planet';
}
function missionDestinationField() {
    if (demo) return 'Field Kappa';
    var q = currentQuadrant();
    return (q && q.fields.length) ? q.fields[0].name : 'the nearest field';
}

// The station nearest a given position, for the tug (SPEC 2.16) now that
// there can be more than one — the delivery run's fixed sector still only
// ever has Station Meridian, so it stays the answer there unconditionally.
function nearestStationTo(pos) {
    if (demo) {
        var s = null;
        SECTOR_POIS.forEach(function (p) { if (p.poiType === 'station') s = p; });
        return s ? { name: s.name, pos: v3(s.pos.x, s.pos.y, s.pos.z) } : null;
    }
    var best = null, bestD = Infinity;
    QUADRANT.forEach(function (q) {
        if (q.poiType !== 'station') return;
        var d = len(sub(ringPos(q), pos));
        if (d < bestD) { bestD = d; best = { name: q.name, pos: ringPos(q) }; }
    });
    return best;
}

// A field's fullness in words — never the raw budget number, matching every
// other hidden-threshold readout in this codebase.
function fieldFullnessWord(budget) {
    var pct = Math.max(0, budget) / CFG.cloudOreBudget;
    return pct > 0.6 ? 'plenty' : pct > 0.25 ? 'thinning' : 'nearly worked out';
}
function fieldKindWord(type) { return type === 'mixed' ? 'mixed deposit' : type + '-rich'; }
function fieldTypeNote(t) {
    if (!t.fieldType) return '';
    return ' ' + capFirst(fieldKindWord(t.fieldType)) + ', ' + fieldFullnessWord(t.fieldBudget) + '.';
}

function findTargetByName(name) {
    for (var i = 0; i < targets.length; i++) if (targets[i].name === name) return targets[i];
    return null;
}

function zoneRad() {
    var z = ZONES[zoneIdx], k = Math.PI / 180;
    // SPEC 3.27: a half-broken targeting sensor narrows the LOCK zone only
    // (not the laser-aim or missile cones, which belong to their own
    // separately-breakable systems).
    // SPEC 3.63: inside the nebula, the sensor reads the same "half" state

    var sensorMult = (systemState('sensor') === 'half' || insideNebula()) ? CFG.repairSensorPct : 1;
    return { laser: z.laser * k, lockOn: z.lockOn * k * sensorMult,
             lockOff: z.lockOff * k * sensorMult, missile: z.missile * k };
}

// ============================== 3. MATH =====================================
function v3(x, y, z) { return { x: x, y: y, z: z }; }
function add(a, b)   { return v3(a.x + b.x, a.y + b.y, a.z + b.z); }
function sub(a, b)   { return v3(a.x - b.x, a.y - b.y, a.z - b.z); }
function scale(a, s) { return v3(a.x * s, a.y * s, a.z * s); }
function dot(a, b)   { return a.x * b.x + a.y * b.y + a.z * b.z; }
function len(a)      { return Math.sqrt(dot(a, a)); }
function norm(a)     { var l = len(a); return l > 1e-9 ? scale(a, 1 / l) : v3(0, 0, -1); }
function clamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }
function cross(a, b) { return v3(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x); }
window.clamp = clamp;   // audio_engine.js (a separate top-level script, outside
                        // this closure) needs it for panning math.

// Ship basis. yaw 0 / pitch 0 faces -Z (Web Audio native forward).
// Positive yaw = nose right, positive pitch = nose up.
function shipForward() {
    var cy = Math.cos(ship.yaw), sy = Math.sin(ship.yaw);
    var cp = Math.cos(ship.pitch), sp = Math.sin(ship.pitch);
    return v3(sy * cp, sp, -cy * cp);
}
function shipUp() {
    var cy = Math.cos(ship.yaw), sy = Math.sin(ship.yaw);
    var cp = Math.cos(ship.pitch), sp = Math.sin(ship.pitch);
    return v3(-sy * sp, cp, cy * sp);
}
function shipRight() {
    return v3(Math.cos(ship.yaw), 0, Math.sin(ship.yaw));
}

// Angular relationship between the nose and a world point.
function aim(pos) {
    var dir = norm(sub(pos, ship.pos));
    var f = dot(dir, shipForward());
    var r = dot(dir, shipRight());
    var u = dot(dir, shipUp());
    return {
        err: Math.acos(clamp(f, -1, 1)),      // total angular error
        azimuth: Math.atan2(r, f),            // + = target to the right
        elev: Math.asin(clamp(u, -1, 1)),     // + = target above
        facing: f,                            // dot(forward, dir) for the lowpass
        dist: len(sub(pos, ship.pos))
    };
}

function deg(rad) { return rad * 180 / Math.PI; }
function round5(x) { return Math.round(x / 5) * 5; }
function round10(x) { return Math.round(x / 10) * 10; }

var BEGIN_LINE = 'The Silence. Press Enter to begin. Wear headphones.';

// One voice. aria-live assertive gives free barge-in through NVDA's own synth.
function say(text) {
    if (!liveEl) return;
    var t = String(text || '');
    // The same string twice in a row can be dropped by a screen reader, so a
    // hair space is alternated on to force it to speak again.
    if (liveEl.textContent === t) t = t + ' ';
    liveEl.textContent = t;
}

function prettyKey(name) {
    var map = { ' ': 'Space', arrowleft: 'Left arrow', arrowright: 'Right arrow',
                arrowup: 'Up arrow', arrowdown: 'Down arrow', enter: 'Enter',
                escape: 'Escape', pageup: 'Page Up', pagedown: 'Page Down' };
    var k = String(name).toLowerCase();
    if (map[k]) return map[k];
    return name.length === 1 ? name.toUpperCase() : name;
}

function buildHelpLines() {
    var lines = [];
    HELP_SECTIONS.forEach(function (s) {
        lines.push({ text: s.heading + ', heading.', heading: true });
        s.items.forEach(function (it) {
            lines.push({ text: typeof it === 'function' ? it() : it, heading: false });
        });
    });
    return lines;
}

function openHelp() {
    help.open = true;
    help.idx = -1;
    help.lines = buildHelpLines();
    keysDown = {};
    thrusterSync(null);
    stopBeam(true);
    if (SIM.audio.ctx && SIM.audio.masterGain && !menuOpen) SIM.audio.ramp(SIM.audio.masterGain.gain, 0.0001, 0.2);
    say('Help. ' + HELP_SECTIONS.length + ' sections, ' + help.lines.length +
        ' lines. Down arrow reads line by line, H jumps to the next heading, Escape closes.');
}

function closeHelp() {
    help.open = false;
    if (SIM.audio.ctx && SIM.audio.masterGain && !menuOpen) SIM.audio.ramp(SIM.audio.masterGain.gain, CFG.masterGain, 0.2);
    say('Help closed.' + (menuOpen ? ' Mission menu still open.' : ''));
}

function helpSpeakLine() {
    var ln = help.lines[help.idx];
    if (ln) say(ln.text);
}

function helpKey(lname, shift) {
    if (lname === 'escape' || lname === 'f1') { closeHelp(); return; }
    if (lname === 'arrowdown') {
        if (help.idx < help.lines.length - 1) { help.idx++; helpSpeakLine(); }
        else { SIM.audio.blip(220, 80, 0.1); say('End of help. Escape closes.'); }
    } else if (lname === 'arrowup') {
        if (help.idx > 0) { help.idx--; helpSpeakLine(); }
        else { help.idx = 0; SIM.audio.blip(220, 80, 0.1); say('Top of help.'); }
    } else if (lname === 'h') {
        var i = help.idx;
        if (shift) {
            for (i = help.idx - 1; i >= 0; i--) if (help.lines[i].heading) break;
            if (i < 0) { SIM.audio.blip(220, 80, 0.1); say('No previous heading.'); return; }
        } else {
            for (i = help.idx + 1; i < help.lines.length; i++) if (help.lines[i].heading) break;
            if (i >= help.lines.length) { SIM.audio.blip(220, 80, 0.1); say('No next heading.'); return; }
        }
        help.idx = i; helpSpeakLine();
    } else if (lname === 'home') {
        help.idx = 0; helpSpeakLine();
    } else if (lname === 'end') {
        help.idx = help.lines.length - 1; helpSpeakLine();
    } else {
        say('That key does nothing in help. Up and down arrows read, H jumps headings, Escape closes.');
    }
}

// ============================== 5. AUDIO ====================================
// The generic Web Audio layer (context, buses, the recorded-asset bank, the
// tone/noise/chord/echo/sweep primitives) now lives in audio_engine.js as
// SIM.audio — everything below here is audio that's actually SHAPED BY
// LIVE SIMULATION STATE every frame (ship/rock/beacon voices, the laser
// beam, the lock tick, thrusters), which is why it stays here rather than
// moving with the generic layer. Discrete one-shot "moments" (explosions,
// chimes, launches, warnings) live in audio_cues.js as SIM.cues, dispatched
// by name so they can be swapped for recorded/engineered sound later
// without touching this file.

// The listener is the ship. Position and orientation ramped every frame.
function updateListener() {
    if (!SIM.audio.ctx) return;
    var L = SIM.audio.ctx.listener, f = shipForward(), u = shipUp();
    if (L.positionX) {
        SIM.audio.ramp(L.positionX, ship.pos.x); SIM.audio.ramp(L.positionY, ship.pos.y); SIM.audio.ramp(L.positionZ, ship.pos.z);
        SIM.audio.ramp(L.forwardX, f.x); SIM.audio.ramp(L.forwardY, f.y); SIM.audio.ramp(L.forwardZ, f.z);
        SIM.audio.ramp(L.upX, u.x); SIM.audio.ramp(L.upY, u.y); SIM.audio.ramp(L.upZ, u.z);
    } else {
        if (L.setPosition) L.setPosition(ship.pos.x, ship.pos.y, ship.pos.z);
        if (L.setOrientation) L.setOrientation(f.x, f.y, f.z, u.x, u.y, u.z);
    }
}

// Build a target's continuous voice:
//   osc(s) [+LFO] -> gain -> lowpass -> HRTF panner -> master
// Each simultaneous HRTF panner costs a pair of short convolutions; the demo
// runs 6-8 at once, and ~30 would still be comfortable on a modern machine,
// so a full sim has plenty of headroom.
function buildVoice(t) {
    if (!SIM.audio.ctx) return;
    var voice = t.voice;
    var gain = SIM.audio.ctx.createGain();
    gain.gain.value = CFG.targetGain;
    var lp = SIM.audio.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = CFG.lpMax;
    var panner = SIM.audio.makePanner(t.pos);
    // SPEC 3.58 (ideas14.txt): a combat ship's engine is directional, oriented
    // by its own `facing` yaw (turned toward its motion, or toward the pilot
    // before it fires — stepCombatShips) — brighter when it's turned toward
    // you, which is the "it's turning to shoot" tell. `t.kind` is falsy only
    // for combat ships (rocks/POIs/friendlies all set it), so this never
    // touches anything else's voice.
    if (!t.kind) {
        panner.coneInnerAngle = CFG.enemyConeInner;
        panner.coneOuterAngle = CFG.enemyConeOuter;
        panner.coneOuterGain = CFG.enemyConeOuterGain;
    }
    gain.connect(lp); lp.connect(panner); panner.connect(SIM.audio.worldBus);

    // Recorded engine loop when available (same loop hygiene as the rocks:
    // skip the MP3 padding, random start offset so ships don't phase-lock).
    if (t.shipAsset && SIM.audio.assetBufs[t.shipAsset.name]) {
        var buf = SIM.audio.assetBufs[t.shipAsset.name];
        var src = SIM.audio.ctx.createBufferSource();
        src.buffer = buf; src.loop = true;
        src.loopStart = 0.15; src.loopEnd = buf.duration - 0.15;
        src.playbackRate.value = t.shipAsset.rate * (0.97 + Math.random() * 0.06);
        t.baseRate = src.playbackRate.value;
        src.connect(gain);
        src.start(0, 0.15 + Math.random() * (buf.duration - 0.5));
        t.nodes = { gain: gain, lp: lp, panner: panner, oscs: [src], src: src };
        return;
    }
    // Not decoded yet (SPEC 2.19): kick off the fetch for next time and
    // fall through to the synthesized voice below for this one.
    if (t.shipAsset) SIM.audio.load(t.shipAsset.name);

    var oscs = [], lfos = [];
    function osc(type, freq) {
        var o = SIM.audio.ctx.createOscillator();
        o.type = type; o.frequency.value = freq;
        oscs.push(o); return o;
    }
    if (voice.type === 'beat') {
        osc('sine', voice.freq).connect(gain);
        osc('sine', voice.freq * 2.02).connect(gain);
    } else if (voice.type === 'detuned') {
        var a = osc('sawtooth', voice.freq), b = osc('sawtooth', voice.freq);
        b.detune.value = 7;
        a.connect(gain); b.connect(gain);
    } else {
        osc(voice.type, voice.freq).connect(gain);
    }
    if (voice.trem) {              // amplitude LFO
        var lg = SIM.audio.ctx.createGain(); lg.gain.value = CFG.targetGain * 0.5;
        var lo = SIM.audio.ctx.createOscillator(); lo.frequency.value = voice.trem;
        lo.connect(lg); lg.connect(gain.gain); lfos.push(lo);
    }
    if (voice.vib) {               // frequency LFO on the first oscillator
        var vg = SIM.audio.ctx.createGain(); vg.gain.value = voice.vibDepth || 10;
        var vo = SIM.audio.ctx.createOscillator(); vo.frequency.value = voice.vib;
        vo.connect(vg); vg.connect(oscs[0].frequency); lfos.push(vo);
    }
    oscs.concat(lfos).forEach(function (o) { o.start(); });
    t.nodes = { gain: gain, lp: lp, panner: panner, oscs: oscs.concat(lfos) };
}

function stopVoice(t) {
    // SPEC 3.73: the shadow's own thrust recording rides the SAME panner
    // (t.nodes.panner) disconnected below, so it goes silent either way —
    // this just cancels its own pending fade/stop timers too, so nothing
    // stray fires later against an already-torn-down node.
    if (t.thrustNodes) stopShadowThrust(t);
    if (!t.nodes) return;
    try {
        t.nodes.oscs.forEach(function (o) { o.stop(); });
        t.nodes.panner.disconnect();
    } catch (e) {}
    t.nodes = null;
}

// A rock's voice is its recorded loop: buffer -> gain -> lowpass -> HRTF
// panner, exactly the shape of a combat voice so the tick, radar boost, and
// behind-the-hull filter all work unchanged. playbackRate carries size (big
// rocks rumble low, chips sing high) — and it is an AudioParam, so a chip
// event can audibly RAISE the same rock's pitch. loopStart/End skip the MP3
// encoder padding so the loop never clicks, and a random start offset keeps
// two rocks of the same type from playing in lockstep.
function buildRockVoice(t) {
    if (!SIM.audio.ctx) return;
    if (!SIM.audio.assetBufs[t.type.asset]) { SIM.audio.load(t.type.asset); return; }
    var buf = SIM.audio.assetBufs[t.type.asset];
    var gain = SIM.audio.ctx.createGain();
    gain.gain.value = CFG.targetGain * 1.15;
    var lp = SIM.audio.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = CFG.lpMax;
    var panner = SIM.audio.makePanner(t.pos);
    gain.connect(lp); lp.connect(panner); panner.connect(SIM.audio.worldBus);
    var src = SIM.audio.ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    src.loopStart = 0.15; src.loopEnd = buf.duration - 0.15;
    src.playbackRate.value = rockRate(t) * (0.95 + Math.random() * 0.1);
    src.connect(gain);
    src.start(0, 0.15 + Math.random() * (buf.duration - 0.5));
    t.nodes = { gain: gain, lp: lp, panner: panner, oscs: [src], src: src };
}

// Called when a rock collapses into its mineable core (this round): swaps
// the voice from the pre-core type loop to one of two per-type core
// recordings (ROCK_TYPES[].coreAssets), crossfaded in through a second
// gain feeding the SAME lowpass/panner the rock already has — a real
// voice change, not just the old pitch-ramp-on-the-same-loop. Returns
// false (no swap) if the asset isn't decoded yet, kicking off its load
// for next time; the caller's own pitch-ramp is the fallback for this rock.
function swapRockCoreVoice(t) {
    var A = SIM.audio;
    if (!A.ctx || !t.nodes) return false;
    var pool = t.type.coreAssets;
    var key = pool[Math.floor(Math.random() * pool.length)];
    if (!A.assetBufs[key]) { A.load(key); return false; }
    var buf = A.assetBufs[key];
    var newGain = A.ctx.createGain(); newGain.gain.value = 0.0001;
    var newSrc = A.ctx.createBufferSource();
    newSrc.buffer = buf; newSrc.loop = true;
    newSrc.loopStart = 0.15; newSrc.loopEnd = buf.duration - 0.15;
    newSrc.connect(newGain); newGain.connect(t.nodes.lp);
    newSrc.start(0, 0.15 + Math.random() * (buf.duration - 0.5));
    A.ramp(newGain.gain, CFG.targetGain * 1.15, 0.6);
    var oldGain = t.nodes.gain, oldSrc = t.nodes.src;
    A.ramp(oldGain.gain, 0.0001, 0.6);
    setTimeout(function () { try { oldSrc.stop(); oldGain.disconnect(); } catch (e) {} }, 700);
    t.nodes.src = newSrc; t.nodes.gain = newGain; t.nodes.oscs = [newSrc];
    return true;
}

function rockRate(t) { return t.resource ? 1.6 : ROCK_SIZES[t.size].rate; }

function rollHp(size) {
    var s = ROCK_SIZES[size];
    return s.hpMin + Math.floor(Math.random() * (s.hpMax - s.hpMin));
}

function spawnRock(type, size, pos, vel) {
    rockSeq++;
    var t = {
        kind: 'rock',
        name: type.name + ' ' + rockSeq,
        type: type, size: size, resource: false,
        hp: rollHp(size),
        oreLeft: 0,
        pos: pos, vel: vel || v3(0, 0, 0),
        alive: true
    };
    buildRockVoice(t);
    return t;
}

// fieldType (SPEC 3.10, optional): a QUADRANT field's type biases the rock
// draw (FIELD_TYPE_ROCK_WEIGHTS) instead of the plain even split. Kappa's
// own call (no argument — the delivery run, or the standalone drill) is
// byte-for-byte what it always was, first-rock-always-Ice quirk included.
function makeMiningRoster(fieldType) {
    rockSeq = 0;
    var rocks = [];
    var plan = [0, 1, 1, 2];   // one huge, two large, one medium
    plan.forEach(function (size, i) {
        var type = fieldType ? pickWeighted(ROCK_TYPES, FIELD_TYPE_ROCK_WEIGHTS[fieldType])
                              : ROCK_TYPES[Math.floor(Math.random() * ROCK_TYPES.length)];
        if (i === 0 && !fieldType) type = ROCK_TYPES[i % ROCK_TYPES.length];
        var ang = Math.random() * Math.PI * 2;
        var r = 250 + Math.random() * 200;
        var pos = v3(Math.cos(ang) * r, -120 + Math.random() * 240, Math.sin(ang) * r);
        var drift = v3(Math.random() * 8 - 4, Math.random() * 4 - 2, Math.random() * 8 - 4);
        rocks.push(spawnRock(type, size, pos, drift));
    });
    return rocks;
}

// Beacon voices. Same node shape as every other voice (gain -> lowpass ->
// HRTF panner) so the tick, radar, and behind-the-hull muffle all work, but
// the panner uses long-range sensor params so a beacon 15,000 out is still
// faintly audible. Each POI type has an unmistakable signature.
// Per-type beacon volume: every POI shares the base beacon gain except the
// station, which runs at a fraction of it — used both when the voice is
// built and when the radar ping restores each beacon to its own resting
// level, so the two never drift apart.
function poiGain(t) {
    var g = CFG.targetGain * CFG.beaconGainScale;
    return t.poiType === 'station' ? g * CFG.stationBeaconScale : g;
}

function buildPoiVoice(t) {
    if (!SIM.audio.ctx) return;
    var G = poiGain(t);
    var gain = SIM.audio.ctx.createGain();
    gain.gain.value = G;
    var lp = SIM.audio.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = CFG.lpMax;
    var panner = SIM.audio.makePanner(t.pos);
    panner.refDistance = CFG.beaconRef;
    panner.maxDistance = CFG.beaconMax;
    panner.rolloffFactor = CFG.beaconRolloff;
    // Phase 3L, L.9: the gate's beacon is directional — a cone sweeping a
    // full turn every gateSweepS (updateTargeting), loudest when the beam
    // points at you. The outer gain floors rather than zeros — silence is
    // a bug, and beacon mode's "target only" setting still has to find it.
    if (t.poiType === 'gate') {
        panner.coneInnerAngle = CFG.gateConeInner;
        panner.coneOuterAngle = CFG.gateConeOuter;
        panner.coneOuterGain = CFG.gateConeOuterGain;
        t.gatePhase = 0;
    }
    // Beacon mode's mute sits after the tremolo — the LFO is summed INTO
    // gain.gain, so zeroing that gain would still swing it by the depth.
    var mute = SIM.audio.ctx.createGain();
    mute.gain.value = beaconAudible(t) ? 1 : 0;
    gain.connect(lp); lp.connect(mute); mute.connect(panner); panner.connect(SIM.audio.worldBus);
    var oscs = [];
    var nodes = { gain: gain, lp: lp, mute: mute, panner: panner, oscs: oscs };
    function osc(type, freq) {
        var o = SIM.audio.ctx.createOscillator();
        o.type = type; o.frequency.value = freq;
        oscs.push(o); return o;
    }
    function tremolo(rate, depth, lfoType) {
        var lg = SIM.audio.ctx.createGain(); lg.gain.value = depth;
        var lo = osc(lfoType || 'sine', rate);
        lo.connect(lg); lg.connect(gain.gain);
    }
    // SPEC 3.31: a recorded beacon REPLACES the synthesized voice below
    // entirely (it already has its own character) — same gain/lowpass/
    // mute/panner chain as every synthesized beacon, so B, the distance
    // haze, and the gate's own cone all still apply. Loads async — guarded
    // against the target having already been torn down by the time the
    // fetch lands (stopVoice nulls t.nodes; a stale nodes reference here
    // means don't start a source nothing will ever stop).
    if (t.beaconAsset) {
        SIM.audio.load(t.beaconAsset).then(function (buf) {
            if (t.nodes !== nodes) return;
            var src = SIM.audio.ctx.createBufferSource();
            src.buffer = buf; src.loop = true;
            src.connect(gain);
            src.start();
            oscs.push(src);
        }).catch(function () {});
    } else if (t.poiType === 'combat') {
        // Low menacing war-drum throb.
        osc('sawtooth', 70).connect(gain);
        tremolo(1.2, G * 0.6);
    } else if (t.poiType === 'mining') {
        // Distant rockfall rumble: deep noise through a tight lowpass.
        var src = SIM.audio.ctx.createBufferSource(); src.buffer = SIM.audio.noiseBuf; src.loop = true;
        var rlp = SIM.audio.ctx.createBiquadFilter();
        rlp.type = 'lowpass'; rlp.frequency.value = 220;
        src.connect(rlp); rlp.connect(gain);
        oscs.push(src);
        tremolo(0.7, G * 0.5);
    } else if (t.poiType === 'station') {
        // Friendly rhythmic nav beacon: clean tone gated on and off.
        // Placeholder until every station has a beaconAsset (SPEC 3.31).
        osc('sine', 660).connect(gain);
        tremolo(1.8, G, 'square');
    } else if (t.poiType === 'gate') {
        // Placeholder until every gate has a beaconAsset (SPEC 3.31).
        osc('sawtooth', 55).connect(gain);
        tremolo(0.15, G * 0.4);
    } else if (t.poiType === 'haulHome') {
        // SPEC 3.60: a warm, steady welcoming tone — distinct from the
        // station's own gated beacon, since "bring it home" wants something
        // inviting rather than a nav-fix chirp.
        osc('triangle', 300).connect(gain);
        var haulB = osc('triangle', 300 * 1.5); haulB.connect(gain);
        tremolo(0.5, G * 0.3);
    } else if (t.poiType === 'course') {
        // SPEC 3.41: one clean tone per gate, each detuned a little by its
        // own index ("slight variations between the tones") so a run of
        // gates is tell-apart-able by ear, not just by number.
        osc('sine', 500 + t.gateIndex * 35).connect(gain);
        tremolo(2.2, G * 0.5, 'triangle');
    } else if (t.poiType === 'star') {
        // The compass point: a very low, steady drone with a slow flicker —
        // audible everywhere via the same long beaconMax every POI shares.
        osc('sine', 30).connect(gain);
        tremolo(0.2, G * 0.3);
    } else if (t.poiType === 'corona') {
        // SPEC 3.74: the same star drone, up close and brighter — a
        // second, higher oscillator and a faster, deeper flicker mark
        // "you are inside it now" apart from the compass-point beacon.
        osc('sine', 30).connect(gain);
        osc('sine', 62).connect(gain);
        tremolo(0.9, G * 0.6);
    } else {
        // Planet: vast, slow atmospheric drone with a lazy shimmer.
        osc('sine', 45).connect(gain);
        var b = osc('sine', 45 * 2.01); b.connect(gain);
        tremolo(0.25, G * 0.35);
    }
    oscs.forEach(function (o) { o.start(); });
    t.nodes = nodes;
}

// Whether a beacon should sound under the current B setting. The mute
// follows this every frame in updateTargeting, so a selection change (Tab,
// the map, a mission start) takes effect without any call site knowing.
function beaconAudible(t) {
    if (docked) return false;   // ideas6: inside the station, the beacons are outside
    if (beaconMode === 'target') return targets[selected] === t;
    if (beaconMode !== 'on') return false;
    // SPEC 3.10: the delivery run's fixed four-point sector stays
    // always-audible when "on" — unchanged, already tested. The open
    // quadrant's ten points get a distance cutoff instead (the selected
    // target is always audible regardless), so "on" isn't a beacon soup.
    if (demo) return true;
    return targets[selected] === t || len(sub(t.pos, ship.pos)) <= CFG.beaconAudibleDist;
}

// Push every beacon's mute to beaconAudible() right now. updateTargeting
// does this every live frame; this is for the moments the sim is frozen
// (docking — simTick returns early while docked, so the frame loop never
// gets to silence them).
function applyBeaconMutes() {
    if (!SIM.audio.ctx) return;
    targets.forEach(function (t) {
        if (t.kind === 'poi' && t.nodes && t.nodes.mute) {
            t.nodes.mute.gain.setTargetAtTime(beaconAudible(t) ? 1 : 0, SIM.audio.ctx.currentTime, 0.15);
        }
    });
}

// SPEC 3.44: beaconKey() (B's own direct cycle) is gone — B is the tractor
// now. The Sound menu's own Beacons line (SPEC 3.45) is the only way left
// to change beaconMode; beaconModeText() below still backs it.
function beaconModeText() {
    for (var k = 0; k < BEACON_MODES.length; k++) if (BEACON_MODES[k].id === beaconMode) return BEACON_MODES[k].say;
    return 'Beacons: on.';
}

// Read back at sector entry when the beacons aren't simply on, so a quiet
// sector is never a mystery.
function beaconNote() {
    return beaconMode === 'on' ? '' : ' ' + beaconModeText() + ' The Sound menu cycles them.';
}

function makeSectorRoster() {
    // ideas6: the station interior loop is only ever needed after a
    // docking, so it's fetched here (cached/coalesced — cheap to repeat on
    // every sector re-entry) rather than in the boot preload set.
    if (SIM.audio.ctx) SIM.audio.load('station_interior1').catch(function () {});
    // SPEC 3.10: the delivery run keeps its fixed four-point sector
    // (SECTOR_POIS, untouched); the open campaign gets the moving quadrant.
    if (demo) {
        return SECTOR_POIS.map(function (p) {
            var t = { kind: 'poi', name: p.name, poiType: p.poiType, desc: p.desc,
                      pos: v3(p.pos.x, p.pos.y, p.pos.z), alive: true, beaconAsset: p.beaconAsset };
            buildPoiVoice(t);
            return t;
        });
    }
    return makeQuadrantRoster();
}

// ---- maneuvering thrusters --------------------------------------------------
// One little looped-noise puffer per control, running while its key is held.
// The pairs are deliberately mismatched — left vs right and up vs down sit at
// slightly different band frequencies (and yaw pans toward the turn) so each
// maneuver is audibly its own sound before the world even responds. The main
// drive (W) and retro brake (S) also carry a low hum at different pitches.
// Physically honest jets: the sound comes from the thruster doing the work,
// which sits OPPOSITE the motion. Turn left → right-side jets (panned right).
// Pitch up → belly jets firing downward (the low voice). Thrust forward →
// the aft engines behind you (deep). Brake → forward retros (bright).
var THRUSTER_DEFS = {
    arrowleft:  { freq: 950,  pan:  0.6, vol: 0.05 },
    arrowright: { freq: 1080, pan: -0.6, vol: 0.05 },
    arrowup:    { freq: 720,  pan:  0,   vol: 0.05 },
    arrowdown:  { freq: 1350, pan:  0,   vol: 0.045 },
    w:          { freq: 500,  pan:  0,   vol: 0.07, hum: 82 },   // aft engines
    s:          { freq: 170,  pan:  0,   vol: 0.09, hum: 55 }    // fore retros
};
var thrusters = {};   // live nodes per channel

function thrusterStart(name) {
    if (!SIM.audio.ctx || thrusters[name]) return;
    var def = THRUSTER_DEFS[name];
    var g = SIM.audio.ctx.createGain(); g.gain.value = 0.0001;
    var src = SIM.audio.ctx.createBufferSource(); src.buffer = SIM.audio.noiseBuf; src.loop = true;
    var f = SIM.audio.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = def.freq; f.Q.value = 1.2;
    src.connect(f); f.connect(g);
    if (SIM.audio.ctx.createStereoPanner) {
        var sp = SIM.audio.ctx.createStereoPanner(); sp.pan.value = def.pan;
        g.connect(sp); sp.connect(SIM.audio.uiBus);
    } else g.connect(SIM.audio.uiBus);
    var hum = null;
    if (def.hum) {
        hum = SIM.audio.ctx.createOscillator(); hum.type = 'triangle'; hum.frequency.value = def.hum;
        hum.connect(g); hum.start();
    }
    src.start();
    thrusters[name] = { src: src, hum: hum, g: g };
    SIM.audio.ramp(g.gain, def.vol, 0.08);
}

function thrusterStop(name) {
    var n = thrusters[name];
    if (!n) return;
    delete thrusters[name];
    SIM.audio.ramp(n.g.gain, 0.0001, 0.12);
    setTimeout(function () {
        try { n.src.stop(); if (n.hum) n.hum.stop(); n.g.disconnect(); } catch (e) {}
    }, 220);
}

// Match the sounding set to what is actually held; pass null to silence all.
function thrusterSync(held) {
    for (var name in THRUSTER_DEFS) {
        var wantOn = !!(held && held[name]);
        if (wantOn && !thrusters[name]) thrusterStart(name);
        if (!wantOn && thrusters[name]) thrusterStop(name);
    }
}

// ---- automatic stabilizers --------------------------------------------------
// This is a space sim people can PLAY, not a Newtonian flight sim: nobody
// should have to counter their own thrust. Mechanically the ship already
// bleeds momentum every frame (dampKeep); the stabilizers make that audible
// and diegetic — soft pulsing jets that fire on their own after you coast,
// fading out as the ship settles. Silence means you have stopped.
var stabNodes = null;

function updateStabilizers(speedToShed) {
    if (!SIM.audio.ctx) return;
    if (speedToShed > 0 && !stabNodes) {
        var g = SIM.audio.ctx.createGain(); g.gain.value = 0.0001;
        var f = SIM.audio.ctx.createBiquadFilter();
        f.type = 'bandpass'; f.frequency.value = 1150; f.Q.value = 1.5;
        var src = SIM.audio.ctx.createBufferSource(); src.buffer = SIM.audio.noiseBuf; src.loop = true;
        var lfo = SIM.audio.ctx.createOscillator(); lfo.frequency.value = 5;   // puff-puff
        var lg = SIM.audio.ctx.createGain(); lg.gain.value = 0.0;
        lfo.connect(lg); lg.connect(g.gain);
        src.connect(f); f.connect(g); g.connect(SIM.audio.uiBus);
        src.start(); lfo.start();
        stabNodes = { src: src, lfo: lfo, lg: lg, g: g };
    }
    if (stabNodes) {
        if (speedToShed > 0) {
            var vol = 0.006 + clamp(speedToShed / CFG.maxSpeed, 0, 1) * 0.04;
            SIM.audio.ramp(stabNodes.g.gain, vol, 0.2);
            SIM.audio.ramp(stabNodes.lg.gain, vol * 0.6, 0.2);
        } else {
            var n = stabNodes; stabNodes = null;
            SIM.audio.ramp(n.g.gain, 0.0001, 0.25);
            setTimeout(function () {
                try { n.src.stop(); n.lfo.stop(); n.g.disconnect(); } catch (e) {}
            }, 400);
        }
    }
}

// ---- lock tick --------------------------------------------------------------
// The targeting instrument. Deliberately StereoPanner, not HRTF: it is a
// cockpit instrument, and its pan/pitch carry the supplementary cues (turn
// direction, elevation) without polluting the HRTF world layer.
var tick = { timer: null, solid: null };
var lockPulseTimer = null;   // the sector/mining lock tone's own repeat chain

function tickFreqFor(elevRad) {
    return 600 * Math.pow(2, (deg(elevRad) / 90) * 0.75);
}

function stopSolidTone() {
    if (!tick.solid) return;
    var n = tick.solid; tick.solid = null;
    try { SIM.audio.ramp(n.g.gain, 0.0001, 0.05); } catch (e) {}
    setTimeout(function () { try { n.o.stop(); if (n.lfo) n.lfo.stop(); n.g.disconnect(); } catch (e) {} }, 120);
}

// SPEC 3.69: an optional slow tremolo LFO on the gain — the 'shielded'
// lock tone reuses this exact solid tone, just wavering, rather than
// inventing a whole second voice.
function startSolidTone(vol, tremoloHz) {
    if (!SIM.audio.ctx || tick.solid) return;
    var g = SIM.audio.ctx.createGain(); g.gain.value = 0.0;
    var sp = SIM.audio.ctx.createStereoPanner ? SIM.audio.ctx.createStereoPanner() : null;
    if (sp) { g.connect(sp); sp.connect(SIM.audio.uiBus); } else g.connect(SIM.audio.uiBus);
    var o = SIM.audio.ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 880;
    o.connect(g); o.start();
    var lfo = null;
    if (tremoloHz) {
        var targetVol = vol || CFG.lockToneVol;
        var lg = SIM.audio.ctx.createGain(); lg.gain.value = targetVol * 0.4;
        lfo = SIM.audio.ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = tremoloHz;
        lfo.connect(lg); lg.connect(g.gain); lfo.start();
    }
    tick.solid = { o: o, g: g, sp: sp, lfo: lfo };
    SIM.audio.ramp(g.gain, vol || CFG.lockToneVol, 0.05);
}

// SPEC 2.11 picked the lock tone by MODE (combat solid, sector/mining a
// soft double-blip every 2 s). ideas6 picks it by what is actually under
// the cursor, so the tone itself says what kind of thing is locked:
//   'solid' — a ship (or a mission friendly): today's 880 Hz tone.
//   'pulse' — a rock or a dust field: the soft double-blip, every 2 s.
//   'poi'   — a point of interest: the solid tone much softer, and the
//             guidance ticks keep running underneath it (tickBeat), so a
//             minutes-long flight onto a beacon never loses its steering.
function lockToneKind() {
    var t = targets[selected];
    if (!t) return 'solid';
    if (t.kind === 'rock' || t.kind === 'dust') return 'pulse';
    if (t.kind === 'poi') return 'poi';
    // SPEC 3.69: a capital turret behind its own closed shield door — the
    // reticle itself says so, a slow tremolo on the same solid tone
