    var out = SIM.audio.worldOut(pos, 1500);
    if (!SIM.audio.playAsset('missile_fire', 0.5, out)) SIM.audio.sfxTone({ type: 'sawtooth', f1: 500, f2: 200, dur: 0.4, vol: 0.3, out: out });
    say(t.name + ' missile launch! Incoming.' + shieldCoach());
}

// D (SPEC 1.8): a decoy burst that spoofs the missile coming at you right
// now — it loses guidance at once and coasts like a shielded one, no
// shield needed. Useless against a beam. A press with nothing inbound
// still spends one (Brian: decided) — chaff is a reflex, not a menu.
function fireChaff() {
    if (systemState('decoys') === 'off') {
        SIM.cues.play('refusal_offline');
        say('Decoys offline. Repair crew is on it.');
        return;
    }
    if (chaff <= 0) {
        SIM.cues.play('refusal_dud');
        say('No decoys left.' + (sectorHome ? ' Station Meridian restocks.' : ''));
        return;
    }
    chaff--;
    // SPEC 3.27: a half-broken decoy system has a coin-flip chance to
    // fizzle — spent, no cue, no effect on any inbound threat.
    if (systemState('decoys') === 'half' && Math.random() < CFG.repairChaffFizzlePct) {
        SIM.cues.play('refusal_dud');
        say('Decoy fizzles. ' + chaff + ' left.');
        return;
    }
    SIM.cues.play('chaff_burst');
    var th = threat, left = chaff + ' left.';
    if (th && th.type === 'missile' && th.guided) {
        th.guided = false; th.coast = 0;
        // SPEC 3.37 (ideas10.txt): this flag is the ONLY thing that
        // distinguishes a decoy-spoofed ballistic missile from one a
        // raised shield already dropped guidance on (shieldKey does the
        // same guided=false/coast=0 reset) — it's what lets the pop later,
        // in stepThreat, announce "Decoy took it." only for this one.
        th.spoofed = true;
        // Veteran and Ace answer a spoof fast: the next attack comes while
        // the decoyed missile is still popping, not after the usual gap.
        if (TIERS[tierIdx].alwaysHostile) th.followUp = true;
        // The launch no longer claims "spoofed" outright — the missile is
        // merely going ballistic; the outcome comes a second later from
        // the pop itself (endThreat's own line in stepThreat).
        say('Decoy away. Missile going ballistic. ' + left);
    } else if (th && th.type === 'missile') {
        say('Decoy away. That missile was already ballistic. ' + left);
    } else if (th && th.type === 'laser') {
        say('Decoy away. Decoys do nothing against a laser. Shields. ' + left);
    } else {
        say('Decoy away, nothing inbound. ' + left);
    }
}

function endThreat() {
    if (!threat) return;
    var th = threat; threat = null;
    if (th.nodes) {
        try {
            SIM.audio.ramp(th.nodes.g.gain, 0.0001, 0.1);
            setTimeout(function () {
                try { th.nodes.oscs.forEach(function (o) { o.stop(); }); th.nodes.p.disconnect(); } catch (e) {}
            }, 200);
        } catch (e) {}
    }
    // SPEC 3.69: a capital turret's own attack ending starts its door
    // CLOSING, in place of the ordinary attack-gap timer — a real event
    // boundary, so the closing sound is a single clean say/cue here, not
    // folded awkwardly into whatever the attack's own last line said. A
    // turret that died mid-attack (destroyTarget already set `alive`
    // false before calling this) skips straight to the normal gap.
    if (th.t && th.t.parent && th.t.alive) {
        capitalDoorCloseSound(th.t);
        capitalDoor = { t: th.t, clock: 0, phase: 'closing' };
        return;
    }
    if (th.followUp) threatIn = CFG.enemyChaffFollowUpS;   // (SPEC 1.8, Veteran/Ace)
    else scheduleNextThreat();
}

function stepThreat(dt) {
    var th = threat, t = th.t;
    if (!t.alive) { endThreat(); return; }
    if (th.type === 'laser') {
        th.clock += dt;
        if (th.phase === 'lock') {
            if (th.clock >= CFG.enemyLaserTelegraphS) {
                th.phase = 'beam'; th.clock = 0;
                th.nodes = enemyBeamVoice(t);
            }
            return;
        }
        if (th.nodes) SIM.audio.movePanner(th.nodes.p, t.pos);
        if (th.clock < CFG.enemyLaserTickS) return;
        th.clock -= CFG.enemyLaserTickS; th.ticks++;
        if (len(sub(t.pos, ship.pos)) > CFG.enemyLaserRange * 1.5) {
            endThreat();
            say(t.name + ' loses the beam. Out of range.');
            return;
        }
        if (shield.up) { th.absorbed++; absorbShield(CFG.enemyLaserTickDmg); }
        else hullHit(CFG.enemyLaserTickDmg, t.name);
        if (lost) return;
        if (th.ticks >= CFG.enemyLaserTicks) {
            var abs = th.absorbed;
            endThreat();
            if (abs > 0) say(abs === CFG.enemyLaserTicks ? 'Shields held.' : 'Shields caught the rest.');
        }
        return;
    }
    // SPEC 3.58 (ideas14.txt): the cannon rattles continuously — no fixed-
    // duration beam, no telegraph — with a live volume AND damage that
    // both track the same facing-cone angle every frame: full inside the
    // inner cone, a fraction in the outer band, nothing beyond it. Side-
    // stepping out of the cone (or the ship failing to turn fast enough to
    // follow) is the whole defense, no key needed.
    if (th.type === 'cannon') {
        th.clock += dt;
        if (th.nodes) {
            SIM.audio.movePanner(th.nodes.p, t.pos);
            SIM.audio.setOrientation(th.nodes.p, Math.sin(t.facing || 0), 0, -Math.cos(t.facing || 0));
            th.coneMul = coneMulFor(facingConeAngle(t));
            if (SIM.audio.ctx) th.nodes.g.gain.setTargetAtTime(th.coneMul, SIM.audio.ctx.currentTime, 0.08);
        }
        if (len(sub(t.pos, ship.pos)) > CFG.enemyCannonRange * 1.5) {
            endThreat();
            say(t.name + ' loses the cannon. Out of range.');
            return;
        }
        if (th.clock < CFG.enemyCannonTickS) return;
        th.clock -= CFG.enemyCannonTickS; th.ticks++;
        var dmg = Math.round(CFG.enemyCannonTickDmg * (th.coneMul || 0));
        if (dmg > 0) {
            th.dealt += dmg;
            if (shield.up) { th.absorbed += dmg; absorbShield(dmg); }
            else hullHit(dmg, t.name);
            if (lost) return;
        }
        if (th.ticks >= CFG.enemyCannonTicks) {
            var absC = th.absorbed, dealtC = th.dealt;
            endThreat();
            if (dealtC > 0 && absC > 0) say(absC === dealtC ? 'Shields held.' : 'Shields caught the rest.');
        }
        return;
    }
    // missile
    th.age += dt;
    if (th.guided && shield.up) {
        th.guided = false; th.coast = 0;
        SIM.audio.blip(300, 220, 0.12, 0, 'sawtooth');
        say('Incoming missile lost guidance.');
    }
    if (th.guided) {
        th.vel = steerToward(th.vel, norm(sub(ship.pos, th.pos)), CFG.enemyMissileSpeed, CFG.enemyMissileTurn * dt);
    } else {
        th.coast += dt;
        if (th.coast > CFG.missileCoastS) {
            SIM.audio.noiseBurst(th.pos, 300, 0.35, 1200);
            // SPEC 3.37 (ideas10.txt): the confirmation Brian asked for —
            // a decoy-spoofed missile popping clear says so, at its own
            // position, distinctly from chaff_burst's launch sound. A
            // shield-dropped ballistic missile (guided=false via shieldKey,
            // no th.spoofed) still pops silently here, unchanged.
            var wasSpoofed = th.spoofed;
            var pos = th.pos;
            endThreat();
            if (wasSpoofed) { SIM.cues.play('decoy_took', { pos: pos }); say('Decoy took it.'); }
            return;
        }
    }
    th.pos = add(th.pos, scale(th.vel, dt));
    if (th.nodes) SIM.audio.movePanner(th.nodes.p, th.pos);
    if (len(sub(th.pos, ship.pos)) < CFG.missileHit * 1.5) {
        endThreat();
        if (shield.up) { absorbShield(CFG.enemyMissileDamage); say('Shields absorb the missile.'); }
        // SPEC 3.37 (ideas10.txt): rare, but a spoofed missile's ballistic
        // path can still clip the hull before it pops — silence there
        // would read as "the decoy lied," so hullHit gets a prefix naming
        // it, folded into its own single say() (never a second call).
        else hullHit(CFG.enemyMissileDamage, t.name + ' missile', true,
                      th.spoofed ? 'Spoofed missile clipped you.' : '');
    } else if (th.age > CFG.enemyMissileLifeS) {
        SIM.audio.noiseBurst(th.pos, 300, 0.35, 1200);
        endThreat();
        say('Incoming missile burned out.');
    }
}

// Hull damage: a low thud in the cockpit and the number. Hull is out of 100
// so the raw value IS the percent. `isMissile` (SPEC 3.27) is true only for
// an enemy missile actually landing on the hull — the one source that can
// knock a subsystem offline; a beam or a collision never rolls for it.
function hullHit(dmg, source, isMissile, prefix) {
    hull = Math.max(0, hull - dmg);
    SIM.cues.play('hull_hit');
    if (hull <= 0) { shipDestroyed(source); return; }
    // A broken cargo hold spills a fraction of the hold on every further
    // hit, any source — not gated on isMissile, since the hold doesn't
    // care what just hit the hull.
    var spillText = '';
    var cargoSt = systemState('cargo');
    if (cargoSt !== 'ok' && ore > 0) {
        var spilled = Math.min(ore, Math.ceil(ore * (cargoSt === 'off' ? CFG.repairCargoSpillOff : CFG.repairCargoSpillHalf)));
        if (spilled > 0) { ore -= spilled; spillText = ' ' + spilled + ' ore spills from the hold.'; }
    }
    var knockText = isMissile ? knockoutSystem() : '';
    // SPEC 3.37 (ideas10.txt): an optional lead-in, folded into this same
    // say() (never a second call) — used today only for a spoofed missile
    // that still clipped the hull.
    say((prefix ? prefix + ' ' : '') + 'Your hull ' + hull + '.' + spillText + knockText);
}

function shipDestroyed(source) {
    lost = true;
    endThreat();
    stopBeam(true);
    killMissile();
    shieldReset();
    keysDown = {};
    thrusterSync(null);
    SIM.cues.play('ship_destroyed');
    // SPEC 2.16: the sector campaign and the delivery run (tugCandidate())
    // no longer offer an Enter-restart or an X-back-to-sector escape after
    // a loss — a tug is dispatched and that's the only way back, on the
    // clock like everything else. A standalone training drill from the
    // mission menu keeps the old instant retry (the else branch, untouched).
    var tugged = tugCandidate();
    if (tugged) startTug();
    // SPEC 3.65: incomings are Web Audio nodes, not JS state updateTurret's
    // own over() guard can freeze — silence them now, or a dying zone's
    // tone rings on pointlessly through the debrief that follows.
    if (mode === 'turret') stopAllTurretVoices();
    setTimeout(function () {
        var tail = tugged
            ? 'Tug dispatched from ' + tug.poiData.name + ', ' + Math.ceil(tug.total) + ' seconds' +
              (tug.total > CFG.tugBaseS ? ' — no trusted station nearby, this is the long way home' : '') +
              '. Enter pays ' + CFG.tugFeeCredits + ' credits to halve the wait — pays again for another halving, as long as credits allow.'
            // SPEC 3.70: tugCandidate() being false here already guarantees
            // sectorHome is falsy (tugged = sectorHome || mode==='sector')
            // — the old sectorHome ternary this replaced was unreachable.
            : 'Enter tries again, X for the mission menu.';
        say('Hull breached by ' + source + '. Ship lost. ' + tail);
        // SPEC 3.65/3.70: a further real timer boundary, so this never
        // collides with the line just spoken (SPEC 2.15) — the debrief
        // opens with its own combined announcement, overriding the generic
        // "Enter tries again" tail above with its own version of the same
        // thing. A tug death (tugged) never debriefs — SPEC 2.16's own
        // countdown is that state's own voice. Real bug found in testing
        // 3.65, guarded against here too: by the time this fires, the
        // player may already have retried or left — guarded on the exact
        // per-mode state object this death belongs to (turret keeps its
        // own dedicated check below, unchanged since 3.65), not just
        // "still in the same mode".
        if (mode === 'turret' && turretState) {
            var deathState = turretState;
            setTimeout(function () { if (turretState === deathState) openTurretDebrief(); }, 1200);
        } else if (!tugged) {
            var deathMode = mode, deathRef = capital || mission || minefieldState || nebulaState || null;
            setTimeout(function () { openLossDebrief(source, deathMode, deathRef); }, 1200);
        }
    }, 900);
}

// SPEC 3.70: every standalone drill's loss debriefs too, from the delayed
// line above — never a tug death (2.16's own countdown is that state's own
// voice; tugCandidate() being false is what routed the death here at all).
// `deathRef` is whichever per-mode identity object this death belonged to
// (turret has its own dedicated path above, predating this generalization);
// the plain combat drill has no such object, so it falls back to the same
// `lost` check every other guard here also applies — clearMission() resets
// `lost` synchronously the instant a retry starts, so a stale timer sees it
// already false by the time it fires.
function openLossDebrief(source, deathMode, deathRef) {
    if (mode !== deathMode || !lost) return;
    var hitBy = 'Ship lost, hit by ' + source + '.';
    var opener, lines;
    if (deathMode === 'combat' && capital) {
        if (capital !== deathRef) return;
        var turretsLeft = aliveTargets().filter(function (t) { return !t.kind; }).length;
        opener = 'The capital ship escapes';
        lines = [ hitBy, turretsLeft + (turretsLeft === 1 ? ' turret still up.' : ' turrets still up.') ];
    } else if (deathMode === 'combat' && mission) {
        if (mission !== deathRef) return;
        opener = 'Mission over';
        lines = [ hitBy, mission.friendly.name + (mission.friendly.alive ? ' still flying.' : ' lost too.') ];
    } else if (deathMode === 'minefield') {
        if (minefieldState !== deathRef) return;
        opener = 'Minefield over';
        lines = [ hitBy, 'Time ' + fmtTime(minefieldState.elapsed) + '.',
                  minefieldState.detonations + (minefieldState.detonations === 1 ? ' mine detonated.' : ' mines detonated.') ];
    } else if (deathMode === 'nebula') {
        if (nebulaState !== deathRef) return;
        opener = 'Nebula transit over';
        lines = [ hitBy, 'Time ' + fmtTime(nebulaState.elapsed) + '.' ];
    } else if (deathMode === 'combat') {
        opener = 'Combat training over';
        lines = [ hitBy, 'Missiles remaining ' + missiles + '.' ];
    } else {
        return;   // course/shadow/gaterun/mining never reach shipDestroyed today
    }
    openDebrief(opener, lines, 'Enter tries again, X for the mission menu.');
}

// ---- shields ----------------------------------------------------------------
// The pilot's answer to enemy fire. Six-axis dogfighting is not this game's
// thing, so instead of jinking the pilot listens for the warning and gets
// the shields up. They take a moment to raise (a rising sweep, then a clunk
// and a steady hum), hold for a limited time before collapsing, and recharge
// in proportion to how long they were held. While up: weapons offline, and
// every missile in flight — theirs or yours — loses guidance.
function shieldsBusy() { return shield.up || shield.raising >= 0; }

function shieldKey() {
    if (mode !== 'combat') { say('Shields are only needed in combat. Nothing here is shooting.'); return; }
    if (systemState('shields') === 'off') {
        SIM.cues.play('refusal_offline');
        say('Shields offline. Repair crew is on it.');
        return;
    }
    if (shield.up) { shieldDrop(false, 'manual'); return; }
    if (shield.raising >= 0) { say('Shields already coming up.'); return; }
    if (shield.repairing > 0) {
        SIM.cues.play('refusal_wait');
        say('Shields in disrepair. Damage control needs ' + Math.ceil(shield.repairing) + ' seconds.');
        return;
    }
    if (beam && beam.tool === 'laser') {
        SIM.cues.play('refusal_wait');
        say('Laser burst in progress, ' + Math.ceil(beamSecondsLeft()) + ' seconds. Shields after.');
        return;
    }
    shield.raising = 0;
    shield.warnedLow = false;
    stopBeam(true);                                // an E/V tool yields to the shield
    var secs = CFG.shieldRaiseMs / 1000;
    SIM.cues.play('shield_raise', { dur: secs });
    say('Raising shields.');
}

// Absorb one hit into the pool: splash cue, drain, a one-time "failing"
// warning under 25%, and a drop into disrepair if it empties the pool.
// Returns true if that hit was the one that dropped the shield.
function absorbShield(dmg) {
    SIM.cues.play('shield_splash');
    shield.pool = Math.max(0, shield.pool - dmg);
    if (!shield.warnedLow && shield.pool > 0 && shield.pool <= shieldPoolMax() * 0.25) {
        shield.warnedLow = true;
        SIM.cues.play('shield_failing_warn');
        say('Shields failing.');
    }
    if (shield.pool <= 0) { shieldDrop(false, 'depleted'); return true; }
    return false;
}

// The disrepair crew: a ratchet/welding-tick loop on the UI bus that
// quickens as the repair nears done, entirely separate from the HRTF world.
function scheduleRepairTick() {
    if (shield.repairing <= 0) { shieldRepairTimer = null; return; }
    SIM.cues.play('shield_repair_tick');
    var frac = clamp(shield.repairing / CFG.shieldRepairS, 0, 1);
    shieldRepairTimer = setTimeout(scheduleRepairTick, 250 + frac * 650);
}
function stopRepairSound() {
    if (shieldRepairTimer) { clearTimeout(shieldRepairTimer); shieldRepairTimer = null; }
}

function shieldHum(on) {
    if (!SIM.audio.ctx) return;
    if (on && !shield.nodes) {
        var g = SIM.audio.ctx.createGain(); g.gain.value = 0.0001;
        var a = SIM.audio.ctx.createOscillator(); a.type = 'sine'; a.frequency.value = 110;
        var b = SIM.audio.ctx.createOscillator(); b.type = 'triangle'; b.frequency.value = 220;
        var bg = SIM.audio.ctx.createGain(); bg.gain.value = 0.35;
        var lfo = SIM.audio.ctx.createOscillator(); lfo.frequency.value = 1.5;
        var lg = SIM.audio.ctx.createGain(); lg.gain.value = 0.02;
        lfo.connect(lg); lg.connect(g.gain);
        a.connect(g); b.connect(bg); bg.connect(g); g.connect(SIM.audio.uiBus);
        a.start(); b.start(); lfo.start();
        shield.nodes = { g: g, oscs: [a, b, lfo] };
        SIM.audio.ramp(g.gain, 0.06, 0.15);
    } else if (!on && shield.nodes) {
        var n = shield.nodes; shield.nodes = null;
        SIM.audio.ramp(n.g.gain, 0.0001, 0.2);
        setTimeout(function () { try { n.oscs.forEach(function (o) { o.stop(); }); n.g.disconnect(); } catch (e) {} }, 300);
    }
}

function updateShield(dt) {
    if (shield.raising >= 0) {
        shield.raising += dt;
        if (shield.raising * 1000 >= CFG.shieldRaiseMs) {
            shield.raising = -1; shield.up = true;
            SIM.cues.play('shield_clunk');
            shieldHum(true);
            say('Shields up.');
        }
    } else if (shield.up) {
        // No timed collapse: the pool only drains on an absorbed hit,
        // handled in absorbShield() where the damage lands.
    } else if (shield.repairing > 0) {
        shield.repairing -= dt;
        if (shield.repairing <= 0) {
            shield.repairing = 0;
            stopRepairSound();
            shield.pool = shieldPoolMax() * CFG.shieldRepairReturn;
            SIM.cues.play('ready_chime');
            say('Shields back online, ' + Math.round(CFG.shieldRepairReturn * 100) + ' percent.');
        }
    } else if (shield.pool < shieldPoolMax()) {
        shield.pool = Math.min(shieldPoolMax(), shield.pool + CFG.shieldRegenPerS * dt);
    }
    // SPEC 3.27: a knockout can shrink the pool max WHILE it's holding more
    // than that (e.g. it finished regenerating full before the crew's
    // repair crossed the system into 'half') — clamp every tick so the
    // pool is never seen above its own current ceiling.
    shield.pool = Math.min(shield.pool, shieldPoolMax());
}

function shieldDrop(silent, why) {
    if (!shield.up) { shield.raising = -1; return; }
    shield.up = false;
    shieldHum(false);
    if (why === 'depleted') {
        shield.repairing = CFG.shieldRepairS;
        stopRepairSound();
        scheduleRepairTick();
        if (silent) return;
        SIM.cues.play('shield_drop_depleted');
        say('Shields down. Damage control on it.');
    } else {
        // Manual drop: whatever charge is left in the pool keeps regenerating.
        if (silent) return;
        SIM.cues.play('shield_drop_manual');
        say('Shields down. Weapons hot.');
    }
}

// Full reset between missions: full pool, no disrepair debt, no hum.
function shieldReset() {
    shield.up = false; shield.raising = -1; shield.pool = shieldPoolMax();
    shield.repairing = 0; shield.warnedLow = false;
    stopRepairSound();
    shieldHum(false);
}

// ---- ship systems (SPEC 3.27) -----------------------------------------------
// An enemy missile that lands on the hull — never a beam, never one caught
// by a raised shield — has a chance to knock one subsystem offline. Only
// ONE system breaks per landed hit, drawn by weight, never redrawing one
// already broken; a standard repair crew works the single highest-priority
// broken system at a time, health climbing steadily from 0 (offline) to 50
// (usable, degraded) to 100 (fully back). Docking still repairs everything
// instantly, unchanged — see repairAllSystems().
var shipSystems = {};      // id -> health 0-100; absent (or 100) = fully OK
var systemCaps = {};       // SPEC 3.66: id -> field-repair ceiling; absent (or 100) = never knocked out this sortie
var activeRepairId = null; // which system (or 'hull') the crew is currently working
var repairRcsPaused = false; // SPEC 3.36: true while parked at the reaction-mass floor
var repairRcsSpentSortie = 0; // SPEC 3.36: total reaction mass the crew has spent, this sortie — F2

function systemCap(id) { return systemCaps[id] === undefined ? 100 : systemCaps[id]; }

// Fixed knockout weights (Brian's list) for everything except laser slots,
// which are added dynamically below — one entry per FITTED slot, weight 3
// each, so a two-laser ship draws from 9 systems total.
var SYSTEM_DRAW = [
    { id: 'decoys',   weight: 3 },
    { id: 'sensor',   weight: 3 },
    { id: 'missiles', weight: 2 },
    { id: 'cargo',    weight: 2 },
    { id: 'thrust',   weight: 2 },
    { id: 'shields',  weight: 1 },
    { id: 'warp',     weight: 1 }
];
var SYSTEM_NAMES = {
    shields: 'Shields', thrust: 'Thrust', sensor: 'Targeting sensor',
    missiles: 'Missiles', decoys: 'Decoys', warp: 'Warp engine', cargo: 'Cargo hold'
};
// The crew's fixed work order (Brian's list) — independent of draw weight.
// Every laser slot shares one priority tier; ties among them resolve by
// slot index (lowest first). 'hull' (SPEC 3.36, ideas10.txt) is the crew's
// lowest rung, not a shipSystems entry — the hull only ever becomes the
// crew's job once every system above is whole.
var REPAIR_PRIORITY = ['shields', 'thrust', 'sensor', 'laser', 'missiles', 'decoys', 'warp', 'cargo', 'hull'];

function systemName(id) {
    var m = /^laser(\d+)$/.exec(id);
    return m ? 'Laser slot ' + (Number(m[1]) + 1) : (SYSTEM_NAMES[id] || id);
}
function systemPriorityKey(id) { return /^laser\d+$/.test(id) ? 'laser' : id; }
function fittedLaserSystemIds() {
    var ids = [];
    if (!profile) return ids;
    for (var i = 0; i < LASER_SLOTS; i++) if (profile.slots[i]) ids.push('laser' + i);
    return ids;
}
function allSystemIds() { return fittedLaserSystemIds().concat(SYSTEM_DRAW.map(function (s) { return s.id; })); }
function systemWeight(id) {
    if (/^laser\d+$/.test(id)) return 3;
    for (var i = 0; i < SYSTEM_DRAW.length; i++) if (SYSTEM_DRAW[i].id === id) return SYSTEM_DRAW[i].weight;
    return 1;
}
function systemHealth(id) { var h = shipSystems[id]; return h === undefined ? 100 : h; }
// 'ok' (working normally) | 'half' (usable, degraded) | 'off' (refuses).
function systemState(id) {
    var h = systemHealth(id);
    if (h >= 100) return 'ok';
    return h >= 50 ? 'half' : 'off';
}

// Shields' pool max shrinks to CFG.repairPoolPct while at half health —
// every place that used to read CFG.shieldPool as "the max" reads this
// instead, so a knockout takes effect the instant it lands, same as a
// module's cfg overlay takes effect the instant it's bought.
function shieldPoolMax() {
    return CFG.shieldPool * (systemState('shields') === 'half' ? CFG.repairPoolPct : 1);
}

// Immediate side effects of a system going from OK to broken. Most systems
// just start refusing on their NEXT use (handled at each call site below);
// a raised shield is the one exception that has to drop right now, mid-
// fight, rather than wait for the next G press.
function applyKnockoutEffects(id) {
    if (id === 'shields' && shield.up) shieldDrop(true, 'systemFailure');
}

// SPEC 3.66: shared by the real knockout path and the poke() test hook —
// sets the system's health to 0 and steps its field-repair cap down
// (repairFieldCap the first time, repairCapLossPerHit further each time
// after, floored at repairCapFloor), so a test can exercise the exact
// same cap math a real hit does.
function registerKnockout(id) {
    shipSystems[id] = 0;
    var curCap = systemCap(id);
    systemCaps[id] = curCap >= 100 ? CFG.repairFieldCap : Math.max(CFG.repairCapFloor, curCap - CFG.repairCapLossPerHit);
    applyKnockoutEffects(id);
}

// The real random path — called only from hullHit() when an enemy missile
// (never a beam, never one a raised shield absorbed) lands. Returns a
// spoken fragment ending in a period, or '' — folded into hullHit's own
// single say() call (the SPEC 2.15 rule: never a second say() in one tick).
function knockoutSystem() {
    if (Math.random() >= CFG.knockoutChance) return '';
    var candidates = allSystemIds().filter(function (s) { return systemState(s) === 'ok'; });
    if (!candidates.length) return '';   // everything already broken
    var total = candidates.reduce(function (s, c) { return s + systemWeight(c); }, 0);
    var r = Math.random() * total, id = candidates[candidates.length - 1];
    for (var i = 0; i < candidates.length; i++) {
        r -= systemWeight(candidates[i]);
        if (r <= 0) { id = candidates[i]; break; }
    }
    registerKnockout(id);
    return ' ' + systemName(id) + ' offline.';
}

// The repair crew: one broken system at a time, fixed priority, health
// climbing at a steady rate from 0 to 100 over repairHalfS*2 seconds (half
// of that to reach the 50% "usable" mark). Runs from simTick on the same
// gate as everything else — frozen under any overlay, like the rest of
// the sim. SPEC 3.36 (ideas10.txt) added two things on top, both true for
// systems AND the hull alike: the hull becomes the crew's job once every
// system is whole (REPAIR_PRIORITY's own lowest rung, at HALF the system
// rate — Brian: "hull repairs do not happen at the same rate as other
// modules/components"), and every point of repair costs reaction mass,
// through spendRcs() so the usual 50/25% alerts and the battery flip fire
// exactly as thrusting does — the crew simply stops, at a floor well
// short of empty, rather than ever strand the ship unable to turn.
function brokenSystemIds() {
    return Object.keys(shipSystems).filter(function (id) { return shipSystems[id] < 100; });
}
// SPEC 3.66: which broken systems the crew can still make progress on in
// the FIELD — below their own cap, not just below 100. A system sitting
// at its cap stays "broken" (F2/I/Z all keep reporting it) but stops
// being the crew's active target; only docking finishes it.
function fieldFixableSystemIds() {
    return brokenSystemIds().filter(function (id) { return shipSystems[id] < systemCap(id); });
}
function updateRepairCrew(dt) {
    var fixable = fieldFixableSystemIds();
    var targetId = null;
    if (fixable.length) {
        fixable.sort(function (a, b) {
            var pa = REPAIR_PRIORITY.indexOf(systemPriorityKey(a)), pb = REPAIR_PRIORITY.indexOf(systemPriorityKey(b));
            return pa !== pb ? pa - pb : (a < b ? -1 : 1);
        });
        targetId = fixable[0];
    } else if (hull < CFG.repairHullFieldCap) {
        targetId = 'hull';
    }
    if (!targetId) { activeRepairId = null; repairRcsPaused = false; return; }

    var cap = targetId === 'hull' ? CFG.repairHullFieldCap : systemCap(targetId);
    var before = targetId === 'hull' ? hull : shipSystems[targetId];
    var basePerSecond = 100 / (CFG.repairHalfS * 2);
    var perSecond = targetId === 'hull' ? basePerSecond * CFG.repairHullFactor : basePerSecond;
    // SPEC 3.66: never compute (and never bill reaction mass for) more
    // healing than the cap allows — a system already parked at its own
    // cap costing mass for zero gain was the real risk here.
    var amount = Math.min(perSecond * dt, Math.max(0, cap - before));
    if (amount <= 0) { activeRepairId = null; repairRcsPaused = false; return; }
    var rcsCost = amount * CFG.repairRcsPerPoint;
    if (rcs - rcsCost < CFG.repairRcsFloor) {
        if (!repairRcsPaused) { repairRcsPaused = true; say('Damage control paused: reaction mass low.'); }
        return;
    }
    repairRcsPaused = false;
    spendRcs(rcsCost);
    repairRcsSpentSortie += rcsCost;

    if (targetId !== activeRepairId) {
        activeRepairId = targetId;
        SIM.audio.playAsset('repair_crew', 0.4);
        if (targetId === 'hull') say('Damage control on the hull.');
    }

    if (targetId === 'hull') {
        var beforeHull = hull;
        hull = Math.min(cap, hull + amount);
        if (beforeHull < cap && hull >= cap) {
            activeRepairId = null;
            say(cap >= CFG.shipHull ? 'Hull repaired.' : 'Hull at ' + cap + ', field repair. Dock for full.');
        }
        return;
    }
    var after = Math.min(cap, before + amount);
    shipSystems[targetId] = after;
    if (before < 50 && after >= 50) {
        SIM.cues.play('repair_half');
        say(systemName(targetId) + ' at 50 percent, usable.');
    } else if (after >= cap) {
        activeRepairId = null;
        if (cap >= 100) { delete shipSystems[targetId]; say(systemName(targetId) + ' repaired.'); }
        else say(systemName(targetId) + ' at ' + cap + ', field repair. Dock for full.');
    }
}

// Docking's instant fix (behavior unchanged from before this system
// existed): every broken system clears at once, no partial credit.
function repairAllSystems() {
    shipSystems = {};
    systemCaps = {};   // SPEC 3.66: docking clears every field-repair cap
    activeRepairId = null;
    repairRcsPaused = false;
    repairRcsSpentSortie = 0;
}

// ---- particulate debris -----------------------------------------------------
// Dust knocked loose by mining. It has essentially no momentum, so a field
// hangs in space right where the rock was cracked while the rock itself is
// shoved away — the consolation prize a pilot can always come back for.
// Each field carries a faint high shimmer through its own HRTF panner, so
// drifting dust is findable by ear; louder shimmer means a richer field.
var debris = [];   // { kind:'dust', name, pos, amount, alive, nodes }
var dustSeq = 0;

function addDebris(pos, amount) {
    amount = Math.round(amount * CFG.debrisScale);
    if (mode !== 'mining' || amount <= 0) return;
    var f = null, best = CFG.debrisMergeDist;
    debris.forEach(function (d) {
        var dd = len(sub(d.pos, pos));
        if (dd < best) { best = dd; f = d; }
    });
    if (f) { f.amount += amount; updateDustVolume(f); return; }
    // A dust field is itself a target: it joins the T-cycle list so the
    // pilot can select it, center it with the tick, and fly to it.
    f = { kind: 'dust', name: 'Dust ' + (++dustSeq), alive: true,
          pos: v3(pos.x, pos.y, pos.z), amount: amount, nodes: null };
    buildDustVoice(f);
    debris.push(f);
    targets.push(f);
}

function buildDustVoice(f) {
    if (!SIM.audio.ctx) return;
    var g = SIM.audio.ctx.createGain(); g.gain.value = 0.0001;
    // Not a steady hiss: the band center wanders slowly and the level
    // sparkles, so a field sounds like drifting, glittering motes — and
    // each field rolls its own base color so no two sound identical.
    var base = 2100 + Math.random() * 900;
    var bp = SIM.audio.ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = base; bp.Q.value = 3;
    var wander = SIM.audio.ctx.createOscillator();
    wander.frequency.value = 0.15 + Math.random() * 0.25;
    var wg = SIM.audio.ctx.createGain(); wg.gain.value = 650;
    wander.connect(wg); wg.connect(bp.frequency);
    var sparkle = SIM.audio.ctx.createOscillator();
    sparkle.frequency.value = 1.5 + Math.random() * 2;
    var sg = SIM.audio.ctx.createGain(); sg.gain.value = 0.012;
    sparkle.connect(sg); sg.connect(g.gain);
    var p = SIM.audio.makePanner(f.pos);
    var src = SIM.audio.ctx.createBufferSource(); src.buffer = SIM.audio.noiseBuf; src.loop = true;
    src.connect(bp); bp.connect(g); g.connect(p); p.connect(SIM.audio.worldBus);
    wander.start(); sparkle.start();
    src.start(0, Math.random());
    f.nodes = { gain: g, panner: p, src: src, lfos: [wander, sparkle] };
    updateDustVolume(f);
}

function updateDustVolume(f) {
    if (!f.nodes) return;
    SIM.audio.ramp(f.nodes.gain.gain, clamp(0.015 + f.amount / 8000, 0.015, 0.07), 0.3);
}

function removeDust(f) {
    f.alive = false;
    var i = debris.indexOf(f);
    if (i >= 0) debris.splice(i, 1);
    var j = targets.indexOf(f);
    if (j >= 0) {
        // Keep the selection pointing at the same object across the splice.
        var prevSel = targets[selected];
        targets.splice(j, 1);
        if (prevSel === f || !prevSel) selectNearest();
        else selected = targets.indexOf(prevSel);
    }
    if (f.nodes) {
        var n = f.nodes; f.nodes = null;
        SIM.audio.ramp(n.gain.gain, 0.0001, 0.3);
        setTimeout(function () {
            try {
                n.src.stop();
                (n.lfos || []).forEach(function (o) { o.stop(); });
                n.panner.disconnect();
            } catch (e) {}
        }, 500);
    }
}

function clearDebris() { debris.slice().forEach(removeDust); debris = []; }

function debrisTotal() {
    return debris.reduce(function (s, d) { return s + d.amount; }, 0);
}

// ---- tractor beam (SPEC 3.30, tiered as of SPEC 3.44) ----------------------
// B (moved from Z, SPEC 3.44) pulls the selected rock or core toward the
// ship instead of flying to it. A clean, constant-rate pull by size (not a
// force competing with the laser's own beamPush frame by frame — a
// deliberate simplification, flagged in SPEC.md) while damping whatever
// velocity the target already carries, so a laser-shoved rock's momentum
// dies out fast instead of sailing past the pull. Not standard equipment:
// tractorTestFit fits everyone with tier 1 for free until Brian has heard
// it; after that, owning tractor_1/2/3/4 (MODULES) is the only way.
// Four owned tiers, like the lasers (SPEC 3.44), reshaped by SPEC 3.52:
// every size INCLUDING core/small now scales per tier (nothing held back
// at a flat rate any more), each tier has its own range and reaction-mass
// cost multiplier, and there is no lower "selected" tier — owned tier IS
// the active one. Indexed 0..3 for tiers 1..4 (tractorLevel() is the
// 1-based number players hear; TRACTOR_TIERS[tractorLevel() - 1] the row).
// Placeholder numbers throughout, Brian's ear decides the real ones.
var TRACTOR_TIERS = [
    { core: 20, medium: 4,  large: 0,  huge: 0, range: 500, costMul: 1.0, asset: 'tractor_beam'   },
    { core: 26, medium: 12, large: 3,  huge: 0, range: 650, costMul: 0.8, asset: 'tractor_beam_2' },
    { core: 32, medium: 20, large: 10, huge: 3, range: 800, costMul: 0.6, asset: 'tractor_beam_3' },
    { core: 40, medium: 28, large: 16, huge: 6, range: 950, costMul: 0.4, asset: 'tractor_beam_4' }
];
var tractor = { active: false, targetIdx: -1, tier: 1, nodes: null };

function tractorFitted() { return CFG.tractorTestFit || ownedModules().indexOf('tractor_1') >= 0; }

// Owned tier: 1 with the test fit (today's numbers, unchanged from before
// tiers existed) and rising with the highest tractor_N module actually
// bought — same pattern autoTargetTier() explicitly borrowed from this one.
function tractorLevel() {
    var lvl = 1;
    if (ownedModules().indexOf('tractor_2') >= 0) lvl = 2;
    if (ownedModules().indexOf('tractor_3') >= 0) lvl = 3;
    if (ownedModules().indexOf('tractor_4') >= 0) lvl = 4;
    return lvl;
}
// core and small rock share ROCK_SIZES.length-1 (a core is a collapsed
// small rock, SPEC 3.30's own "core and small rock" pairing); every size
// reads the OWNED tier's own row of TRACTOR_TIERS (0 = refuses the pull
// entirely — only huge at tier 1/2 today).
function tractorPullRateFor(t, tier) {
    tier = tier || TRACTOR_TIERS[tractorLevel() - 1];
    if (t.size >= ROCK_SIZES.length - 1) return tier.core;
    if (t.size === ROCK_SIZES.length - 2) return tier.medium;
    if (t.size === ROCK_SIZES.length - 3) return tier.large;
    return tier.huge;
}
// SPEC 3.52: the rock's own mass, independent of which tier is pulling it
// — a higher tier is a better motor, not a lighter load. Feeds the
// reaction-mass cost formula in updateTractor.
function rockMass(t) {
    if (t.size >= ROCK_SIZES.length - 1) return 1;    // core/small
    if (t.size === ROCK_SIZES.length - 2) return 3;    // medium
    if (t.size === ROCK_SIZES.length - 3) return 8;    // large
    return 20;                                          // huge
}
// The hum is Brian's own recording, one per tier (TRACTOR_TIERS[].asset) —
// the synthesized tone is only a fallback for the rare case the asset
// hasn't decoded yet this session.
function tractorStartHum(assetName) {
    if (!SIM.audio.ctx || tractor.nodes) return;
    var A = SIM.audio;
    if (!A.assetBufs[assetName]) A.load(assetName);
    var g = A.ctx.createGain(); g.gain.value = 0.0001;
    var src, isAsset = !!A.assetBufs[assetName];
    if (isAsset) {
        src = A.ctx.createBufferSource();
        src.buffer = A.assetBufs[assetName]; src.loop = true;
    } else {
        src = A.ctx.createOscillator(); src.type = 'sine'; src.frequency.value = 90;
    }
    src.connect(g); g.connect(A.uiBus);
    src.start();
    tractor.nodes = { g: g, src: src, isAsset: isAsset };
    A.ramp(g.gain, 0.12, 0.2);
}
function tractorStopHum() {
    if (!tractor.nodes) return;
    var n = tractor.nodes; tractor.nodes = null;
    SIM.audio.ramp(n.g.gain, 0.0001, 0.2);
    setTimeout(function () { try { n.src.stop(); n.g.disconnect(); } catch (e) {} }, 300);
}
function stopTractor(reason) {
    if (!tractor.active) return;
    tractor.active = false; tractor.targetIdx = -1;
    tractorStopHum();
    if (reason) say(reason);
}
function tractorKey() {
    if (tractor.active) { stopTractor('Tractor released.'); return; }
    if (mode !== 'mining') { SIM.cues.play('refusal_offline'); say('The tractor beam only works while mining.'); return; }
    if (!tractorFitted()) { SIM.cues.play('refusal_offline'); say('No tractor beam fitted. The shipyard sells it.'); return; }
    // SPEC 3.52: tractor and every beam tool (laser, extractor, vacuum) are
    // mutually exclusive — a beam already running refuses B, the same
    // shape a burst already refuses G. The other direction (a beam cutting
    // an active tractor) lives in startBeam() instead.
    if (beam) {
        SIM.cues.play('refusal_wait');
        say('Beam in progress, ' + Math.ceil(beamSecondsLeft()) + ' seconds. Tractor after.');
        return;
    }
    var t = targets[selected];
    // SPEC 3.55: the distress call's own derelict is tractorable too (it
    // maps onto this same size/mass table via makeDistressRoster) — every
    // other non-rock target still refuses.
    if (!t || !t.alive || (t.kind !== 'rock' && !t.tractorable)) { say('No rock selected. Tab cycles targets.'); return; }
    var tier = TRACTOR_TIERS[tractorLevel() - 1];
    var dist = len(sub(t.pos, ship.pos));
    if (dist > tier.range) {
        SIM.cues.play('refusal_dud');
        say('Too far for the tractor. Distance ' + round10(dist) + ', reach ' + tier.range + '.');
        return;
    }
    if (tractorPullRateFor(t, tier) <= 0) {
        SIM.cues.play('refusal_offline');   // SPEC 3.50: a hard capability mismatch, not a spent resource
        say('Too massive for this tractor.');
        return;
    }
    tractor.active = true; tractor.targetIdx = selected; tractor.tier = tractorLevel();
    tractorStartHum(tier.asset);
    say('Tractor engaged on ' + t.name + '.');
}
// Runs every frame in mining mode (simTick). A pure kinematic pull — see
// the section comment above for why this doesn't model a real force.
// SPEC 3.52: reaction mass is spent for the actual WORK done (rock mass x
// distance closed x tier efficiency), not a flat per-second draw — a flat
// draw made every tier cost MORE than just flying the same distance
// (checked against rcsThrustPerS/rcsPerSpeedShed), the opposite of the
// design goal ("skilled usage should be better than just using thrusters").
function updateTractor(dt) {
    if (!tractor.active) return;
    var t = targets[tractor.targetIdx];
    if (!t || !t.alive || (t.kind !== 'rock' && !t.tractorable)) { stopTractor('Tractor lost its target.'); return; }
    // SPEC 3.60: the one place the tractor trails a MOVING puller instead of
    // closing to a fixed stop distance from the ship — gated on `haul` so
    // every other tractor use (ordinary mining) never reaches this branch.
    if (haul && t.haulable) { updateHaulTow(t, dt); return; }
    var tier = TRACTOR_TIERS[tractor.tier - 1];
    var rel = sub(ship.pos, t.pos);
    var dist = len(rel);
    // A tiny tolerance, not a strict <=: closeAmount below clamps to exactly
    // (dist - tractorStopDist) as that gap shrinks, and the resulting
    // position's own distance can land a hair above it by floating-point
    // noise, never quite tripping a strict equality.
    if (dist <= CFG.tractorStopDist + 0.5) { stopTractor('In extractor range.'); return; }
    if (dist > tier.range * 1.5) { stopTractor('Tractor lost its target.'); return; }
    t.vel = scale(t.vel, Math.pow(CFG.tractorDamp, dt));
    var pullRate = tractorPullRateFor(t, tier);
    var dir = scale(rel, 1 / dist);
    var closeAmount = Math.min(pullRate * dt, dist - CFG.tractorStopDist);
    t.pos = add(t.pos, scale(dir, closeAmount));
    spendRcs(rockMass(t) * closeAmount * CFG.tractorRcsPerMassUnit * tier.costMul);
    if (t.nodes) SIM.audio.movePanner(t.nodes.panner, t.pos);
    if (tractor.nodes) {
        // Pitch/rate rises as the target closes — the recording's
        // playbackRate climbs to ~2.9x at the stop distance (same ratio the
        // old synthesized 90->260Hz tone used); the oscillator fallback
        // still ramps its own frequency the original way.
        var frac = clamp(1 - (dist - CFG.tractorStopDist) / (tier.range - CFG.tractorStopDist), 0, 1);
        if (tractor.nodes.isAsset) SIM.audio.ramp(tractor.nodes.src.playbackRate, 1 + frac * 1.89, 0.2);
        else SIM.audio.ramp(tractor.nodes.src.frequency, 90 + frac * 170, 0.2);
    }
}

// ---- the haul (SPEC 3.60, ideas14.txt — Brian's own tow picture) -----------
// The one place the tractor trails a MOVING puller. The load chases an
// ideal point behind the ship; how far it actually falls behind that point
// IS the strain — hard accel or a sharp turn (the ideal point darting away
// faster than the tier's own pull rate can correct for) strains the line
// with no separate rule needed for either, the way a real tow would. The
// one thing that gets an explicit rule on top: reversing into the load
// (Brian: "not allowing someone to auto-thrust backwards or they lose
// tether"). tractor.active/targetIdx/tier (the ordinary rig state) still
// drive this — only updateTractor's own dispatch and this function are new.
var haulCreakNodes = null;

function haulCreakVoice() {
    if (!SIM.audio.ctx) return null;
    var A = SIM.audio;
    var g = A.ctx.createGain(); g.gain.value = 0.0001;
    var lp = A.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300;
    var o = A.ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 60;
    o.connect(lp); lp.connect(g); g.connect(A.uiBus);
    o.start();
    return { g: g, o: o };
}
function startHaulCreak() { if (!haulCreakNodes && SIM.audio.ctx) haulCreakNodes = haulCreakVoice(); }
function stopHaulCreak() {
    if (!haulCreakNodes) return;
    var n = haulCreakNodes; haulCreakNodes = null;
    SIM.audio.ramp(n.g.gain, 0.0001, 0.2);
    setTimeout(function () { try { n.o.stop(); n.g.disconnect(); } catch (e) {} }, 300);
}

function haulHomeTarget() { return haul ? targets[haul.homeIdx] : null; }

// SPEC 3.60: strain is three explicit, independent gains — hard thrust
// (ship speed over a safe threshold), sharp turning (combined yaw+pitch
// rate over a threshold), and reversing (an outright rule, not a threshold:
// any S or auto-reverse pumps it hard). Gentle flying under all three
// decays back to zero — an early build inferred strain purely from how far
// the load visibly lagged and snapped almost instantly under ordinary
// forward thrust, since the tractor's own pull-rate numbers (tuned for the
// kinematic mining pull, a distance-per-second budget) were the wrong unit
// entirely for an acceleration cap on matching the ship's cruising speed.
// The load's actual MOTION is separate from strain on purpose: a generous,
// forgiving spring-damper toward an ideal trailing point, so it stays
// visibly/audibly connected under ordinary play regardless of how strained
// the line is — strain is a warning, not a physical leash length.
function updateHaulTow(t, dt) {
    haul.elapsed += dt;   // SPEC 3.71: "also kept", not the headline
    var tier = TRACTOR_TIERS[tractor.tier - 1];
    var idealPos = sub(ship.pos, scale(shipForward(), CFG.haulTowDist));
    var toIdeal = sub(idealPos, t.pos);
    var relVel = sub(t.vel, ship.vel);
    var accel = add(scale(toIdeal, CFG.haulSpringK), scale(relVel, -CFG.haulDamping));
    // Safety clamp: continuous flight never displaces idealPos far in one
    // frame, so this never engages in ordinary play — it exists only to
    // keep a pathological single-frame jump (an external poke, a stale
    // reference) from resonating into a runaway explicit-Euler blowup.
    var accelLen = len(accel);
    if (accelLen > CFG.haulMaxAccel) accel = scale(accel, CFG.haulMaxAccel / accelLen);
    t.vel = add(t.vel, scale(accel, dt));
    if (t.nodes) SIM.audio.movePanner(t.nodes.panner, t.pos);

    var cost = rockMass(t) * len(accel) * dt * CFG.haulRcsPerMassUnit * tier.costMul;
    spendRcs(cost);
    haul.rcsSpent += cost;

    var speedOver = Math.max(0, len(ship.vel) - CFG.haulSafeSpeed);
    var yawRate = Math.abs(angleDiff(haul.lastYaw, ship.yaw)) * 180 / Math.PI / dt;
    var pitchRate = Math.abs(ship.pitch - haul.lastPitch) * 180 / Math.PI / dt;
    haul.lastYaw = ship.yaw; haul.lastPitch = ship.pitch;
    var turnRate = yawRate + pitchRate;
    var gain = (speedOver / 100) * CFG.haulSpeedStrainPerS + (turnRate / 90) * CFG.haulTurnStrainPerS;
    if (keysDown.s || autoThrust === 'rev') gain += CFG.haulReverseStrainPerS;
    haul.strain = clamp(haul.strain + gain * dt - CFG.haulStrainDecayPerS * dt, 0, 1.5);

    if (haul.strain > CFG.haulCreakWarnFrac) {
        startHaulCreak();
        var creakFrac = clamp((haul.strain - CFG.haulCreakWarnFrac) / (1 - CFG.haulCreakWarnFrac), 0, 1);
        if (haulCreakNodes) {
            SIM.audio.ramp(haulCreakNodes.g.gain, 0.05 + creakFrac * 0.35, 0.1);
            haulCreakNodes.o.frequency.setTargetAtTime(60 + creakFrac * 220, SIM.audio.ctx.currentTime, 0.1);
        }
    } else {
        stopHaulCreak();
    }

    if (haul.strain >= 1) {
        stopHaulCreak();
        haul.parted++;   // SPEC 3.71
        stopTractor('Tow line parted.');
        return;
    }

    var home = haulHomeTarget();
    if (home) {
        var homeDist = len(sub(t.pos, home.pos));
        if (homeDist <= CFG.tractorStopDist) finishHaul();
    }
}

function finishHaul() {
    stopHaulCreak();
    stopTractor(null);   // silent — openDebrief below is the one combined say() (SPEC 2.15)
    won = true;
    var spent = Math.round(haul.rcsSpent);
    // SPEC 3.71: reaction mass spent is the headline (lower is better) —
    // time and how many times the line parted ride alongside.
    recordRun('haul', { rcsSpent: spent, seconds: Math.round(haul.elapsed), parted: haul.parted });
    openDebrief('Tow complete',
        [ 'Reaction mass spent ' + spent + ', par ' + CFG.haulPar + '.',
          spent <= CFG.haulPar ? 'Under par.' : 'Over par by ' + (spent - CFG.haulPar) + '.',
          'Time ' + fmtTime(haul.elapsed) + '.',
          haul.parted + (haul.parted === 1 ? ' time parted.' : ' times parted.') ],
        'Enter tries again, X for the mission menu.');
}

// A single haulable rock and a home beacon, nothing else — reuses spawnRock
// and buildPoiVoice wholesale, so the rock's own voice/collapse/core logic
// and the beacon's own lock/tick/beacon-mode plumbing all just work.
function makeHaulRoster() {
    rockSeq = 0;
    var type = ROCK_TYPES[Math.floor(Math.random() * ROCK_TYPES.length)];
    // A 'medium' rock, deliberately: tier 1 (CFG.tractorTestFit, what
    // everyone starts with) can't move 'large' or 'huge' at all — see
    // TRACTOR_TIERS. Brian's own picture is a huge rock; that's a tier 3+
    // fantasy for once tiers are actually earned, flagged here rather than
    // silently built un-completable at the default fit.
    var size = ROCK_SIZES.length - 2;
    var rock = spawnRock(type, size, v3(0, 0, -400), v3(0, 0, 0));
    rock.haulable = true;
    var ang = Math.random() * Math.PI * 2;
    var homePos = v3(Math.cos(ang) * CFG.haulHomeDist, 0, -400 + Math.sin(ang) * CFG.haulHomeDist);
    var home = { name: 'Home Beacon', poiType: 'haulHome', kind: 'poi', desc: 'tow it here',
                 pos: homePos, alive: true, resource: false };
    buildPoiVoice(home);
    return [rock, home];
}

function haulIntro() {
    return 'The haul. A rock waits ahead, and a home beacon sits out there — Tab finds each. ' +
           'B engages the tractor once you are close and centered; once latched it tows behind you as you fly. ' +
           'Fly smoothly: hard thrust, sharp turns, and above all backing into it strain the line, and a creak ' +
           'warns you before it parts — drop back and re-latch if it does. Bring it within reach of the home ' +
           'beacon, latched, to finish. F1 for help.';
}

function startHaulMission() {
    menuOpen = false;
    ore = 0; hull = CFG.shipHull; missiles = CFG.missileMax; chaff = CFG.chaffMax;
    autoTargetCharges = CFG.autoTargetCharges;
    refillRcs(); collisionDamage = 0; repairAllSystems();
    newGame('mining', null, true);
    say(haulIntro());
}

// ---- distress call: the tow, in reverse (SPEC 3.55, ideas13.txt) -----------
// One disabled derelict, reusing the friendly-target machinery from 2.17
// (kind: 'friendly' already keeps it out of the laser/missile/rock damage
// paths) plus a `size` that maps it onto TRACTOR_TIERS/rockMass exactly like
// a rock — no new pull-rate or reaction-mass math needed anywhere. `hp`/
// `maxHp` are nominal (1/1): nothing in this mission ever damages it.
// Deliberate correction to the spec's own text: it says the derelict is
// "excluded from Tab like every other friendly," but the whole mechanic
// needs it selectable to tractor and recover — `tractorable: true` is the
// one flag that opens a narrow exception in selectNearest()/cycleTarget(),
// leaving every OTHER friendly (escort/defend, the haul's own home beacon)
// excluded exactly as before.
function makeDistressRoster(d) {
    var f = {
        name: 'Derelict', kind: 'friendly', hp: 1, maxHp: 1, alive: true,
        disabled: true, tractorable: true, size: ROCK_SIZES.length - 2,
        pos: v3(0, 0, -CFG.distressSpawnDist), vel: v3(0, 0, 0),
        voice: { type: 'sine', freq: 320, trem: 1.2 }
    };
    d.derelict = f;
    return [f];
}

// SPEC 3.55: leaving before the derelict is recovered, or dying, fails the
// call the same generic way escort/defend already do — clearMission()'s
// existing favorFail hook (below) covers it, keyed the same way. Offered
// only from a station's hail menu (see startMissionRun), never as a
// standalone mission-menu drill — there's no "the station" to bring it
// home to without one.
function distressIntro() {
    return 'A distress call. A disabled ship drifts nearby, calling for help — Tab finds it. ' +
           'Tractor it in with B, then E recovers it once it is close. Bring it home to ' +
           distress.poiName + ' to complete the call. F1 for help.';
}

// ---- the star's corona (SPEC 3.74, ideas16.txt) ----------------------------
// An encounter, not open flight — C within poiInteract of the star enters
// this the same way calling a field enters mining (sectorHome snapshot,
// mode 'mining', X returns to the sector — see callPoi's own 'star'
// branch). One target, the corona itself, `kind: 'poi'`, brighter than
// the compass-point drone every other POI type shares. No board, no
// debrief — there's nothing to "finish" here, only a place to leave.
function makeCoronaRoster() {
    var t = { name: 'The Corona', poiType: 'corona', kind: 'poi', desc: 'the star, up close',
              pos: v3(0, 0, 0), alive: true, resource: false };
    buildPoiVoice(t);
    return [t];
}
function coronaIntro() {
    return 'The corona. The star pulls harder the closer you get — facing away and holding W resists it, ' +
           'coasting drifts you in. V scoops hydrogen here, richer the closer you sit, up to ' +
           CFG.starHarvestBest + ' units out. Inside ' + CFG.starHeatDist + ' the hull ablates. ' +
           'Weapons are cold. X returns to the sector.';
}
// Inverse-square, capped — nothing at starEntryDist, everything close in.
// The star sits at the world origin, so `dist` is just the ship's own
// distance from (0,0,0); no separate target lookup needed.
function starPullAccel(dist) {
    var d = Math.max(dist, 1);
    return Math.min(CFG.starPull * Math.pow(CFG.starGravityDist / d, 2), CFG.starPullMax);
}
// 1x at starHarvestDist, rising linearly to starHarvestCloseMult at
// starHarvestBest and staying there for anything closer still — "up to
// 3x AT starHarvestBest," not an ever-richer reward for going past it.
function starHarvestMult(dist) {
    if (dist >= CFG.starHarvestDist) return 1;
    if (dist <= CFG.starHarvestBest) return CFG.starHarvestCloseMult;
    var frac = (CFG.starHarvestDist - dist) / (CFG.starHarvestDist - CFG.starHarvestBest);
    return 1 + (CFG.starHarvestCloseMult - 1) * frac;
}
// Called every frame from simTick while mode === 'mining' && corona. Pulls
// the ship toward the origin, speaks the pull as a percent of the pilot's
// OWN current full thrust (so battery power — a smaller denominator —
// makes the same physical pull read as a bigger bite, exactly Brian's
// "how much of my own W the star is eating"), ablates the hull inside
// starHeatDist (the nebula's own direct hull -= shape, 3.63, reused
// rather than a per-frame hullHit — no knockout roll belongs here), and
// routes BOTH ways of losing the ship — capture by radius, or the hull
// burning to zero — through the ordinary shipDestroyed() (2.16): sectorHome
// is already set (this encounter is only ever entered by C from the open
// quadrant), so tugCandidate() is already true and needs no special case.
function updateCorona(dt) {
    if (!corona || over()) return;
    var dist = len(ship.pos);
    var pullAccel = starPullAccel(dist);
    if (dist > 0.5) ship.vel = add(ship.vel, scale(ship.pos, -pullAccel / dist * dt));

    var thrustSt = systemState('thrust');
    var mass = shipMass(), rf = rcsFactor(), tf = thrustSt === 'half' ? CFG.repairThrustPct : thrustSt === 'off' ? 0 : 1;
    var fullThrust = (CFG.thrust / mass) * rf * tf;
    var pullPct = fullThrust > 0 ? pullAccel / fullThrust * 100 : 999;
    CFG.starPullPcts.forEach(function (p) {
        if (corona.lastPullPct < p && pullPct >= p) say('Pull at ' + p + ' percent thrust.');
    });
    corona.lastPullPct = pullPct;

    var insideHeatNow = dist <= CFG.starHeatDist;
    if (insideHeatNow && !corona.insideHeat) say('Entering the corona\'s heat. The hull will ablate.');
    else if (!insideHeatNow && corona.insideHeat) say('Clear of the heat. The hull stops ablating.');
    if (insideHeatNow) {
        var before = hull;
        hull = Math.max(0, hull - CFG.starHeatPerS * dt);
        CFG.starHeatPcts.forEach(function (p) {
            if (before > p && hull <= p) say('Hull ' + Math.round(hull) + ' percent, burning.');
        });
        corona.insideHeat = insideHeatNow;
        if (hull <= 0) { shipDestroyed('the star'); return; }
    } else {
        corona.insideHeat = insideHeatNow;
    }

    if (dist <= CFG.starCaptureDist) {
        say('Caught in the star\'s pull.');
        shipDestroyed('the star\'s pull');
    }
}

// ---- rock lifecycle ---------------------------------------------------------
function rockPush(t) { return t.resource ? 2.2 : ROCK_SIZES[t.size].push; }
function pushRock(t, dv) { t.vel = add(t.vel, dv); }

// Random unit-ish vector for blast impulses.
function randDir() {
    var a = Math.random() * Math.PI * 2, e = Math.random() * 1.6 - 0.8;
    return v3(Math.cos(a) * Math.cos(e), Math.sin(e), Math.sin(a) * Math.cos(e));
}

// A stage gave way. The player never knows which outcome is coming: the rock
// splits in two (each child rolls its own hidden hp and may differ in stage),
// chips down a size (same rock, higher pitch, fresh hidden hp), or — past
// 'small' — collapses into a glowing resource core for the extractor.
function rockEvent(t) {
    stopBeam(true);
    // This round: a 'large' rock (ROCK_SIZES index 1) picks its blast from
    // the dedicated asteroid_large_crumble pool instead of the generic
    // asteroid_explosion set — a bigger sound for a bigger rock.
    SIM.cues.play('explosion_rock', { pos: t.pos, size: ROCK_SIZES[t.size].label });
    // The blast sheds a mist of particulates that hangs where it happened —
    // bigger rocks throw bigger mists. (Computed before the size changes.)
    var mist = Math.round((CFG.debrisEventBase + Math.random() * 200) *
                          (1 + (ROCK_SIZES.length - 1 - t.size) * 0.5));
    addDebris(t.pos, mist);
    if (t.size >= ROCK_SIZES.length - 1) {
        // Small rock collapses into the mineable core.
        t.resource = true;
        t.oreLeft = t.type.ore + Math.floor(Math.random() * 600) - 300;
        pushRock(t, scale(randDir(), 6));
        // This round: swap to a real per-type core recording; fall back to
        // the original pitch-ramp-on-the-same-loop if it isn't decoded yet.
        if (t.nodes && t.nodes.src && !swapRockCoreVoice(t)) {
            SIM.audio.ramp(t.nodes.src.playbackRate, 1.6, 0.6);
        }
        say(t.name + ' collapses into a glowing core. Get close and press E to extract.');
        return;
    }
    if (Math.random() < t.type.splitChance) {
        // Break apart: two smaller children pushed gently opposite ways —
        // just enough drift to separate them, not enough to flee the cloud.
        t.alive = false;
        stopVoice(t);
        var d = randDir();
        var childSize = t.size + 1;
        // Drift scales with the children's flightiness: big children barely
        // separate, small ones tumble noticeably — pilot's choice to chase
        // the rock or stay and vacuum the dust it left behind.
        var kick = (9 + Math.random() * 7) * ROCK_SIZES[childSize].push;
        var a = spawnRock(t.type, childSize, add(t.pos, scale(d, 8)),  add(t.vel, scale(d, kick)));
        var b = spawnRock(t.type, childSize, sub(t.pos, scale(d, 8)),  sub(t.vel, scale(d, kick)));
        targets.push(a); targets.push(b);
        // Auto-track the nearer child so the pilot keeps working the seam.
        var child = len(sub(a.pos, ship.pos)) <= len(sub(b.pos, ship.pos)) ? a : b;
        selected = targets.indexOf(child);
        locked = false;
        stopLockTone();
        say(t.name + ' breaks apart! Auto targeting child: ' +
            ROCK_SIZES[childSize].label + ' ' + t.type.name + ' asteroid, ' +
            child.name + ', distance ' + round10(len(sub(child.pos, ship.pos))) + '.');
        return;
    }
    // Chip down: same rock, one size smaller, audibly higher voice.
    t.size += 1;
    t.hp = rollHp(t.size);
    pushRock(t, scale(randDir(), (5 + Math.random() * 5) * ROCK_SIZES[t.size].push));
    if (t.nodes && t.nodes.src) {
        SIM.audio.ramp(t.nodes.src.playbackRate, ROCK_SIZES[t.size].rate, 0.6);
    }
    say(t.name + ' is chipped down to ' + ROCK_SIZES[t.size].label + '.');
    // Chip and core-collapse keep the same rock, so the selection stays put.
}

// Lasering a finished core destroys the payload — use the extractor instead.
// A quarter of the ore survives as a dust mist, so it stings without ruining
// the run entirely.
function shatterCore(t) {
    SIM.cues.play('explosion_rock', { pos: t.pos });
    addDebris(t.pos, Math.round(t.oreLeft * 0.25));
    t.alive = false;
    stopVoice(t);
    say(t.name + ' shatters under the laser. Most of the ore is lost, but a dust mist remains.');
    if (targets[selected] === t) selectNearest();
    checkMiningEnd();
}

// Drifted past the cloud edge: gone for good.
function loseRock(t) {
    t.alive = false;
    if (t.nodes) SIM.audio.ramp(t.nodes.gain.gain, 0.0001, 1.2);
    setTimeout(function () { stopVoice(t); }, 1400);
    SIM.audio.blip(300, 400, 0.1, 0, 'sine');
    say(t.name + ' drifts out of the cloud. Lost.');
    if (targets[selected] === t) selectNearest();
    checkMiningEnd();
}

function checkMiningEnd() {
    // SPEC 3.60/3.55: the haul's and the distress call's own completions
    // are NOT "every rock accounted for" — defensive gate alongside the
    // loseRock fix above, in case anything else ever calls this during
    // either run (neither has ever needed it to fire in testing, but the
    // derelict/home-beacon targets aren't rocks either way).
    if (mode !== 'mining' || won || haul || distress || corona) return;   // SPEC 3.74: same defensive gate
    if (aliveRocks().length > 0) return;
    if (debrisTotal() > 0) {
        // The rocks are done but the harvest isn't: sweep the dust to finish.
        setTimeout(function () {
            say('All rocks worked. Dust still shimmers in the cloud — fly to it and vacuum it up with V.');
        }, 600);
        return;
    }
    won = true;
    if (ore > 0) setTimeout(function () { SIM.cues.play('win_fanfare'); }, 400);
    // SPEC 3.71: the standalone drill's own board — the cloud cleared
    // before the clock ran out. `ore` is the headline (higher wins);
    // `updateMining`'s own clock-out path (finishMiningDrillClock, below)
    // is the other way this can end, never both.
    if (miningState) {
        var msg = miningState;
        recordRun('mining', { ore: ore, seconds: Math.round(msg.elapsed), cleared: true, cores: msg.cores });
        setTimeout(function () {
            openDebrief('Cloud cleared',
                [ 'Ore hold ' + ore + '.',
                  'Cleared with ' + fmtTime(Math.max(0, CFG.miningDrillS - msg.elapsed)) + ' to spare.',
                  msg.cores + (msg.cores === 1 ? ' core extracted.' : ' cores extracted.') ],
                'Enter mines a fresh cloud, X for the mission menu.');
        }, 700);
        return;
    }
    setTimeout(function () {
        openDebrief('Cloud cleared',
            [ 'Ore hold ' + ore + '.' ],
            'Enter mines a fresh cloud, X ' + (sectorHome ? 'to return to the sector.' : 'for the mission menu.'));
    }, 700);
}
// SPEC 3.71: the standalone Mining drill's own 7-minute clock (elsewhere,
// a real quadrant field or the demo/contract's own leg never sets
// miningState at all — see its declaration). Ends the run at zero
// regardless of what's left in the cloud; a beam already in flight (E or
// V) finishes its own current tick untouched, same as any other tool does
// once `won` flips — nothing here interrupts it directly.
function updateMining(dt) {
    if (!miningState || won || lost || !miningState.started) return;
    var before = CFG.miningDrillS - miningState.elapsed;
    miningState.elapsed += dt;
    var left = CFG.miningDrillS - miningState.elapsed;
    CFG.miningClockMarks.forEach(function (m) {
        if (before > m && left <= m) say(m + (m === 1 ? ' second left.' : ' seconds left.'));
    });
    if (left <= 0) finishMiningDrillClock();
}
function finishMiningDrillClock() {
    won = true;
    var msg = miningState;
    recordRun('mining', { ore: ore, seconds: CFG.miningDrillS, cleared: false, cores: msg.cores });
    if (ore > 0) setTimeout(function () { SIM.cues.play('win_fanfare'); }, 300);
    setTimeout(function () {
        openDebrief('Time up',
            [ 'Ore hold ' + ore + '.',
              msg.cores + (msg.cores === 1 ? ' core extracted.' : ' cores extracted.') ],
            'Enter mines a fresh cloud, X for the mission menu.');
    }, 700);
}
// SPEC 3.71: the standalone Combat drill's own clock — just a ticker;
// destroyTarget's generic branch is still what actually ends the drill
// on the fifth kill, same as before this round.
function updateCombat(dt) {
    if (!combatState || won || lost || !combatState.started) return;
    combatState.elapsed += dt;
}

// E — the extractor. Only bites on a rock that has been mined to its core.
function startExtract() {
    // SPEC 3.55: recovering the derelict is instant, one E press once it's
    // been tractored close — not a multi-tick drain like a rock's core, so
    // this branches away before any of the ordinary extractor gating below
    // (which assumes a t.resource rock and a real beam).
    if (distress && !distress.recovered) {
        var d = targets[selected];
        if (!d || d.kind !== 'friendly') { say('Select the derelict first. Tab cycles targets.'); return; }
        var ad = len(sub(d.pos, ship.pos));
        if (ad > CFG.tractorStopDist + 0.5) {
            SIM.cues.play('refusal_dud');
            say('Tractor it in first. Distance ' + round10(ad) + '.');
            return;
        }
        distress.recovered = true;
        stopTractor();
        d.alive = false;
        var di = targets.indexOf(d);
        if (di >= 0) targets.splice(di, 1);
        stopVoice(d);
        selectNearest();
        SIM.audio.blip(900, 200, 0.15, 0, 'sine');
        say('Derelict secured. Bring it home to ' + distress.poiName + '.');
        return;
    }
    // SPEC 3.74: the corona has no core — "vacuums and extractors" in
    // Brian's own note is read as "the mining tools" generically, and V
    // is the one that actually does anything here.
    if (corona) { SIM.cues.play('refusal_offline'); say('The corona has no core. V scoops hydrogen instead.'); return; }
    if (mode !== 'mining') { SIM.cues.play('refusal_offline'); say('The extractor is a mining tool.'); return; }
    if (beam) { SIM.cues.play('refusal_wait'); return; }
    var t = targets[selected];
    if (!t || !t.alive || !t.resource) {
        say('The extractor only works on a rock mined down to its glowing core.');
        return;
    }
    var a = aim(t.pos);
    if (a.dist > CFG.vacRange) {
        say('Too far. Fly within ' + CFG.vacRange + ' of the core. Distance ' + round10(a.dist) + '.');
        return;
    }
    if (a.err > CFG.vacArc) { say('Center the core first.'); return; }
    startBeam('vac');
}

// V — the space vacuum. Filters loose particulates near the ship; no aim
// needed. The consolation harvest when a rock got away.
function startDustVac() {
    if (mode !== 'mining') { SIM.cues.play('refusal_offline'); say('The vacuum is a mining tool.'); return; }
    if (beam) { SIM.cues.play('refusal_wait'); return; }
    // SPEC 3.74: the corona's own harvest — no debris field to check range
    // against, just the ship's own distance from the star at the origin.
    if (corona) {
        var cdist = len(ship.pos);
        if (cdist > CFG.starHarvestDist) {
            SIM.cues.play('refusal_dud');
            say('Too far to harvest hydrogen. Fly within ' + CFG.starHarvestDist + '. Distance ' + round10(cdist) + '.');
            return;
        }
        startBeam('dust');
        return;
    }
    var any = debris.some(function (d) { return len(sub(d.pos, ship.pos)) < CFG.dustVacRange; });
    if (!any) {
        say(debrisTotal() > 0
            ? 'No dust within range. Fly toward the shimmer and try again.'
            : 'No dust in the cloud. Crack a rock loose first.');
        return;
    }
    startBeam('dust');
}

// ---- turret defense (SPEC 3.59/3.65, ideas14.txt + Brian's own playtest) ---
// Brian's own picture: three fixed zones in front of a stationary ship,
// Left/Right switch between them, and Space/F/G act on whichever one is
// selected — juggling a laser cooldown, a shield, and a limited missile
// magazine across all three at once, "to represent defending the back of a
// ship from a turret like thing." No lock, no Tab — the zone IS the aim.
// SPEC 3.65 (from playing 3.59 — "I got most of the objects, hull hit maybe
// once"): a sweet spot to clear at (too early or too late scores less), the
// approach getting faster as the drill goes on, a second incoming kind only
// a shield answers, a streak reward, and a debrief with more than points.
// First pass is the 3-zone version only (3.59b, the numpad 3x3, is separate).
var TURRET_ZONE_NAMES = ['left', 'centre', 'right'];

function makeTurretState() {
    var zones = TURRET_ZONE_NAMES.map(function () {
        return { laserReadyAt: 0, shieldUp: false, incoming: null, spawnIn: rand(CFG.turretSpawnGapMinS, CFG.turretSpawnGapMaxS) };
    });
    return { zone: 1, zones: zones, elapsed: 0, cleared: 0, hits: 0, missiles: CFG.turretMissileMax,
             score: 0, streak: 0, bestStreak: 0, streakShieldUntil: 0, streakPreShield: null,
             volleyCaught: 0, volleyLanded: 0, zoneHits: [0, 0, 0], offsets: [] };
}
function rand(min, max) { return min + Math.random() * (max - min); }

function turretIntro() {
    // SPEC 3.72: the volley (a second incoming kind, shield-only) is
    // retired — turretVolleyChance is 0, so it never spawns any more.
    // Dropped from the spoken intro too; saying it here would tell every
    // pilot to expect something they'll never hear.
    return 'Turret defense. Three zones: left, centre, and right — left and right arrows switch ' +
           'between them. Space fires the laser in the selected zone, F a missile, G its shield. ' +
           'Survive ' + CFG.turretDrillS + ' seconds. F1 for help.';
}

// A world position for an incoming: its zone's bearing plus its height's
// elevation, closing from turretSpawnDist to 0 as `frac` (timeLeft/total)
// falls, directly in front of the stationary ship.
function turretIncomingPos(zoneIdx, height, frac) {
    var yaw = CFG.turretZoneBearingsDeg[zoneIdx] * Math.PI / 180;
    var pitch = CFG.turretHeightOffsetsDeg[height] * Math.PI / 180;
    var dist = frac * CFG.turretSpawnDist;
    var dir = v3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
    return add(ship.pos, scale(dir, dist));
}

// A continuous closing voice — pitch/rate both rise as frac falls, the same
// "it's getting closer" cue the lock tick and the mine field (3.61) will
// reuse. SPEC 3.65: a 'volley' is a distinct timbre (filtered noise, not a
// tone) so the ear can tell "can be shot" from "shield only" apart from the
// zone's bearing/height alone. Shape mirrors enemyBeamVoice: {g, p, oscs}.
function buildIncomingVoice(inc) {
    if (!SIM.audio.ctx) return null;
    var A = SIM.audio;
    var g = A.ctx.createGain(); g.gain.value = 0.0001;
    var p = A.makePanner(turretIncomingPos(inc.zone, inc.height, 1));
    var pulseGain = A.ctx.createGain(); pulseGain.gain.value = 1;
    var pulse = A.ctx.createOscillator(); pulse.type = 'sine'; pulse.frequency.value = 2;
    var pulseDepth = A.ctx.createGain(); pulseDepth.gain.value = 0.5;
    pulse.connect(pulseDepth); pulseDepth.connect(pulseGain.gain);
    var tone, filt;
    if (inc.kind === 'volley') {
        tone = A.ctx.createBufferSource(); tone.buffer = A.noiseBuf; tone.loop = true; tone.start();
        filt = A.ctx.createBiquadFilter(); filt.type = 'bandpass'; filt.frequency.value = 500; filt.Q.value = 4;
        tone.connect(filt); filt.connect(pulseGain);
    } else {
        tone = A.ctx.createOscillator(); tone.type = 'triangle'; tone.frequency.value = 300; tone.start();
        tone.connect(pulseGain);
    }
    pulseGain.connect(g); g.connect(p); p.connect(A.worldBus);
    pulse.start();
    A.ramp(g.gain, CFG.turretIncomingVol, 0.15);   // SPEC 3.72: was a hardcoded 0.22
    return { g: g, p: p, oscs: [tone, pulse], pulse: pulse, tone: tone, filt: filt };
}
function moveIncomingVoice(inc, frac) {
    if (!inc.nodes) return;
    SIM.audio.movePanner(inc.nodes.p, turretIncomingPos(inc.zone, inc.height, frac));
    // Closer = higher pitch/frequency and a faster pulse — both from the
    // same frac, 1 (just spawned) down to 0 (impact) — for either kind.
    var t = SIM.audio.ctx.currentTime;
    if (inc.nodes.filt) inc.nodes.filt.frequency.setTargetAtTime(500 + (1 - frac) * 1200, t, 0.1);
    else inc.nodes.tone.frequency.setTargetAtTime(300 + (1 - frac) * 500, t, 0.1);
    inc.nodes.pulse.frequency.setTargetAtTime(2 + (1 - frac) * 10, t, 0.1);
}
function stopIncomingVoice(inc) {
    if (!inc.nodes) return;
    var nodes = inc.nodes; inc.nodes = null;
    try {
        SIM.audio.ramp(nodes.g.gain, 0.0001, 0.1);
        setTimeout(function () { try { nodes.oscs.forEach(function (o) { o.stop(); }); nodes.p.disconnect(); } catch (e) {} }, 200);
    } catch (e) {}
}
function stopAllTurretVoices() {
    if (!turretState) return;
    turretState.zones.forEach(function (z) { if (z.incoming) stopIncomingVoice(z.incoming); });
}

// SPEC 3.65: the drawn time-to-impact shrinks linearly across the drill,
// from the full range down to turretRampFloor of it — the tone's own rise
// IS the speed (moveIncomingVoice already derives pitch/pulse from frac),
// so pressure needs no other mechanism.
function turretRampFactor() {
    var frac = clamp(turretState.elapsed / CFG.turretDrillS, 0, 1);
    return 1 - (1 - CFG.turretRampFloor) * frac;
}

function spawnTurretIncoming(zoneIdx) {
    var z = turretState.zones[zoneIdx];
    var heights = ['low', 'mid', 'high'];
    var total = rand(CFG.turretIncomingMinS, CFG.turretIncomingMaxS) * turretRampFactor();
    var kind = Math.random() < CFG.turretVolleyChance ? 'volley' : 'shot';
    z.incoming = { zone: zoneIdx, height: heights[Math.floor(Math.random() * heights.length)],
                    kind: kind, timeLeft: total, total: total };
    z.incoming.nodes = buildIncomingVoice(z.incoming);
}

// SPEC 3.65: score a clear by how close to the sweet spot it landed — full
// marks at turretSweetFrac of the approach, falling either side, floored at
// turretMinPoints so any clear still counts for something. Also logs the
// signed timing offset (seconds; negative = early, positive = late) for the
// debrief's own average.
function turretClearScore(inc, frac) {
    var off = (CFG.turretSweetFrac - frac) * inc.total;
    turretState.offsets.push(off);
    var s = CFG.turretMaxPoints * Math.max(0, 1 - Math.abs(frac - CFG.turretSweetFrac) / CFG.turretSweetWidth);
    return Math.max(CFG.turretMinPoints, Math.round(s));
}

// A clear, or a shield catching a volley, extends the streak; a hull hit
// (an unhandled impact) resets it. At turretStreakFor, every zone's shield
// snaps up for turretStreakShieldS regardless of what the player had set,
// then each zone is restored to its own prior state.
function turretRegisterSuccess() {
    turretState.streak++;
    if (turretState.streak > turretState.bestStreak) turretState.bestStreak = turretState.streak;
    if (turretState.streak > 0 && turretState.streak % CFG.turretStreakFor === 0) {
        turretState.streakPreShield = turretState.zones.map(function (z) { return z.shieldUp; });
        turretState.zones.forEach(function (z) { z.shieldUp = true; });
        turretState.streakShieldUntil = turretState.elapsed + CFG.turretStreakShieldS;
        SIM.audio.blip(700, 160, 0.18, 0, 'sine');
        say('Streak! Shields up, ' + CFG.turretStreakShieldS + ' seconds.');
        return true;   // caller must not also say() this tick (SPEC 2.15)
    }
    return false;
}
function turretRegisterFailure() { turretState.streak = 0; }

// An incoming that ran its clock out: the zone's own shield absorbs it
// (silently for a shot, scored for a volley) or it lands on the hull.
function turretImpact(zoneIdx) {
    var z = turretState.zones[zoneIdx];
    var inc = z.incoming;
    stopIncomingVoice(inc);
    z.incoming = null;
    z.spawnIn = rand(CFG.turretSpawnGapMinS, CFG.turretSpawnGapMaxS);
    if (z.shieldUp) {
        SIM.cues.play('shield_splash');
        if (inc.kind === 'volley') {
            turretState.volleyCaught++;
            turretState.score += CFG.turretVolleyPoints;   // SPEC 3.72: still scored, just never spoken
            var streakLine = turretRegisterSuccess();
            if (!streakLine) say('Shields catch it in the ' + TURRET_ZONE_NAMES[zoneIdx] + ' zone.');
        } else {
            say('Shields catch it in the ' + TURRET_ZONE_NAMES[zoneIdx] + ' zone.');
        }
    } else if (inc.kind === 'volley') {
        turretState.volleyLanded++;
        turretState.zoneHits[zoneIdx]++;
        turretRegisterFailure();
        hullHit(CFG.turretHullDmg, 'Volley, ' + TURRET_ZONE_NAMES[zoneIdx] + ' zone');
    } else {
        turretState.hits++;
        turretState.zoneHits[zoneIdx]++;
        turretRegisterFailure();
        hullHit(CFG.turretHullDmg, 'Incoming, ' + TURRET_ZONE_NAMES[zoneIdx] + ' zone');
    }
}

function updateTurret(dt) {
    if (over()) return;
    turretState.elapsed += dt;
    // The streak shield's own countdown, independent of the impact loop
    // below — restores each zone to whatever it had before the streak.
    if (turretState.streakPreShield && turretState.elapsed >= turretState.streakShieldUntil) {
        turretState.zones.forEach(function (z, i) { z.shieldUp = turretState.streakPreShield[i]; });
        turretState.streakPreShield = null;
    }
    turretState.zones.forEach(function (z, i) {
        if (z.incoming) {
            z.incoming.timeLeft -= dt;
            if (z.incoming.timeLeft <= 0) { turretImpact(i); return; }
            moveIncomingVoice(z.incoming, clamp(z.incoming.timeLeft / z.incoming.total, 0, 1));
        } else {
            z.spawnIn -= dt;
            if (z.spawnIn <= 0) spawnTurretIncoming(i);
        }
    });
    if (lost) return;
    if (turretState.elapsed >= CFG.turretDrillS) {
        won = true;
        stopAllTurretVoices();
        openTurretDebrief();
    }
}

// SPEC 3.65: "more than points" — six measures Brian asked for without
// naming which ones; each names something the player can change next run.
function turretAccuracyPct() {
    var attempted = turretState.cleared + turretState.hits;
    return attempted > 0 ? Math.round(turretState.cleared / attempted * 100) : 0;
}
