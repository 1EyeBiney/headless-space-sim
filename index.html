    } else if (th.age > CFG.enemyMissileLifeS) {
        SIM.audio.noiseBurst(th.pos, 300, 0.35, 1200);
        endThreat();
        say('Incoming missile burned out.');
    }
}

// Hull damage: a low thud in the cockpit and the number. Hull is out of 100
// so the raw value IS the percent.
function hullHit(dmg, source) {
    hull = Math.max(0, hull - dmg);
    SIM.cues.play('hull_hit');
    if (hull <= 0) { shipDestroyed(source); return; }
    say('Your hull ' + hull + '.');
}

function shipDestroyed(source) {
    lost = true;
    endThreat();
    stopBeam(true);
    killMissile();
    shieldReset();
    keysDown = {};
    thrusterSync(null);
    SIM.cues.play('ship_destroyed');
    setTimeout(function () {
        var tail = demo
            ? 'Delivery run failed at ' + fmtTime(demo.elapsed) + '. Enter restarts the run from the beginning, X for the mission menu.'
            : 'Enter tries again' + (sectorHome ? ', X returns to the sector.' : ', X for the mission menu.');
        say('Hull breached by ' + source + '. Ship lost. ' + tail);
    }, 900);
}

// ---- shields ----------------------------------------------------------------
// The pilot's answer to enemy fire. Six-axis dogfighting is not this game's
// thing, so instead of jinking the pilot listens for the warning and gets
// the shields up. They take a moment to raise (a rising sweep, then a clunk
// and a steady hum), hold for a limited time before collapsing, and recharge
// in proportion to how long they were held. While up: weapons offline, and
// every missile in flight — theirs or yours — loses guidance.
function shieldsBusy() { return shield.up || shield.raising >= 0; }

function shieldKey() {
    if (mode !== 'combat') { say('Shields are only needed in combat. Nothing here is shooting.'); return; }
    if (shield.up) { shieldDrop(false, 'manual'); return; }
    if (shield.raising >= 0) { say('Shields already coming up.'); return; }
    if (shield.repairing > 0) {
        SIM.cues.play('refusal_wait');
        say('Shields in disrepair. Damage control needs ' + Math.ceil(shield.repairing) + ' seconds.');
        return;
    }
    if (beam && beam.tool === 'laser') {
        SIM.cues.play('refusal_dud');
        say('Laser burst in progress, ' + Math.ceil(beamSecondsLeft()) + ' seconds. Shields after.');
        return;
    }
    shield.raising = 0;
    shield.warnedLow = false;
    stopBeam(true);                                // an E/V tool yields to the shield
    var secs = CFG.shieldRaiseMs / 1000;
    SIM.cues.play('shield_raise', { dur: secs });
    say('Raising shields.');
}

// Absorb one hit into the pool: splash cue, drain, a one-time "failing"
// warning under 25%, and a drop into disrepair if it empties the pool.
// Returns true if that hit was the one that dropped the shield.
function absorbShield(dmg) {
    SIM.cues.play('shield_splash');
    shield.pool = Math.max(0, shield.pool - dmg);
    if (!shield.warnedLow && shield.pool > 0 && shield.pool <= CFG.shieldPool * 0.25) {
        shield.warnedLow = true;
        SIM.cues.play('shield_failing_warn');
        say('Shields failing.');
    }
    if (shield.pool <= 0) { shieldDrop(false, 'depleted'); return true; }
    return false;
}

// The disrepair crew: a ratchet/welding-tick loop on the UI bus that
// quickens as the repair nears done, entirely separate from the HRTF world.
function scheduleRepairTick() {
    if (shield.repairing <= 0) { shieldRepairTimer = null; return; }
    SIM.cues.play('shield_repair_tick');
    var frac = clamp(shield.repairing / CFG.shieldRepairS, 0, 1);
    shieldRepairTimer = setTimeout(scheduleRepairTick, 250 + frac * 650);
}
function stopRepairSound() {
    if (shieldRepairTimer) { clearTimeout(shieldRepairTimer); shieldRepairTimer = null; }
}

function shieldHum(on) {
    if (!SIM.audio.ctx) return;
    if (on && !shield.nodes) {
        var g = SIM.audio.ctx.createGain(); g.gain.value = 0.0001;
        var a = SIM.audio.ctx.createOscillator(); a.type = 'sine'; a.frequency.value = 110;
        var b = SIM.audio.ctx.createOscillator(); b.type = 'triangle'; b.frequency.value = 220;
        var bg = SIM.audio.ctx.createGain(); bg.gain.value = 0.35;
        var lfo = SIM.audio.ctx.createOscillator(); lfo.frequency.value = 1.5;
        var lg = SIM.audio.ctx.createGain(); lg.gain.value = 0.02;
        lfo.connect(lg); lg.connect(g.gain);
        a.connect(g); b.connect(bg); bg.connect(g); g.connect(SIM.audio.uiBus);
        a.start(); b.start(); lfo.start();
        shield.nodes = { g: g, oscs: [a, b, lfo] };
        SIM.audio.ramp(g.gain, 0.06, 0.15);
    } else if (!on && shield.nodes) {
        var n = shield.nodes; shield.nodes = null;
        SIM.audio.ramp(n.g.gain, 0.0001, 0.2);
        setTimeout(function () { try { n.oscs.forEach(function (o) { o.stop(); }); n.g.disconnect(); } catch (e) {} }, 300);
    }
}

function updateShield(dt) {
    if (shield.raising >= 0) {
        shield.raising += dt;
        if (shield.raising * 1000 >= CFG.shieldRaiseMs) {
            shield.raising = -1; shield.up = true;
            SIM.cues.play('shield_clunk');
            shieldHum(true);
            say('Shields up.');
        }
    } else if (shield.up) {
        // No timed collapse: the pool only drains on an absorbed hit,
        // handled in absorbShield() where the damage lands.
    } else if (shield.repairing > 0) {
        shield.repairing -= dt;
        if (shield.repairing <= 0) {
            shield.repairing = 0;
            stopRepairSound();
            shield.pool = CFG.shieldPool * CFG.shieldRepairReturn;
            SIM.cues.play('ready_chime');
            say('Shields back online, ' + Math.round(CFG.shieldRepairReturn * 100) + ' percent.');
        }
    } else if (shield.pool < CFG.shieldPool) {
        shield.pool = Math.min(CFG.shieldPool, shield.pool + CFG.shieldRegenPerS * dt);
    }
}

function shieldDrop(silent, why) {
    if (!shield.up) { shield.raising = -1; return; }
    shield.up = false;
    shieldHum(false);
    if (why === 'depleted') {
        shield.repairing = CFG.shieldRepairS;
        stopRepairSound();
        scheduleRepairTick();
        if (silent) return;
        SIM.cues.play('shield_drop_depleted');
        say('Shields down. Damage control on it.');
    } else {
        // Manual drop: whatever charge is left in the pool keeps regenerating.
        if (silent) return;
        SIM.cues.play('shield_drop_manual');
        say('Shields down. Weapons hot.');
    }
}

// Full reset between missions: full pool, no disrepair debt, no hum.
function shieldReset() {
    shield.up = false; shield.raising = -1; shield.pool = CFG.shieldPool;
    shield.repairing = 0; shield.warnedLow = false;
    stopRepairSound();
    shieldHum(false);
}

// ---- particulate debris -----------------------------------------------------
// Dust knocked loose by mining. It has essentially no momentum, so a field
// hangs in space right where the rock was cracked while the rock itself is
// shoved away — the consolation prize a pilot can always come back for.
// Each field carries a faint high shimmer through its own HRTF panner, so
// drifting dust is findable by ear; louder shimmer means a richer field.
var debris = [];   // { kind:'dust', name, pos, amount, alive, nodes }
var dustSeq = 0;

function addDebris(pos, amount) {
    amount = Math.round(amount * CFG.debrisScale);
    if (mode !== 'mining' || amount <= 0) return;
    var f = null, best = CFG.debrisMergeDist;
    debris.forEach(function (d) {
        var dd = len(sub(d.pos, pos));
        if (dd < best) { best = dd; f = d; }
    });
    if (f) { f.amount += amount; updateDustVolume(f); return; }
    // A dust field is itself a target: it joins the T-cycle list so the
    // pilot can select it, center it with the tick, and fly to it.
    f = { kind: 'dust', name: 'Dust ' + (++dustSeq), alive: true,
          pos: v3(pos.x, pos.y, pos.z), amount: amount, nodes: null };
    buildDustVoice(f);
    debris.push(f);
    targets.push(f);
}

function buildDustVoice(f) {
    if (!SIM.audio.ctx) return;
    var g = SIM.audio.ctx.createGain(); g.gain.value = 0.0001;
    // Not a steady hiss: the band center wanders slowly and the level
    // sparkles, so a field sounds like drifting, glittering motes — and
    // each field rolls its own base color so no two sound identical.
    var base = 2100 + Math.random() * 900;
    var bp = SIM.audio.ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = base; bp.Q.value = 3;
    var wander = SIM.audio.ctx.createOscillator();
    wander.frequency.value = 0.15 + Math.random() * 0.25;
    var wg = SIM.audio.ctx.createGain(); wg.gain.value = 650;
    wander.connect(wg); wg.connect(bp.frequency);
    var sparkle = SIM.audio.ctx.createOscillator();
    sparkle.frequency.value = 1.5 + Math.random() * 2;
    var sg = SIM.audio.ctx.createGain(); sg.gain.value = 0.012;
    sparkle.connect(sg); sg.connect(g.gain);
    var p = SIM.audio.makePanner(f.pos);
    var src = SIM.audio.ctx.createBufferSource(); src.buffer = SIM.audio.noiseBuf; src.loop = true;
    src.connect(bp); bp.connect(g); g.connect(p); p.connect(SIM.audio.masterGain);
    wander.start(); sparkle.start();
    src.start(0, Math.random());
    f.nodes = { gain: g, panner: p, src: src, lfos: [wander, sparkle] };
    updateDustVolume(f);
}

function updateDustVolume(f) {
    if (!f.nodes) return;
    SIM.audio.ramp(f.nodes.gain.gain, clamp(0.015 + f.amount / 8000, 0.015, 0.07), 0.3);
}

function removeDust(f) {
    f.alive = false;
    var i = debris.indexOf(f);
    if (i >= 0) debris.splice(i, 1);
    var j = targets.indexOf(f);
    if (j >= 0) {
        // Keep the selection pointing at the same object across the splice.
        var prevSel = targets[selected];
        targets.splice(j, 1);
        if (prevSel === f || !prevSel) selectNearest();
        else selected = targets.indexOf(prevSel);
    }
    if (f.nodes) {
        var n = f.nodes; f.nodes = null;
        SIM.audio.ramp(n.gain.gain, 0.0001, 0.3);
        setTimeout(function () {
            try {
                n.src.stop();
                (n.lfos || []).forEach(function (o) { o.stop(); });
                n.panner.disconnect();
            } catch (e) {}
        }, 500);
    }
}

function clearDebris() { debris.slice().forEach(removeDust); debris = []; }

function debrisTotal() {
    return debris.reduce(function (s, d) { return s + d.amount; }, 0);
}

// ---- rock lifecycle ---------------------------------------------------------
function rockPush(t) { return t.resource ? 2.2 : ROCK_SIZES[t.size].push; }
function pushRock(t, dv) { t.vel = add(t.vel, dv); }

// Random unit-ish vector for blast impulses.
function randDir() {
    var a = Math.random() * Math.PI * 2, e = Math.random() * 1.6 - 0.8;
    return v3(Math.cos(a) * Math.cos(e), Math.sin(e), Math.sin(a) * Math.cos(e));
}

// A stage gave way. The player never knows which outcome is coming: the rock
// splits in two (each child rolls its own hidden hp and may differ in stage),
// chips down a size (same rock, higher pitch, fresh hidden hp), or — past
// 'small' — collapses into a glowing resource core for the extractor.
function rockEvent(t) {
    stopBeam(true);
    SIM.cues.play('explosion_rock', { pos: t.pos });
    // The blast sheds a mist of particulates that hangs where it happened —
    // bigger rocks throw bigger mists. (Computed before the size changes.)
    var mist = Math.round((CFG.debrisEventBase + Math.random() * 200) *
                          (1 + (ROCK_SIZES.length - 1 - t.size) * 0.5));
    addDebris(t.pos, mist);
    if (t.size >= ROCK_SIZES.length - 1) {
        // Small rock collapses into the mineable core.
        t.resource = true;
        t.oreLeft = t.type.ore + Math.floor(Math.random() * 600) - 300;
        pushRock(t, scale(randDir(), 6));
        if (t.nodes && t.nodes.src) SIM.audio.ramp(t.nodes.src.playbackRate, 1.6, 0.6);
        say(t.name + ' collapses into a glowing core. Get close and press E to extract.');
        return;
    }
    if (Math.random() < t.type.splitChance) {
        // Break apart: two smaller children pushed gently opposite ways —
        // just enough drift to separate them, not enough to flee the cloud.
        t.alive = false;
        stopVoice(t);
        var d = randDir();
        var childSize = t.size + 1;
        // Drift scales with the children's flightiness: big children barely
        // separate, small ones tumble noticeably — pilot's choice to chase
        // the rock or stay and vacuum the dust it left behind.
        var kick = (9 + Math.random() * 7) * ROCK_SIZES[childSize].push;
        var a = spawnRock(t.type, childSize, add(t.pos, scale(d, 8)),  add(t.vel, scale(d, kick)));
        var b = spawnRock(t.type, childSize, sub(t.pos, scale(d, 8)),  sub(t.vel, scale(d, kick)));
        targets.push(a); targets.push(b);
        // Auto-track the nearer child so the pilot keeps working the seam.
        var child = len(sub(a.pos, ship.pos)) <= len(sub(b.pos, ship.pos)) ? a : b;
        selected = targets.indexOf(child);
        locked = false;
        stopSolidTone();
        say(t.name + ' breaks apart! Auto targeting child: ' +
            ROCK_SIZES[childSize].label + ' ' + t.type.name + ' asteroid, ' +
            child.name + ', distance ' + round10(len(sub(child.pos, ship.pos))) + '.');
        return;
    }
    // Chip down: same rock, one size smaller, audibly higher voice.
    t.size += 1;
    t.hp = rollHp(t.size);
    pushRock(t, scale(randDir(), (5 + Math.random() * 5) * ROCK_SIZES[t.size].push));
    if (t.nodes && t.nodes.src) {
        SIM.audio.ramp(t.nodes.src.playbackRate, ROCK_SIZES[t.size].rate, 0.6);
    }
    say(t.name + ' is chipped down to ' + ROCK_SIZES[t.size].label + '.');
    // Chip and core-collapse keep the same rock, so the selection stays put.
}

// Lasering a finished core destroys the payload — use the extractor instead.
// A quarter of the ore survives as a dust mist, so it stings without ruining
// the run entirely.
function shatterCore(t) {
    SIM.cues.play('explosion_rock', { pos: t.pos });
    addDebris(t.pos, Math.round(t.oreLeft * 0.25));
    t.alive = false;
    stopVoice(t);
    say(t.name + ' shatters under the laser. Most of the ore is lost, but a dust mist remains.');
    if (targets[selected] === t) selectNearest();
    checkMiningEnd();
}

// Drifted past the cloud edge: gone for good.
function loseRock(t) {
    t.alive = false;
    if (t.nodes) SIM.audio.ramp(t.nodes.gain.gain, 0.0001, 1.2);
    setTimeout(function () { stopVoice(t); }, 1400);
    SIM.audio.blip(300, 400, 0.1, 0, 'sine');
    say(t.name + ' drifts out of the cloud. Lost.');
    if (targets[selected] === t) selectNearest();
    checkMiningEnd();
}

function checkMiningEnd() {
    if (mode !== 'mining' || won) return;
    if (aliveRocks().length > 0) return;
    if (debrisTotal() > 0) {
        // The rocks are done but the harvest isn't: sweep the dust to finish.
        setTimeout(function () {
            say('All rocks worked. Dust still shimmers in the cloud — fly to it and vacuum it up with V.');
        }, 600);
        return;
    }
    won = true;
    if (ore > 0) setTimeout(function () { SIM.cues.play('win_fanfare'); }, 400);
    setTimeout(function () {
        say('Cloud cleared. Ore hold ' + ore +
            '. Press Enter to mine a fresh cloud, or X ' +
            (sectorHome ? 'to return to the sector.' : 'for the mission menu.'));
    }, 700);
}

// E — the extractor. Only bites on a rock that has been mined to its core.
function startExtract() {
    if (mode !== 'mining') { say('The extractor is a mining tool.'); return; }
    if (beam) { SIM.cues.play('refusal_dud'); return; }
    var t = targets[selected];
    if (!t || !t.alive || !t.resource) {
        say('The extractor only works on a rock mined down to its glowing core.');
        return;
    }
    var a = aim(t.pos);
    if (a.dist > CFG.vacRange) {
        say('Too far. Fly within ' + CFG.vacRange + ' of the core. Distance ' + round10(a.dist) + '.');
        return;
    }
    if (a.err > CFG.vacArc) { say('Center the core first.'); return; }
    startBeam('vac');
}

// V — the space vacuum. Filters loose particulates near the ship; no aim
// needed. The consolation harvest when a rock got away.
function startDustVac() {
    if (mode !== 'mining') { say('The vacuum is a mining tool.'); return; }
    if (beam) { SIM.cues.play('refusal_dud'); return; }
    var any = debris.some(function (d) { return len(sub(d.pos, ship.pos)) < CFG.dustVacRange; });
    if (!any) {
        say(debrisTotal() > 0
            ? 'No dust within range. Fly toward the shimmer and try again.'
            : 'No dust in the cloud. Crack a rock loose first.');
        return;
    }
    startBeam('dust');
}

// ============================== 8. RADAR ====================================
// Plays each surviving target's own signature at its true 3D position,
// nearest first, by briefly boosting its continuous voice +6 dB. Doubles as
// an HRTF localization drill.
function radarPing() {
    if (radarBusy) return;
    var alive = aliveTargets().slice().sort(function (x, y) {
        return len(sub(x.pos, ship.pos)) - len(sub(y.pos, ship.pos));
    });
    if (!alive.length) { say('No targets remain.'); return; }
    radarBusy = true;
    alive.forEach(function (t, i) {
        setTimeout(function () {
            if (t.alive && t.nodes && SIM.audio.ctx) {
                // Each voice returns to ITS OWN resting level — a dust field's
                // quiet shimmer must not stay stuck at rock volume.
                var back = t.kind === 'dust'
                    ? clamp(0.015 + t.amount / 8000, 0.015, 0.07)
                    : t.kind === 'poi' ? poiGain(t)
                    : CFG.targetGain;
                var peak = t.kind === 'dust' ? back * 4 : back * CFG.radarBoost;
                var g = t.nodes.gain.gain, t0 = SIM.audio.ctx.currentTime;
                g.cancelScheduledValues(t0);
                g.setValueAtTime(peak, t0);
                g.setValueAtTime(peak, t0 + CFG.radarBurstMs / 1000);
                g.linearRampToValueAtTime(back, t0 + CFG.radarBurstMs / 1000 + 0.1);
            }
        }, i * CFG.radarGapMs);
    });
    setTimeout(function () {
        radarBusy = false;
        if (mode === 'mining') {
            var r = aliveRocks().length, d = debris.length;
            say(r + (r === 1 ? ' rock' : ' rocks') +
                (d ? ' and ' + d + (d === 1 ? ' dust field.' : ' dust fields.') : ' remain.'));
        } else if (mode === 'sector') {
            say(alive.length + ' points of interest.');
        } else {
            say(alive.length + (alive.length === 1 ? ' target remains.' : ' targets remain.'));
        }
    }, alive.length * CFG.radarGapMs + 200);
}

function statusReport() {
    var speed = Math.round(len(ship.vel));
    var line = 'Speed ' + speed + '. ';
    var t = targets[selected];
    if (t && t.alive) line += bearingText(t) + ' ';
    if (mode === 'mining') {
        line += 'Ore hold ' + ore + '. ';
        if (debris.length) {
            line += debris.length + (debris.length === 1 ? ' dust field' : ' dust fields') + ' adrift. ';
        }
    }
    if (mode === 'sector') line += 'Ore hold ' + ore + '. Warp charge ' + warpPct() + ' percent. ';
    line += mode === 'mining' ? aliveRocks().length + ' rocks remain. '
          : mode === 'sector' ? aliveTargets().length + ' points of interest. '
          : aliveTargets().length + ' targets remain. ';
    if (mode !== 'mining') {
        line += 'Your hull ' + hull + ' percent. ' + missiles + (missiles === 1 ? ' missile. ' : ' missiles. ');
    }
    if (mode === 'combat' || mode === 'mining') line += laserStatusText();
    if (mode === 'combat') {
        line += shield.up ? 'Shields up, ' + Math.round(shield.pool / CFG.shieldPool * 100) + ' percent. '
              : shield.raising >= 0 ? 'Shields coming up. '
              : shield.repairing > 0 ? 'Shields in disrepair, ' + Math.ceil(shield.repairing) + ' seconds. '
              : shield.pool < CFG.shieldPool ? 'Shields down, ' + Math.round(shield.pool / CFG.shieldPool * 100) + ' percent, recharging. '
              : 'Shields down. ';
        if (laserHot()) line += 'Laser overheated. ';
    }
    if (demo) line += 'Clock ' + fmtTime(demo.elapsed) + '. ' + demoObjective();
    say(line);
}

// ---- run log --------------------------------------------------------------------
// A read-only browsable list, same shell as the quadrant map: the sim
// freezes and ducks while open, arrows step, Escape closes.
function openRunLog() {
    if (!profile.runs.length) { say('No runs recorded yet. Finish a delivery run to set one.'); return; }
    runlog.open = true;
    runlog.idx = -1;
    keysDown = {};
    thrusterSync(null);
    if (SIM.audio.ctx && SIM.audio.masterGain && !paused) SIM.audio.ramp(SIM.audio.masterGain.gain, 0.0001, 0.2);
    say('Run log. Best ' + profile.runs.length + ' of up to 10. Up and down arrows browse, Escape closes.');
}

function closeRunLog() {
    runlog.open = false;
    if (SIM.audio.ctx && SIM.audio.masterGain && !paused) SIM.audio.ramp(SIM.audio.masterGain.gain, CFG.masterGain, 0.2);
    say('Run log closed.');
}

function runLogLineText(i) {
    var r = profile.runs[i];
    return 'Number ' + (i + 1) + ': ' + fmtTime(r.seconds) + ', ' + TIERS[r.tier].name + ' difficulty' +
           (r.upgrades ? ', ' + r.upgrades + ' upgrades' : '') + ', ' + r.date + '.';
}

function runLogKey(lname) {
    if (lname === 'escape') { closeRunLog(); return; }
    var n = profile.runs.length;
    if (lname === 'arrowdown') {
        if (runlog.idx < n - 1) { runlog.idx++; say(runLogLineText(runlog.idx)); }
        else { SIM.audio.blip(220, 80, 0.1); say('End of the list.'); }
    } else if (lname === 'arrowup') {
        if (runlog.idx > 0) { runlog.idx--; say(runLogLineText(runlog.idx)); }
        else { runlog.idx = 0; SIM.audio.blip(220, 80, 0.1); say('Top of the list.'); }
    } else {
        say('Up and down arrows read the run log, Escape closes.');
    }
}

// ---- delivery run --------------------------------------------------------------
// The shareable, timed demo: clear the Contested Zone, mine the quota, deliver
// it to Station Meridian. The clock counts only while the sim is live (pauses,
// help, and the map stop it), and hyperwarp time counts.
function startDemo() {
    menuOpen = false;
    ore = 0; hull = CFG.shipHull; missiles = CFG.missileMax;
    sectorHome = null;
    demo = { elapsed: 0, combatCleared: false, delivered: false, quotaSaid: false };
    newGame('sector');
    placeAtStationStart();
    // The first objective is the nav target from the start, so H works at once.
    targets.forEach(function (t, i) { if (t.poiType === 'combat') selected = i; });
    locked = false; stopSolidTone();
    say(demoIntro());
}

// New pilots begin just outside Station Meridian, facing the Contested Zone,
// with a full tank — the demo route (SPEC 1.10) starts here.
function placeAtStationStart() {
    var s = null, c = null;
    targets.forEach(function (t) {
        if (t.poiType === 'station') s = t;
        if (t.poiType === 'combat') c = t;
    });
    if (!s || !c) return;
    var dir = norm(sub(c.pos, s.pos));
    ship.pos = add(s.pos, scale(dir, CFG.sectorStartDist));
    ship.vel = v3(0, 0, 0);
    ship.yaw = Math.atan2(dir.x, -dir.z);
    ship.pitch = Math.asin(clamp(dir.y, -1, 1));
    refillWarp();
    selectNearest();
}

function demoIntro() {
    return 'Delivery run. The clock is running. First clear the Contested Zone, then mine ' +
           CFG.demoOreGoal + ' ore at Asteroid Field Kappa and deliver it to Station Meridian. ' +
           'The station also repairs, rearms, and refuels you. You carry ' + CFG.missileMax + ' missiles, ' +
           'and a full warp tank that reaches the Contested Zone, your nav target. ' +
           'Q opens the map, H hyperwarps to your nav target, C calls a point within ' +
           CFG.poiInteract + ', and I reads the clock and the tank. F1 for help.';
}

function fmtTime(s) {
    var m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return (m ? m + (m === 1 ? ' minute ' : ' minutes ') : '') + sec + (sec === 1 ? ' second' : ' seconds');
}

function demoObjective() {
    if (!demo) return '';
    if (!demo.combatCleared) return 'Objective: clear the Contested Zone.';
    if (demo.delivered) return 'Delivery complete.';
    if (ore < CFG.demoOreGoal) return 'Objective: mine ore, ' + ore + ' of ' + CFG.demoOreGoal + '.';
    return 'Objective: deliver ' + ore + ' ore to Station Meridian.';
}

// Called on every ore gain: once the quota is met, say so (once).
function oreGained() {
    if (!demo || demo.quotaSaid || ore < CFG.demoOreGoal) return;
    demo.quotaSaid = true;
    setTimeout(function () {
        SIM.audio.sfxArpeggio([659, 784, 1047], 0.12, 0.14, { type: 'triangle' });
        say('Ore hold ' + ore + '. Delivery quota met! Take it to Station Meridian. Q for the map.');
    }, 500);
}

// ============================== 8B. SECTOR ==================================
// The quadrant map (Q): a browsable overlay in the help-screen style. The
// sim freezes and the world ducks while it is open; Enter sets the nav
// target and hands control back with the tick already tracking it.
// Map access rules: always in open sector space; from a sector-entered
// mining encounter any time (miners leave when they please); from a
// sector-entered combat encounter only once the zone is cleared, so the map
// is never an escape hatch mid-fight. Training drills have no sector to
// return to, so the map is offline there.
function openMap() {
    if (mode !== 'sector') {
        if (!sectorHome) {
            say('The quadrant map is offline on training drills. X returns to the mission menu.');
            return;
        }
        if (mode === 'combat' && !won) {   // (a lost ship is not a cleared zone either)
            say('The quadrant map is jammed by hostile fire. Clear the zone first.');
            return;
        }
    }
    if (beam) stopBeam(true);
    map.open = true;
    map.idx = -1;
    map.items = mode === 'sector' ? aliveTargets() : SECTOR_POIS;
    keysDown = {};
    thrusterSync(null);
    updateStabilizers(0);
    if (SIM.audio.ctx && SIM.audio.masterGain && !paused) SIM.audio.ramp(SIM.audio.masterGain.gain, 0.0001, 0.2);
    say('Quadrant map. ' + map.items.length + ' points of interest. Up and down browse, ' +
        (mode === 'sector' ? 'Enter sets the nav target' : 'Enter departs for that point') +
        ', Escape closes.');
}

function closeMap(spoken) {
    map.open = false;
    if (SIM.audio.ctx && SIM.audio.masterGain && !paused) SIM.audio.ramp(SIM.audio.masterGain.gain, CFG.masterGain, 0.2);
    if (spoken) say(spoken);
}

// Inside an encounter the map can't give live bearings (the encounter is its
// own little space), so lines read as chart entries: sector-frame distance
// from the point you are at.
function mapLineText(item) {
    if (mode === 'sector') {
        return bearingText(item) + ' ' + capFirst(warpReachText(len(sub(item.pos, ship.pos)))) + '.';
    }
    if (sectorHome && item.name === sectorHome.poiName) {
        return item.name + ', ' + item.desc + '. Your current location.';
    }
    var d = sectorHome ? round10(len(sub(item.pos, sectorHome.pos))) : 0;
    return item.name + ', ' + item.desc + '. Distance ' + d + ' from here.';
}

function mapKey(lname) {
    if (lname === 'escape' || lname === 'q') { closeMap('Map closed.'); return; }
    if (lname === 'arrowdown') {
        if (map.idx < map.items.length - 1) { map.idx++; say(mapLineText(map.items[map.idx])); }
        else { SIM.audio.blip(220, 80, 0.1); say('End of the list.'); }
    } else if (lname === 'arrowup') {
        if (map.idx > 0) { map.idx--; say(mapLineText(map.items[map.idx])); }
        else { map.idx = 0; SIM.audio.blip(220, 80, 0.1); say('Top of the list.'); }
    } else if (lname === 'enter') {
        if (map.idx < 0) { say('Browse to a point first, with the up and down arrows.'); return; }
        var item = map.items[map.idx];
        if (mode === 'sector') {
            selected = targets.indexOf(item);
            locked = false;
            stopSolidTone();
            closeMap('Nav target set: ' + item.name + '. H hyperwarps to it, or fly it by the tick.');
        } else {
            // Depart the encounter for the chosen point.
            var home = sectorHome;
            closeMap();
            if (item.name === home.poiName) {
                returnToSector();              // just step back outside
            } else {
                returnToSector(true);          // silent: the warp narrates
                var idx = -1;
                targets.forEach(function (t, i) { if (t.name === item.name) idx = i; });
                if (idx >= 0) { selected = idx; locked = false; stopSolidTone(); }
                startWarp();
            }
        }
    } else {
        say('Up and down browse the map, Enter ' +
            (mode === 'sector' ? 'sets the nav target' : 'departs') + ', Escape closes.');
    }
}

// ---- the warp tank (SPEC 1.10) ------------------------------------------------
function warpPct() { return Math.round(warpCharge / CFG.warpTankMax * 100); }
function refillWarp() { warpCharge = CFG.warpTankMax; }

// Charge a jump to a point that far away would spend (the usual dropout is
// flown, not warped), and whether the tank covers it.
function warpNeed(dist) { return Math.max(0, dist - CFG.warpDropout); }
function warpReachText(dist) {
    var need = warpNeed(dist);
    return need <= warpCharge ? 'in warp range'
         : 'beyond warp range by ' + round10(need - warpCharge);
}

// Open-flight regen, audible: a low core-cooling hiss on the UI bus that
// thins as the tank fills, then a chime when it's full. Silent in
// encounters and at full charge.
function updateWarpCore(dt) {
    if (mode !== 'sector' || warping || warpCharge >= CFG.warpTankMax) { warpCoreSound(false); return; }
    warpCharge = Math.min(CFG.warpTankMax, warpCharge + CFG.warpRegenPerS * dt);
    if (warpCharge >= CFG.warpTankMax) {
        warpCoreSound(false);
        SIM.cues.play('ready_chime');
        say('Warp core cooled. Tank full.');
        return;
    }
    warpCoreSound(true);
}

function warpCoreSound(on) {
    var A = SIM.audio;
    if (!A.ctx) return;
    if (on && !warpCoreNodes) {
        var g = A.ctx.createGain(); g.gain.value = 0.0001;
        var f = A.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 180; f.Q.value = 1.2;
        var src = A.ctx.createBufferSource(); src.buffer = A.noiseBuf; src.loop = true;
        var lfo = A.ctx.createOscillator(); lfo.frequency.value = 0.6;   // slow breathing
        var lg = A.ctx.createGain(); lg.gain.value = 0.0;
        lfo.connect(lg); lg.connect(g.gain);
        src.connect(f); f.connect(g); g.connect(A.uiBus);
        src.start(); lfo.start();
        warpCoreNodes = { src: src, lfo: lfo, lg: lg, g: g };
    }
    if (warpCoreNodes) {
        if (on) {
            var vol = 0.01 + (1 - warpCharge / CFG.warpTankMax) * 0.04;   // thins as it fills
            A.ramp(warpCoreNodes.g.gain, vol, 0.3);
            A.ramp(warpCoreNodes.lg.gain, vol * 0.5, 0.3);
        } else {
            var n = warpCoreNodes; warpCoreNodes = null;
            A.ramp(n.g.gain, 0.0001, 0.3);
            setTimeout(function () { try { n.src.stop(); n.lfo.stop(); n.g.disconnect(); } catch (e) {} }, 500);
        }
    }
}

// ---- docking (SPEC 1.6) ---------------------------------------------------
// A cockpit instrument like the tick, on the UI bus, not HRTF: a centerline
// tone panned by lateral offset (drifted right of the line = tone from the
// left = turn left, the tick's own "steer toward the tone" convention),
// its pitch carrying glide slope (high = sharp, low = flat), and a range
// click that quickens toward the door. Placeholder timbre for Brian's ear.
function corridorFrame(poi) {
    var axis = norm(poi.dockAxis || v3(0, 0, 1));
    var right = norm(cross(v3(0, 1, 0), axis));
    if (len(right) < 1e-6) right = v3(1, 0, 0);   // axis is near-vertical; fall back
    return { axis: axis, right: right, up: cross(axis, right) };
}

function startDocking(poi) {
    var f = corridorFrame(poi);
    docking = { poi: poi, axis: f.axis, right: f.right, up: f.up, coachAt: 0, tickTimer: null };
    scheduleDockTick();
    say('Meridian control: cleared to dock. Approach corridor active.');
}

function stopDocking(silent) {
    if (!docking) return;
    var d = docking; docking = null;
    clearTimeout(d.tickTimer);
    dockToneOn(false);
    if (!silent) say('Docking aborted.');
}

// Ship's offset from the ideal corridor line: lateral (+ = right of the
// line), vertical (+ = high), and straight-line range to the door.
function dockOffsets() {
    var v = sub(ship.pos, docking.poi.pos);
    return { lateral: dot(v, docking.right), vertical: dot(v, docking.up),
             range: len(sub(docking.poi.pos, ship.pos)) };
}

function dockToneOn(on) {
    var A = SIM.audio;
    if (!A.ctx) return;
    if (on && !dockToneNodes) {
        var g = A.ctx.createGain(); g.gain.value = 0.0001;
        var o = A.ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 600;
        var pan = A.ctx.createStereoPanner ? A.ctx.createStereoPanner() : null;
        o.connect(g);
        if (pan) { g.connect(pan); pan.connect(A.uiBus); } else { g.connect(A.uiBus); }
        o.start();
        dockToneNodes = { o: o, g: g, pan: pan };
        A.ramp(g.gain, 0.09, 0.2);
    } else if (!on && dockToneNodes) {
        var n = dockToneNodes; dockToneNodes = null;
        A.ramp(n.g.gain, 0.0001, 0.2);
        setTimeout(function () { try { n.o.stop(); n.g.disconnect(); } catch (e) {} }, 400);
    }
}

// The range click: a real setTimeout chain (like the lock tick), independent
// of the rAF-driven frame loop, so it keeps time even if simTick stalls.
function scheduleDockTick() {
    if (!docking) return;
    var frac = clamp(dockOffsets().range / CFG.dockCorridorLen, 0, 1);
    SIM.audio.blip(1400, 40, 0.08, 0, 'square');
    docking.tickTimer = setTimeout(scheduleDockTick,
        CFG.dockClickFastMs + (CFG.dockClickSlowMs - CFG.dockClickFastMs) * frac);
}

function updateDocking(dt) {
    if (!docking) return;
    var o = dockOffsets();
    if (o.range <= CFG.dockRadius && len(ship.vel) <= CFG.dockMaxSpeed) { finishDocking(); return; }
    if (o.range <= CFG.dockSpeedCheckDist && len(ship.vel) > CFG.dockMaxSpeed) { abortToEntry(); return; }
    dockToneOn(true);
    var pan = clamp(-o.lateral / CFG.dockPanWidth, -1, 1);
    var pitch = 600 + clamp(o.vertical, -400, 400);
    if (dockToneNodes) {
        SIM.audio.ramp(dockToneNodes.o.frequency, pitch, 0.15);
        if (dockToneNodes.pan) SIM.audio.ramp(dockToneNodes.pan.pan, pan, 0.15);
    }
    var now = Date.now();
    if (now - docking.coachAt > CFG.dockCoachIntervalMs) {
        docking.coachAt = now;
        var lat = Math.round(Math.abs(o.lateral) / 5) * 5, vert = Math.round(Math.abs(o.vertical) / 5) * 5;
        if (lat > CFG.dockCenterTol || vert > CFG.dockCenterTol) {
            var bits = [];
            if (lat > CFG.dockCenterTol) bits.push(lat + (o.lateral > 0 ? ' right' : ' left'));
            if (vert > CFG.dockCenterTol) bits.push(vert + (o.vertical > 0 ? ' high' : ' low'));
            say(bits.join(', ') + ', range ' + round10(o.range) + '.');
        }
    }
}

function abortToEntry() {
    var entry = add(docking.poi.pos, scale(docking.axis, CFG.dockCorridorLen));
    ship.pos = entry; ship.vel = v3(0, 0, 0);
    var dir = norm(sub(docking.poi.pos, entry));
    ship.yaw = Math.atan2(dir.x, -dir.z);
    ship.pitch = Math.asin(clamp(dir.y, -1, 1));
    docking.coachAt = Date.now();
    SIM.cues.play('dock_abort');
    say('Too fast. Docking aborted. Resetting to the approach corridor.');
}

// Success: repair/rearm/refuel and the delivery handover move here from the
// old instant-call flow — they now happen on ARRIVAL, not on the call.
function finishDocking() {
    var poi = docking.poi;
    stopDocking(true);
    ship.vel = v3(0, 0, 0);
    SIM.cues.play('dock_clunk');
    docked = { poi: poi };
    stationIdx = 0;
    var repaired = hull < CFG.shipHull, rearmed = missiles < CFG.missileMax,
        refueled = warpCharge < CFG.warpTankMax;
    hull = CFG.shipHull; missiles = CFG.missileMax; refillWarp();
    var service = (repaired ? 'Hull repaired. ' : '') +
                  (rearmed ? 'Missiles rearmed to ' + CFG.missileMax + '. ' : '') +
                  (refueled ? 'Warp tank filled. ' : '');
    if (demo && !demo.delivered && ore >= CFG.demoOreGoal) {
        var delivered = ore;
        demo.delivered = true;
        ore = 0;
        var isBest = recordRun(demo.elapsed);
        var bestLine = isBest === true ? 'New personal best!'
                      : isBest === false ? 'Best is ' + fmtTime(profile.runs[0].seconds) + '.'
                      : '';
        setTimeout(function () { SIM.cues.play('win_fanfare'); }, 300);
        say('Docked at ' + poi.name + '. Cargo received, ' + delivered + ' ore. Delivery complete! ' +
            'Run time ' + fmtTime(demo.elapsed) + '. ' + bestLine + ' ' + service + stationMenuIntro());
    } else {
        say('Docked at ' + poi.name + '. ' + service +
            (demo && !demo.delivered
                ? 'The delivery needs ' + CFG.demoOreGoal + ' ore. Your hold reads ' + ore + '.'
                : 'Your cargo hold reads ' + ore + ' ore.') + ' ' + stationMenuIntro());
    }
}

// ---- station menu shell (SPEC 1.7 fleshes out the item list) --------------
// Same shell as the mission menu: arrows navigate, a click per move, Enter
// selects with a beat, Escape (or X) undocks. Not yet the shared listMenu
// the plan describes — see CLAUDE.md's note on the run log for why.
var STATION_ITEMS = [
    { label: 'Undock', desc: 'Back out along the approach corridor, clear of the station.',
      run: function () { undock(); } }
];

function stationMenuIntro() {
    return 'Station menu. Use up and down arrows to navigate and Enter to select. ' + stationItemText();
}
function stationItemText() {
    var it = STATION_ITEMS[stationIdx];
    return itemLabel(it) + '. ' + itemDesc(it);
}

function undock() {
    var poi = docked.poi;
    docked = null;
    var dir = norm(poi.dockAxis || v3(0, 0, 1));
    ship.pos = add(poi.pos, scale(dir, CFG.dockRadius + 100));
    ship.vel = v3(0, 0, 0);
    ship.yaw = Math.atan2(-dir.x, dir.z); ship.pitch = 0;   // face away from the door
    say('Undocked. Clear of ' + poi.name + '.');
}

function stationMenuKey(lname) {
    var n = STATION_ITEMS.length;
    if (lname === 'escape' || lname === 'x') { undock(); return; }
    if (lname === 'arrowdown') { menuClick(); stationIdx = (stationIdx + 1) % n; say(stationItemText()); }
    else if (lname === 'arrowup') { menuClick(); stationIdx = (stationIdx - 1 + n) % n; say(stationItemText()); }
    else if (lname === 'enter' || lname === 'arrowright' || lname === 'arrowleft') {
        var item = STATION_ITEMS[stationIdx];
        if (item.adjust) {
            if (lname !== 'enter') { menuClick(); item.adjust(lname === 'arrowright' ? 1 : -1); }
            say(stationItemText());
            return;
        }
        menuSelectSound();
        say(itemLabel(item) + ' selected.');
        item.run();
    } else if (lname === 'tab') {
        say(stationItemText());
    } else {
        SIM.audio.blip(220, 80, 0.1);
        say('Up and down arrows browse the station menu, Enter selects, Escape undocks. ' + itemLabel(STATION_ITEMS[stationIdx]) + '.');
    }
}

// H — hyperwarp to the nav target. Spool up, jump as far as the tank allows,
// and drop out just beyond calling range — or wherever the charge runs dry —
// so the last leg is always flown by ear.
// The nearest point of interest inside the no-warp zone, or null. Checked
// against every POI, not just the nav target — the drive won't spool this
// close to ANYTHING, so a pilot must fly clear of a station before jumping
// anywhere else, not just before jumping back to that same station.
function nearbyPoi() {
    var best = null, bestD = CFG.warpInhibitDist;
    targets.forEach(function (p) {
        if (!p.alive || p.kind !== 'poi') return;
        var d = len(sub(p.pos, ship.pos));
        if (d < bestD) { bestD = d; best = p; }
    });
    return best;
}

function startWarp() {
    if (mode !== 'sector') { say('Hyperwarp needs open sector space.'); return; }
    if (warping) return;
    var t = targets[selected];
    if (!t) { say('No nav target. Q opens the quadrant map.'); return; }
    var near = nearbyPoi();
    if (near) {
        say('Hyperwarp inhibited this close to ' + near.name + '. Fly clear first.');
        return;
    }
    var d = len(sub(t.pos, ship.pos));
    if (d < CFG.warpMinDist) {
        say('Too close for hyperwarp. Just fly it. Distance ' + round10(d) + '.');
        return;
    }
    if (warpCharge <= 0) {
        SIM.cues.play('refusal_wait');
        say('Warp charge exhausted. Fly it, or let the core cool. Q for the map.');
        return;
    }
    warpCoreSound(false);
    warping = true;
    keysDown = {};
    thrusterSync(null);
    updateStabilizers(0);
    say('Hyperwarp charging.');
    SIM.cues.play('warp_charge', { dur: CFG.warpChargeMs / 1000 });
    setTimeout(function () {
        if (!running || mode !== 'sector') { warping = false; return; }
        var dir = norm(sub(t.pos, ship.pos));
        var need = warpNeed(len(sub(t.pos, ship.pos)));
        var travel = Math.min(need, warpCharge);
        var dry = travel < need;
        SIM.cues.play(dry ? 'warp_dry' : 'warp_arrive');
        ship.pos = add(ship.pos, scale(dir, travel));
        warpCharge -= travel;
        ship.vel = v3(0, 0, 0);
        ship.yaw = Math.atan2(dir.x, -dir.z);
        ship.pitch = Math.asin(clamp(dir.y, -1, 1));
        warping = false;
        setTimeout(function () {
            var rem = round10(len(sub(t.pos, ship.pos)));
            say(dry
                ? 'Warp charge exhausted. ' + t.name + ' dead ahead, distance ' + rem +
                  '. Thrust the rest; C calls it within ' + CFG.poiInteract + '.'
                : 'Hyperwarp complete. ' + t.name + ' dead ahead, distance ' + rem +
                  '. C calls it once you are within ' + CFG.poiInteract +
                  '. Warp charge ' + warpPct() + ' percent.');
        }, 350);
    }, CFG.warpChargeMs);
}

// C — call the selected point of interest (within range).
function snapshotSector(atPoi) {
    return { pos: v3(ship.pos.x, ship.pos.y, ship.pos.z),
             yaw: ship.yaw, pitch: ship.pitch, poiName: atPoi.name };
}

function callPoi() {
    var t = targets[selected];
    if (!t) { say('No point of interest selected. Tab cycles them.'); return; }
    var d = len(sub(t.pos, ship.pos));
    if (d > CFG.poiInteract) {
        say('Too far to call ' + t.name + '. Get within ' + CFG.poiInteract +
            '. Distance ' + round10(d) + '.');
        return;
    }
    SIM.audio.blip(880, 90, 0.12); setTimeout(function () { SIM.audio.blip(1100, 90, 0.12); }, 130);
    if (t.poiType === 'combat') {
        sectorHome = snapshotSector(t);
        newGame('combat');
        say('Contested Zone control: hostiles inbound, weapons free. ' + combatIntro());
    } else if (t.poiType === 'mining') {
        if (demo && !demo.combatCleared) {
            say('Field Kappa control: mining rights are suspended while hostiles hold the Contested Zone. Clear it first, pilot.');
            return;
        }
        sectorHome = snapshotSector(t);
        newGame('mining');
        say('Field Kappa control: mining rights confirmed. ' + miningIntro());
    } else if (t.poiType === 'station') {
        if (docked) { say('Already docked. Escape or X undocks.'); return; }
        if (docking) {
            var o = dockOffsets();
            say('Approach corridor active. Range ' + round10(o.range) + '.');
            return;
        }
        startDocking(t);
    } else {
        say('Planet Auren orbital relay: atmospheric operations are not yet available. ' +
            'The view is spectacular, though.');
    }
}

// X from an encounter entered via the sector: back to open space at the POI.
function returnToSector(silent) {
    var home = sectorHome;
    sectorHome = null;
    newGame('sector');
    ship.pos = home.pos; ship.yaw = home.yaw; ship.pitch = home.pitch;
    var idx = -1;
    targets.forEach(function (t, i) { if (t.name === home.poiName) idx = i; });
    if (idx >= 0) { selected = idx; locked = false; stopSolidTone(); }
    refillWarp();                                  // the core cooled while you were busy
    if (!silent) {
        say('Back in open space near ' + home.poiName + '. Warp tank full. Ore hold ' + ore + '. Q for the map.');
    }
}

// ============================== 9. INPUT ====================================
// F5, F6, F11, and control R, F, W, T belong to the browser, so the pilot is
// never trapped in the page. The keyboard explorer is the one exception: while
// on, it promises every key is described and nothing happens.
var BROWSER_KEYS = { F5: true, F6: true, F11: true };

function isBrowserKey(e) {
    if (BROWSER_KEYS[e.key]) return true;
    if (e.ctrlKey) {
        var k = String(e.key).toLowerCase();
        if (k === 'r' || k === 'f' || k === 'w' || k === 't') return true;
    }
    return false;
}

var HELD = { arrowleft: 1, arrowright: 1, arrowup: 1, arrowdown: 1, w: 1, s: 1 };

function onKeyDown(e) {
    if (!running) return;
    if (isBrowserKey(e) && !describeMode) return;
    // Single characters lower-cased so Caps Lock, the NVDA laptop modifier,
    // never silences the game.
    var name = keyName(e);
    if (typeof name === 'string' && name.length === 1) name = name.toLowerCase();
    var lname = String(name).toLowerCase();
    e.preventDefault();

    if (describeMode) {
        if (e.repeat) return;
        if (lname === 'f12' || lname === 'escape') {
            describeMode = false;
            say('Explore mode off.');
        } else {
            say(prettyKey(name) + '. ' +
                (function () {
                    var d = KEY_DESCRIPTIONS[lname === ' ' ? ' ' : lname];
                    return (typeof d === 'function' ? d() : d) || 'Does nothing here.';
                })());
        }
        return;
    }

    // The help pop-up captures everything while open (arrows read, H jumps
    // headings, Escape closes) so game keys can't fire underneath it.
    if (help.open) { helpKey(lname, !!e.shiftKey); return; }

    // The quadrant map captures everything the same way.
    if (map.open) { if (lname === 'f1') { closeMap(); openHelp(); } else mapKey(lname); return; }

    // The run log captures everything the same way.
    if (runlog.open) { runLogKey(lname); return; }

    // Docked at a station: the station menu captures everything.
    if (docked) { stationMenuKey(lname); return; }

    // Mid-jump, the ship answers to nobody.
    if (warping) { if (!e.repeat) say('Hyperwarp in progress.'); return; }

    // The mission menu: a Keyboard Commander style list. Nothing else fires.
    if (menuOpen) {
        if (e.repeat) return;
        menuKey(lname, name);
        return;
    }

    if (HELD[lname]) { keysDown[lname] = true; return; }
    if (e.repeat) return;

    switch (lname) {
        case ' ':
            if (mode === 'sector') say('Weapons are cold in open space. C calls a point of interest.');
            else if (!paused && !over()) startBeam();
            break;
        case 'f':
            if (mode === 'sector') say('Weapons are cold in open space. C calls a point of interest.');
            else if (!paused && !over()) fireMissile();
            break;
        case '1': case '2': case '3': case '4': case '5': case '6':
            if (!paused) selectSlot(parseInt(lname, 10) - 1);
            break;
        case 'g':      if (!paused && !over()) shieldKey(); break;
        case 'tab':    if (!paused && !over()) cycleTarget(); break;
        case 'r':      if (!paused && !over()) radarPing(); break;
        case 'e':      if (!paused && !over()) startExtract(); break;
        case 'v':      if (!paused && !over()) startDustVac(); break;
        case 'q':      if (!paused) openMap(); break;
        case 'h':      if (!paused) startWarp(); break;
        case 'c':
            if (mode === 'sector') { if (!paused) callPoi(); }
            else say('C calls points of interest in open sector space.');
            break;
        case 'x':
            if (docking) stopDocking(false);
            else if (sectorHome && mode !== 'sector') returnToSector();
            else exitToMenu();
            break;
        case 'i':      statusReport(); break;
        case 't': {
            var sel = targets[selected];
            if (sel && sel.alive) say(bearingText(sel));
            else say(mode === 'mining' ? 'No rock selected. Tab cycles targets.'
                                       : 'No target selected. Tab cycles targets.');
            break;
        }
        case 'z':
            zoneIdx = (zoneIdx + 1) % ZONES.length;
            SIM.audio.blip(zoneIdx === 0 ? 400 : (zoneIdx === 1 ? 550 : 700), 90, 0.14, 0, 'triangle');
            say('Target zone ' + ZONES[zoneIdx].name.toLowerCase() +
                '. Laser hits inside ' + ZONES[zoneIdx].laser +
                ' degrees, missile needs ' + ZONES[zoneIdx].missile + '.');
            break;
        case 'f1':     openHelp(); break;
        case 'f12':
            describeMode = true;
            say('Explore mode on. Press any key to hear what it does. F12 or Escape turns it off.');
            break;
        case 'escape':
            paused = !paused;
            if (SIM.audio.ctx && SIM.audio.masterGain) SIM.audio.ramp(SIM.audio.masterGain.gain, paused ? 0.0001 : CFG.masterGain, 0.2);
            keysDown = {};
            thrusterSync(null);
            stopBeam(true);
            say(paused ? 'Paused. Escape resumes.' : 'Resumed.');
            break;
        case 'enter':
            if (lost && demo) {
                // A lost ship fails the delivery run: the whole thing restarts.
                startDemo();
            } else if (over()) {
                // A fresh drill run from the menu starts a fresh hold and a
                // full magazine; a replay inside a sector run keeps the
                // cargo and the missile count. A retry after a loss always
                // comes with a repaired hull (there is no other way back).
                if (mode === 'mining' && !sectorHome) ore = 0;
                if (!sectorHome) missiles = CFG.missileMax;
                if (lost || !sectorHome) hull = CFG.shipHull;
                newGame();
                say(mode === 'mining' ? miningIntro() : combatIntro());
            }
            else say('Enter does nothing here. F1 for help.');
            break;
        default:
            // Silence is a bug: a key nothing wanted still gets an answer.
            say(prettyKey(name) + ' does nothing here. F1 for help.');
    }
}

// Some injected or virtual keyboards (and a few switch-access devices) send
// an empty e.key and only fill e.code, so fall back to decoding the code.
function keyName(e) {
    var name = e.key;
    if (name && name !== 'Unidentified') return name;
    var c = e.code || '';
    if (c === 'Space') return ' ';
    if (/^Key[A-Z]$/.test(c)) return c.slice(3).toLowerCase();
    return c;
}

function onKeyUp(e) {
    var name = keyName(e);
    if (typeof name === 'string' && name.length === 1) name = name.toLowerCase();
    delete keysDown[String(name).toLowerCase()];
}

// ============================== 10. LOOP ====================================
var lastFrame = 0;

function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min((now - lastFrame) / 1000, 0.1);
    lastFrame = now;
    simTick(dt);
}

function simTick(dt) {
    // The delivery clock runs whenever the sim is live, hyperwarp included.
    if (demo && !demo.delivered && running && !paused && !help.open && !map.open &&
        !menuOpen && !over() && dt > 0) demo.elapsed += dt;
    if (!running || paused || over() || help.open || map.open || menuOpen || warping || docked || dt <= 0) {
        thrusterSync(null); updateStabilizers(0); return;
    }

    // Attitude from held arrows.
    if (keysDown.arrowleft)  ship.yaw   -= CFG.turnRate * dt;
    if (keysDown.arrowright) ship.yaw   += CFG.turnRate * dt;
    if (keysDown.arrowup)    ship.pitch += CFG.turnRate * dt;
    if (keysDown.arrowdown)  ship.pitch -= CFG.turnRate * dt;
    ship.pitch = clamp(ship.pitch, -CFG.pitchLimit, CFG.pitchLimit);

    // Thrust, brake, damping, cap — with each maneuver's own thruster sound.
    if (keysDown.w) ship.vel = add(ship.vel, scale(shipForward(), CFG.thrust * dt));
    thrusterSync(keysDown);
    if (keysDown.s) ship.vel = scale(ship.vel, Math.pow(CFG.brakeKeep, dt));
    ship.vel = scale(ship.vel, Math.pow(CFG.dampKeep, dt));
    var spd = len(ship.vel);
    if (spd > CFG.maxSpeed) ship.vel = scale(ship.vel, CFG.maxSpeed / spd);
    ship.pos = add(ship.pos, scale(ship.vel, dt));
    // Stabilizers pulse only while coasting with real momentum to shed.
    updateStabilizers(spd > 3 && !keysDown.w && !keysDown.s ? spd : 0);

    if (mode === 'mining') {
        // Rock physics: drift with momentum, bleed energy to friction so a
        // blasted rock calms down and becomes laserable again, and vanish
        // if pushed past the edge of the asteroid cloud.
        targets.forEach(function (t) {
            if (!t.alive || t.kind !== 'rock') return;   // dust hangs still
            t.pos = add(t.pos, scale(t.vel, dt));
            t.vel = scale(t.vel, Math.pow(CFG.rockFriction, dt));
            if (t.nodes) SIM.audio.movePanner(t.nodes.panner, t.pos);
            if (len(t.pos) > CFG.cloudRadius) loseRock(t);
        });
    }
    // (Combat ship motion — the orbiting Cruiser and evade bursts — lives in
    // updateEnemies, along with enemy fire.)

    updateListener();
    updateTargeting();
    stepMissile(dt);
    updateShield(dt);
    updateEnemies(dt);
    updateWarpCore(dt);
    updateDocking(dt);
    updateStatusLine();
}

// Test-only manual clock: advances the sim by dtSeconds (default a 60 Hz
// frame) without requestAnimationFrame, so a script can drive a scenario
// even while the tab is backgrounded. Steps in real frame-sized chunks
// (capped like simTick's own dt) rather than one giant dt, so nothing that
// assumes per-frame granularity (spool timers, tick schedulers) skips state.
function stepSim(dtSeconds, chunk) {
    var left = dtSeconds === undefined ? 1 / 60 : dtSeconds;
    var step = chunk || 1 / 30;
    while (left > 1e-6) {
        var d = Math.min(step, left);
        simTick(d);
        left -= d;
    }
}

// Visual sanity line for a sighted co-tester. aria-hidden, never read.
var lastStatusAt = 0;
function updateStatusLine() {
    var now = Date.now();
    if (now - lastStatusAt < 250 || !statusEl) return;
    lastStatusAt = now;
    var t = targets[selected], lines = [];
    lines.push('Speed ' + Math.round(len(ship.vel)) +
               '   yaw ' + Math.round(deg(ship.yaw)) +
               '   pitch ' + Math.round(deg(ship.pitch)));
    if (t && t.alive) {
        var a = aim(t.pos);
        lines.push('Target: ' + t.name + '   err ' + deg(a.err).toFixed(1) +
                   '°   dist ' + Math.round(a.dist) + (locked ? '   LOCKED' : ''));
    }
    lines.push((mode === 'mining'
                    ? 'Rocks: ' + aliveRocks().length + '   dust fields: ' + debris.length + '   ore ' + ore
                    : 'Targets alive: ' + aliveTargets().length) +
               (missile ? '   missile in flight' + (missile.guided ? '' : ' (ballistic)') : ''));
    lines.push('Hull ' + hull + '   missiles ' + missiles +
               '   shields ' + (shield.up ? 'UP ' + Math.round(shield.pool / CFG.shieldPool * 100) + '%' : shield.raising >= 0 ? 'raising' : shield.repairing > 0 ? 'disrepair' : 'down') +
               '   ' + laserSlotText(laserSlot) + (laserHot() ? '   LASER HOT' : '') +
               (threat ? '   threat: ' + threat.type + ' from ' + threat.t.name : '') +
               (demo ? '   clock ' + Math.floor(demo.elapsed) + 's' : ''));
    statusEl.textContent = lines.join('\n');
}

// Automated-testing hook (harmless in play): lets a test harness inspect
// state and point or place the ship without simulating held arrow keys.
window.__sim = {
    state: function () {
        return {
            mode: mode, menu: menuOpen, menuIdx: menuIdx, ore: ore, won: won, lost: lost,
            hostile: targets.filter(function (t) { return !t.kind && t.hostile; }).map(function (t) { return t.name; }),
            hull: hull, missiles: missiles, laserHot: laserHot(),
            laser: { slot: laserSlot, id: profile ? profile.slots[laserSlot] : null,
                     readyIn: Math.round(laserCooldownLeft(laserSlot) * 10) / 10,
                     burstLeft: beamSecondsLeft() },
            shield: { up: shield.up, raising: shield.raising, pool: Math.round(shield.pool), repairing: shield.repairing },
            threat: threat ? { type: threat.type, from: threat.t.name, guided: threat.guided } : null,
            missile: missile ? { guided: missile.guided, dist: Math.round(len(sub(missile.target.pos, missile.pos))) } : null,
            demo: demo ? { elapsed: Math.round(demo.elapsed), combatCleared: demo.combatCleared, delivered: demo.delivered } : null,
            warp: { charge: Math.round(warpCharge), max: CFG.warpTankMax, pct: warpPct() },
            pos: { x: Math.round(ship.pos.x), y: Math.round(ship.pos.y), z: Math.round(ship.pos.z) },
            docking: docking ? Object.assign({ poiName: docking.poi.name }, dockOffsets()) : null,
            docked: docked ? { poiName: docked.poi.name } : null,
            assets: SIM.audio.assetsReady(),
            dust: debris.map(function (d) {
                return { amount: d.amount, dist: Math.round(len(sub(d.pos, ship.pos))) };
            }),
            targets: targets.map(function (t) {
                return { name: t.name, alive: t.alive,
                         size: t.kind === 'rock' ? ROCK_SIZES[t.size] && ROCK_SIZES[t.size].label : undefined,
                         resource: !!t.resource,
                         dist: Math.round(len(sub(t.pos, ship.pos))),
                         speed: t.vel ? Math.round(len(t.vel)) : 0 };
            })
        };
    },
    faceSelected: function () {
        var t = targets[selected];
        if (!t) return false;
        var dir = norm(sub(t.pos, ship.pos));
        ship.yaw = Math.atan2(dir.x, -dir.z);
        ship.pitch = Math.asin(clamp(dir.y, -1, 1));
        return true;
    },
    warpToSelected: function (d) {
        var t = targets[selected];
        if (!t) return false;
        var dir = norm(sub(t.pos, ship.pos));
        ship.pos = sub(t.pos, scale(dir, d || 100));
        return true;
    },
    // Test-only manual clock: advances the sim by dtSeconds (default one
    // 60 Hz frame) without requestAnimationFrame, in small chunks so every
    // per-frame system (spool timers, tick schedulers) still sees each
    // step — not one giant dt. Needed because a backgrounded/hidden browser
    // tab suspends rAF almost entirely (Chrome Page Visibility throttling),
    // which would otherwise stall shields, enemy fire, missiles, everything.
    step: function (dtSeconds, chunk) { stepSim(dtSeconds, chunk); },
    // Test-only knobs: pull the next enemy attack forward, or set the hold.
    poke: function (o) {
        if (o && o.threatIn !== undefined) threatIn = o.threatIn;
        if (o && o.ore !== undefined) ore = o.ore;
        if (o && o.hull !== undefined) hull = o.hull;
        if (o && o.combatCleared !== undefined && demo) demo.combatCleared = o.combatCleared;
        if (o && o.enemyHp !== undefined) targets.forEach(function (t) { if (!t.kind && t.alive) t.hp = o.enemyHp; });
        if (o && o.laserReady) laserReadyAt = [];
        if (o && o.warpCharge !== undefined) warpCharge = o.warpCharge;
    }
};

// ============================== 11. SHELL ===================================
function clearMission() {
    targets.forEach(stopVoice);
    killMissile();
    stopBeam(true);
    thrusterSync(null);
    stopSolidTone();
    clearDebris();
    dustSeq = 0;
    targets = [];
    ship.pos = v3(0, 0, 0); ship.vel = v3(0, 0, 0); ship.yaw = 0; ship.pitch = 0;
    won = false; lost = false; paused = false; locked = false;
    warping = false;
    endThreat();
    threatIn = CFG.enemyFirstAttackS;
    shieldReset();
    laser.misses = []; laser.hotUntil = 0; laserReadyAt = [];
    warpCoreSound(false);                        // (the charge itself persists across a sector run)
    stopDocking(true); docked = null; dockToneOn(false);
    // NOTE: ore is NOT reset here — it is the cargo hold, persistent across
    // a whole sector run. The mission menu zeroes it when starting fresh.
}

function newGame(m) {
    if (m) mode = m;
    clearMission();
    if (mode === 'sector') {
        targets = makeSectorRoster();
    } else if (mode === 'mining') {
        targets = makeMiningRoster();
    } else {
        targets = makeRoster();
        targets.forEach(function (t) {
            t.alive = true;
            t.maxHp = t.hp;
            t.hostile = TIERS[tierIdx].alwaysHostile;
            if (t.orbit) {
                t.pos = v3(Math.cos(t.orbit.angle) * t.orbit.radius, t.orbit.y,
                           Math.sin(t.orbit.angle) * t.orbit.radius);
            }
            if (SIM.audio.ctx) buildVoice(t);
        });
    }
    selectNearest();
    if (SIM.audio.ctx && SIM.audio.masterGain) SIM.audio.ramp(SIM.audio.masterGain.gain, CFG.masterGain, 0.2);
}

// ---- mission menu -----------------------------------------------------------
// Ported from Keyboard Commander (c:\nbs\kc, kc_hub.js renderGameMenu /
// kc_input.js MENU_NAV): a wrap-around list, a click on every move, the
// item and its description spoken on arrival, Enter (or Left/Right) picks
// with a two-note select sound, "X selected" and a short beat before the
// action, and a first letter jumps to the next item starting with it. The
// cursor position survives a trip out and back, like KC's menuSelection.
var MENU_ITEMS = [
    { label: 'Delivery run',
      desc: 'The timed challenge. Clear the Contested Zone, mine ' + CFG.demoOreGoal +
            ' ore, and deliver it to Station Meridian.',
      run: function () { startDemo(); } },
    { label: 'Sector',
      desc: 'Open space with four points of interest. Free flight, no clock.',
      run: function () { startMission('sector'); } },
    { label: 'Combat training',
      desc: function () {
          return 'Five ships in a training zone. ' + (TIERS[tierIdx].alwaysHostile
              ? 'Every ship is hostile from the start.'
              : 'They hold their fire until you hit them.');
      },
      run: function () { startMission('combat'); } },
    { label: 'Mining',
      desc: 'An asteroid cloud to laser apart, vacuum, and extract.',
      ready: function () {
          if (SIM.audio.assetsReady()) return true;
          say('The asteroid sounds are still loading. Try again in a moment.');
          return false;
      },
      run: function () { startMission('mining'); } },
    { label: 'Help',
      desc: 'The help screen. F1 also opens it anywhere.',
      run: function () { openHelp(); } },
    { label: function () { return 'Difficulty: ' + TIERS[tierIdx].name; },
      desc: function () { return TIER_DESCS[tierIdx]; },
      adjust: function (dir) {
          applyTier((tierIdx + dir + TIERS.length) % TIERS.length);
          saveProfile();
      } },
    { label: 'Run log',
      desc: function () {
          return profile.runs.length
              ? 'Your best delivery run times, best ' + profile.runs.length + ' of up to 10.'
              : 'No runs recorded yet.';
      },
      run: function () { openRunLog(); } }
];
var menuIdx = 0;
var menuBusy = false;   // the beat between "selected" and the action

function menuClick()  { SIM.cues.play('menu_click'); }
function menuSelectSound() { SIM.cues.play('menu_select'); }

function itemLabel(item) { return typeof item.label === 'function' ? item.label() : item.label; }
function itemDesc(item)  { return typeof item.desc  === 'function' ? item.desc()  : item.desc; }
function menuItemText(i) { return itemLabel(MENU_ITEMS[i]) + '. ' + itemDesc(MENU_ITEMS[i]); }

// Entering the menu: the full instruction plus the current item.
function menuAnnounce(prefix) {
    say((prefix || '') + 'Mission menu. Use up and down arrows to navigate and Enter to select. ' +
        menuItemText(menuIdx));
}

function startMission(m) {
    menuOpen = false;
    ore = 0; hull = CFG.shipHull; missiles = CFG.missileMax;
    newGame(m);
    if (m === 'sector') placeAtStationStart();
    say(m === 'sector' ? sectorIntro() : m === 'combat' ? combatIntro() : miningIntro());
}

function menuKey(lname, name) {
    if (menuBusy) return;
    var n = MENU_ITEMS.length;
    if (lname === 'arrowdown') {
        menuClick(); menuIdx = (menuIdx + 1) % n; say(menuItemText(menuIdx));
    } else if (lname === 'arrowup') {
        menuClick(); menuIdx = (menuIdx - 1 + n) % n; say(menuItemText(menuIdx));
    } else if (lname === 'enter' || lname === 'arrowright' || lname === 'arrowleft') {
        var item = MENU_ITEMS[menuIdx];
        // The Difficulty line adjusts in place on Left/Right instead of
        // launching anything; Enter just re-states it (KC settings pattern).
        if (item.adjust) {
            if (lname !== 'enter') { menuClick(); item.adjust(lname === 'arrowright' ? 1 : -1); }
            say(menuItemText(menuIdx));
            return;
        }
        if (item.ready && !item.ready()) return;
        menuSelectSound();
        say(itemLabel(item) + ' selected.');
        menuBusy = true;
        setTimeout(function () {
            menuBusy = false;
            if (!menuOpen) return;            // (a browser reload in the gap)
            item.run();
        }, 600);
    } else if (lname === 'f1') {
        openHelp();
    } else if (lname === 'f12') {
        describeMode = true;
        say('Explore mode on. Press any key to hear what it does. F12 or Escape turns it off.');
    } else if (lname === 'tab') {
        say(menuItemText(menuIdx));
    } else if (lname.length === 1 && /[a-z]/.test(lname)) {
        // First-letter jump, cycling from the item after the cursor.
        var next = -1;
        for (var i = 1; i <= n; i++) {
            var k = (menuIdx + i) % n;
            if (itemLabel(MENU_ITEMS[k]).toLowerCase().charAt(0) === lname) { next = k; break; }
        }
        if (next >= 0) { menuClick(); menuIdx = next; say(menuItemText(menuIdx)); }
        else { SIM.audio.blip(220, 80, 0.1); say('No item starts with ' + prettyKey(name) + '. Up and down arrows browse, Enter selects.'); }
    } else {
        SIM.audio.blip(220, 80, 0.1);
        say('Up and down arrows browse the mission menu, Enter selects. ' + itemLabel(MENU_ITEMS[menuIdx]) + '.');
    }
}

function exitToMenu() {
    clearMission();
    sectorHome = null;
    demo = null;
    menuOpen = true;
    if (SIM.audio.ctx && SIM.audio.masterGain) SIM.audio.ramp(SIM.audio.masterGain.gain, CFG.masterGain, 0.2);
    menuAnnounce();
}

function combatIntro() {
    var stance = TIERS[tierIdx].alwaysHostile
        ? 'Every ship is hostile and watching.'
        : 'Ships hold their fire until you hit them.';
    return 'Combat training, ' + TIERS[tierIdx].name + ' difficulty. Five targets detected. ' +
           'The Freighter is dead ahead. Tab cycles targets, T reports the selected one, ' +
           'Space fires when the tone goes solid. ' + stance + ' When you hear the lock-on ' +
           'chirps, G raises the shields. F1 for help.';
}

function sectorIntro() {
    return 'Entering the sector just outside Station Meridian, warp tank full. Four points of interest on the quadrant map: ' +
           'a combat area, a mining area, a space station, and a planet, each with its own beacon sound. ' +
           'Q opens the map, Tab cycles beacons, H hyperwarps to your nav target, ' +
           'and C calls a point once you are within ' + CFG.poiInteract + '. F1 for help.';
}

function miningIntro() {
    return 'Space mining. ' + aliveRocks().length +
           ' asteroids drifting in the cloud, each singing its own sound. ' +
           'Laser them apart. Every cut sheds dust you can vacuum up with V, ' +
           'and a rock mined to its glowing core is extracted with E. ' +
           'Rocks pushed out of the cloud are lost. F1 for help.';
}

function init() {
    loadProfile();
    var initBtn = document.getElementById('initBtn');
    var container = document.getElementById('game');
    liveEl = document.getElementById('announce');
    statusEl = document.getElementById('status');

    // ?run=delivery in the URL skips the menu and jumps straight into the
    // timed delivery run after the Press-Enter gesture — a shareable link
    // for the demo, e.g. https://.../?run=delivery
    var params = new URLSearchParams(location.search);
    var autoRun = params.get('run');

    initBtn.addEventListener('click', function () {
        SIM.audio.audioStart();                    // must live inside the user gesture
        initBtn.style.display = 'none';
        container.hidden = false;
        container.focus();
        running = true;
        scheduleTick();
        // The container's label is read when it takes focus; wait so the
        // intro does not talk over it.
        if (autoRun === 'delivery') {
            setTimeout(function () {
                if (!SIM.audio.ctx) say('Audio is unavailable in this browser, speech only. ');
                startDemo();
            }, 800);
        } else {
            menuOpen = true;
            setTimeout(function () {
                menuAnnounce(SIM.audio.ctx ? '' : 'Audio is unavailable in this browser, speech only. ');
            }, 800);
        }
    });

    // Keep focus inside the container. If anything steals it, take it back.
    document.addEventListener('focusin', function (e) {
        if (container.hidden || !running) return;
        if (!container.contains(e.target) && e.target !== container) {
            container.focus();
        }
    });

    window.addEventListener('keydown', onKeyDown, true);
    window.addEventListener('keyup', onKeyUp, true);
    window.addEventListener('blur', function () { keysDown = {}; thrusterSync(null); });

    requestAnimationFrame(function (t) { lastFrame = t; requestAnimationFrame(frame); });
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

})();
</script>
</body>
</html>
