        if (o && o.ore !== undefined) ore = o.ore;
        if (o && o.hull !== undefined) hull = o.hull;
        if (o && o.combatCleared !== undefined) {
            if (demo) demo.combatCleared = o.combatCleared;
            else if (contract) contract.combatCleared = o.combatCleared;
        }
        if (o && o.contractElapsed !== undefined && contract) contract.elapsed = o.contractElapsed;
        if (o && o.enemyHp !== undefined) targets.forEach(function (t) { if (!t.kind && t.alive) t.hp = o.enemyHp; });
        if (o && o.laserReady) laserReadyAt = [];
        if (o && o.warpCharge !== undefined) warpCharge = o.warpCharge;
        if (o && o.chaff !== undefined) chaff = o.chaff;
        if (o && o.missiles !== undefined) missiles = o.missiles;
        if (o && o.shieldPool !== undefined) shield.pool = o.shieldPool;
        if (o && o.rcs !== undefined) rcs = o.rcs;
        if (o && o.rcsBattery !== undefined) rcsBattery = o.rcsBattery;
        if (o && o.tugRemaining !== undefined && tug) tug.remaining = o.tugRemaining;
        if (o && o.kill) shipDestroyed('test rig');
        if (o && o.friendlyHp !== undefined && mission) mission.friendly.hp = o.friendlyHp;
        if (o && o.friendlyShield !== undefined && mission) mission.friendly.shield = o.friendlyShield;
        if (o && o.missionNextStrikeIn !== undefined && mission) mission.nextStrikeIn = o.missionNextStrikeIn;
        if (o && o.missionElapsed !== undefined && mission) mission.elapsed = o.missionElapsed;
        if (o && o.credits !== undefined && profile) profile.credits = o.credits;
        if (o && o.alloy !== undefined && profile) profile.resources.alloy = o.alloy;
        if (o && o.laserHealth && profile) Object.assign(profile.laserHealth, o.laserHealth);
        if (o && o.laserLevels && profile) Object.assign(profile.laserLevels, o.laserLevels);
        if (o && o.clock !== undefined && profile) profile.clock = o.clock;
        // SPEC 3.27: force a specific system straight to broken (bypasses
        // the chance roll and weight draw — the exact test hook the spec
        // itself asks for), or set a system's health directly, or clear
        // everything at once (the same effect docking has).
        if (o && o.knockout) registerKnockout(o.knockout);   // SPEC 3.66: the real cap math, not a bare health set
        if (o && o.systemHealth) Object.assign(shipSystems, o.systemHealth);
        if (o && o.systemCap) Object.assign(systemCaps, o.systemCap);   // SPEC 3.66 test hook
        // SPEC 3.68: Brian has no real distance yet — this is the live knob
        // he tries numbers with, not just a test hook.
        if (o && o.blinkDist !== undefined) CFG.blinkDist = o.blinkDist;
        if (o && o.blinkReadyAt !== undefined) blinkReadyAt = o.blinkReadyAt;   // test hook: force the cooldown clear/set
        // SPEC 3.69 test hooks: select a named target directly (Tab by
        // name is otherwise tedious with four near-identical turrets),
        // and force a turret's own door state without waiting out the
        // real open/close timers.
        if (o && o.selectByName) {
            var byNameT = targets.filter(function (t) { return t.name === o.selectByName; })[0];
            if (byNameT) { selected = targets.indexOf(byNameT); locked = false; stopLockTone(); }
        }
        if (o && o.turretDoor) {
            var dt2 = targets.filter(function (t) { return t.parent === capital && t.name === o.turretDoor.name; })[0];
            if (dt2) dt2.doorUp = o.turretDoor.up;
        }
        // SPEC 3.30: move/resize the SELECTED rock directly (distance and
        // size drive every tractor refusal) and force the test-fit flag,
        // without needing to fly to a rock of the exact size by hand.
        if (o && o.targetPos !== undefined) { var tt = targets[selected]; if (tt) tt.pos = v3(o.targetPos.x, o.targetPos.y, o.targetPos.z); }
        if (o && o.targetSize !== undefined) { var tt2 = targets[selected]; if (tt2 && tt2.kind === 'rock') tt2.size = o.targetSize; }
        // SPEC 3.58 test hook: force a named combat ship's own facing (deg)
        // directly, to engineer the cone-angle geometry without waiting for
        // updateFacing's own turn rate to get there.
        if (o && o.enemyFacingDeg !== undefined) {
            targets.forEach(function (t) {
                if (!t.kind && t.alive && (!o.enemyName || t.name === o.enemyName)) t.facing = o.enemyFacingDeg * Math.PI / 180;
            });
        }
        // SPEC 3.59 test hook: force a specific turret zone's incoming
        // straight to a given timeLeft (or spawn one if there is none),
        // to reach an impact/clear deterministically without waiting out
        // the real random spawn gap.
        if (o && o.turretIncomingS !== undefined && turretState) {
            var tzIdx = o.turretZone !== undefined ? o.turretZone : turretState.zone;
            var tz = turretState.zones[tzIdx];
            if (!tz.incoming) spawnTurretIncoming(tzIdx);
            // SPEC 3.65 test hook: force the kind too, and set timeLeft as a
            // FRACTION of the incoming's own total (not a raw second count)
            // when o.turretFrac is given, so a test can land exactly on the
            // sweet spot regardless of the randomized total.
            if (o.turretKind) tz.incoming.kind = o.turretKind;
            tz.incoming.timeLeft = o.turretFrac !== undefined ? o.turretFrac * tz.incoming.total : o.turretIncomingS;
        }
        if (o && o.enemyPos) {
            targets.forEach(function (t) {
                if (!t.kind && t.alive && t.name === o.enemyPos.name) {
                    t.pos = v3(o.enemyPos.x, o.enemyPos.y, o.enemyPos.z);
                    if (t.nodes) SIM.audio.movePanner(t.nodes.panner, t.pos);
                }
            });
        }
        if (o && o.tractorTestFit !== undefined) CFG.tractorTestFit = o.tractorTestFit;
        if (o && o.repairAllSystems) repairAllSystems();
        if (o && o.depleteField && profile.quadrants[profile.quadrantId]) {
            profile.quadrants[profile.quadrantId].fields.forEach(function (f) {
                if (f.name === o.depleteField) f.budget = 0;
            });
        }
        if (o && o.pos !== undefined) ship.pos = v3(o.pos.x, o.pos.y, o.pos.z);
        if (o && o.vel !== undefined) ship.vel = v3(o.vel.x, o.vel.y, o.vel.z);
        // SPEC 3.38 test hook: force the ship's own facing directly, in
        // degrees — needed to engineer auto-target's own worst case
        // (dead behind, max pitch) without hand-flying there.
        if (o && o.yawDeg !== undefined) ship.yaw = o.yawDeg * Math.PI / 180;
        if (o && o.pitchDeg !== undefined) ship.pitch = clamp(o.pitchDeg * Math.PI / 180, -CFG.pitchLimit, CFG.pitchLimit);
        if (o && o.collisionDamage !== undefined) collisionDamage = o.collisionDamage;
        // Live, never saved: a test sets beacons off without touching the profile.
        if (o && o.beacons !== undefined) beaconMode = o.beacons;
        if (o && o.mute !== undefined) setMuted(o.mute);
        if (o && o.sound && profile) { Object.assign(profile.sound, o.sound); applySoundLevels(); }
        // SPEC 3.23: force a port straight to a given favor (bypassing the
        // sell/mission grind to test tier gating directly), and/or its
        // clock so decay can be tested without waiting real play-hours.
        if (o && o.favor) {
            ensureQuadrantHome();
            var fport = ensurePort(currentQuadrant(), o.favor.name);
            if (o.favor.value !== undefined) { fport.favor = o.favor.value; fport.peakFavor = Math.max(fport.peakFavor, o.favor.value); }
            if (o.favor.lastVisitHour !== undefined) fport.lastVisitHour = o.favor.lastVisitHour;
        }
    }
};

// ============================== 11. SHELL ===================================
function clearMission() {
    // SPEC 3.23: an escort/defend mission abandoned mid-run (X, or picking
    // something else from the Escape menu) while the friendly was still
    // alive — every abandonment path funnels through here before `mission`
    // is wiped below, so this is the one place that needs the check. The
    // friendly actually dying is the bigger loss, handled in missionEnd
    // instead (favorFriendlyLost); the timed contract has no equivalent
    // penalty for walking away from it early, deliberately — it's a
    // self-paced errand, not a mission with something at stake.
    if (mission && !mission.ended && mission.poiName) loseFavor({ name: mission.poiName }, CFG.favorFail);
    // SPEC 3.55: the same rule, for the distress call — leaving before the
    // derelict is recovered fails it. A RECOVERED-but-not-yet-docked call is
    // deliberately spared below (see the `distress = null` line) rather than
    // wiped here, since "bring it home" needs the flag to survive the trip
    // back out of this mining pocket into the open sector.
    if (distress && !distress.recovered && distress.poiName) loseFavor({ name: distress.poiName }, CFG.favorFail);
    targets.forEach(stopVoice);
    killMissile();
    stopTractor();
    stopBeam(true);
    thrusterSync(null);
    stopLockTone();
    clearDebris();
    dustSeq = 0;
    targets = [];
    ship.pos = v3(0, 0, 0); ship.vel = v3(0, 0, 0); ship.yaw = 0; ship.pitch = 0;
    won = false; lost = false; locked = false; tug = null; mission = null; courseState = null; minefieldState = null; shadowState = null; nebulaState = null; gateRunState = null;
    miningState = null; combatState = null;   // SPEC 3.71
    corona = null;   // SPEC 3.74
    stopAllTurretVoices(); turretState = null;   // SPEC 3.59: incomings aren't `targets`
    debrief.open = false;   // SPEC 3.70 (was SPEC 3.65's turret-only turretDebrief)
    stopHaulCreak(); haul = null;   // SPEC 3.60
    stopCapitalVoice(); capital = null; capitalDoor = null;   // SPEC 3.69
    // SPEC 3.55: NOT unconditional, unlike every other scoped state above —
    // a recovered distress call survives leaving this encounter (the same
    // way `contract` already survives leaving the open quadrant it's not
    // tied to at all); only an unrecovered one is actually wiped here.
    if (!(distress && distress.recovered)) distress = null;
    stopWarpEngagedLoop(); warpFlight = null; warping = false;
    endThreat();
    threatIn = CFG.enemyFirstAttackS;
    shieldReset();
    laser.misses = []; laser.hotUntil = 0; laserReadyAt = []; laserBoostUntil = 0;
    stopLaserSwitch();
    autoThrust = false;
    // (the warp charge itself persists across a sector run)
    docked = null;
    if (SIM.audio.ctx) SIM.audio.stopMusic(0.5);   // the docked interior loop, if one was playing
    // NOTE: ore is NOT reset here — it is the cargo hold, persistent across
    // a whole sector run. The mission menu zeroes it when starting fresh.
}

function newGame(m, missionSpec, startHaulRun, startCapitalRun, startDistressPoiName, startCorona) {
    if (m) mode = m;
    clearMission();
    if (missionSpec) mission = missionSpec;   // SPEC 2.17: set AFTER clearMission clears the old one
    // SPEC 3.60: same reasoning as missionSpec above — clearMission() just
    // nulled `haul`, so a fresh one is set AFTER, only when this call is
    // actually starting (or restarting) a haul run.
    if (startHaulRun) haul = { targetIdx: 0, homeIdx: 1, strain: 0, rcsSpent: 0, lastYaw: ship.yaw, lastPitch: ship.pitch,
                                elapsed: 0, parted: 0 };   // SPEC 3.71
    // SPEC 3.69: same reasoning again — `capital` set fresh AFTER
    // clearMission() nulled it, only when actually (re)starting this run.
    if (startCapitalRun) capital = { pos: v3(CFG.capitalOrbitRadius, CFG.capitalOrbitY, 0), facing: Math.PI, orbitAngle: 0, nodes: null,
                                      elapsed: 0, refused: 0 };   // SPEC 3.71
    // SPEC 3.55: same reasoning again — a fresh `distress` set AFTER
    // clearMission() nulled it (or left a recovered one alone, see
    // clearMission itself), only when actually accepting the call.
    if (startDistressPoiName) distress = { poiName: startDistressPoiName, recovered: false };
    // SPEC 3.74: same reasoning again — a fresh `corona` set AFTER
    // clearMission() nulled it, only when actually (re)entering the star.
    if (startCorona) corona = { lastPullPct: 0, insideHeat: false };
    if (mode === 'sector') {
        targets = makeSectorRoster();
    } else if (mode === 'course') {
        targets = makeCourseRoster(COURSES[0]);
    } else if (mode === 'minefield') {
        targets = makeMinefieldRoster();
    } else if (mode === 'shadow') {
        targets = makeShadowRoster();
        targets.forEach(function (t) { if (SIM.audio.ctx) buildVoice(t); });
    } else if (mode === 'nebula') {
        targets = makeNebulaRoster();
    } else if (mode === 'gaterun') {
        targets = makeGateRunRoster();
        targets.forEach(function (t) { if (SIM.audio.ctx) buildPoiVoice(t); });
    } else if (mode === 'turret') {
        // SPEC 3.59: no targets at all — the three zones and their incomings
        // are their own state (turretState), built by startMission() right
        // after this call, same relationship courseState has to newGame().
        targets = [];
    } else if (mode === 'mining' && haul) {
        // SPEC 3.60: a dedicated one-rock-and-a-beacon roster, not the
        // standard cloud — mining's own makeMiningRoster() is completely
        // untouched by this branch.
        targets = makeHaulRoster();
    } else if (mode === 'mining' && distress) {
        // SPEC 3.55: a dedicated one-derelict roster, same shape as haul's
        // branch just above — mining's own makeMiningRoster() untouched.
        targets = makeDistressRoster(distress);
        targets.forEach(function (t) { if (SIM.audio.ctx) buildVoice(t); });
    } else if (mode === 'mining' && corona) {
        // SPEC 3.74: a dedicated one-target roster (the corona itself);
        // mining's own makeMiningRoster() untouched, same shape as haul's
        // and distress's own branches above — makeCoronaRoster() already
        // builds its own voice internally (the minefield exit beacon's
        // own precedent), so no forEach needed here.
        targets = makeCoronaRoster();
    } else if (mode === 'combat' && capital) {
        // SPEC 3.69: four turrets, no other roster at all — `capital`
        // itself isn't a target (no lock, no Tab), just the thing they
        // ride. Voice built and hostility set here, same shape the
        // mission branch just below already uses.
        targets = makeCapitalRoster();
        targets.forEach(function (t) {
            t.hostile = TIERS[tierIdx].alwaysHostile;
            if (SIM.audio.ctx) buildVoice(t);
        });
        if (SIM.audio.ctx) capital.nodes = buildCapitalVoice();
    } else if (mode === 'mining') {
        // SPEC 3.10: sectorHome.poiName names the field this visit is
        // against (set by callPoi before this runs) — its type biases the
        // rock draw. Kappa and the standalone drill (no sectorHome) pass
        // no type, unchanged.
        var fieldType = null;
        if (!demo && sectorHome) {
            var qm = currentQuadrant();
            var fm = qm && qm.fields.filter(function (x) { return x.name === sectorHome.poiName; })[0];
            fieldType = fm ? fm.type : null;
        }
        targets = makeMiningRoster(fieldType);
    } else if (mission) {
        targets = makeMissionRoster(mission);
        targets.forEach(function (t) { if (SIM.audio.ctx) buildVoice(t); });
    } else {
        targets = makeRoster();
        targets.forEach(function (t) {
            t.alive = true;
            t.maxHp = t.hp;
            t.hostile = TIERS[tierIdx].alwaysHostile;
            if (t.orbit) {
                t.pos = v3(Math.cos(t.orbit.angle) * t.orbit.radius, t.orbit.y,
                           Math.sin(t.orbit.angle) * t.orbit.radius);
            }
            if (SIM.audio.ctx) buildVoice(t);
        });
    }
    selectNearest();
    if (SIM.audio.ctx && SIM.audio.masterGain) SIM.audio.ramp(SIM.audio.masterGain.gain, CFG.masterGain, 0.2);
    startSpaceAmbient();   // SPEC 3.67: every mode reaches here — the one call site needed
}

function openMissionMenuOverlay() {
    menuResumable = true;
    menuOpen = true;
    menuSub = null;
    menuIdx = MENU_ITEMS.length;   // the appended Resume slot
    keysDown = {};
    thrusterSync(null);
    stopBeam(true);
    if (!warping && SIM.audio.ctx && SIM.audio.masterGain) SIM.audio.ramp(SIM.audio.masterGain.gain, 0.0001, 0.2);
    menuAnnounce();
}

// Resume: closes the overlay and hands control straight back to the ship,
// wherever it now is (including mid-flight, if the warp finished while the
// menu was open). If the cursor was sitting on the Resume slot itself
// (index MENU_ITEMS.length, which does not exist in the plain boot list),
// pull it back onto the last real item so a later exitToMenu() never reads
// an out-of-range index.
function resumeFromMenu() {
    menuOpen = false;
    menuResumable = false;
    menuSub = null;
    if (menuIdx >= MENU_ITEMS.length) menuIdx = MENU_ITEMS.length - 1;
    if (SIM.audio.ctx && SIM.audio.masterGain) SIM.audio.ramp(SIM.audio.masterGain.gain, CFG.masterGain, 0.2);
    say('Resumed.');
}

function startMission(m) {
    menuOpen = false;
    ore = 0; hull = CFG.shipHull; missiles = CFG.missileMax; chaff = CFG.chaffMax;
    autoTargetCharges = CFG.autoTargetCharges;
    refillRcs(); collisionDamage = 0; repairAllSystems();
    newGame(m);
    if (m === 'sector') placeAtStationStart();
    // SPEC 3.41: courseState is set AFTER newGame() (which calls
    // clearMission(), itself nulling courseState out) — not before.
    if (m === 'course') {
        courseState = { activeIndex: 0, elapsed: 0, started: false, made: 0, missed: 0, offsets: [] };
        activateCourseGate(0, courseIntro());
    } else if (m === 'minefield') {
        // SPEC 3.61: same reasoning as courseState above — set AFTER
        // newGame()'s own clearMission() call nulls it out.
        minefieldState = { elapsed: 0, started: false, detonations: 0 };
        say(minefieldIntro());
    } else if (m === 'shadow') {
        // SPEC 3.62: same reasoning again.
        shadowState = { elapsed: 0, started: false, contact: 0, inRange: false, currentHold: 0, longestHold: 0, timesLost: 0 };
        say(shadowIntro());
    } else if (m === 'nebula') {
        // SPEC 3.63: same reasoning again. cloudCenter is fixed for the
        // whole run (the cloud itself never moves); nebula_cloud crossfades
        // over startSpaceAmbient()'s own space_ambient bed, which newGame()
        // already started a moment ago — playMusic's own prev-node fade
        // handles the overlap the same way docking's interior loop does.
        nebulaState = { elapsed: 0, started: false, inside: false,
                         cloudCenter: v3(0, 0, -CFG.nebulaCenterDist) };
        if (SIM.audio.ctx) SIM.audio.playMusic('nebula_cloud', { vol: CFG.stationAmbientVol, fadeS: 1.5 });
        say(nebulaIntro());
    } else if (m === 'gaterun') {
        // SPEC 3.64: same reasoning again.
        gateRunState = { elapsed: 0, started: false, wasted: 0 };
        say(gateRunIntro());
    } else if (m === 'turret') {
        // SPEC 3.59: built AFTER newGame() for the same reason courseState
        // is — newGame()'s own clearMission() call nulls it out first.
        turretState = makeTurretState();
        say(turretIntro());
    } else if (m === 'mining') {
        // SPEC 3.71: the standalone Mining drill's own 7-minute clock —
        // never set for a quadrant field visit or the demo/contract's own
        // leg, which reach mode 'mining' through a different call
        // (newGame('mining', ...) directly, never startMission('mining')).
        miningState = { elapsed: 0, started: false, cores: 0 };
        say(miningIntro());
    } else if (m === 'combat') {
        // SPEC 3.71: the standalone Combat drill's own clock and laser-
        // accuracy counters — a mission or the capital ship never sets
        // combatState (both reach mode 'combat' through newGame() too,
        // but with `mission`/`capital` already set before this call).
        combatState = { elapsed: 0, started: false, shotsFired: 0, shotsLanded: 0 };
        say(combatIntro());
    } else {
        say(sectorIntro());
    }
}

// Select an item from either level: the two-note sound, "X selected", and
// the 600 ms beat before its run(). Shared by the main list and the
// Encounters sublist (SPEC 3.56).
function menuSelectItem(item) {
    if (item.ready && !item.ready()) return;
    menuSelectSound();
    say(itemLabel(item) + ' selected.');
    menuBusy = true;
    setTimeout(function () {
        menuBusy = false;
        if (!menuOpen) return;            // (a browser reload in the gap)
        menuSub = null;
        item.run();
    }, 600);
}

// First-letter jump, cycling from the item after the cursor. Returns the
// new index or -1.
function menuLetterJump(items, idx, lname) {
    var n = items.length;
    for (var i = 1; i <= n; i++) {
        var k = (idx + i) % n;
        if (itemLabel(items[k]).toLowerCase().charAt(0) === lname) return k;
    }
    return -1;
}

// The Encounters sublist (SPEC 3.56): the same shell one level down. Escape
// here closes the sublist only — a second Escape resumes a live mission —
// so the two levels behave the same way.
function menuSubKey(lname, name) {
    var n = menuSub.length;
    if (lname === 'escape' || lname === 'arrowleft') { closeMenuSub(); return; }
    if (lname === 'arrowdown') {
        menuClick(); encounterIdx = (encounterIdx + 1) % n; say(subItemText(encounterIdx));
    } else if (lname === 'arrowup') {
        menuClick(); encounterIdx = (encounterIdx - 1 + n) % n; say(subItemText(encounterIdx));
    } else if (lname === 'enter' || lname === 'arrowright') {
        menuSelectItem(menuSub[encounterIdx]);
    } else if (lname === 'f1') {
        openHelp();
    } else if (lname === 'f2') {
        openShipScreen();
    } else if (lname === 'f3') {
        openResourceScreen();
    } else if (lname === 'f12') {
        describeMode = true;
        say('Explore mode on. Press any key to hear what it does. F12 or Escape turns it off.');
    } else if (lname === 'tab') {
        say(subItemText(encounterIdx));
    } else if (lname.length === 1 && /[a-z]/.test(lname)) {
        var next = menuLetterJump(menuSub, encounterIdx, lname);
        if (next >= 0) { menuClick(); encounterIdx = next; say(subItemText(encounterIdx)); }
        else { SIM.audio.blip(220, 80, 0.1); say('No encounter starts with ' + prettyKey(name) + '. Up and down arrows browse, Enter starts one, Left returns.'); }
    } else {
        SIM.audio.blip(220, 80, 0.1);
        say('Up and down arrows browse the encounters, Enter starts one, Left or Escape returns to the mission menu. ' + itemLabel(menuSub[encounterIdx]) + '.');
    }
}

function menuKey(lname, name) {
    if (menuBusy) return;
    if (menuSub) { menuSubKey(lname, name); return; }
    // Escape again also resumes (accepted by default) — only when the menu
    // was opened over a live mission; at the plain boot list it falls
    // through to the generic hint below, same as any other unbound key.
    if (lname === 'escape' && menuResumable) { resumeFromMenu(); return; }
    var items = activeMenuItems(), n = items.length;
    if (lname === 'arrowdown') {
        menuClick(); menuIdx = (menuIdx + 1) % n; say(menuItemText(menuIdx));
    } else if (lname === 'arrowup') {
        menuClick(); menuIdx = (menuIdx - 1 + n) % n; say(menuItemText(menuIdx));
    } else if (lname === 'enter' || lname === 'arrowright' || lname === 'arrowleft') {
        var item = items[menuIdx];
        // The Difficulty line adjusts in place on Left/Right instead of
        // launching anything; Enter just re-states it (KC settings pattern).
        if (item.adjust) {
            if (lname !== 'enter') { menuClick(); item.adjust(lname === 'arrowright' ? 1 : -1); }
            say(menuItemText(menuIdx));
            return;
        }
        // SPEC 3.56: a sublist opens on Right or Enter; Left on it explains.
        if (item.sub) {
            if (lname === 'arrowleft') { say('Right arrow or Enter opens ' + itemLabel(item) + '.'); return; }
            openMenuSub(item);
            return;
        }
        menuSelectItem(item);
    } else if (lname === 'f1') {
        openHelp();
    } else if (lname === 'f2') {
        openShipScreen();
    } else if (lname === 'f3') {
        openResourceScreen();
    } else if (lname === 'f12') {
        describeMode = true;
        say('Explore mode on. Press any key to hear what it does. F12 or Escape turns it off.');
    } else if (lname === 'tab') {
        say(menuItemText(menuIdx));
    } else if (lname.length === 1 && /[a-z]/.test(lname)) {
        var next = menuLetterJump(items, menuIdx, lname);
        if (next >= 0) { menuClick(); menuIdx = next; say(menuItemText(menuIdx)); }
        else { SIM.audio.blip(220, 80, 0.1); say('No item starts with ' + prettyKey(name) + '. Up and down arrows browse, Enter selects.'); }
    } else {
        SIM.audio.blip(220, 80, 0.1);
        say('Up and down arrows browse the mission menu, Enter selects. ' + itemLabel(items[menuIdx]) + '.');
    }
}

// ---- Sound settings (SPEC 1.12, five steps as of SPEC 3.45) -----------------
// One line per category, Left/Right cycle Off / Low / Quiet / Medium / Full
// and play a short sound in that category at the new level, so the change is
// heard as well as spoken, plus one more line (Beacons) past the real
// categories that cycles BEACON_MODES instead. Reached from the mission
// menu; Escape returns to it.
function openSoundMenu() {
    soundMenu.open = true;
    soundMenu.idx = 0;
    say('Sound. Up and down arrows browse, left and right set a level, Escape returns to the menu. ' +
        soundLineText(soundMenu.idx));
}

function soundLineText(i) {
    // SPEC 3.45: the Beacons line lives one slot past the real categories —
    // not a SOUND_CATS entry itself, since it cycles BEACON_MODES (3 states),
    // not SOUND_LEVELS (5 steps), and applySoundLevels() never touches it.
    if (i === SOUND_CATS.length) {
        return beaconModeText() + ' Cycles the sector\'s four POI beacons: on, off, or only your selected nav target.';
    }
    var c = SOUND_CATS[i];
    // SPEC 3.80: Music opens its own submenu (Play/Stop, Next, Previous,
    // Style, Volume) rather than cycling a level directly with left/right
    // like every other category — say so instead of the level here.
    if (c.id === 'music') {
        return c.label + ': ' + (profile.music.on ? 'on, ' + (SIM.music.currentTitle() || 'starting') : 'off') +
               '. Enter or right arrow opens the music submenu.';
    }
    return c.label + ': ' + SOUND_LEVELS[profile.sound[c.id]].name + '. ' + c.desc;
}

function soundDemo(id) {
    var A = SIM.audio;
    if (!A.ctx) return;
    if (id === 'world') {
        var out = A.worldOut(add(ship.pos, scale(shipForward(), 200)), 400);
        if (out) A.sfxTone({ type: 'triangle', f1: 440, f2: 330, dur: 0.35, vol: 0.25, out: out });
    } else if (id === 'cockpit') {
        A.sfxTone({ type: 'sine', f1: 880, dur: 0.12, vol: 0.2 });
    } else if (id === 'music') {
        A.sfxChord([330, 415, 494], 0.5, 0.22, { out: A.musicBus });
    } else {
        SIM.cues.play('menu_select');
    }
}

function soundKey(lname) {
    // SPEC 3.45: n includes the Beacons line appended after every real
    // SOUND_CATS entry; onBeacons is true only on that last, special row.
    var n = SOUND_CATS.length + 1;
    var onBeacons = soundMenu.idx === SOUND_CATS.length;
    var c = onBeacons ? null : SOUND_CATS[soundMenu.idx];
    if (lname === 'escape' || lname === 'x') {
        soundMenu.open = false;
        say('Sound closed. ' + menuItemText(menuIdx));
        return;
    }
    if (lname === 'arrowdown') { menuClick(); soundMenu.idx = (soundMenu.idx + 1) % n; say(soundLineText(soundMenu.idx)); }
    else if (lname === 'arrowup') { menuClick(); soundMenu.idx = (soundMenu.idx - 1 + n) % n; say(soundLineText(soundMenu.idx)); }
    else if (lname === 'arrowright' && c && c.id === 'music') { openMusicMenu(); }
    else if (lname === 'arrowright' || lname === 'arrowleft') {
        var d = lname === 'arrowright' ? 1 : -1;
        if (onBeacons) {
            var bi = 0;
            for (var k = 0; k < BEACON_MODES.length; k++) if (BEACON_MODES[k].id === beaconMode) bi = k;
            beaconMode = BEACON_MODES[(bi + d + BEACON_MODES.length) % BEACON_MODES.length].id;
            saveProfile();
            SIM.audio.blip(beaconMode === 'on' ? 700 : beaconMode === 'target' ? 550 : 400, 90, 0.14, 0, 'triangle');
            say(beaconModeText());
        } else if (c && c.id === 'music') {
            // SPEC 3.80: no direct level cycling here — the submenu owns it.
            SIM.audio.blip(220, 80, 0.1);
            say('Enter or right arrow opens the music submenu.');
        } else {
            profile.sound[c.id] = (profile.sound[c.id] + d + SOUND_LEVELS.length) % SOUND_LEVELS.length;
            applySoundLevels();
            saveProfile();
            say(c.label + ': ' + SOUND_LEVELS[profile.sound[c.id]].name + '.');
            setTimeout(function () { soundDemo(c.id); }, 250);
        }
    }
    else if (lname === 'enter' || lname === 'tab') {
        if (c && c.id === 'music') openMusicMenu();
        else say(soundLineText(soundMenu.idx));
    }
    else if (lname === 'y') { speakTotals(); }
    else {
        SIM.audio.blip(220, 80, 0.1);
        say('Up and down arrows browse the sound settings, left and right set a level, Escape returns. ' + (onBeacons ? 'Beacons.' : c.label + '.'));
    }
}

// ---- the background music player (SPEC 3.80) -------------------------------
// SIM.music (audio_engine.js) is the mechanism; everything here is index.html
// deciding what to SAY about it and keeping profile.music in sync. Retires
// Round 44's menu-only startMenuMusic() outright — the player is just
// another place the pilot plays, on wherever they left it, menu included.
//
// onTrackStart fires from SIM.music on every real track change (a key
// press, a menu action, or a track ending and auto-advancing alike) —
// SPEC 3.80's own "every track start speaks its title... a key press or
// the last track ending alike, one say()". musicToggleKey's "Music on."
// case needs to fold the SAME title into its own single say() (SPEC 2.15:
// never two say() calls in one tick) rather than let this one speak a
// second time on top of it — `_silent` is the one-shot suppression for
// exactly that call.
SIM.music.onTrackStart = function (name) {
    if (!name) return;
    profile.music.style = SIM.music.style;
    var list = (window.MUSIC_STYLES && MUSIC_STYLES[SIM.music.style]) || [];
    profile.music.idx = list.indexOf(name);
    saveProfile();
    if (SIM.music._silent) { SIM.music._silent = false; return; }
    say((window.MUSIC_TITLES && MUSIC_TITLES[name]) || name);
};

var MUSIC_STYLE_LABELS = { celestial: 'Celestial' };
function musicStyleLabel(id) { return MUSIC_STYLE_LABELS[id] || id; }
function musicTitleOf(name) { return (window.MUSIC_TITLES && MUSIC_TITLES[name]) || name; }

// '[' — SPEC 3.80. Toggling on resumes the saved track (profile.music.idx)
// rather than drawing a fresh random one, so a reload picks back up near
// where it left off.
function musicToggleKey() {
    if (!SIM.audio.ctx) return;
    if (profile.music.on) {
        SIM.music.stop();
        profile.music.on = false;
        saveProfile();
        say('Music off.');
    } else {
        profile.music.on = true;
        var savedList = (window.MUSIC_STYLES && MUSIC_STYLES[profile.music.style]) || [];
        var savedName = savedList[profile.music.idx] || null;
        SIM.music._silent = true;
        var name = SIM.music.start(profile.music.style, savedName);
        saveProfile();
        say('Music on. ' + musicTitleOf(name) + '.');
    }
}
// ']' / Shift+']' — next/previous. Refuses (offline buzz) rather than
// silently doing nothing when the player is off, matching "silence is a
// bug" — every key answers.
function musicStepKey(shiftKey) {
    if (!SIM.audio.ctx) return;
    if (!profile.music.on) { SIM.cues.play('refusal_offline'); say('Music is off. Left bracket turns it on.'); return; }
    if (shiftKey) musicPreviousAction(); else musicNextAction();
}
function musicNextAction() {
    if (!profile.music.on) { SIM.cues.play('refusal_offline'); say('Music is off. Left bracket turns it on.'); return; }
    SIM.music.next();
}
function musicPreviousAction() {
    if (!profile.music.on) { SIM.cues.play('refusal_offline'); say('Music is off. Left bracket turns it on.'); return; }
    SIM.music.previous();
}
function musicCycleStyle(d) {
    var styles = Object.keys(window.MUSIC_STYLES || {});
    if (styles.length <= 1) { SIM.audio.blip(220, 80, 0.1); say('Only one style exists so far.'); return; }
    var i = styles.indexOf(profile.music.style);
    if (i < 0) i = 0;
    i = (i + d + styles.length) % styles.length;
    profile.music.style = styles[i];
    profile.music.idx = 0;
    saveProfile();
    if (profile.music.on) SIM.music.setStyle(styles[i]);
    say('Style: ' + musicStyleLabel(styles[i]) + '.');
}

// The Sound menu's Music sub-line opens this submenu (SPEC 3.80): Play/
// Stop, Next, Previous, Style, Volume — the KC shape Brian asked for,
// "volume controls via menu... could be in sounds." Volume lives only
// here, never on a key.
var MUSIC_MENU_ROWS = ['toggle', 'next', 'previous', 'style', 'volume'];
function musicMenuLineText(i) {
    var row = MUSIC_MENU_ROWS[i];
    if (row === 'toggle') {
        return profile.music.on ? 'Play/Stop: on, ' + (SIM.music.currentTitle() || 'starting') + '.'
                                 : 'Play/Stop: off.';
    }
    if (row === 'next') return 'Next track.';
    if (row === 'previous') return 'Previous track.';
    if (row === 'style') {
        var n = Object.keys(window.MUSIC_STYLES || {}).length;
        return 'Style: ' + musicStyleLabel(profile.music.style) + '.' +
               (n > 1 ? ' Left and right cycle styles.' : ' Only one style exists so far.');
    }
    return 'Volume: ' + SOUND_LEVELS[profile.sound.music].name + '.';
}
function openMusicMenu() {
    musicMenu.open = true;
    musicMenu.idx = 0;
    say('Music. Up and down arrows browse, Enter activates, left and right adjust. Escape returns to Sound. ' +
        musicMenuLineText(0));
}
function musicMenuKey(lname) {
    var n = MUSIC_MENU_ROWS.length;
    var row = MUSIC_MENU_ROWS[musicMenu.idx];
    if (lname === 'escape' || lname === 'x') {
        musicMenu.open = false;
        say('Music closed. ' + soundLineText(soundMenu.idx));
        return;
    }
    if (lname === 'arrowdown') { menuClick(); musicMenu.idx = (musicMenu.idx + 1) % n; say(musicMenuLineText(musicMenu.idx)); return; }
    if (lname === 'arrowup') { menuClick(); musicMenu.idx = (musicMenu.idx - 1 + n) % n; say(musicMenuLineText(musicMenu.idx)); return; }
    if (lname === 'enter' || lname === 'tab') {
        if (row === 'toggle') musicToggleKey();
        else if (row === 'next') musicNextAction();
        else if (row === 'previous') musicPreviousAction();
        else say(musicMenuLineText(musicMenu.idx));
        return;
    }
    if (lname === 'arrowleft' || lname === 'arrowright') {
        var d = lname === 'arrowright' ? 1 : -1;
        if (row === 'volume') {
            profile.sound.music = (profile.sound.music + d + SOUND_LEVELS.length) % SOUND_LEVELS.length;
            applySoundLevels();
            saveProfile();
            say('Volume: ' + SOUND_LEVELS[profile.sound.music].name + '.');
        } else if (row === 'style') {
            musicCycleStyle(d);
        } else if (row === 'toggle') {
            musicToggleKey();
        } else if (row === 'next') {
            musicNextAction();
        } else {
            musicPreviousAction();
        }
        return;
    }
    if (lname === 'y') { speakTotals(); return; }
    SIM.audio.blip(220, 80, 0.1);
    say('Up and down arrows browse the music settings, Enter activates. ' + musicMenuLineText(musicMenu.idx));
}

// SPEC 3.67 (ideas15.txt): the deep space bed — Brian: "set that as
// ambient background for anything in space, quadrant/encounter... the
// only place we would not use it now is when inside the station."
// Called unconditionally at the end of newGame() (every mode reaches
// it there) and again by undock() to bring it back over the docked
// interior loop's own crossfade. Same music slot as everything else on
// purpose: playMusic's own prev-node fade is what makes docking and the
// menu both replace it cleanly with no special-case code here.
function startSpaceAmbient() {
    // SPEC 3.72: the turret's own rising tones get to rise over something
    // quieter, not just louder over the same bed — `mode` is already set
    // to its new value by the time newGame() reaches this call, so this is
    // the one place that needs to know turret exists at all. Every other
    // mode transition (leaving turret for anything else) calls this again
    // at the plain CFG.spaceAmbientVol, which is the "restore" — no
    // separate un-duck step needed in clearMission().
    var vol = CFG.spaceAmbientVol * (mode === 'turret' ? CFG.turretAmbientDuck : 1);
    if (SIM.audio.ctx) SIM.audio.playMusic('space_ambient', { vol: vol, fadeS: 1.5 });
}

function exitToMenu() {
    clearMission();
    sectorHome = null;
    demo = null;
    contract = null;   // SPEC 3.28: abandoning the quadrant abandons its contract too, same as demo
    menuResumable = false;
    menuOpen = true;
    if (SIM.audio.ctx && SIM.audio.masterGain) SIM.audio.ramp(SIM.audio.masterGain.gain, CFG.masterGain, 0.2);
    // SPEC 3.80: no menu-only track any more — the background music player
    // (if the pilot has it on) has been playing right through this, same as
    // it plays through everything else; nothing to (re)start here.
    menuAnnounce();
}

function combatIntro() {
    var stance = TIERS[tierIdx].alwaysHostile
        ? 'Every ship is hostile and watching.'
        : 'Ships hold their fire until you hit them.';
    return 'Combat training, ' + TIERS[tierIdx].name + ' difficulty. Five targets detected. ' +
           'The Freighter is dead ahead. Tab cycles targets, T reports the selected one, ' +
           'Space fires when the tone goes solid. ' + stance + ' When you hear the lock-on ' +
           'chirps, G raises the shields. F1 for help.';
}

function sectorIntro() {
    // SPEC 3.10: only ever spoken for the open quadrant (startMission's own
    // 'sector' branch — the delivery run uses demoIntro instead), so this
    // can describe the moving world without a demo check.
    return 'Entering the quadrant just outside Station Meridian, warp tank full. The star, two stations, two planets, ' +
           'a jump gate, the Contested Zone, and one or more asteroid fields are on the quadrant map, grouped by kind, ' +
           'each with its own beacon sound. Q opens the map, Tab cycles beacons, H hyperwarps to your nav target, ' +
           'and C calls a point once you are within ' + CFG.poiInteract + '. F1 for help.' + beaconNote();
}

function miningIntro() {
    return 'Space mining. ' + aliveRocks().length +
           ' asteroids drifting in the cloud, each singing its own sound. ' +
           'Laser them apart. Every cut sheds dust you can vacuum up with V, ' +
           'and a rock mined to its glowing core is extracted with E. ' +
           'Rocks pushed out of the cloud are lost. F1 for help.';
}

function init() {
    loadProfile();
    var initBtn = document.getElementById('initBtn');
    var container = document.getElementById('game');
    liveEl = document.getElementById('announce');
    statusEl = document.getElementById('status');

    // SPEC 3.39 (ideas10.txt): the Press-Enter page was silent until Enter
    // — say() already works here (liveEl just got assigned above; it's an
    // aria-live div, not audio, so it needs no AudioContext), so speak it
    // at load, then again if it's missed: once at beginRemindFirstMs, then
    // every beginRemindEveryMs after that, both cleared the instant the
    // begin gesture fires below.
    var beginRemindInterval = null;
    say(BEGIN_LINE);
    var beginRemindTimeout = setTimeout(function () {
        say(BEGIN_LINE);
        beginRemindInterval = setInterval(function () { say(BEGIN_LINE); }, CFG.beginRemindEveryMs);
    }, CFG.beginRemindFirstMs);

    // ?run=delivery in the URL skips the menu and jumps straight into the
    // timed delivery run after the Press-Enter gesture — a shareable link
    // for the demo, e.g. https://.../?run=delivery
    var params = new URLSearchParams(location.search);
    var autoRun = params.get('run');
    // SPEC 3.43: ?mute=1 silences every Web Audio bus for this session —
    // Sonnet's own standing test convention, alongside beacons off.
    muted = params.get('mute') === '1';

    initBtn.addEventListener('click', function () {
        clearTimeout(beginRemindTimeout);
        clearInterval(beginRemindInterval);
        SIM.audio.audioStart();                    // must live inside the user gesture
        // Set directly, not ramped, so a muted boot has no audible blip
        // before the ramp would have reached zero.
        if (muted && SIM.audio.masterGain) SIM.audio.masterGain.gain.value = 0;
        applySoundLevels();
        // SPEC 3.80: the background music player starts here, unconditionally
        // — not just on the menu branch below, since it should be playing on
        // the ?run=delivery autoRun path too. Resumes the saved track
        // (profile.music.idx) rather than drawing a fresh random one.
        SIM.music.init();
        if (profile.music.on) {
            var savedList = (window.MUSIC_STYLES && MUSIC_STYLES[profile.music.style]) || [];
            SIM.music.start(profile.music.style, savedList[profile.music.idx] || null);
        }
        initBtn.style.display = 'none';
        container.hidden = false;
        container.focus();
        running = true;
        scheduleTick();
        // The container's label is read when it takes focus; wait so the
        // intro does not talk over it.
        if (autoRun === 'delivery') {
            setTimeout(function () {
                if (!SIM.audio.ctx) say('Audio is unavailable in this browser, speech only. ');
                startDemo();
            }, 800);
        } else {
            menuOpen = true;
            setTimeout(function () {
                menuAnnounce(SIM.audio.ctx ? '' : 'Audio is unavailable in this browser, speech only. ');
            }, 800);
        }
    });

    // Keep focus inside the container. If anything steals it, take it back.
    document.addEventListener('focusin', function (e) {
        if (container.hidden || !running) return;
        if (!container.contains(e.target) && e.target !== container) {
            container.focus();
        }
    });

    window.addEventListener('keydown', onKeyDown, true);
    window.addEventListener('keyup', onKeyUp, true);
    window.addEventListener('blur', function () { keysDown = {}; thrusterSync(null); });

    requestAnimationFrame(function (t) { lastFrame = t; requestAnimationFrame(frame); });
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

})();
</script>
</body>
</html>
