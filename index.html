// ============================== 8B. SECTOR ==================================
// The quadrant map (Q): a browsable overlay in the help-screen style. The
// sim freezes and the world ducks while it is open; Enter sets the nav
// target and hands control back with the tick already tracking it.
// Map access rules: always in open sector space; from a sector-entered
// mining encounter any time (miners leave when they please); from a
// sector-entered combat encounter only once the zone is cleared, so the map
// is never an escape hatch mid-fight. Training drills have no sector to
// return to, so the map is offline there.
function openMap() {
    if (mode !== 'sector') {
        if (!sectorHome) {
            say('The quadrant map is offline on training drills. X returns to the mission menu.');
            return;
        }
        if (mode === 'combat' && !won) {   // (a lost ship is not a cleared zone either)
            say('The quadrant map is jammed by hostile fire. Clear the zone first.');
            return;
        }
    }
    if (beam) stopBeam(true);
    map.open = true;
    map.idx = -1;
    // SPEC 3.10: sector mode groups by kind (mapBuildItems adds heading
    // rows); inside an encounter the map is still a flat "depart to X"
    // chart, sourced from whichever sector is actually live — the
    // delivery run's fixed SECTOR_POIS, or the open quadrant's own points
    // (quadrantPoiList — no audio nodes, just for listing).
    var pointCount;
    if (mode === 'sector') {
        map.items = mapBuildItems();
        pointCount = aliveTargets().length;
    } else {
        map.items = demo ? SECTOR_POIS : quadrantPoiList();
        pointCount = map.items.length;
    }
    keysDown = {};
    thrusterSync(null);
    updateStabilizers(0);
    if (SIM.audio.ctx && SIM.audio.masterGain && !menuOpen) SIM.audio.ramp(SIM.audio.masterGain.gain, 0.0001, 0.2);
    say('Quadrant map. ' + pointCount + ' points of interest.' +
        ((!demo && currentQuadrant() && currentQuadrant().openComms) ? ' Comms open quadrant-wide.' : '') +
        ' Up and down browse, ' +
        (mode === 'sector' ? 'Enter sets the nav target' : 'Enter departs for that point') +
        ', Escape closes.');
}

// Grouped by kind (SPEC 3.10, Brian): a heading line per non-empty group,
// nearest first within it, first-letter jump to a group (S/P/A/C/G — the
// star has no letter of its own, every other initial being already taken).
var MAP_GROUPS = [
    { letter: 's', label: 'Stations',        filter: function (t) { return t.poiType === 'station'; } },
    { letter: 'p', label: 'Planets',         filter: function (t) { return t.poiType === 'planet'; } },
    { letter: 'a', label: 'Asteroid fields', filter: function (t) { return t.poiType === 'mining'; } },
    { letter: 'c', label: 'Contested zone',  filter: function (t) { return t.poiType === 'combat'; } },
    { letter: 'g', label: 'Gate',            filter: function (t) { return t.poiType === 'gate'; } },
    { letter: null, label: 'Star',           filter: function (t) { return t.poiType === 'star'; } }
];
function mapBuildItems() {
    var items = [];
    MAP_GROUPS.forEach(function (g) {
        var matches = aliveTargets().filter(g.filter);
        if (!matches.length) return;
        matches.sort(function (x, y) { return len(sub(x.pos, ship.pos)) - len(sub(y.pos, ship.pos)); });
        items.push({ heading: g.label + ', ' + matches.length + '.', letter: g.letter });
        matches.forEach(function (t) { items.push(t); });
    });
    return items;
}

function closeMap(spoken) {
    map.open = false;
    if (SIM.audio.ctx && SIM.audio.masterGain && !menuOpen) SIM.audio.ramp(SIM.audio.masterGain.gain, CFG.masterGain, 0.2);
    if (spoken) say(spoken);
}

// Inside an encounter the map can't give live bearings (the encounter is its
// own little space), so lines read as chart entries: sector-frame distance
// from the point you are at.
// SPEC 3.23: "the map line does too" — a station's line in the open
// quadrant's map names its current tier. Not spoken for the demo's own
// fixed sector, which never runs favor.
function stationTierNote(item) {
    if (demo || item.poiType !== 'station') return '';
    return ' ' + capFirst(favorTier(favorOf(item.name))) + '.';
}
function mapLineText(item) {
    if (item.heading) return item.heading;
    if (mode === 'sector') {
        return bearingText(item) + ' ' + capFirst(warpReachText(len(sub(item.pos, ship.pos)))) + '.' +
               stationTierNote(item) + fieldTypeNote(item);
    }
    if (sectorHome && item.name === sectorHome.poiName) {
        return item.name + ', ' + item.desc + '. Your current location.';
    }
    var d = sectorHome ? round10(len(sub(item.pos, sectorHome.pos))) : 0;
    return item.name + ', ' + item.desc + '. Distance ' + d + ' from here.' + fieldTypeNote(item);
}

function mapKey(lname) {
    if (lname === 'escape' || lname === 'q') { closeMap('Map closed.'); return; }
    if (lname === 'arrowdown') {
        if (map.idx < map.items.length - 1) { map.idx++; say(mapLineText(map.items[map.idx])); }
        else { SIM.audio.blip(220, 80, 0.1); say('End of the list.'); }
    } else if (lname === 'arrowup') {
        if (map.idx > 0) { map.idx--; say(mapLineText(map.items[map.idx])); }
        else { map.idx = 0; SIM.audio.blip(220, 80, 0.1); say('Top of the list.'); }
    } else if (lname === 'enter') {
        if (map.idx < 0) { say('Browse to a point first, with the up and down arrows.'); return; }
        var item = map.items[map.idx];
        if (item.heading) { say('That is a heading. Up or down to browse into it.'); return; }
        if (mode === 'sector') {
            selected = targets.indexOf(item);
            locked = false;
            stopLockTone();
            closeMap('Nav target set: ' + item.name + '. H hyperwarps to it, or fly it by the tick.');
        } else {
            // Depart the encounter for the chosen point.
            var home = sectorHome;
            closeMap();
            if (item.name === home.poiName) {
                returnToSector();              // just step back outside
            } else {
                returnToSector(true);          // silent: the warp narrates
                var idx = -1;
                targets.forEach(function (t, i) { if (t.name === item.name) idx = i; });
                if (idx >= 0) { selected = idx; locked = false; stopLockTone(); }
                startWarp();
            }
        }
    } else if (lname === 'y') {
        speakTotals();
    } else if (mode === 'sector' && typeof lname === 'string' && lname.length === 1 && /[a-z]/.test(lname)) {
        // SPEC 3.10: first-letter jump to a group heading.
        var gi = -1;
        for (var i = 0; i < map.items.length; i++) {
            if (map.items[i].heading && map.items[i].letter === lname) { gi = i; break; }
        }
        if (gi >= 0) { map.idx = gi; say(mapLineText(map.items[gi])); }
        else { SIM.audio.blip(220, 80, 0.1); say('No group starts with that letter.'); }
    } else {
        say('Up and down browse the map, Enter ' +
            (mode === 'sector' ? 'sets the nav target' : 'departs') + ', Escape closes.');
    }
}

// ---- the warp tank (SPEC 1.10) ------------------------------------------------
function warpPct() { return Math.round(warpCharge / CFG.warpTankMax * 100); }
function refillWarp() { warpCharge = CFG.warpTankMax; }

// Charge a jump to a point that far away would spend (the usual dropout is
// flown, not warped), and whether the tank covers it.
function warpNeed(dist) { return Math.max(0, dist - CFG.warpDropout); }
// SPEC 3.27: a half-broken warp engine halves the effective reach of
// whatever charge is in the tank (the tank itself is untouched) — every
// place that used to compare against warpCharge as "how far can I jump"
// reads this instead, so the map's "in range"/"beyond by N" never lies.
function warpEffectiveCharge() {
    return warpCharge * (systemState('warp') === 'half' ? CFG.repairWarpRangePct : 1);
}
function warpReachText(dist) {
    var need = warpNeed(dist);
    var eff = warpEffectiveCharge();
    return need <= eff ? 'in warp range'
         : 'beyond warp range by ' + round10(need - eff);
}

// Open-flight regen (SPEC 1.13, Brian: no hiss — the old core-cooling
// noise is gone). Speech as the charge crosses each CFG.warpAlertPcts
// threshold, then the existing full line with its chime. Stateless on
// purpose: an alert fires when one frame's regen carries the charge
// across a threshold, so a jump that drops it back under re-arms it for
// free. Silent in encounters and at full charge — the station and every
// encounter exit say "Warp tank filled" themselves.
function updateWarpCore(dt) {
    if (mode !== 'sector' || warping || warpCharge >= CFG.warpTankMax || systemState('warp') === 'off') return;
    var before = warpCharge / CFG.warpTankMax * 100;
    warpCharge = Math.min(CFG.warpTankMax, warpCharge + CFG.warpRegenPerS * dt);
    var after = warpCharge / CFG.warpTankMax * 100;
    if (warpCharge >= CFG.warpTankMax) {
        SIM.cues.play('ready_chime');
        say('Warp core cooled. Tank full.');
        return;
    }
    for (var i = 0; i < CFG.warpAlertPcts.length; i++) {
        var p = CFG.warpAlertPcts[i];
        if (before < p && after >= p) { say('Warp core ' + p + ' percent.'); break; }
    }
}

// ---- docking (SPEC 1.19: range-only — no flown corridor) ------------------
// C within stationDockRange docks at once; farther out (but within
// stationCommRange) it's a hail — a status line, no docking. Repair/rearm/
// refuel/restock and the delivery handover happen on arrival, same as they
// always have; only the flown approach (SPEC 1.6) is gone.
function dockAtStation(poi, extra) {
    extra = extra || '';
    touchStationVisit(poi.name);   // SPEC 3.33: docking is a real interaction
    var approachDir = norm(sub(ship.pos, poi.pos));
    ship.vel = v3(0, 0, 0);
    SIM.cues.play('dock_clunk');
    docked = { poi: poi, approachDir: approachDir };
    stationIdx = 0;
    // ideas6: docked is its own place. The lock tick and tone stop, every
    // beacon outside goes quiet (updateTargeting can't do it — simTick is
    // frozen while docked), and the station's interior loop comes up on
    // the music bus. undock() reverses all three.
    locked = false; stopLockTone();
    applyBeaconMutes();
    if (SIM.audio.ctx) SIM.audio.playMusic('station_interior1', { vol: CFG.stationAmbientVol, fadeS: 1 });
    var repaired = hull < CFG.shipHull, rearmed = missiles < CFG.missileMax,
        restocked = chaff < CFG.chaffMax, refueled = warpCharge < CFG.warpTankMax,
        massRefueled = rcs < CFG.rcsMax, systemsFixed = brokenSystemIds().length > 0;
    // Collision damage is the only hull loss that costs anything (SPEC
    // 2.14, "bad drivers pay") — bill it here, repair whatever's afforded,
    // and only the REST of the hull (ordinary combat/mining damage) is
    // free like it always was.
    var billable = Math.min(collisionDamage, CFG.shipHull - hull);
    var repairCost = Math.ceil(billable * CFG.repairCreditPerPoint * honoredDiscountAt(poi));
    var billLine = '';
    if (repairCost > 0) {
        var afford = Math.min(repairCost, profile.credits);
        var pointsPaid = Math.floor(afford / CFG.repairCreditPerPoint);
        profile.credits -= afford;
        hull = Math.min(CFG.shipHull, hull + pointsPaid + (CFG.shipHull - hull - billable));
        collisionDamage = Math.max(0, billable - pointsPaid);
        billLine = afford >= repairCost
            ? 'Collision damage repaired for ' + repairCost + ' credits. '
            : (pointsPaid > 0 ? pointsPaid + ' points of collision damage repaired for ' + afford + ' credits — the rest waits on credits. '
                               : 'Collision damage still owed — ' + repairCost + ' credits needed. ');
        saveProfile();
    } else {
        hull = CFG.shipHull;
    }
    missiles = CFG.missileMax; chaff = CFG.chaffMax; autoTargetCharges = CFG.autoTargetCharges;
    refillWarp(); refillRcs(); repairAllSystems();
    var service = billLine +
                  (rearmed ? 'Missiles rearmed to ' + CFG.missileMax + '. ' : '') +
                  (restocked ? 'Decoys restocked to ' + CFG.chaffMax + '. ' : '') +
                  (refueled ? 'Warp tank filled. ' : '') +
                  (massRefueled ? 'Reaction mass filled. ' : '') +
                  (systemsFixed ? 'Systems repaired. ' : '');
    // SPEC 3.23: no mood line here any more — docking always means the
    // pilot already cleared Trusted (favorTierAtLeast gated the call that
    // got here), so restating it would just repeat what the hail already
    // said on the way in.
    var greeting = (autoThrust ? autoOffText() : '');
    autoThrust = false;
    if (demo && !demo.delivered && ore >= CFG.demoOreGoal) {
        var delivered = ore;
        demo.delivered = true;
        ore = 0;
        // SPEC 3.23: the one favor change the fixed sector's own demo DOES
        // make — writeFavor bypasses the "no favor in demo" rule on
        // purpose here, matching the spec's own explicit callout.
        writeFavor(poi.name, CFG.favorDeliveryHandover);
        // SPEC 3.71: `runs` under the shared BOARDS shape now — same
        // richer delta phrasing every other board already speaks.
        var prevBestRun = recordRun('runs', { seconds: demo.elapsed, tier: tierIdx, upgrades: profile.upgrades.length });
        var bestLine = prevBestRun === undefined ? 'Your first time.'
                      : demo.elapsed < prevBestRun ? 'New personal best by ' + fmtTime(prevBestRun - demo.elapsed) + '.'
                      : fmtTime(demo.elapsed - prevBestRun) + ' off your best.';
        setTimeout(function () { SIM.cues.play('win_fanfare'); }, 300);
        say(extra + greeting + 'Docked at ' + poi.name + '. Cargo received, ' + delivered + ' ore. Delivery complete! ' +
            'Run time ' + fmtTime(demo.elapsed) + '. ' + bestLine + ' ' + service + stationMenuIntro());
    } else if (contract && !contract.delivered && contract.combatCleared &&
               poi.name === 'Station Meridian' && ore >= CFG.demoOreGoal) {
        // SPEC 3.28: the quadrant's own timed contract, same three-step
        // shape as the demo above (clear the zone, meet the ore quota, dock
        // at Meridian specifically) but paid in credits rather than handed
        // over as cargo — the ore itself stays sold at the ordinary rate,
        // CFG.contractCredits on top as the contract's own bonus.
        var cDelivered = ore;
        contract.delivered = true;
        ore = 0;
        var payout = Math.floor(cDelivered / CFG.oreCreditRate) + CFG.contractCredits;
        profile.credits += payout;
        // SPEC 3.32: named alongside escort/defend, though it's masked in
        // practice here — completing the contract always means docking,
        // and docking already refills reaction mass to full a few lines
        // below regardless.
        addRcs(CFG.rcsMission);
        gainFavor(poi, CFG.favorMission);   // SPEC 3.23: treated as "a mission completed for that port"
        // SPEC 3.71: `contract` under the shared BOARDS shape now.
        var prevBestContract = recordRun('contract', { seconds: contract.elapsed, tier: tierIdx });
        var cBestLine = prevBestContract === undefined ? 'Your first time.'
                       : contract.elapsed < prevBestContract ? 'New personal best by ' + fmtTime(prevBestContract - contract.elapsed) + '.'
                       : fmtTime(contract.elapsed - prevBestContract) + ' off your best.';
        saveProfile();
        setTimeout(function () { SIM.cues.play('win_fanfare'); }, 300);
        say(extra + greeting + 'Docked at ' + poi.name + '. Cargo received, ' + cDelivered + ' ore. Contract complete! ' +
            'Contract time ' + fmtTime(contract.elapsed) + '. ' + cBestLine + ' ' + payout + ' credits paid. ' +
            service + stationMenuIntro());
    } else if (distress && distress.recovered && poi.name === distress.poiName) {
        // SPEC 3.55: same shape as the contract branch above — "bring it
        // home" completes at the SAME station that offered the call, not
        // just any dock, matching distressIntro's own wording. A dock
        // anywhere else while a recovered call is still open just falls to
        // the generic branch below, unaffected.
        distress = null;
        profile.credits += CFG.distressCredits;
        addRcs(CFG.rcsMission);   // SPEC 3.32: named alongside escort/defend/contract
        gainFavor(poi, CFG.favorMission);
        saveProfile();
        setTimeout(function () { SIM.cues.play('win_fanfare'); }, 300);
        say(extra + greeting + 'Docked at ' + poi.name + '. The derelict is home. Distress call complete! ' +
            CFG.distressCredits + ' credits paid. ' + service + stationMenuIntro());
    } else {
        say(extra + greeting + 'Docked at ' + poi.name + '. ' + service +
            (demo && !demo.delivered
                ? 'The delivery needs ' + CFG.demoOreGoal + ' ore. Your hold reads ' + ore + '.'
                : (contract && !contract.delivered
                    ? contractDockNote()
                    : (distress
                        ? (distress.recovered ? 'The derelict still needs to come home to ' + distress.poiName + '.'
                                               : 'The distress call still needs the derelict recovered.')
                        : 'Your cargo hold reads ' + ore + ' ore, ' + profile.credits + ' credits.'))) + ' ' + stationMenuIntro());
    }
}

// What dockAtStation says while a SPEC 3.28 contract is open but this dock
// didn't complete it — names whichever of the three steps is still missing.
function contractDockNote() {
    if (!contract.combatCleared) return 'The timed delivery needs the Contested Zone cleared first.';
    if (ore < CFG.demoOreGoal) return 'The timed delivery needs ' + CFG.demoOreGoal + ' ore. Your hold reads ' + ore + '.';
    return 'Dock at Station Meridian to complete the timed delivery.';
}

// ---- death by tug (SPEC 2.16) ----------------------------------------------
// A lost ship in the sector campaign (an encounter reached via the sector,
// or the delivery run itself — both always leave sectorHome set or mode
// 'sector') no longer Enter-restarts in place: it waits for a tug, on the
// clock, same as any other consequence in this game. A standalone training
// drill from the mission menu (no sectorHome, mode never 'sector') keeps
// today's instant Enter-to-retry — tugCandidate() is the one place that
// decides which applies.
function tugCandidate() { return !!(sectorHome || mode === 'sector'); }

// What a held flight key answers while over() holds the ship still.
function overHeldText() {
    if (tug) return 'Ship lost. A tug is on the way, ' + Math.ceil(tug.remaining) + ' seconds out.';
    if (mission) return 'Mission over. X returns to the sector.';
    if (lost) return 'Ship lost. Enter tries again, X leaves.';
    return 'Encounter over. Enter plays again, X ' + (sectorHome ? 'returns to the sector.' : 'for the mission menu.');
}

// SPEC 3.23: like nearestStationTo, but only among stations that would
// actually let the pilot dock right now (Trusted favor or better —
// Controlled would also qualify once control exists, but it doesn't yet,
// so Trusted is the whole test).
function nearestTrustedStationTo(pos) {
    var best = null, bestD = Infinity;
    QUADRANT.forEach(function (q) {
        if (q.poiType !== 'station') return;
        if (favorTierRank(favorTier(favorOf(q.name))) < favorTierRank('trusted')) return;
        var d = len(sub(ringPos(q), pos));
        if (d < bestD) { bestD = d; best = { name: q.name, pos: ringPos(q) }; }
    });
    return best;
}

function startTug() {
    // SPEC 3.10: more than one station can exist now — go to whichever is
    // nearest the pilot's SECTOR-frame position at the moment of death
    // (sectorHome's own snapshot inside an encounter; ship.pos directly for
    // an open-flight death, e.g. a collision). The delivery run's fixed
    // sector still only ever has Station Meridian (nearestStationTo's own
    // demo branch), unchanged.
    var pilotPos = (mode === 'sector') ? ship.pos : (sectorHome ? sectorHome.pos : ship.pos);
    if (demo) {
        var demoPoi = nearestStationTo(pilotPos);
        tug = { total: CFG.tugBaseS, remaining: CFG.tugBaseS, poiData: demoPoi, paid: 0,
                remindedFirst: false, reminded30: false };
        return;
    }
    // SPEC 3.23: replaces the old influence-halving model entirely — favor
    // now decides WHERE the tug goes, not how fast. The nearest station
    // that actually trusts the pilot, at the base wait; if none in the
    // quadrant does, the long ride home to Meridian by name, at
    // tugHomeFactor times the base.
    var trusted = nearestTrustedStationTo(pilotPos);
    if (trusted) {
        tug = { total: CFG.tugBaseS, remaining: CFG.tugBaseS, poiData: trusted, paid: 0,
                remindedFirst: false, reminded30: false };
        return;
    }
    var meridianEntry = QUADRANT.filter(function (q) { return q.name === 'Station Meridian'; })[0];
    var total = CFG.tugBaseS * CFG.tugHomeFactor;
    tug = { total: total, remaining: total, poiData: { name: meridianEntry.name, pos: ringPos(meridianEntry) },
             paid: 0, remindedFirst: false, reminded30: false };
}

// SPEC 3.35 (ideas10.txt): the countdown also teaches — a lost pilot is
// reminded, twice, that F2 reads the ship and F3 the hold, at the first
// announcement (whatever it is) and again at CFG.tugReminderMarkS
// (30s), never both in the same say() and never more than once each.
var TUG_REMINDER = ' F2 reads your ship, F3 your hold.';
function updateTug(dt) {
    var beforeStep = Math.floor(tug.remaining / 10);
    tug.remaining = Math.max(0, tug.remaining - dt);
    var afterStep = Math.floor(tug.remaining / 10);
    if (tug.remaining <= 0) { tugArrives(); return; }
    if (afterStep < beforeStep) {
        var extra = '';
        if (!tug.remindedFirst) { tug.remindedFirst = true; extra = TUG_REMINDER; }
        else if (!tug.reminded30 && afterStep === Math.floor(CFG.tugReminderMarkS / 10)) {
            tug.reminded30 = true;
            extra = TUG_REMINDER;
        }
        say('Tug in ' + Math.ceil(tug.remaining) + ' seconds.' + extra);
    }
}

// SPEC 3.35 (ideas10.txt): repeatable — every payment halves whatever's
// left, as many times as credits allow (a fresh 100-credit pilot buys
// exactly two: 90 -> 45 -> 22.5). Only "not enough credits" ever refuses.
function payTugFee() {
    if (profile.credits < CFG.tugFeeCredits) {
        SIM.cues.play('refusal_dud');   // SPEC 3.50: matches "not enough credits" everywhere else in the shop
        say('Need ' + CFG.tugFeeCredits + ' credits to rush the tug; you have ' + profile.credits + '.');
        return;
    }
    profile.credits -= CFG.tugFeeCredits;
    tug.remaining /= 2;
    tug.paid++;
    saveProfile();
    var offer = profile.credits >= CFG.tugFeeCredits ? ' Enter pays another ' + CFG.tugFeeCredits + '.' : '';
    say('Paid ' + CFG.tugFeeCredits + ' credits. Tug in ' + Math.ceil(tug.remaining) + ' seconds.' + offer);
}

// Docked exactly like flying in and calling the station, minus the flying —
// full repair/rearm/refuel/restock and the delivery handover if the hold
// already meets the goal, same code path dockAtStation always ran.
function tugArrives() {
    var poiData = tug.poiData;
    tug = null;
    sectorHome = null;
    newGame('sector');
    var idx = -1;
    targets.forEach(function (t, i) { if (t.name === poiData.name) idx = i; });
    if (idx < 0) return;   // shouldn't happen: makeSectorRoster always includes the station
    var poi = targets[idx];
    ship.pos = add(poi.pos, scale(v3(0, 0, 1), CFG.stationDockRange + 100));
    selected = idx; locked = false; stopLockTone();
    dockAtStation(poi, 'Tug arrives. ');
}

// ---- station menu shell (SPEC 1.7 fleshes out the item list) --------------
// Same shell as the mission menu: arrows navigate, a click per move, Enter
// selects with a beat, Escape (or X) undocks. Not yet the shared listMenu
// the plan describes — see CLAUDE.md's note on the run log for why.
var STATION_ITEMS = [
    { label: 'Sell ore',
      desc: function () {
          if (oreSellBlocked()) return 'Blocked — that ore is the delivery.';
          return ore > 0 ? 'Sell ' + ore + ' ore for ' + Math.floor(ore / CFG.oreCreditRate) + ' credits.'
                          : 'No ore in the hold.';
      },
      ready: function () {
          if (oreSellBlocked()) {
              say('That ore is the delivery. Dock at Station Meridian to hand it over.');
              return false;
          }
          if (ore <= 0) { say('No ore to sell.'); return false; }
          return true;
      },
      run: function () { sellOre(); } },
    { label: 'Sell salvage',
      desc: function () {
          var n = profile.resources.salvage;
          return n > 0 ? 'Sell ' + n + ' salvage for ' + (n * CFG.salvageCredit) + ' credits.'
                       : 'No salvage in the hold.';
      },
      ready: function () {
          if (profile.resources.salvage <= 0) { say('No salvage to sell.'); return false; }
          return true;
      },
      run: function () { sellResource('salvage', CFG.salvageCredit, docked.poi); } },
    { label: 'Sell alloy',
      desc: function () {
          var n = profile.resources.alloy;
          return n > 0 ? 'Sell ' + n + ' alloy for ' + (n * CFG.alloyCredit) + ' credits.'
                       : 'No alloy in the hold.';
      },
      ready: function () {
          if (profile.resources.alloy <= 0) { say('No alloy to sell.'); return false; }
          return true;
      },
      run: function () { sellResource('alloy', CFG.alloyCredit, docked.poi); } },
    { label: 'Modules',
      desc: function () {
          return MODULES.length + ' modules on file, ' + ownedModules().length + ' fitted. ' +
                 profile.credits + ' credits.';
      },
      run: function () { openModules(); } },
    { label: 'Lasers',
      desc: function () {
          return 'Mining level ' + profile.laserLevels.mining + ', rapid level ' + profile.laserLevels.rapid + '. ' +
                 profile.credits + ' credits, ' + profile.resources.alloy + ' alloy.';
      },
      run: function () { openLaserShop(); } },
    { label: 'Undock', desc: 'Back out to clear of the station.',
      run: function () { undock(); } }
];

// SPEC 3.24: while the delivery run's own quota is still owed, Sell ore is
// refused everywhere (hail, transporter-range once 3.23 exists, landed) —
// Brian sold his 15,000 from the hail menu once and the handover never
// happened, the clock running on with nothing delivered. dockAtStation's
// own automatic handover (ore >= demoOreGoal) is untouched — this only
// gates the manual Sell action. A hold short of the goal can't be sold
// either, so there's no "sell most of it, then restart" escape hatch.
// (3.28 will extend this the same way for the quadrant's own timed
// contract once it exists.)
function oreSellBlocked() { return !!((demo && !demo.delivered) || (contract && !contract.delivered)); }

// SPEC 3.23: every sale nudges favor at the station — favorPerWantUnit's
// per-category rate, the number the spec gives for "selling what it
// wants". There's no per-station wants list yet (that's 3.11), so every
// sale counts as if it were wanted for now — flagged in SPEC.md. Folded
// into the SAME say() as the credit total (the SPEC 2.15 rule), never a
// separate call.
function sellOreAt(poi) {
    var sold = ore;
    var earned = Math.floor(ore / CFG.oreCreditRate);
    ore = 0;
    profile.credits += earned;
    // A sale is a real interaction even when it's too small to cross a
    // whole favor point — touch first (regardless), then apply whatever
    // whole-point gain it earned on top.
    touchStationVisit(poi.name);
    var favorGain = Math.floor(sold / CFG.favorPerWantUnit.ore);
    if (favorGain > 0) gainFavor(poi, favorGain);
    saveProfile();
    say('Sold for ' + earned + ' credits. Balance ' + profile.credits + '.' +
        (favorGain > 0 ? ' +' + favorGain + ' favor.' : ''));
}
function sellOre() { sellOreAt(docked.poi); }

// SPEC 3.33: donate the whole hold for favor, no credits — its own rate
// (donateOrePerFavor, not the sale rate), reachable from comms range so
// a stranger can buy their way to Known without a fight. Ore only —
// "ore is the currency of standing"; salvage and alloy stay sellable
// only. Same oreSellBlocked() rule as Sell (the delivery run's or the
// contract's ore can't be given away any more than it can be sold).
function donateOreAt(poi) {
    var donated = ore;
    ore = 0;
    touchStationVisit(poi.name);
    var favorGain = Math.floor(donated / CFG.donateOrePerFavor);
    if (favorGain > 0) gainFavor(poi, favorGain);
    saveProfile();
    say('Donated ' + donated + ' ore.' +
        (favorGain > 0 ? ' +' + favorGain + ' favor.' : ' Not enough for a point of favor.'));
}

// Salvage and alloy (SPEC 2.15): the same sell-for-credits shape as ore,
// at a flat per-unit price rather than ore's per-10 rate — they're rarer.
function sellResource(key, pricePerUnit, poi) {
    var n = profile.resources[key];
    var earned = n * pricePerUnit;
    profile.resources[key] = 0;
    profile.credits += earned;
    touchStationVisit(poi.name);
    var favorGain = Math.floor(n / CFG.favorPerWantUnit[key]);
    if (favorGain > 0) gainFavor(poi, favorGain);
    saveProfile();
    say('Sold for ' + earned + ' credits. Balance ' + profile.credits + '.' +
        (favorGain > 0 ? ' +' + favorGain + ' favor.' : ''));
}

// ---- Modules submenu --------------------------------------------------------
// SPEC 3.33: Honored's 25% discount applies to the credits price only —
// alloy is a scarce resource, not really a "price" in the same sense.
function moduleCost(m) { return Math.ceil(m.cost * honoredDiscountAt(docked && docked.poi)); }

function moduleText(i) {
    var m = MODULES[i], owned = ownedModules().indexOf(m.id) >= 0;
    if (owned) return m.name + '. ' + m.desc + ' Already fitted.';
    if (m.requires && ownedModules().indexOf(m.requires) < 0) {
        return m.name + '. ' + m.desc + ' Requires ' + moduleById(m.requires).name + ' first.';
    }
    var cost = moduleCost(m);
    var alloyText = m.alloy ? ', ' + m.alloy + ' alloy' : '';
    var afford = profile.credits >= cost && (!m.alloy || profile.resources.alloy >= m.alloy);
    return m.name + '. ' + m.desc + ' ' + cost + ' credits' + alloyText + ', adds ' + m.mass + ' mass. ' +
           (afford ? 'You can afford it.'
            : profile.credits < cost ? 'Need ' + (cost - profile.credits) + ' more credits.'
                                      : 'Need ' + (m.alloy - profile.resources.alloy) + ' more alloy.');
}

function openModules() {
    stationSubmenu = 'modules';
    moduleIdx = 0;
    say('Modules. Up and down arrows browse, Enter fits one, Escape returns. ' + moduleText(moduleIdx));
}

function buyModule(i) {
    var m = MODULES[i];
    var cost = moduleCost(m);
    if (ownedModules().indexOf(m.id) >= 0) { SIM.cues.play('refusal_dud'); say('Already fitted.'); return; }
    if (m.requires && ownedModules().indexOf(m.requires) < 0) {
        SIM.cues.play('refusal_dud');
        say('Requires ' + moduleById(m.requires).name + ' first.');
        return;
    }
    if (profile.credits < cost) {
        SIM.cues.play('refusal_dud');
        say('Not enough credits. Need ' + (cost - profile.credits) + ' more.');
        return;
    }
    if (m.alloy && profile.resources.alloy < m.alloy) {
        SIM.cues.play('refusal_dud');
        say('Not enough alloy. Need ' + (m.alloy - profile.resources.alloy) + ' more.');
        return;
    }
    profile.credits -= cost;
    if (m.alloy) profile.resources.alloy -= m.alloy;
    profile.upgrades.push(m.id);
    applyTier(tierIdx);      // re-layer CFG with the new module live, mid-session
    saveProfile();
    menuSelectSound();
    say(capFirst(m.name) + ' fitted. ' + profile.credits + ' credits left.');
}

function moduleKey(lname) {
    var n = MODULES.length;
    if (lname === 'escape' || lname === 'x') { stationSubmenu = null; say(stationItemText()); return; }
    if (lname === 'arrowdown') { menuClick(); moduleIdx = (moduleIdx + 1) % n; say(moduleText(moduleIdx)); }
    else if (lname === 'arrowup') { menuClick(); moduleIdx = (moduleIdx - 1 + n) % n; say(moduleText(moduleIdx)); }
    else if (lname === 'enter' || lname === 'arrowright' || lname === 'arrowleft') { buyModule(moduleIdx); }
    else if (lname === 'tab') { say(moduleText(moduleIdx)); }
    else if (lname === 'y') { speakTotals(); }
    else {
        SIM.audio.blip(220, 80, 0.1);
        say('Up and down arrows browse modules, Enter fits one, Escape returns. ' + MODULES[moduleIdx].name + '.');
    }
}

// ---- Lasers submenu (SPEC 3.26) --------------------------------------------
// Same shell as Modules: one Buy and one Repair line per family. Buying
// advances the owned level (health resets full); repairing tops up health
// at the owned level's own price, never both at once.
// SPEC 3.46: rebuilt (not a fixed list) — buy/repair lines for a family
// once it's owned (profile.laserLevels has an entry for it), one "Fit
// family in slot N" line per empty slot x unowned family otherwise. A
// family fit once becomes owned, so it stops being offered as "fit"
// anywhere else — the shop's own way of refusing a second fit of the
// same family, with no special-case check needed.
function unownedLaserFamilies() {
    return LASER_FAMILIES.filter(function (f) { return !profile.laserLevels[f.id]; });
}
function emptyLaserSlotIdxs() {
    var out = [];
    for (var i = 0; i < LASER_SLOTS; i++) if (!profile.slots[i]) out.push(i);
    return out;
}
function buildLaserShop() {
    var items = [];
    LASER_FAMILIES.forEach(function (fam) {
        if (profile.laserLevels[fam.id]) {
            items.push({ kind: 'buy', family: fam.id });
            items.push({ kind: 'repair', family: fam.id });
        }
    });
    var empties = emptyLaserSlotIdxs(), unowned = unownedLaserFamilies();
    empties.forEach(function (slotIdx) {
        unowned.forEach(function (fam) { items.push({ kind: 'fit', family: fam.id, slot: slotIdx }); });
    });
    return items;
}
var LASER_SHOP = [];
function refreshLaserShop() {
    LASER_SHOP = buildLaserShop();
    laserShopIdx = Math.min(laserShopIdx, LASER_SHOP.length - 1);
}

// SPEC 3.33: Honored's 25% discount on the credits side only — alloy
// stays full price, same reasoning as moduleCost.
function laserLevelCost(next) { return Math.ceil(CFG.laserLevelCredits * next * honoredDiscountAt(docked && docked.poi)); }
function laserRepairCost(fam) {
    var points = Math.round(100 - profile.laserHealth[fam]);
    return Math.ceil(points * CFG.laserRepairCreditsPerPoint * profile.laserLevels[fam] * honoredDiscountAt(docked && docked.poi));
}
// SPEC 3.46: a flat cost, always level 1 — unlike laserLevelCost above,
// which scales with the level being bought.
function laserFitCost() { return Math.ceil(CFG.laserFitCredits * honoredDiscountAt(docked && docked.poi)); }

function laserShopText(i) {
    var it = LASER_SHOP[i], fam = LASER_FAMILIES_BY_ID[it.family];
    var label = capFirst(fam.label) + ' laser';
    if (it.kind === 'fit') {
        var fcost = laserFitCost(), falloy = CFG.laserFitAlloy;
        var fafford = profile.credits >= fcost && profile.resources.alloy >= falloy;
        return 'Fit ' + fam.label + ' laser in slot ' + (it.slot + 1) + '. ' + fcost + ' credits, ' + falloy + ' alloy. ' +
               (fafford ? 'You can afford it.'
                : profile.credits < fcost ? 'Need ' + (fcost - profile.credits) + ' more credits.'
                                           : 'Need ' + (falloy - profile.resources.alloy) + ' more alloy.');
    }
    var owned = profile.laserLevels[it.family], health = profile.laserHealth[it.family];
    if (it.kind === 'buy') {
        if (owned >= 8) return label + ' fully upgraded, level 8.';
        var next = owned + 1, cost = laserLevelCost(next), alloy = CFG.laserLevelAlloy * next;
        var afford = profile.credits >= cost && profile.resources.alloy >= alloy;
        return label + ' level ' + next + '. ' + cost + ' credits, ' + alloy + ' alloy. ' +
               (afford ? 'You can afford it.'
                : profile.credits < cost ? 'Need ' + (cost - profile.credits) + ' more credits.'
                                          : 'Need ' + (alloy - profile.resources.alloy) + ' more alloy.');
    }
    if (health >= 100) return 'Repair ' + fam.label + ' laser. Already at full health.';
    var points = Math.round(100 - health), price = laserRepairCost(it.family);
    return 'Repair ' + fam.label + ' laser level ' + owned + ', ' + points + ' points, ' + price + ' credits.';
}

function laserShopReady(i) {
    var it = LASER_SHOP[i];
    if (it.kind === 'fit') {
        var fcost = laserFitCost();
        if (profile.credits < fcost) {
            SIM.cues.play('refusal_dud'); say('Not enough credits. Need ' + (fcost - profile.credits) + ' more.'); return false;
        }
        if (profile.resources.alloy < CFG.laserFitAlloy) {
            SIM.cues.play('refusal_dud'); say('Not enough alloy. Need ' + (CFG.laserFitAlloy - profile.resources.alloy) + ' more.'); return false;
        }
        return true;
    }
    if (it.kind === 'buy') {
        var owned = profile.laserLevels[it.family];
        if (owned >= 8) { say('Already fully upgraded.'); return false; }
        var next = owned + 1, cost = laserLevelCost(next), alloy = CFG.laserLevelAlloy * next;
        if (profile.credits < cost) {
            SIM.cues.play('refusal_dud'); say('Not enough credits. Need ' + (cost - profile.credits) + ' more.'); return false;
        }
        if (profile.resources.alloy < alloy) {
            SIM.cues.play('refusal_dud'); say('Not enough alloy. Need ' + (alloy - profile.resources.alloy) + ' more.'); return false;
        }
        return true;
    }
    if (profile.laserHealth[it.family] >= 100) { say('Already at full health.'); return false; }
    var price = laserRepairCost(it.family);
    if (profile.credits < price) {
        SIM.cues.play('refusal_dud'); say('Not enough credits. Need ' + (price - profile.credits) + ' more.'); return false;
    }
    return true;
}

function fitLaser(famId, slotIdx) {
    profile.credits -= laserFitCost();
    profile.resources.alloy -= CFG.laserFitAlloy;
    profile.laserLevels[famId] = 1;

function buyLaserLevel(fam) {

function repairLaser(fam) {

var CONTRACT_MISSION = {

function activeMissions() {

function missionDestinationPlanet() {
    if (demo) return 'Planet Auren';
    var best = null, bestD = Infinity;
    QUADRANT.forEach(function (q) {

        var d = len(sub(ringPos(q), ship.pos));
        if (d < bestD) { bestD = d; best = q.name; }
    });

}
function missionDestinationField() {

// SPEC 3.28: the contract can't be (re-)offered while one is already open —
// `contract` itself lingers (delivered: true) after a completed run, same
// as `demo` does, purely so its own heading/status line still has
// something to report until the pilot leaves the sector, so this checks
// !contract.delivered rather than just truthiness, on top of the ordinary
// per-kind cooldown escort/defend also use.
function missionAvailable(kind) {
    if (kind === 'contract' && contract && !contract.delivered) return false;
    // SPEC 3.55: same "already open" shape as the contract above — a
    // recovered-but-not-yet-docked distress call has no `delivered` flag of
    // its own to check, since it's cleared to null the instant it IS
    // docked home; truthiness alone is the right test here.
    if (kind === 'distress' && distress) return false;
    return profile.clock >= (profile.missionCooldownUntil[kind] || 0);
}

function missionText(i) {
    var m = activeMissions()[i];
    if (!missionAvailable(m.kind)) {
        if (m.kind === 'contract' && contract && !contract.delivered) return itemLabel(m) + '. A contract is already open.';
        if (m.kind === 'distress' && distress) return itemLabel(m) + '. A distress call is already open.';
        return itemLabel(m) + '. Not available for ' +
               Math.ceil(profile.missionCooldownUntil[m.kind] - profile.clock) + ' more seconds.';
    }
    return itemLabel(m) + '. ' + m.desc();
}

}

// Accepting a mission leaves the hail behind and enters the encounter the
// same way callPoi()'s combat/mining branches do: snapshot the sector spot
// (so returning, or a loss's tug, comes back here), then newGame('combat',
// spec) — the spec object becomes `mission`, which routes newGame's own
// roster-building to makeMissionRoster instead of the standard five ships.
function startMissionRun(kind) {
    profile.missionCooldownUntil[kind] = profile.clock + CFG.missionCooldownS;
    saveProfile();
    // SPEC 3.28: the contract never enters an encounter — it just starts
    // the clock and hands the pilot back to the open quadrant they were
    // already flying, unlike escort/defend which snapshot sectorHome and
    // jump into a combat roster via newGame('combat', spec).
    if (kind === 'contract') {
        touchStationVisit(hailMenu.poi.name);   // SPEC 3.33: accepting is a real interaction
        hailMenu.open = false;
        hailMenu.submenu = null;
        if (SIM.audio.ctx && SIM.audio.masterGain && !menuOpen) SIM.audio.ramp(SIM.audio.masterGain.gain, CFG.masterGain, 0.2);
        contract = { elapsed: 0, combatCleared: false, delivered: false, quotaSaid: false };
        say('Timed delivery accepted. ' + contractObjective() + ' I reads the contract clock.');
        return;
    }
    // SPEC 3.55: like escort/defend below, this snapshots sectorHome and
    // enters an encounter — but 'mining' (the tractor/extractor are the
    // whole mechanic), no `mission` object at all (see the `distress` var's
    // own comment for why it's kept separate), and ore/hull/etc. reset the
    // same way starting any other fresh encounter does.
    if (kind === 'distress') {
        var poiD = hailMenu.poi;
        touchStationVisit(poiD.name);
        hailMenu.open = false;
        hailMenu.submenu = null;
        sectorHome = snapshotSector(poiD);
        ore = 0; hull = CFG.shipHull; missiles = CFG.missileMax; chaff = CFG.chaffMax;
        autoTargetCharges = CFG.autoTargetCharges;
        refillRcs(); collisionDamage = 0; repairAllSystems();
        newGame('mining', null, false, false, poiD.name);
        say('Distress call accepted. ' + distressIntro());
        return;
    }
    var poi = hailMenu.poi;
    touchStationVisit(poi.name);   // SPEC 3.33: accepting is a real interaction
    hailMenu.open = false;
    hailMenu.submenu = null;
    sectorHome = snapshotSector(poi);
    var spec = {
        kind: kind, elapsed: 0, wavesSent: 0, ended: false, poiName: poi.name,
        nextStrikeIn: CFG.missionStrikeGapMinS + Math.random() * (CFG.missionStrikeGapMaxS - CFG.missionStrikeGapMinS),
        waveTimes: kind === 'escort' ? CFG.missionEscortWaveTimes.slice() : CFG.missionDefendWaveTimes.slice()
    };
    newGame('combat', spec);
    say((kind === 'escort' ? 'Escort accepted. ' : 'Defend accepted. ') + missionIntro());
}

// SPEC 3.54: the same escort/defend machinery as startMissionRun, but from
// the mission menu directly — no station, so no sectorHome to snapshot, no
// cooldown, no touchStationVisit, and poiName is null (which is what tells
// missionEnd/clearMission to skip the favor bump/loss, and what tells the
// Enter handler above to let this one replay). Mirrors startMission's own
// reset of ore/hull/missiles/chaff/rcs/collision damage/systems.
function startMissionDrill(kind) {
    menuOpen = false;
    ore = 0; hull = CFG.shipHull; missiles = CFG.missileMax; chaff = CFG.chaffMax;
    autoTargetCharges = CFG.autoTargetCharges;
    refillRcs(); collisionDamage = 0; repairAllSystems();
    var spec = {
        kind: kind, elapsed: 0, wavesSent: 0, ended: false, poiName: null,
        nextStrikeIn: CFG.missionStrikeGapMinS + Math.random() * (CFG.missionStrikeGapMaxS - CFG.missionStrikeGapMinS),
        waveTimes: kind === 'escort' ? CFG.missionEscortWaveTimes.slice() : CFG.missionDefendWaveTimes.slice()
    };
    newGame('combat', spec);
    say((kind === 'escort' ? 'Escort drill. ' : 'Defend drill. ') + missionIntro());
}
